    else h+='<button class="btn" data-a="chapter" data-id="'+c.id+'">'+(ok?'مراجعة الباب واختباره':'العودة للباب')+'</button>';
    h+='</div></div></section>';
  }
  return h+'</main>';
}
function viewBoard(){
  const me={n:S.name||'أنت',c:commit(),s:streak(),p:points(),you:true};
  const all=BOARD.map(x=>Object.assign({},x)).concat([me]).sort((a,b)=>b.c-a.c||b.s-a.s||b.p-a.p);
  const rank=all.indexOf(me)+1;
  const hue=[85,230,45];
  let h=header()+'<main><h1 class="greet">المتصدرون<small>الأعلى التزامًا بالتعلّم خلال آخر ٣٠ يومًا</small></h1>';
  h+='<section class="sumcard"><div class="r1"><b class="big">'+n(me.c)+'٪</b><span>نسبة التزامك</span></div><p>ترتيبك '+n(rank)+' من '+n(all.length)+(me.c===0?' · تعلّم اليوم لتبدأ في الصعود':' · '+n(me.s)+' يومًا متتاليًا')+'</p></section>';
  const top=all.slice(0,3),order=[1,0,2];
  h+='<div class="podium">'+order.map(i=>{const e=top[i];if(!e)return '';return '<div class="pod chap'+(i===0?' first':'')+'" style="--h:'+hue[i]+'"><div class="md">'+['🥇','🥈','🥉'][i]+'</div><div class="av" aria-hidden="true">'+esc(e.n.charAt(0))+'</div><div class="nm">'+esc(e.n)+(e.you&&S.name?' (أنت)':'')+'</div><div class="pc">'+n(e.c)+'٪</div><small>🔥 '+n(e.s)+' يومًا</small></div>';}).join('')+'</div>';
  h+='<div class="sec-title"><h2>أفضل ٥ متصدرين</h2><small>نسبة الالتزام</small></div>';
  const row=(e,i)=>'<div class="brow chap'+(e.you?' me':'')+'" style="--h:'+(e.you?215:(150+i*17)%360)+'"><span class="rk">'+n(i+1)+'</span><span class="av" aria-hidden="true">'+esc(e.n.charAt(0))+'</span><span class="tx"><b>'+esc(e.n)+(e.you&&S.name?' (أنت)':'')+'</b><span>🔥 '+n(e.s)+' يومًا · ⭐ '+n(e.p)+' نقطة</span><div class="bar"><i style="width:'+e.c+'%"></i></div></span><span class="pcn">'+n(e.c)+'٪</span></div>';
  all.slice(0,5).forEach((e,i)=>{h+=row(e,i);});
  if(rank>5)h+='<p class="demo">ترتيبك الحالي</p>'+row(me,rank-1);
  h+='<p class="demo">أسماء المتصدرين وبياناتهم افتراضية للتجربة، وتُحسب بياناتك أنت من نشاطك الفعلي.</p>';
  h+='<p class="fine">نسبة الالتزام = عدد الأيام التي أنهيت فيها اختبارًا من آخر ٣٠ يومًا.</p></main>';
  return h;
}
function viewProfile(){
  const p=points(),lv=level(p),done=doneCount(),nxL=LEVELS[lv+1];
  let h=header()+'<main>';
  h+='<section class="pro-head"><span class="avatar" aria-hidden="true">'+esc((S.name||'ط').trim().charAt(0)||'ط')+'</span><div class="who"><label for="nameIn" style="position:absolute;left:-9999px">اسمك</label><input id="nameIn" class="name-in" type="text" maxlength="24" placeholder="اكتب اسمك" value="'+esc(S.name)+'" autocomplete="off"><div class="lvl">المستوى: <b>'+LEVELS[lv][1]+'</b>'+(nxL?' · تبقّى '+n(nxL[0]-p)+' نقطة للمستوى «'+nxL[1]+'»':' · بلغتَ أعلى مستوى')+'</div></div></section>';
  h+='<section class="stats">'
    +'<div class="stat chap" style="--h:215"><b>'+n(done)+'/'+n(TOTAL)+'</b><span>📚 دروس مكتملة</span></div>'
    +'<div class="stat chap" style="--h:85"><b>'+n(p)+'</b><span>⭐ نقطة</span></div>'
    +'<div class="stat chap" style="--h:30"><b>'+n(streak())+'</b><span>🔥 أيام متتالية</span></div>'
    +'<div class="stat chap" style="--h:160"><b>'+pc(commit())+'</b><span>📅 الالتزام (٣٠ يومًا)</span></div></section>';
  h+='<div class="sec-title"><h2>التقدم في الأبواب</h2></div>';
  Object.keys(SECS).forEach(k=>{h+='<h3 class="subt">'+SECS[k].e+' '+SECS[k].t+'</h3>';secOf(k).forEach(c=>{const d=stepsDone(c),t=chSteps(c),lk=!unlocked(c);
    h+='<div class="prow chap" style="--h:'+c.h+(lk?';opacity:.6':'')+'"><div class="h"><span><span class="tile">'+ic(lk?'lock':c.ic)+'</span>'+c.t+'</span><span class="meta" style="margin:0">'+(lk?'مقفل':n(d)+' من '+n(t))+'</span></div><div class="bar"><i style="width:'+(d/t*100)+'%"></i></div></div>';});});
  const bs=badges();
  h+='<div class="sec-title"><h2>الشارات</h2><small>'+n(bs.filter(b=>b.on).length)+' من '+n(bs.length)+'</small></div><div class="badges">';
  bs.forEach(b=>{h+='<div class="badge chap'+(b.on?'':' off')+'" style="--h:'+b.h+'"><span class="bi">'+ic(b.ic)+'</span><b>'+b.t+'</b><small>'+(b.on?'تم الحصول عليها':b.d)+'</small></div>';});
  h+='</div><div class="reset">';
  h+=confirmReset?'<span>هل تريد حذف كل تقدمك؟</span><button class="btn danger" data-a="reset-yes">نعم، احذف</button><button class="btn alt" data-a="reset-no">إلغاء</button>':'<button class="btn alt" data-a="reset">إعادة ضبط التقدم</button>';
  h+='</div><p class="fine">يُحفظ تقدمك في هذا المتصفح على هذا الجهاز.</p></main>';
  return h;
}
const VIEWS={home:viewHome,chapter:viewChapter,review:viewReview,exam:viewExam,lesson:viewLesson,board:viewBoard,profile:viewProfile};
const TABOF={home:'home',chapter:'home',review:'home',exam:'home',lesson:'home',board:'board',profile:'profile'};
function render(keepScroll){
  const y=window.scrollY;
  app.innerHTML=VIEWS[V.name]();
  if(V.name==='home'){renderList();renderTip();}
  document.querySelectorAll('#nav [data-tab]').forEach(b=>{
    if(b.dataset.tab===TABOF[V.name])b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  window.scrollTo(0,keepScroll?y:0);
}
function go(v,keep){
  /* حراسة الأبواب المقفلة */
  let c=null;
  if(v.name==='chapter'||v.name==='review'||v.name==='exam')c=CH.find(x=>x.id===v.id);
  else if(v.name==='lesson')c=LESSONS.find(x=>x.id===v.id).ch;
  if(c){
    if(!unlocked(c)){v={name:'home'};c=null;}
    else if((v.name==='exam')&&!allLessons(c))v={name:'chapter',id:c.id};
  }
  if(c)SEC=c.sec;
  if(v.name!=='lesson'&&v.name!=='exam')Q=null;
  V=v;confirmReset=false;render(keep);
}

/* ---------- الأحداث ---------- */
function startQuiz(id){
  const l=LESSONS.find(x=>x.id===id);
  Q={kind:'lesson',id:id,phase:'quiz',i:0,picked:null,score:0,gain:0,newBadges:[],
     items:l.q.map(q=>({q:q.q,e:q.e,opts:shuffle(q.o.map((t,k)=>({t:t,ok:k===q.a})))}))};
  V={name:'lesson',id:id};render();
}
function startExam(id){
  const c=CH.find(x=>x.id===id);
  const pool=[];c.ls.forEach(l=>l.q.forEach(q=>pool.push(q)));
  Q={kind:'exam',id:id,phase:'quiz',i:0,picked:null,score:0,gain:0,pct:0,newBadges:[],
     items:shuffle(pool).slice(0,Math.min(EXAM_N,pool.length)).map(q=>({q:q.q,e:q.e,opts:shuffle(q.o.map((t,k)=>({t:t,ok:k===q.a})))}))};
  V={name:'exam',id:id};render();
}
function markDay(){
  const t=dstr(new Date());if(S.days.indexOf(t)<0)S.days.push(t);
  S.maxStreak=Math.max(S.maxStreak||0,streak());
}
function finishQuiz(){
  const l=LESSONS.find(x=>x.id===Q.id);
  const before=points(),bb=badges().filter(b=>b.on).map(b=>b.t);
  const r=S.lessons[l.id]||{best:0,done:false,attempts:0};
  r.attempts++;r.best=Math.max(r.best,Q.score);if(Q.score>=passMark(Q.items.length))r.done=true;
  S.lessons[l.id]=r;
  markDay();save();
  Q.gain=points()-before;
  Q.newBadges=badges().filter(b=>b.on&&bb.indexOf(b.t)<0).map(b=>b.t);
  Q.phase='result';render();
}
function finishExam(){
  const c=CH.find(x=>x.id===Q.id);
  const before=points(),bb=badges().filter(b=>b.on).map(b=>b.t);
  Q.pct=Math.round(Q.score/Q.items.length*100);
  const r=S.exams[c.id]||{best:0,attempts:0,passed:false};
  r.attempts++;r.best=Math.max(r.best,Q.pct);if(Q.pct>=PASS_PCT)r.passed=true;
  S.exams[c.id]=r;
  markDay();save();
  Q.gain=points()-before;
  Q.newBadges=badges().filter(b=>b.on&&bb.indexOf(b.t)<0).map(b=>b.t);
  Q.phase='result';render();
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a;
  if(a==='home')go({name:'home'});
  else if(a==='chapter')go({name:'chapter',id:b.dataset.id});
  else if(a==='review')go({name:'review',id:b.dataset.id});
  else if(a==='exam')go({name:'exam',id:b.dataset.id});
  else if(a==='lesson')go({name:'lesson',id:b.dataset.id});
  else if(a==='profile')go({name:'profile'});
  else if(a==='read'){Q.phase='read';render();}
  else if(a==='start')startQuiz(b.dataset.id);
  else if(a==='xstart')startExam(b.dataset.id);
  else if(a==='pick'){if(Q.picked!==null)return;const k=+b.dataset.k;Q.picked=k;if(Q.items[Q.i].opts[k].ok)Q.score++;render(true);}
  else if(a==='next'){if(Q.i+1<Q.items.length){Q.i++;Q.picked=null;render();}else if(Q.kind==='exam')finishExam();else finishQuiz();}
  else if(a==='sec'){SEC=b.dataset.s;TAB='ch';SQ='';showSearch=false;render(true);}
  else if(a==='tab'){TAB=b.dataset.t;SQ='';render(true);}
  else if(a==='togsearch'){showSearch=!showSearch;if(!showSearch)SQ='';render(true);if(showSearch){const s=document.getElementById('search');if(s)s.focus();}}
  else if(a==='tip'){tipI=(tipI+1)%TIPS.length;renderTip();}
  else if(a==='reset'){confirmReset=true;render(true);}
  else if(a==='reset-no'){confirmReset=false;render(true);}
  else if(a==='reset-yes'){S={name:S.name,lessons:{},days:[],exams:{}};save();confirmReset=false;render();}
});
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  go({name:b.dataset.a==='profile'?'profile':b.dataset.a==='board'?'board':'home'});
});
app.addEventListener('input',e=>{
  if(e.target.id==='search'){SQ=e.target.value;renderList();}
});
app.addEventListener('change',e=>{
  if(e.target.id==='nameIn'){S.name=e.target.value.trim();save();render(true);}
});
render();
})();
</script>
