<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>فقه ميسّر</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout concept: single-column mobile app. Pastel gradient ground, a white panel with a blue top edge holding tabs and tinted row cards that each carry a thick accent edge on the start side; two feature cards above; floating pill nav below. Each chapter owns one hue (--h). */
:root{
  --bg:#EEF7FF; --bg1:#FFF0E2; --bg2:#E6F5FF; --bg3:#F3F9FF;
  --surface:#FFFFFF; --soft:#F5FAFF; --fg:#14243B; --muted:#7285A0; --line:#DDEBF7;
  --blue:#1CAEF5; --blue2:#0A8EE0; --blue-soft:#E2F4FE; --on-blue:#FFFFFF;
  --gold:#B7791F; --gold-soft:#FFF2CC; --gold-line:#F3C94F;
  --good:#12915A; --good-soft:#D9F7E8; --bad:#D4413A; --bad-soft:#FFE3E0;
  --f1-bg:#F5EFFF; --f1-bd:#D9C8FB; --f1-t:#7A3FE5; --f1-fg:#2F2350; --f1-dot:#E4D6FF;
  --f2-bg:#101C36; --f2-bd:#22385F; --f2-t:#1BC8EA; --f2-fg:#E7EEFA; --f2-dot:#1B2D52;
  --tl:.955; --tc:.045; --al:.72; --il:.5; --ln:.915;
  --shadow:0 10px 28px rgba(30,90,150,.12);
  --font:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1424; --bg1:#1D2236; --bg2:#0F1D33; --bg3:#0B1424;
    --surface:#15243B; --soft:#112038; --fg:#E8F1FB; --muted:#93A6C2; --line:#243B5C;
    --blue:#33B8F7; --blue2:#1593E6; --blue-soft:#12324D; --on-blue:#04223A;
    --gold:#F0C560; --gold-soft:#3A2E10; --gold-line:#8A6A1D;
    --good:#5FD79B; --good-soft:#12342A; --bad:#FF8F85; --bad-soft:#3D1B1A;
    --f1-bg:#251C45; --f1-bd:#4A3A82; --f1-t:#C4A6FF; --f1-fg:#E9E0FF; --f1-dot:#352A63;
    --f2-bg:#0A1226; --f2-bd:#21385E; --f2-t:#35D7F2; --f2-fg:#E7EEFA; --f2-dot:#16264A;
    --tl:.32; --tc:.06; --al:.78; --il:.88; --ln:.4;
    --shadow:0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1424; --bg1:#1D2236; --bg2:#0F1D33; --bg3:#0B1424;
  --surface:#15243B; --soft:#112038; --fg:#E8F1FB; --muted:#93A6C2; --line:#243B5C;
  --blue:#33B8F7; --blue2:#1593E6; --blue-soft:#12324D; --on-blue:#04223A;
  --gold:#F0C560; --gold-soft:#3A2E10; --gold-line:#8A6A1D;
  --good:#5FD79B; --good-soft:#12342A; --bad:#FF8F85; --bad-soft:#3D1B1A;
  --f1-bg:#251C45; --f1-bd:#4A3A82; --f1-t:#C4A6FF; --f1-fg:#E9E0FF; --f1-dot:#352A63;
  --f2-bg:#0A1226; --f2-bd:#21385E; --f2-t:#35D7F2; --f2-fg:#E7EEFA; --f2-dot:#16264A;
  --tl:.32; --tc:.06; --al:.78; --il:.88; --ln:.4;
  --shadow:0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); background-image:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 38%,var(--bg3) 100%); background-attachment:fixed;
  color:var(--fg); font-family:var(--font); font-size:16px; line-height:1.8; direction:rtl;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px; min-height:100%;
}
h1,h2,h3{font-weight:800;line-height:1.45;margin:0;text-wrap:balance}
p{margin:0}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:600px;margin-inline:auto}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:12px}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* hue system */
.chap{
  --ctint:oklch(var(--tl) var(--tc) var(--h));
  --cacc:oklch(var(--al) .16 var(--h));
  --cink:oklch(var(--il) .15 var(--h));
  --cline:oklch(var(--ln) .06 var(--h));
}

/* top bar */
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;color:var(--fg);background:none;border:0;padding:0}
.brand .mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--blue),var(--blue2));color:var(--on-blue);display:grid;place-items:center;box-shadow:0 6px 14px rgba(28,174,245,.35)}
.brand .mark svg{width:24px;height:24px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.greet{font-size:20px;margin:10px 4px 14px;font-weight:800}
.greet small{display:block;font-size:14px;color:var(--muted);font-weight:500}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:5px;margin:0 0 14px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;border-radius:21px;padding:8px 10px;font-weight:800;font-size:18px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.seg button[aria-pressed="true"]{background:linear-gradient(145deg,var(--blue),var(--blue2));color:var(--on-blue);box-shadow:0 6px 14px rgba(28,174,245,.35)}
.subt{font-size:17px;margin:18px 4px 10px;color:var(--muted)}
/* feature cards */
.feats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feat{position:relative;overflow:hidden;text-align:start;border-radius:28px;padding:18px 16px 16px;min-height:158px;display:flex;flex-direction:column;gap:2px;border:2px solid;box-shadow:var(--shadow);min-width:0}
.feat::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;inset-inline-end:-55px;bottom:-70px;background:var(--dot)}
.feat>*{position:relative;z-index:1}
.feat .fl{font-size:15px;font-weight:700;opacity:.9}
.feat .ft{font-size:25px;font-weight:900;line-height:1.35;margin-top:2px;overflow-wrap:anywhere}
.feat .fd{font-size:14px;font-weight:600;opacity:.85;margin-top:auto;padding-top:6px}
.feat.navy{background:linear-gradient(160deg,var(--f2-bg),#16284a);border-color:var(--f2-bd);color:var(--f2-fg);--dot:var(--f2-dot)}
.feat.navy .ft{color:var(--f2-t)}
.feat.lav{background:linear-gradient(160deg,var(--f1-bg),var(--f1-dot));border-color:var(--f1-bd);color:var(--f1-fg);--dot:var(--f1-dot)}
.feat.lav .ft{color:var(--f1-t)}
.feat:hover{transform:translateY(-2px)}
.feat{transition:transform .2s ease}

/* panel */
.panel{margin-top:16px;background:var(--surface);border-radius:30px;border-top:5px solid var(--blue);padding:18px 16px 14px;box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ph .tile{width:56px;height:56px;border-radius:18px;background:linear-gradient(145deg,var(--blue-soft),var(--soft));border:2px solid var(--line);display:grid;place-items:center;font-size:28px;flex:none}
.ph .tx{flex:1;min-width:0}
.ph h2{font-size:23px}
.ph p{font-size:14px;color:var(--muted);font-weight:500}
.sbtn{width:54px;height:54px;border-radius:18px;border:0;background:linear-gradient(145deg,var(--blue),var(--blue2));color:var(--on-blue);display:grid;place-items:center;box-shadow:0 8px 18px rgba(28,174,245,.38);flex:none}
.sbtn svg{width:26px;height:26px}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;background:var(--soft);color:var(--fg);border:2px solid var(--line);border-radius:18px;padding:10px 16px;padding-inline-start:46px;min-height:50px;font-weight:600}
.search input:focus{outline:none;border-color:var(--blue)}
.search .s-ic{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tab{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:20px;border:2px solid var(--line);background:var(--soft);color:var(--fg);font-weight:800;font-size:17px;padding:12px 10px;min-height:56px}
.tab .cnt{min-width:32px;height:32px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:15px;font-variant-numeric:tabular-nums;padding-inline:6px}
.tab[aria-selected="true"]{background:linear-gradient(145deg,var(--blue),var(--blue2));border-color:transparent;color:var(--on-blue);box-shadow:0 8px 18px rgba(28,174,245,.35)}
.tab[aria-selected="true"] .cnt{background:rgba(255,255,255,.3)}

/* rows */
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:start;margin-bottom:12px;padding:13px 14px;border-radius:26px;background:var(--ctint);border:2px solid var(--cline);border-inline-start:8px solid var(--cacc);min-width:0}
.row:last-child{margin-bottom:0}
.row:hover{filter:brightness(1.02);transform:translateX(-2px)}
.row{transition:transform .15s ease}
.row .tile{width:54px;height:54px;border-radius:18px;background:var(--surface);color:var(--cacc);display:grid;place-items:center;box-shadow:0 4px 10px rgba(20,60,110,.08);flex:none}
.row .tile svg{width:28px;height:28px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:18px;font-weight:800;line-height:1.5;color:var(--fg)}
.row .tx span{display:block;font-size:14px;font-weight:600;color:var(--muted);line-height:1.6}
.row .go{color:var(--cacc);opacity:.7;display:flex}
.ck{position:relative;width:46px;height:46px;flex:none;display:grid;place-items:center}
.ck svg.rg{position:absolute;inset:0;width:46px;height:46px;transform:rotate(-90deg)}
.ck circle{fill:none;stroke-width:4}
.ck .tr{stroke:var(--cline)}
.ck .pg{stroke:var(--cacc);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ck b{font-size:14px;font-weight:800;color:var(--cink);font-variant-numeric:tabular-nums;position:relative}
.ck.full{border-radius:50%;background:var(--cacc);color:#fff}
.ck.full svg.i{width:24px;height:24px;stroke-width:3}
.ck.full svg.rg{display:none}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-weight:600}

/* tip */
.tip{margin-top:18px;display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:30px;padding:16px 16px 16px 12px;box-shadow:var(--shadow)}
.tip .tt{flex:1;min-width:0;font-size:17px;font-weight:700;line-height:1.9}
.tip .dots{display:flex;gap:6px;margin-top:8px}
.tip .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.tip .dots i.on{background:var(--blue);width:22px;border-radius:9px}
.tip .bd{width:86px;height:86px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,#FFD65A,#FF9F3D);border:6px solid var(--surface);box-shadow:0 0 0 2px var(--line),var(--shadow);color:#fff}
.tip .bd svg{width:40px;height:40px;stroke-width:2.1}
.fine{margin-top:20px;font-size:13px;color:var(--muted);line-height:1.9;text-align:center;font-weight:500}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:18px;border:2px solid transparent;padding:10px 22px;font-weight:800;background:linear-gradient(145deg,var(--blue),var(--blue2));color:var(--on-blue);min-height:50px;box-shadow:0 8px 18px rgba(28,174,245,.32)}
.btn.alt{background:var(--surface);border-color:var(--line);color:var(--fg);box-shadow:none}
.btn.danger{background:var(--surface);border-color:var(--bad);color:var(--bad);box-shadow:none}
.btn:hover{filter:brightness(1.05)}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 16px 6px 14px;margin:12px 0 4px;font-weight:700;font-size:15px}

/* chapter / lesson heads */
.chead{display:flex;gap:14px;align-items:center;margin:14px 0 16px;background:var(--ctint);border:2px solid var(--cline);border-inline-start:8px solid var(--cacc);border-radius:28px;padding:16px}
.chead .tile{width:64px;height:64px;border-radius:20px;background:var(--surface);color:var(--cacc);display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(20,60,110,.08)}
.chead .tile svg{width:34px;height:34px}
.chead h1{font-size:26px}
.chead p{color:var(--muted);font-size:14px;font-weight:600;line-height:1.7}
.bar{height:10px;border-radius:99px;background:var(--cline);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cacc);border-radius:99px;transition:width .5s ease}
.meta{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}
.cwrap{background:var(--surface);border-radius:28px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}

/* lesson */
.lesson h1{font-size:28px;margin:8px 4px 4px}
.tag{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:700;color:var(--cink);background:var(--ctint);border:2px solid var(--cline);padding:2px 14px;border-radius:999px;margin-top:8px}
.prose{background:var(--surface);border-radius:28px;border-top:5px solid var(--cacc);padding:20px 18px;margin-top:14px;font-size:17px;box-shadow:var(--shadow)}
.prose .intro{margin-bottom:6px;font-weight:600}
.prose h3{font-size:18px;color:var(--cink);margin:20px 0 8px;display:flex;align-items:center;gap:10px}
.prose h3::before{content:"";width:12px;height:26px;border-radius:6px;background:var(--cacc);flex:none}
.prose ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.prose li{position:relative;padding-inline-start:28px;line-height:1.95}
.prose li::before{content:"";position:absolute;inset-inline-start:4px;top:.8em;width:11px;height:11px;border-radius:50%;background:var(--cacc)}
.prose li b{color:var(--cink);font-weight:800}
.note{margin-top:20px;background:var(--gold-soft);border:2px solid var(--gold-line);border-inline-start:8px solid var(--gold-line);border-radius:22px;padding:14px 16px;font-size:16px;font-weight:600}
.note strong{display:block;color:var(--gold);font-weight:900;margin-bottom:2px}
.cta{margin-top:18px;display:flex;justify-content:center}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:14px}

/* quiz */
.quiz{background:var(--surface);border-radius:28px;border-top:5px solid var(--cacc);padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.dots2{display:flex;gap:6px}
.dots2 i{width:24px;height:8px;border-radius:9px;background:var(--cline)}
.dots2 i.on{background:var(--cacc)}
.quiz h2{font-size:21px;margin-bottom:14px;line-height:1.75}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--soft);border:2px solid var(--line);border-radius:22px;padding:12px 14px;margin-bottom:10px;min-height:58px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--cacc)}
.opt .l{width:36px;height:36px;border-radius:50%;background:var(--ctint);color:var(--cink);display:grid;place-items:center;font-weight:800;flex:none}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .l{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .l{background:var(--bad);color:#fff}
.opt .l svg{width:20px;height:20px;stroke-width:3}
.expl{margin-top:4px;border-radius:20px;padding:12px 16px;font-size:16px;font-weight:600}
.expl.ok{background:var(--good-soft)}
.expl.no{background:var(--bad-soft)}
.expl b{display:block;font-weight:900}
.result{text-align:center;padding:10px 0}
.result .big{font-size:60px;font-weight:900;color:var(--cacc);font-variant-numeric:tabular-nums;line-height:1.2}
.result h2{margin:6px 0}
.result p{color:var(--muted);font-weight:600}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* profile */
.pro-head{margin-top:14px;display:flex;gap:16px;align-items:center;background:linear-gradient(150deg,var(--blue),var(--blue2));color:var(--on-blue);border-radius:30px;padding:20px;box-shadow:0 12px 26px rgba(28,174,245,.35);position:relative;overflow:hidden}
.pro-head::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14);inset-inline-end:-50px;bottom:-80px}
.avatar{width:72px;height:72px;border-radius:50%;background:#fff;color:var(--blue2);display:grid;place-items:center;font-size:32px;font-weight:900;flex:none;position:relative;z-index:1}
.pro-head .who{flex:1;min-width:0;position:relative;z-index:1}
.name-in{width:100%;background:transparent;border:0;border-bottom:2px dashed rgba(255,255,255,.55);color:inherit;font-weight:800;font-size:22px;padding:2px 0}
.name-in::placeholder{color:rgba(255,255,255,.7)}
.name-in:focus{outline:none;border-bottom-color:#fff}
.lvl{font-size:14px;font-weight:600;margin-top:6px;opacity:.95}
.lvl b{font-weight:900}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.stat{border-radius:26px;padding:14px 16px;background:var(--ctint);border:2px solid var(--cline);border-inline-start:8px solid var(--cacc)}
.stat b{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.3;color:var(--cink)}
.stat span{font-size:14px;color:var(--muted);font-weight:700}
.sec-title{font-size:20px;margin:26px 4px 12px;display:flex;justify-content:space-between;align-items:baseline}
.sec-title small{font-size:14px;color:var(--muted);font-weight:600}
.prow{padding:12px 14px;margin-bottom:10px;display:grid;gap:8px;border-radius:24px;background:var(--ctint);border:2px solid var(--cline);border-inline-start:8px solid var(--cacc)}
.prow .h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.prow .h>span:first-child{display:flex;align-items:center;gap:10px;font-weight:800}
.prow .tile{width:38px;height:38px;border-radius:12px;background:var(--surface);color:var(--cacc);display:grid;place-items:center}
.prow .tile svg{width:22px;height:22px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.badge{background:var(--ctint);border:2px solid var(--cline);border-radius:26px;padding:14px 8px;text-align:center;font-size:14px;line-height:1.5;display:grid;gap:6px;justify-items:center}
.badge .bi{width:52px;height:52px;border-radius:50%;background:var(--cacc);color:#fff;display:grid;place-items:center}
.badge .bi svg{width:28px;height:28px}
.badge b{font-weight:800}
.badge small{color:var(--muted);font-size:12px;font-weight:600}
.badge.off{filter:grayscale(1);opacity:.55}
.reset{margin-top:26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}


/* locks, review, exam, board */
.row.locked{opacity:.62;filter:grayscale(.8);cursor:not-allowed}
.row.locked:hover{transform:none}
.row.locked .tile{color:var(--muted)}
.ck.lockc{border:3px dashed var(--cline);border-radius:50%;color:var(--muted)}
.ck.lockc svg.i{width:20px;height:20px}
.sp{margin-top:6px;padding-top:14px;border-top:2px dashed var(--line)}
.status{display:flex;align-items:center;gap:12px;background:var(--good-soft);border:2px solid var(--good);border-radius:24px;padding:12px 16px;margin-bottom:12px;font-weight:700}
.status svg.i{width:28px;height:28px;color:var(--good)}
.rnote{margin-top:8px;font-size:15px;color:var(--muted);font-weight:600}
.facts{display:grid;gap:10px;margin:6px 0 4px;padding:0;list-style:none}
.facts li{display:flex;align-items:center;gap:10px;font-weight:700}
.facts li span{width:34px;height:34px;border-radius:50%;background:var(--ctint);color:var(--cink);display:grid;place-items:center;flex:none}
.sumcard{background:linear-gradient(150deg,var(--f2-bg),#16284a);color:var(--f2-fg);border:2px solid var(--f2-bd);border-radius:30px;padding:18px;margin-top:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.sumcard::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:var(--f2-dot);inset-inline-end:-50px;bottom:-70px}
.sumcard>*{position:relative;z-index:1}
.sumcard .r1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sumcard b.big{font-size:44px;font-weight:900;color:var(--f2-t);line-height:1.2;font-variant-numeric:tabular-nums}
.sumcard p{font-size:14px;font-weight:600;opacity:.9}
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:10px;align-items:end;margin-top:16px}
.pod{background:var(--ctint);border:2px solid var(--cline);border-radius:26px;padding:12px 6px 14px;text-align:center;min-width:0}
.pod.first{padding-block:20px}
.pod .md{font-size:28px;line-height:1.2}
.pod .av{width:48px;height:48px;border-radius:50%;margin:4px auto;background:var(--surface);color:var(--cink);display:grid;place-items:center;font-weight:900;font-size:20px;border:3px solid var(--cacc)}
.pod .nm{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pc{font-size:20px;font-weight:900;color:var(--cink);font-variant-numeric:tabular-nums}
.pod small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.brow{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:10px 14px;margin-bottom:10px}
.brow.me{background:var(--blue-soft);border-color:var(--blue)}
.brow .rk{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:900;font-size:14px;flex:none;font-variant-numeric:tabular-nums}
.brow .av{width:42px;height:42px;border-radius:50%;background:var(--ctint);color:var(--cink);display:grid;place-items:center;font-weight:900;flex:none}
.brow .tx{flex:1;min-width:0}
.brow .tx b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .tx span{font-size:13px;color:var(--muted);font-weight:600}
.brow .pcn{font-weight:900;font-size:18px;color:var(--cink);font-variant-numeric:tabular-nums}
.brow .bar{height:6px;margin-top:6px}
.demo{font-size:13px;color:var(--muted);text-align:center;font-weight:600;margin-top:6px}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:9;display:flex;justify-content:center;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.nav div{display:flex;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:6px;width:min(100%,400px);box-shadow:var(--shadow);pointer-events:auto}
.nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:0;border-radius:20px;padding:6px 10px;font-weight:800;font-size:14px;color:var(--muted);min-height:50px;min-width:0}
.nav button[aria-current="page"]{background:linear-gradient(145deg,var(--blue),var(--blue2));color:var(--on-blue);box-shadow:0 6px 14px rgba(28,174,245,.35)}
.nav svg.i{width:22px;height:22px}

@media (max-width:400px){
  .feat .ft{font-size:21px}
  .feat{padding:16px 14px;min-height:148px}
  .row{gap:10px;padding:12px}
  .row .tile{width:48px;height:48px;border-radius:16px}
  .ck{width:40px;height:40px}.ck svg.rg{width:40px;height:40px}
  .tip .bd{width:68px;height:68px}
  .tab{font-size:15px}
  .ph h2{font-size:20px}
  .pro-head{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  'عند فقد الماء بعد البحث عنه.',
  'عند العجز عن استعماله لمرض أو شدة برد أو خوف.',
  'الأصل دخول الوقت قبل التيمم عند الجمهور.']],
 ['صفته وأحكامه',[
  'النية، ثم ضرب الأرض الطيبة بالكفين.',
  'مسح الوجه والكفين.',
  'يقوم مقام الوضوء والغسل معًا.',
  'يبطل بنواقض الوضوء، وبوجود الماء قبل الصلاة.']]],
 'التيمم رخصة تيسيرية، فمن وجد الماء قبل الصلاة بطل تيممه وتوضأ.',
 [['متى يجوز التيمم؟',['عند فقد الماء أو العجز عن استعماله','عند الكسل','عند تأخر الوقت'],'العجز الحقيقي أو الفقد يبيح التيمم.'],
  ['ما الذي يُمسح في التيمم عند الجمهور؟',['الوجه والكفان','الرأس والقدمان','الذراعان إلى الكتفين'],'ورد المسح على الوجه والكفين.'],
  ['يبطل التيمم بـ:',['وجود الماء قبل الصلاة','مرور ساعة','الكلام'],'وجود الماء يبطل التيمم لزوال سببه.'],
  ['التيمم يقوم مقام:',['الوضوء والغسل','الوضوء فقط','الغسل فقط'],'يصح للحدث الأصغر والأكبر معًا.'],
  ['ما يُتيمَّم به:',['الأرض الطيبة','الماء الملوّث','الورق'],'الصعيد الطيب هو الأرض الطاهرة.']]),

L('المسح على الخفين','المسح على الخفين رخصة ثبتت بالسنة المتواترة، تخفيفًا على المسلم.',[
 ['شروطه',[
  'أن يُلبس الخفان على طهارة.',
  'أن يكونا ساترين لمحل الفرض.',
  'أن يكونا طاهرين مباحين.']],
 ['المدة وكيفيته',[
  'المقيم يمسح يومًا وليلة، والمسافر ثلاثة أيام بلياليها عند الجمهور.',
  'تبدأ المدة من أول حدث بعد اللبس.',
  'يُمسح أعلى الخف بيد مبلولة مرة واحدة.',
  'يبطل بخلعه، وبانتهاء المدة، وبما يوجب الغسل.']]],
 'من لبس الخفين على طهارة ثم أحدث جاز له المسح عليهما بدل غسل الرجلين.',
 [['مدة المسح على الخفين للمقيم:',['يوم وليلة','ثلاثة أيام','ساعة'],'المقيم يوم وليلة، والمسافر ثلاثة أيام.'],
  ['مدة المسح للمسافر:',['ثلاثة أيام بلياليها','يوم وليلة','أسبوع'],'ثبت التوقيت بالحديث.'],
  ['يُشترط في لبس الخف:',['أن يكون على طهارة','أن يكون جديدًا','أن يكون أسود'],'قال ﷺ: «دعهما فإني أدخلتهما طاهرتين».'],
  ['موضع المسح:',['أعلى الخف','أسفله فقط','الخف كله غسلًا'],'السنة مسح ظاهر الخف.'],
  ['يبطل المسح بـ:',['خلع الخف','الأكل','الكلام'],'خلع الخف وانتهاء المدة يبطلان المسح.']]),

L('الحيض والنفاس','الحيض والنفاس من أحكام المرأة التي تتعلق بها الطهارة والعبادات.',[
 ['التعريف',[
  'الحيض دم طبيعي يخرج من الرحم في أوقات معلومة، ويرجع فيه إلى عادة المرأة.',
  'النفاس دم يخرج بعد الولادة، وأكثره أربعون يومًا عند الجمهور.',
  'الاستحاضة دم فساد لا يمنع الصلاة ولا الصوم.']],
 ['أحكام الحائض والنفساء',[
  'لا تصليان ولا تصومان، وتقضيان الصوم دون الصلاة.',
  'لا تطوفان بالبيت، ولا تمسّان المصحف عند الجمهور.',
  'يحرم الجماع في الفرج، وما سواه من الاستمتاع جائز.',
  'تغتسل عند انقطاع الدم ثم تصلي.']]],
 'المستحاضة تصلي وتصوم، وتتوضأ لكل صلاة بعد دخول وقتها.',
 [['ماذا تقضي الحائض بعد الطهر؟',['الصوم دون الصلاة','الصلاة دون الصوم','الصوم والصلاة'],'تيسيرًا من الشرع لتكرار الصلاة.'],
  ['أكثر النفاس عند الجمهور:',['أربعون يومًا','عشرة أيام','ستون يومًا'],'هو قول جمهور الفقهاء.'],
  ['ما الذي يحرم على الحائض؟',['الصلاة والصوم والطواف','الأكل','الكلام'],'تُمنع من العبادات المذكورة حتى تطهر.'],
  ['حكم المستحاضة:',['تصلي وتصوم وتتوضأ لكل صلاة','تترك الصلاة','تترك الصيام'],'الاستحاضة لا تمنع العبادة.'],
  ['متى تغتسل الحائض؟',['عند انقطاع الدم','عند بدايته','بعد أسبوع'],'بالانقطاع تغتسل وتعود إلى الصلاة.']])
]);

C('salah','الصلاة','شروطها وأركانها وصفتها والجماعة والجمعة والسفر',160,'pray',[
L('شروط الصلاة وأوقاتها','الصلاة عمود الدين، وهي خمس في اليوم والليلة، ولا تصح إلا بتحقق شروطها.',[
 ['شروط صحة الصلاة',[
  'الإسلام والعقل والتمييز.',
  'دخول الوقت.',
  'الطهارة من الحدث والنجاسة في البدن والثوب والمكان.',
  '<b>ستر العورة:</b> عورة الرجل ما بين السرة والركبة، وعورة المرأة الحرة جميع بدنها سوى الوجه والكفين.',
  'استقبال القبلة، ويسقط عند العجز كشدة الخوف.',
  'النية.']],
 ['أوقات الصلوات الخمس',[
  '<b>الفجر:</b> من طلوع الفجر الصادق إلى طلوع الشمس.',
  '<b>الظهر:</b> من زوال الشمس إلى أن يصير ظل كل شيء مثله.',
  '<b>العصر:</b> من آخر وقت الظهر إلى غروب الشمس.',
  '<b>المغرب:</b> من الغروب إلى مغيب الشفق.',
  '<b>العشاء:</b> من مغيب الشفق إلى نصف الليل للاختيار، وإلى الفجر للجواز.']]],
 'الشرط يكون قبل الصلاة ويستمر فيها، أما الركن فجزء منها. وفي حدود الأوقات اختلاف يسير بين المذاهب.',
 [['ما الفرق بين الشرط والركن؟',['الشرط خارج الصلاة ويستمر فيها، والركن جزء منها','الركن قبل الصلاة والشرط بعدها','لا فرق بينهما'],'الوضوء شرط يسبق الصلاة، والركوع جزء داخلها.'],
  ['كم عدد الصلوات المفروضة في اليوم والليلة؟',['خمس','ثلاث','ست'],'الفجر والظهر والعصر والمغرب والعشاء.'],
  ['عورة الرجل في الصلاة:',['ما بين السرة والركبة','الصدر فقط','جميع البدن'],'هذا قول الجمهور.'],
  ['يبدأ وقت الفجر من:',['طلوع الفجر الصادق','شروق الشمس','منتصف الليل'],'ويمتد إلى طلوع الشمس.'],
  ['يبدأ وقت المغرب:',['بغروب الشمس','بزوال الشمس','بصلاة العصر'],'ويمتد إلى مغيب الشفق.']]),

L('أركان الصلاة وواجباتها','للصلاة أركان لا تصح بدونها، وواجبات يُجبر تركها سهوًا بسجود السهو.',[
 ['الأركان',[
  'النية وتكبيرة الإحرام.',
  'القيام في الفرض لمن قدر.',
  'قراءة الفاتحة: ركن عند الجمهور، وعند الحنفية القراءة ركن والفاتحة واجبة.',
  'الركوع والاعتدال منه.',
  'السجود مرتين والجلوس بينهما.',
  'التشهد الأخير والجلوس له، والتسليم، والطمأنينة في الأركان.']],
 ['الواجبات',[
  'تكبيرات الانتقال، وقول «سمع الله لمن حمده»، و«سبحان ربي العظيم» و«سبحان ربي الأعلى».',
  'التشهد الأول والجلوس له.',
  'هي واجبات عند الحنفية والحنابلة، وسنن مؤكدة عند الشافعية والمالكية.']]],
 'من ترك ركنًا عمدًا بطلت صلاته، ومن تركه سهوًا أتى به. ومن ترك واجبًا سهوًا جبره بسجود السهو.',
 [['ما حكم من ترك ركنًا من أركان الصلاة عمدًا؟',['تبطل صلاته','تصح صلاته','يسجد للسهو فقط'],'الركن لا تصح الصلاة بدونه.'],
  ['كم سجدة في كل ركعة؟',['سجدتان','سجدة','ثلاث'],'يفصل بينهما جلوس.'],
  ['قراءة الفاتحة ركن عند:',['الجمهور','الحنفية وحدهم','لا أحد'],'والحنفية يرونها واجبة.'],
  ['التشهد الأول عند الحنابلة:',['واجب يُجبر بسجود السهو','ركن لا تصح الصلاة بدونه','مباح'],'من تركه سهوًا سجد للسهو.'],
  ['الطمأنينة في أركان الصلاة:',['ركن عند الجمهور','مباحة','مكروهة'],'من ترك الطمأنينة عمدًا بطلت صلاته عند الجمهور.']]),

L('صفة الصلاة وسننها','تُؤدّى الصلاة على هيئة النبي ﷺ، وتُرتَّب أفعالها من التكبير إلى التسليم.',[
 ['من التكبير إلى الركوع',[
  'النية بالقلب، ثم تكبيرة الإحرام مع رفع اليدين.',
  'وضع اليمنى على اليسرى على الصدر أو تحته.',
  'دعاء الاستفتاح، ثم الاستعاذة والبسملة، ثم الفاتحة وسورة في الأوليين.']],
 ['الركوع والسجود والتشهد',[
  'الركوع: ظهر مستوٍ ويدان على الركبتين، ويقول «سبحان ربي العظيم».',
  'السجود على سبعة أعضاء: الجبهة مع الأنف، واليدان، والركبتان، وأطراف القدمين.',
  'التشهد ثم الصلاة على النبي ﷺ، ثم التسليم يمينًا وشمالًا.']],
 ['سنن مأثورة',[
  'قول «رب اغفر لي» بين السجدتين.',
  'رفع اليدين عند التكبير والركوع والرفع منه عند الشافعية والحنابلة.',
  'الخشوع واستحضار القلب.']]],
 'قال النبي ﷺ: «صلّوا كما رأيتموني أصلي».',
 [['بماذا تبدأ الصلاة؟',['بتكبيرة الإحرام','بالتسليم','بالاستعاذة'],'تحريمها التكبير وتحليلها التسليم.'],
  ['على كم عضوًا يسجد المصلي؟',['سبعة','ثلاثة','عشرة'],'الجبهة والأنف واليدان والركبتان والقدمان.'],
  ['ماذا يقول المصلي في الركوع؟',['سبحان ربي العظيم','سبحان ربي الأعلى','ربنا ولك الحمد'],'«سبحان ربي الأعلى» في السجود.'],
  ['ماذا يُقال بين السجدتين؟',['رب اغفر لي','سبحان ربي الأعلى','التحيات'],'ورد في الحديث.'],
  ['بماذا تُختم الصلاة؟',['بالتسليم','بالتكبير','بسجدة'],'تحليلها التسليم.']]),

L('مبطلات الصلاة ومكروهاتها','معرفة المبطلات تصون الصلاة، ومعرفة المكروهات تزيدها كمالًا.',[
 ['مبطلات الصلاة',[
  'الكلام عمدًا لغير مصلحة الصلاة.',
  'الأكل والشرب عمدًا.',
  'الحركة الكثيرة المتوالية بلا ضرورة.',
  'القهقهة (الضحك بصوت).',
  'انكشاف العورة، وترك شرط أو ركن عمدًا، والحدث في أثنائها.']],
 ['مكروهات الصلاة',[
  'الالتفات بلا حاجة.',
  'العبث بالثياب والبدن.',
  'رفع البصر إلى السماء.',
  'الصلاة مع مدافعة البول أو الغائط، أو بحضرة طعام تشتهيه النفس.']]],
 'الحركة اليسيرة للحاجة لا تبطل الصلاة، كحمل صغير أو فتح باب.',
 [['الكلام عمدًا في الصلاة:',['يبطلها','لا يبطلها','مكروه فقط'],'إلا ما كان من مصلحتها كالتسبيح للتنبيه.'],
  ['القهقهة في الصلاة:',['تبطلها','لا تبطلها','تستحب'],'اتفق الفقهاء على بطلان الصلاة بها.'],
  ['الالتفات بلا حاجة في الصلاة:',['مكروه','مبطل دائمًا','مستحب'],'قال النبي ﷺ إنه اختلاس يختلسه الشيطان من صلاة العبد.'],
  ['حركة يسيرة للحاجة داخل الصلاة:',['لا تبطلها','تبطلها','تبطلها إن كانت باليد'],'الحركة اليسيرة معفو عنها.'],
  ['الصلاة وأنت تدافع البول:',['مكروهة','مستحبة','واجبة'],'لأنها تشغل القلب عن الخشوع.']]),

L('سجود السهو','سجود السهو سجدتان يجبر بهما المصلي خللًا حدث في صلاته من غير قصد.',[
 ['أسبابه',[
  'زيادة ركعة أو سجدة أو ركن فعلي سهوًا.',
  'نقص واجب أو سنة مؤكدة كالتشهد الأول.',
  'الشك في عدد الركعات.']],
 ['كيفيته وأحكامه',[
  'سجدتان كسجود الصلاة بتكبير.',
  'يكون قبل السلام أو بعده بحسب السبب والمذهب.',
  'عند الشك يبني على الأقل (المتيقَّن) عند الجمهور ثم يتم ويسجد.',
  'الركن المتروك يجب الإتيان به ولا يجبره السجود.']]],
 'سجود السهو يجبر الواجبات والسنن المؤكدة، ولا يجبر الأركان.',
 [['كم سجدة في سجود السهو؟',['سجدتان','سجدة','أربع'],'سجدتان.'],
  ['شككتَ هل صليت ثلاثًا أم أربعًا. ماذا تفعل عند الجمهور؟',['تبني على الأقل وتكمل ثم تسجد للسهو','تبني على الأكثر','تترك الصلاة'],'الأقل هو المتيقَّن.'],
  ['هل يجبر سجود السهو ركنًا تركتَه؟',['لا، بل تأتي بالركن','نعم دائمًا','نعم إن كان سجودًا'],'الأركان لا تُجبر بالسجود.'],
  ['نسيتَ التشهد الأول. ماذا تفعل؟',['تسجد للسهو','تعيد الصلاة','لا شيء'],'ترك الواجب سهوًا يُجبر بالسجود.'],
  ['زدتَ ركعة سهوًا في الصلاة:',['تسجد للسهو','تبطل صلاتك','تعيد الوضوء'],'الزيادة سهوًا تُجبر بسجود السهو.']]),

L('صلاة الجماعة والإمامة','للجماعة منزلة عظيمة في الشرع، ولها أحكام تنظم الصف والإمام.',[
 ['حكمها وفضلها',[
  'فرض عين عند الحنابلة، وفرض كفاية عند الشافعية على المشهور، وسنة مؤكدة عند الحنفية والمالكية.',
  'تفضل صلاة الفرد بسبع وعشرين درجة.']],
 ['أحكام الإمامة والصف',[
  'الأحق بالإمامة: الأقرأ ثم الأفقه ثم الأقدم هجرة ثم الأكبر سنًا.',
  'المأموم يتابع الإمام ولا يسبقه.',
  'من أدرك الركوع مع الإمام أدرك الركعة عند الجمهور.',
  'يقف المأموم الواحد عن يمين الإمام، والنساء خلف الرجال.']]],
 'قال ﷺ: «إنما جُعل الإمام ليؤتمَّ به».',
 [['بكم درجة تفضل صلاة الجماعة صلاة الفرد؟',['سبع وعشرين','عشر','ثلاث'],'ثبت ذلك في الصحيحين.'],
  ['من أدرك الركوع مع الإمام عند الجمهور:',['أدرك الركعة','فاتته الركعة','يعيد الصلاة'],'تحسب له ركعة.'],
  ['أين يقف المأموم الواحد؟',['عن يمين الإمام','عن يساره','خلفه'],'ثبت من فعل النبي ﷺ.'],
  ['حكم الجماعة عند الحنابلة:',['فرض عين','مباحة','مكروهة'],'وغيرهم يقولون بالكفاية أو السنة المؤكدة.'],
  ['علاقة المأموم بالإمام:',['يتابعه ولا يسبقه','يسبقه في الركوع','لا علاقة'],'المتابعة أصل الاقتداء.']]),

L('الجمعة والعيدان','يومان يجتمع فيهما المسلمون للعبادة: الجمعة كل أسبوع، والعيدان كل عام.',[
 ['صلاة الجمعة',[
  'فرض عين على الرجل المسلم البالغ العاقل المقيم.',
  'تسبقها خطبتان، وهي ركعتان جهرًا.',
  'لا تجب على المرأة والمسافر والمريض.',
  'يُسن الاغتسال والتبكير والتطيب ولبس أحسن الثياب.']],
 ['صلاة العيدين',[
  'حكمها: واجبة عند الحنفية، فرض كفاية عند الحنابلة، سنة مؤكدة عند الشافعية والمالكية.',
  'ركعتان بتكبيرات زوائد، تليها خطبة.',
  'يُسن الأكل قبل صلاة الفطر، وبعد صلاة الأضحى.']]],
 'يوم الجمعة سيد الأيام، ويُسن فيه الإكثار من الصلاة على النبي ﷺ وقراءة سورة الكهف.',
 [['كم ركعة في صلاة الجمعة؟',['ركعتان','أربع','ثلاث'],'وتسبقها خطبتان.'],
  ['من لا تجب عليه الجمعة؟',['المرأة والمسافر والمريض','المقيم العاقل','الرجل البالغ'],'هؤلاء معذورون بالنص.'],
  ['ما الذي يسبق صلاة الجمعة؟',['خطبتان','أذانان فقط','ركعتان إجباريتان'],'الخطبتان شرط عند الجمهور.'],
  ['كيف تُصلّى العيدين؟',['ركعتان بتكبيرات زوائد','أربع ركعات','ركعة واحدة'],'ثم تأتي الخطبة بعد الصلاة.'],
  ['السنة قبل صلاة عيد الفطر:',['أن يأكل شيئًا قبل الخروج','أن يصوم','أن يمسك عن الأكل'],'ويحرم صيام يوم العيد.']]),

L('صلاة المسافر والمريض','راعت الشريعة حال المسافر والمريض فخففت عنهما في الصلاة.',[
 ['القصر والجمع في السفر',[
  'قصر الرباعية (الظهر والعصر والعشاء) إلى ركعتين.',

  'يومئ بالركوع والسجود إن عجز عنهما.',
  'لا تسقط عنه الصلاة ما دام عقله حاضرًا.']]],
 'الصلاة لا تسقط عن العاقل بحال، وإنما تتغير هيئتها بحسب حاله.',
 [['ماذا يقصر المسافر من الصلوات؟',['الرباعية إلى ركعتين','الفجر','المغرب'],'الفجر والمغرب لا يُقصران.'],
  ['أيٌّ من هذه لا تُقصر في السفر؟',['المغرب','الظهر','العشاء'],'المغرب ثلاث ركعات تُصلّى كاملة.'],
  ['المريض العاجز عن القيام يصلي:',['قاعدًا','يؤخر الصلاة','لا يصلي'],'ثم على جنبه إن عجز عن القعود.'],
  ['الجمع في السفر يكون بين:',['الظهر والعصر، والمغرب والعشاء','الفجر والظهر','العصر والمغرب'],'ثبت جمع النبي ﷺ في السفر.'],
  ['هل تسقط الصلاة عن المريض عاقل الذهن؟',['لا','نعم','نعم إذا طال المرض'],'يصلي بحسب استطاعته.']])
]);

C('janaiz','الجنائز','التغسيل والتكفين والصلاة والدفن والتعزية',255,'leaf',[
L('الاحتضار والتغسيل والتكفين','للميت المسلم حقوق على الأحياء، تبدأ من لحظة الاحتضار.',[
 ['عند الاحتضار',[
  'يُلقَّن المحتضر الشهادة «لا إله إلا الله» من غير إلحاح.',
  'يُدعى له ويُذكَّر بحسن الظن بالله.',
  'عند الوفاة تُغمض عيناه ويُسجّى بثوب.']],
 ['التغسيل والتكفين',[
  'تغسيل الميت وتكفينه والصلاة عليه ودفنه فرض كفاية.',
  'يُبدأ بالميامن ومواضع الوضوء، ويُغسَّل ثلاثًا فأكثر وترًا، ويُجعل في الأخيرة كافور.',
  'كفن الرجل ثلاث لفائف بيض، وللمرأة خمسة أثواب عند الحنفية والحنابلة.',
  'الشهيد في المعركة لا يُغسَّل ويُكفَّن في ثيابه عند الجمهور.']]],
 'الأصل أن يغسل الرجلُ الرجلَ والمرأةُ المرأة، ويجوز للزوجين غسل أحدهما الآخر عند الجمهور.',
 [['ما حكم تغسيل الميت المسلم؟',['فرض كفاية','سنة','مباح'],'إذا قام به بعض المسلمين سقط الإثم عن الباقين.'],
  ['ماذا يُلقَّن المحتضر؟',['لا إله إلا الله','سورة البقرة','الأذان'],'قال ﷺ: «لقّنوا موتاكم لا إله إلا الله».'],
  ['كفن الرجل:',['ثلاث لفائف بيض','قميص وعمامة فقط','قطعة واحدة'],'هذا هو السنة.'],
  ['يُغسَّل الميت:',['ثلاثًا فأكثر وترًا','مرة واحدة فقط','عشر مرات'],'يُستحب الوتر.'],
  ['الشهيد في المعركة عند الجمهور:',['لا يُغسَّل','يُغسَّل ثلاثًا','يُغسَّل بالكافور'],'يُدفن بثيابه.']]),

L('صلاة الجنازة','صلاة الجنازة دعاء جماعي للميت، وهي فرض كفاية.',[
 ['صفتها',[
  'أربع تكبيرات بلا ركوع ولا سجود.',
  'بعد الأولى: الفاتحة عند الشافعية والحنابلة.',
  'بعد الثانية: الصلاة على النبي ﷺ.',
  'بعد الثالثة: الدعاء للميت.',
  'بعد الرابعة: دعاء قصير ثم التسليم.']],
 ['شروطها وأحكامها',[
  'شروطها كشروط الصلاة: الطهارة والقبلة وستر العورة.',
  'حكمها فرض كفاية.',
  'يقف الإمام عند رأس الرجل ووسط المرأة عند الجمهور.',
  'من فاته بعضها أتمّ ما بقي بعد سلام الإمام.']]],
 'قال ﷺ: «من صلّى على جنازة فله قيراط، ومن شهد دفنها فله قيراطان».',
 [['كم تكبيرة في صلاة الجنازة؟',['أربع','ثلاث','ست'],'هي الأكثر ثبوتًا.'],
  ['هل في صلاة الجنازة ركوع وسجود؟',['لا','نعم','سجود فقط'],'هي قيام ودعاء.'],
  ['حكم صلاة الجنازة:',['فرض كفاية','فرض عين','مباحة'],'إذا قام بها من يكفي سقط الإثم.'],
  ['الدعاء للميت يكون بعد:',['التكبيرة الثالثة','التكبيرة الأولى','التسليم'],'مع دعاء للمسلمين.'],
  ['الصلاة على النبي ﷺ في الجنازة بعد:',['التكبيرة الثانية','التكبيرة الرابعة','التكبيرة الأولى'],'هذا الترتيب المشهور.']]),

L('الدفن والتعزية وزيارة القبور','بعد الصلاة يُدفن الميت، وتُراعى أحكام الدفن والعزاء.',[
 ['الدفن',[
  'يُدفن الميت على جنبه الأيمن موجَّهًا إلى القبلة.',
  'يقول من يضعه: «بسم الله وعلى سنة رسول الله ﷺ».',
  'يُستحب تعميق القبر، ويُنهى عن البناء عليه وتجصيصه.']],
 ['التعزية وآداب العزاء',[
  'تُستحب تعزية أهل الميت وصنع الطعام لهم.',
  'تُنهى النياحة وشق الجيوب ولطم الخدود.',
  'البكاء بلا صراخ جائز رحمة.',
  'زيارة القبور سنة للاعتبار والدعاء للميت.']]],
 'قال ﷺ: «اصنعوا لآل جعفر طعامًا فقد أتاهم ما يشغلهم».',
 [['كيف يوضع الميت في القبر؟',['على جنبه الأيمن إلى القبلة','على ظهره إلى الشمال','على بطنه'],'هذه السنة.'],
  ['ما حكم النياحة على الميت؟',['محرمة','مستحبة','واجبة'],'ومنها شق الجيوب ولطم الخدود.'],
  ['هل يجوز البكاء على الميت؟',['نعم بلا نياحة','لا مطلقًا','نعم بصراخ'],'بكى النبي ﷺ لموت ابنه إبراهيم.'],
  ['السنة تجاه أهل الميت:',['صنع الطعام لهم','تكليفهم بصنع الطعام','الابتعاد عنهم'],'تخفيفًا عنهم.'],
  ['الحكمة من زيارة القبور:',['الاعتبار وتذكر الآخرة','التبرك بالتراب','الاحتفال']
  ,'زوروا القبور فإنها تذكّر الآخرة.']])
]);

C('zakah','الزكاة','الشروط والأنصبة والمصارف وزكاة الفطر',85,'coin',[
L('معنى الزكاة وشروط وجوبها','الزكاة الركن الثالث من أركان الإسلام، وهي حق معلوم في مال مخصوص.',[
 ['معناها وحكمها',[
  'الزكاة لغة: النماء والطهارة.',
  'شرعًا: حق واجب في مال مخصوص لطائفة مخصوصة.',
  'من جحد وجوبها كفر، ومن منعها بخلًا فهو آثم.']],
 ['شروط الوجوب',[
  'الإسلام والحرية.',
  'ملك النصاب ملكًا تامًا، أي الحد الأدنى الذي تجب فيه.',
  'حولان الحول: سنة هجرية كاملة، ويُستثنى الزروع والثمار والمعادن.',
  'أن يكون المال فاضلًا عن الحاجات الأصلية.']]],
 'من لم يبلغ ماله النصاب فلا زكاة عليه، وله أن يتصدق تطوعًا.',
 [['ما ترتيب الزكاة بين أركان الإسلام؟',['الثالث','الثاني','الرابع'],'الشهادتان ثم الصلاة ثم الزكاة.'],
  ['ما المقصود بالحول؟',['سنة هجرية كاملة','شهر','سنة ميلادية فقط'],'يُشترط في الأموال.'],
  ['من لم يبلغ ماله النصاب:',['لا زكاة عليه','تجب عليه','تجب بعد سنتين'],'بلوغ النصاب شرط.'],
  ['هل يُشترط الحول في الزروع والثمار؟',['لا','نعم','بعد ثلاث سنوات'],'تجب عند الحصاد.'],
  ['معنى الزكاة لغةً:',['النماء والطهارة','الدين','الحساب'],'سُمّيت بذلك لأنها تطهّر المال وتنميه.']]),

L('زكاة الذهب والنقود وعروض التجارة','تجب الزكاة في الأثمان والنقود وما أُعدّ للتجارة إذا بلغ النصاب.',[
 ['الأنصبة والقدر',[
  'القدر الواجب: ربع العشر، أي ٢٫٥٪.',
  'نصاب الذهب: نحو ٨٥ جرامًا من عيار ٢٤.',
  'نصاب الفضة: نحو ٥٩٥ جرامًا.',
  'النقود الورقية تُقدَّر بأحد النصابين، وتختلف دور الإفتاء في المعيار.']],
 ['عروض التجارة والحلي',[
  'عروض التجارة تُقوَّم عند تمام الحول، ويُخرج ربع عشر قيمتها.',
  'حلي المرأة المعدّ للزينة: لا زكاة فيه عند الجمهور، وتجب فيه عند الحنفية.',
  'الذهب المدّخر أو المعدّ للتجارة تجب زكاته باتفاق.']]],
 'مثال: مال بلغ النصاب وقدره ١٠٠٬٠٠٠ وحال عليه الحول، فزكاته ١٠٠٬٠٠٠ × ٢٫٥٪ = ٢٬٥٠٠.',
 [['ما القدر الواجب في زكاة النقود؟',['٢٫٥٪','١٠٪','٥٪'],'ربع العشر.'],
  ['كم زكاة مبلغ ٢٠٠٬٠٠٠ بلغ النصاب وحال عليه الحول؟',['٥٬٠٠٠','٢٬٠٠٠','١٠٬٠٠٠'],'٢٠٠٬٠٠٠ × ٢٫٥٪ = ٥٬٠٠٠.'],
  ['نصاب الذهب تقريبًا:',['٨٥ جرامًا','٥٩٥ جرامًا','٢٠ جرامًا'],'ونصاب الفضة ٥٩٥ جرامًا.'],
  ['متى تُقوَّم عروض التجارة؟',['عند تمام الحول','عند الشراء فقط','كل شهر'],'ثم يُخرج ربع عشر القيمة.'],
  ['حلي الزينة للمرأة عند الجمهور:',['لا زكاة فيه','فيه زكاة','فيه نصف زكاة'],'وتجب عند الحنفية.']]),

L('زكاة الزروع والثمار والأنعام','تجب الزكاة في ما تُخرجه الأرض، وفي الأنعام السائمة إذا بلغت نصابها.',[

  'الواجب العُشر فيما سُقي بلا كلفة كالمطر والأنهار.',
  'ونصف العُشر فيما سُقي بكلفة كالآلات.',
  'وقت الوجوب عند الحصاد، ولا يُشترط الحول.']],
 ['الأنعام',[

  'في أربعين شاة شاةٌ واحدة.']]],
 'تفاصيل أنصبة الأنعام كثيرة، فيُرجع فيها عند الحاجة إلى أهل العلم.',
 [['الواجب فيما سُقي بماء المطر:',['العُشر','نصف العُشر','ربع العُشر'],'لأنه بلا كلفة.'],
  ['الواجب فيما سُقي بالآلات:',['نصف العُشر','العُشر','ربع العُشر'],'لوجود الكلفة.'],
  ['أول نصاب الغنم:',['أربعون','عشرون','مئة'],'وفيها شاة.'],
  ['متى تجب زكاة الزروع؟',['عند الحصاد','بعد حول','قبل الزراعة'],'قال تعالى: ﴿وآتوا حقه يوم حصاده﴾.'],
  ['السائمة هي:',['التي ترعى أكثر العام','التي تُعلف دائمًا','التي تُذبح'],'الشرط يخرج المعلوفة.']]),

L('مصارف الزكاة','حدّد القرآن في سورة التوبة ثمانية أصناف تُصرف إليهم الزكاة.',[
 ['الأصناف الثمانية',[

  '<b>العاملون عليها:</b> من يجمعونها ويوزعونها.',

  '<b>في الرقاب:</b> تحرير الأرقاء.',

  'لا تحل لآل النبي ﷺ.',
  'الأفضل تعميم الأصناف بحسب الحاجة، ويجوز الاقتصار على بعضها.']]],
 'من دفع زكاته لمن ظنّه مستحقًا ثم تبيّن غناه أجزأه عند كثير من الفقهاء.',

  ['من هو الغارم؟',['من عليه دين لا يستطيع سداده','من يسافر كثيرًا','من يجمع الزكاة'],'الغارم مدين عاجز.'],
  ['لمن لا يجوز دفع الزكاة؟',['الوالدين والأولاد','ابن السبيل','الغارم'],'لوجوب نفقتهم على المزكّي.'],

  ['العاملون على الزكاة:',['يُعطون منها بسبب عملهم','لا يُعطون','لا يكونون إلا فقراء'],'يأخذون أجر عملهم ولو كانوا أغنياء.']]),

L('زكاة الفطر','زكاة الفطر صدقة تُخرج عن الأبدان في ختام رمضان.',[

 [['ما مقدار زكاة الفطر؟',['صاع من غالب قوت البلد','ربع العشر','مئة جرام'],'نحو ٢٫٥ إلى ٣ كجم.'],

  ['على من تجب؟',['كل مسلم قادر عن نفسه ومن يعول','الأغنياء فقط','الرجال فقط'],'تشمل الصغير والكبير.'],
  ['حكمة زكاة الفطر:',['طهرة للصائم وطعمة للمساكين','إسقاط الصيام','زينة'],'جاء ذلك في الحديث.'],
  ['من أخرجها بعد الصلاة:',['هي صدقة من الصدقات','لا تقبل منه','لا شيء عليه']

L('مفسدات الصيام','المفطرات أمور إذا فعلها الصائم عمدًا بطل صومه.',[
 ['ما يفسد الصوم',[
  'الأكل والشرب عمدًا.',

  'القيء عمدًا، أما ما غلبه فلا يفطر.',

  'الأكل والشرب نسيانًا.',
  'الاحتلام في النهار.',
  'المضمضة والاستنشاق بلا مبالغة، وابتلاع الريق.',
  'الاغتسال والتبرد بالماء.']],
 ['الكفارة',[
  'كفارة الجماع عمدًا في نهار رمضان: عتق رقبة، فإن لم يجد فصيام شهرين متتابعين، فإن لم يستطع فإطعام ستين مسكينًا، على الترتيب عند الجمهور.']]],
 'من أفطر عمدًا بغير الجماع لزمه القضاء عند الجمهور، ولا كفارة عليه عند أكثرهم.',
 [['صائم أكل ناسيًا. ما حكم صومه؟',['صحيح','باطل','عليه كفارة'],'«من نسي وهو صائم فأكل أو شرب فليتم صومه».'],
  ['ما أول خصال كفارة الجماع في رمضان؟',['عتق رقبة','إطعام ستين مسكينًا','صيام ثلاثة أيام'],'الترتيب: عتق ثم صيام ثم إطعام.'],
  ['القيء الذي يغلب الصائم:',['لا يفطر','يفطر','يوجب الكفارة'],'الذي يفطر هو المتعمَّد.'],
  ['الاحتلام أثناء النهار:',['لا يفسد الصوم','يفسد الصوم','يوجب القضاء'],'لأنه بغير اختيار.'],
  ['مدة الصيام في الكفارة:',['شهران متتابعان','ثلاثة أيام','شهر واحد'],'فإن قطع التتابع عمدًا بدأ من جديد.']]),

L('أهل الأعذار والقضاء','راعت الشريعة أحوال الناس، فرخّصت في الفطر لأصحاب الأعذار.',[
 ['المريض والمسافر',[
  'يجوز لهما الفطر ثم القضاء بعدد الأيام.',
  'المريض الذي يشق عليه الصوم الفطر في حقه أولى.',
  'المسافر إن لم يشق عليه فالصوم أفضل عند كثير من الفقهاء.']],
 ['الفدية والقضاء',[
  'الشيخ الكبير والمريض مرضًا لا يُرجى برؤه: يُطعمان عن كل يوم مسكينًا.',
  'الحائض والنفساء تفطران وتقضيان الصوم.',
  'الحامل والمرضع إذا خافتا على أنفسهما أو ولديهما تفطران وتقضيان، وفي الفدية خلاف.',
  'من أخّر القضاء بلا عذر حتى جاء رمضان آخر أثم، وعليه القضاء.']]],
 'يُستحب المبادرة بالقضاء، ويجوز تفريقه وتتابعه.',
 [['ماذا تقضي الحائض؟',['الصوم دون الصلاة','الصلاة دون الصوم','كليهما'],'تيسيرًا من الشرع.'],
  ['ما حكم الشيخ الكبير العاجز عن الصوم؟',['فدية إطعام مسكين عن كل يوم','يقضي','لا شيء عليه'],'لأنه لا يرجى قدرته.'],
  ['المسافر في رمضان:',['يجوز له الفطر ثم يقضي','يجب عليه الفطر','لا يجوز له الفطر'],'الفطر رخصة له.'],
  ['الحامل والمرضع إذا خافتا على أنفسهما:',['تفطران وتقضيان','تصومان دائمًا','تفطران دون قضاء'],'والفدية فيها خلاف.'],
  ['من أخّر قضاء رمضان بلا عذر حتى جاء رمضان آخر:',['آثم وعليه القضاء','لا شيء عليه','يسقط عنه القضاء'],'عليه التوبة والقضاء.']]),

L('صيام التطوع والاعتكاف','فتح الله أبواب التطوع ليزداد المسلم قربًا منه.',[
 ['صيام التطوع',[
  'ستة أيام من شوال بعد رمضان.',
  'يوم عرفة لغير الحاج، ويوم عاشوراء مع التاسع.',
  'الاثنين والخميس، والأيام البيض (١٣ و١٤ و١٥ من كل شهر هجري).',
  'يحرم صيام يومي العيدين.']],
 ['الاعتكاف وليلة القدر',[
  'الاعتكاف: لزوم المسجد للعبادة، وهو سنة، وآكده في العشر الأواخر من رمضان.',
  'يُشترط له النية والمسجد، ويحرم على المعتكف الجماع.',
  'ليلة القدر في العشر الأواخر، وأرجاها الليالي الوترية.']]],
 'ليلة القدر خير من ألف شهر، وفيها يُكثر المسلم من القيام والدعاء.',
 [['حكم صيام ست من شوال بعد رمضان:',['مستحب','واجب','مكروه'],'ثبت فضله في الحديث.'],
  ['أي يوم يحرم صيامه؟',['يوم عيد الفطر','يوم الاثنين','يوم عرفة'],'يحرم صيام يومي العيدين.'],
  ['الأيام البيض هي:',['١٣ و١٤ و١٥ من الشهر الهجري','١ و٢ و٣ منه','٢٧ و٢٨ و٢٩ منه'],'سُمّيت بيضًا لابيضاض لياليها بالقمر.'],
  ['الاعتكاف هو:',['لزوم المسجد للعبادة','السفر للحج','الصيام المتواصل'],'ويكون بنية وتفرغ.'],
  ['ليلة القدر في:',['العشر الأواخر من رمضان','أول رمضان','شعبان'],'وأرجاها الليالي الوترية.']])
]);

C('hajj','الحج والعمرة','الشروط والمواقيت والأركان والمحظورات والأضحية',55,'kaaba',[
L('فرض الحج وشروطه','الحج الركن الخامس من أركان الإسلام، وهو قصد البيت الحرام لأداء مناسك مخصوصة.',[
 ['حكمه',[
  'يجب مرة واحدة في العمر على المستطيع، وما زاد فهو تطوع.',
  'وجوبه على الفور عند الجمهور، وعلى التراخي عند الشافعية.']],
 ['شروطه',[
  'الإسلام والعقل والبلوغ والحرية.',
  '<b>الاستطاعة:</b> الزاد والراحلة وأمن الطريق وصحة البدن.',
  'للمرأة وجود زوج أو محرم عند الجمهور، ويكتفي الشافعية برفقة آمنة.']]],
 'حج الصبي صحيح وله أجره، لكنه لا يُسقط عنه فريضة الحج إذا بلغ.',
 [['كم مرة يجب الحج على المستطيع؟',['مرة في العمر','كل سنة','مرتين'],'وما زاد فهو تطوع.'],
  ['أيٌّ من هذه شرط لوجوب الحج؟',['الاستطاعة','إتقان العربية','الإقامة بمكة'],'ومنها الزاد والراحلة.'],
  ['ما حكم الحج الثاني لمن أدّى الفريضة؟',['تطوع','فرض','حرام'],'ما زاد على الأولى نافلة.'],
  ['تشمل الاستطاعة:',['الزاد والراحلة وأمن الطريق','الشهادة فقط','السفر جوًا'],'مع صحة البدن.'],
  ['حج الصبي غير البالغ:',['صحيح ولا يُسقط الفريضة','لا يصح','يُسقط الفريضة'],'يلزمه الحج بعد البلوغ إن استطاع.']]),

L('المواقيت والإحرام','للحج مواقيت زمانية ومكانية، ويبدأ النسك بالإحرام.',[
 ['المواقيت',[
  '<b>الزماني:</b> شوال وذو القعدة وعشر من ذي الحجة.',
  '<b>المكاني:</b> ذو الحليفة لأهل المدينة، والجحفة لأهل الشام ومصر، وقرن المنازل لأهل نجد، ويلملم لأهل اليمن، وذات عرق لأهل العراق.',
  'لا يجوز تجاوز الميقات لمن أراد النسك بغير إحرام.']],
 ['الإحرام وأنواع النسك',[
  'الإحرام نية الدخول في النسك، ويُسن قبله الغسل والتطيب في البدن.',
  'الرجل يلبس إزارًا ورداءً أبيضين، والمرأة تلبس ثيابها الساترة المعتادة.',
  'التلبية: «لبيك اللهم لبيك، لبيك لا شريك لك لبيك، إن الحمد والنعمة لك والملك لا شريك لك».',
  'أنواع النسك ثلاثة: التمتع والقران والإفراد.']]],
 'التمتع: عمرة ثم حج في العام نفسه مع التحلل بينهما، وفيه هدي.',
 [['ما ميقات أهل المدينة؟',['ذو الحليفة','يلملم','قرن المنازل'],'ويُعرف اليوم بأبيار علي.'],
  ['ما ميقات أهل اليمن؟',['يلملم','الجحفة','ذات عرق'],'جاء ذلك في الصحيحين.'],
  ['ما الإحرام؟',['نية الدخول في النسك','لبس الأبيض فقط','الطواف'],'واللباس من هيئاته.'],
  ['كم عدد أنواع النسك؟',['ثلاثة','اثنان','أربعة'],'التمتع والقران والإفراد.'],
  ['أين يُلبّي الحاج؟',['منذ الإحرام','بعد الرمي فقط','قبل المسجد الحرام فقط'],'يستمر حتى رمي جمرة العقبة.']]),

L('أركان الحج وواجباته','للحج أركان لا يصح إلا بها، وواجبات يُجبر تركها بدم.',[
 ['الأركان',[
  '<b>الإحرام.</b>',
  '<b>الوقوف بعرفة</b> يوم التاسع من ذي الحجة: «الحج عرفة».',
  '<b>طواف الإفاضة</b> سبعة أشواط.',
  '<b>السعي</b> بين الصفا والمروة سبعة أشواط، وهو ركن عند الجمهور وواجب عند الحنفية.']],
 ['الواجبات',[
  'الإحرام من الميقات.',
  'المبيت بمزدلفة.',
  'رمي الجمرات.',
  'الحلق أو التقصير.',
  'المبيت بمنى ليالي التشريق، وطواف الوداع.']]],
 'من فاته الوقوف بعرفة فاته الحج. ومن ترك واجبًا لزمه دم.',
 [['ما أعظم أركان الحج؟',['الوقوف بعرفة','رمي الجمرات','الحلق'],'«الحج عرفة».'],
  ['في أي يوم يكون الوقوف بعرفة؟',['التاسع من ذي الحجة','الثامن','العاشر'],'يوم عرفة.'],
  ['كم شوطًا في الطواف؟',['سبعة','خمسة','عشرة'],'تبدأ من الحجر الأسود.'],
  ['من ترك واجبًا من واجبات الحج:',['يلزمه دم','لا شيء عليه','يبطل حجه'],'جبرًا للنقص.'],
  ['المبيت بمزدلفة:',['واجب','ركن','مباح'],'وقد يُكتفى بجزء من الليل عند الجمهور.']]),

L('محظورات الإحرام والفدية','يلتزم المحرم بترك أمور تُسمّى محظورات الإحرام.',[
 ['المحظورات',[
  'حلق الشعر وتقليم الأظافر.',
  'استعمال الطيب.',
  'للرجل: لبس المخيط وتغطية الرأس.',
  'للمرأة: النقاب والقفازان.',
  'قتل الصيد البري وعقد النكاح.',
  'الجماع ومقدماته.']],
 ['الفدية',[
  'فدية الأذى: صيام ثلاثة أيام أو إطعام ستة مساكين أو ذبح شاة.',
  'الجماع قبل التحلل الأول يفسد الحج، ويجب إتمامه وقضاؤه.']]],
 'الأصل في الفدية أنها جبران لما حصل من نقص في النسك.',
 [['أيٌّ من هذه محظور على الرجل المحرم؟',['لبس المخيط','لبس الإزار والرداء','الاغتسال'],'لبس الثوب المخيط وتغطية الرأس من المحظورات.'],
  ['هل يجوز للمحرم استعمال الطيب؟',['لا','نعم','بعد الطواف فقط'],'من المحظورات.'],
  ['فدية الأذى:',['صيام ثلاثة أيام أو إطعام ستة مساكين أو شاة','ريال واحد','لا شيء'],'على التخيير.'],
  ['ما الذي تتجنبه المرأة المحرمة؟',['النقاب والقفازان','الثوب الساتر','الاغتسال'],'تغطي وجهها بغيرهما عند وجود الأجانب.'],
  ['الجماع قبل التحلل الأول:',['يفسد الحج','لا أثر له','يوجب صيام يوم'],'ويجب إتمام الحج وقضاؤه.']]),

L('العمرة والأضحية والعقيقة','من عبادات الذبح والقربات المرتبطة بمواسم الحج والمولود.',[
 ['العمرة',[

  'حكمها: سنة مؤكدة عند الحنفية والمالكية، وفرض عند الشافعية والحنابلة.',
  'تجوز في أي وقت من السنة.']],
 ['الأضحية',[
  'سنة مؤكدة عند الجمهور، وواجبة عند الحنفية على المقيم الغني.',
  'وقتها بعد صلاة العيد إلى آخر أيام التشريق.',
  'من الإبل والبقر والغنم بشرط بلوغ السن.',
  'لا تجزئ العوراء البيّن عورها ولا العرجاء ولا المريضة ولا الكسيرة.']],
 ['العقيقة',[
  'سنة عند ولادة المولود، تُذبح في اليوم السابع.',
  'شاتان عن الغلام وشاة عن الجارية عند الجمهور.']]],
 'يأكل صاحب الأضحية منها ويُهدي ويتصدق.',
 [['ما أركان العمرة؟',['الإحرام والطواف والسعي','الوقوف بعرفة','رمي الجمرات'],'مع الحلق أو التقصير.'],
  ['متى يمكن أداء العمرة؟',['في أي وقت من السنة','في رمضان فقط','في ذي الحجة فقط'],'وفي رمضان أفضل.'],
  ['متى يبدأ وقت الأضحية؟',['بعد صلاة العيد','قبل الفجر','بعد العصر قبل العيد'],'وينتهي بآخر أيام التشريق.'],
  ['أيٌّ من هذه لا تجزئ في الأضحية؟',['العوراء البيّن عورها','السليمة','الكبيرة السن'],'العيوب المنصوص عليها لا تجزئ.'],
  ['العقيقة تُذبح في اليوم:',['السابع','الأول بعد شهر','الأربعين'],'من ولادة المولود.']])
]);

C('muamalat','المعاملات','البيع والربا والغرر والقرض والإجارة والوكالة',350,'scale',[
L('البيع وشروطه','البيع مبادلة مال بمال على سبيل التراضي. والأصل في المعاملات الإباحة ما لم يرد دليل على التحريم.',[
 ['أركان البيع وشروطه',[
  'الأركان عند الجمهور: العاقدان والصيغة والمعقود عليه.',
  '<b>التراضي:</b> فلا يصح البيع بالإكراه.',
  '<b>أهلية العاقد:</b> عاقل مميّز رشيد.',
  '<b>المبيع:</b> مباح النفع، مملوك للبائع، معلوم، مقدور على تسليمه.']],
 ['بيوع منهي عنها',[
  'بيع ما لا يملكه البائع.',
  'النجش: الزيادة في ثمن السلعة لا لرغبة فيها بل لرفع السعر.',
  'بيعتان في بيعة، كقوله: بعتك بألف نقدًا أو بألفين نسيئة دون تعيين.',
  'بيع المحرَّمات كالخمر والخنزير والميتة.']]],
 'قال النبي ﷺ لحكيم بن حزام: «لا تبع ما ليس عندك».',
 [['ما الأصل في المعاملات المالية؟',['الإباحة','التحريم','الكراهة'],'حتى يرد دليل التحريم.'],
  ['هل يصح أن تبيع ما لا تملك؟',['لا يصح','يصح دائمًا','يصح بنصف الثمن'],'من شروط المبيع أن يكون مملوكًا.'],
  ['البيع بالإكراه:',['لا يصح لانعدام التراضي','يصح','يصح بعد سنة'],'التراضي ركن.'],
  ['ما النجش؟',['الزيادة في السلعة لا لرغبة بل لرفع السعر','البيع بالتقسيط','الشراء بسعر منخفض'],'نهى عنه النبي ﷺ.'],
  ['أركان البيع عند الجمهور:',['العاقدان والصيغة والمعقود عليه','البائع فقط','الثمن فقط'],'وهي الأركان الثلاثة.']]),

L('الربا والصرف','الربا من كبائر الذنوب، وقد حرّمه الله تعالى، وهو زيادة محرّمة في معاملة مالية.',[
 ['أنواع الربا',[
  '<b>ربا الفضل:</b> زيادة عند مبادلة الجنس الربوي بجنسه، كذهب بذهب مع زيادة.',
  '<b>ربا النسيئة:</b> تأخير القبض في مبادلة الأصناف الربوية، أو الزيادة مقابل الأجل في القرض.',
  '<b>الأصناف الستة:</b> الذهب والفضة والبرّ والشعير والتمر والملح.']],
 ['قواعد وأحكام',[
  '«كل قرض جرّ منفعة مشروطة فهو ربا».',
  'بيع الذهب بالذهب يُشترط فيه المثلية والتقابض في المجلس.',
  'الصرف: بيع النقد بالنقد، ويُشترط التقابض إذا اختلف الجنس.',
  'يدخل في التحريم الآكل والموكل والكاتب والشاهدان.']]],
 'ما كان علّته الجنس والقدر أو الثمنية يُلحق بالأصناف الستة عند الفقهاء.',
 [['اقترضتَ بشرط أن تردّ أكثر منه. ما الحكم؟',['ربا محرّم','عقد جائز','هبة'],'القرض المشروط فيه زيادة ربا.'],
  ['كم عدد الأصناف الربوية المنصوص عليها؟',['ستة','أربعة','عشرة'],'الذهب والفضة والبر والشعير والتمر والملح.'],
  ['ما ربا الفضل؟',['زيادة في مبادلة الجنس الواحد بجنسه','تأخير الدفع بلا زيادة','ربح التاجر'],'كمن يبيع كيلوين من التمر بثلاثة منه.'],
  ['يُشترط في بيع الذهب بالذهب:',['المثلية والتقابض','التأجيل','الزيادة'],'يدًا بيد مثلًا بمثل.'],
  ['الصرف هو:',['بيع النقد بالنقد','بيع الأرض','تأجير السيارات'],'ويشترط التقابض فيه.']]),

L('الغرر والغش والخيارات','من مقاصد الشريعة في البيوع حفظ الحقوق ومنع النزاع، فنهت عن الغرر والغش.',[
 ['الغرر والغش',[
  '<b>الغرر:</b> ما فيه جهالة كبيرة أو خطر، كبيع السمك في الماء قبل صيده.',
  '<b>الغش:</b> إخفاء عيب في السلعة، وهو محرم.',
  '<b>التدليس:</b> إظهار السلعة بغير حقيقتها.']],
 ['الخيارات',[

 [['ماذا يُقال عند الذبح؟',['بسم الله والله أكبر','سبحان الله','لا إله إلا الله'],'التسمية شرط عند الجمهور.'],

L('الصيد','الصيد مباح بشروط، ويراعى فيه الرحمة وعدم العبث.',[
 ['أحكام الصيد',[
  'الصيد مباح لغير المحرم، ويحرم صيد البر على المحرم.',

 ['شروط الحل',[

  'إذا أكل الكلب من الصيد لم يحل عند الجمهور.',
  'يحرم الصيد للهو والعبث دون حاجة.']]],
 'نهى النبي ﷺ عن اتخاذ ذي روح غرضًا يُرمى.',
 [['ما الجارحة المعلَّمة؟',['التي تنزجر إذا زُجرت وتسترسل إذا أُرسلت','أي كلب','التي تأكل من الصيد'],'هذه شروط التعليم.'],
  ['متى يُسمّى على الصيد؟',['عند الإرسال أو الرمي','بعد الأكل','لا يُسمّى'],'كالتسمية على الذبح.'],
  ['صيد البر على المحرم:',['حرام','حلال','مكروه'],'﴿وحُرّم عليكم صيد البر ما دمتم حُرمًا﴾.'],
  ['إذا أكل الكلب من الصيد عند الجمهور:',['لا يحل','يحل','يحل نصفه'],'لأنه أمسكه لنفسه.'],
  ['الصيد للهو والعبث:',['محرم','مباح','مستحب'],'نهى عن اتخاذ الحيوان غرضًا.']])

C('aymaan','الأيمان والنذور','اليمين وكفارته والنذر',30,'scroll',[
L('اليمين وأنواعها','اليمين توكيد الأمر بذكر الله، ولها أحكام تحفظ حرمة الاسم الأعظم.',[

  '<b>المنعقدة:</b> الحلف على أمر مستقبل، وفيها الكفارة إن حنث.',

 ['أحكام الحلف',[
  'يحرم الحلف بغير الله.',
  'يُكره الإكثار من الحلف.',
  'من حلف على شيء فرأى غيره خيرًا منه فليأتِ الذي هو خير ويكفّر عن يمينه.']]],
 'قال ﷺ: «من كان حالفًا فليحلف بالله أو ليصمت».',
 [['ما حكم لغو اليمين؟',['لا كفارة فيه','فيه كفارة','محرم'],'لأنه بلا قصد.'],
  ['حكم الحلف بغير الله:',['محرم','مباح','مستحب'],'الحلف لا يكون إلا بالله وأسمائه وصفاته.'],
  ['ما اليمين الغموس؟',['الحلف على كذب في أمر ماض عمدًا','الحلف على مستقبل','الحلف بلا قصد'],'من الكبائر.'],
  ['اليمين المنعقدة تكون على:',['أمر مستقبل','أمر ماض','كل شيء'],'ويجب بها الكفارة عند الحنث.'],
  ['من حلف ثم رأى خيرًا منها:',['يفعل الخير ويكفّر','يتمسك بيمينه','لا شيء عليه'],'ورد في الحديث.']]),

L('كفارة اليمين','إذا حنث الحالف في يمين منعقدة لزمته الكفارة.',[

 [['كم مسكينًا تُطعم في كفارة اليمين؟',['عشرة','سبعة','ثلاثون'],'أو كسوتهم أو تحرير رقبة.'],
  ['متى يصوم الحانث ثلاثة أيام؟',['إذا لم يجد إحدى الخصال','في كل حال','بعد كل يمين'],'الصيام بدل عن الخصال.'],
  ['الخصال الثلاث الأولى:',['على التخيير','على الترتيب','واجبة كلها'],'يختار واحدة منها.'],
  ['يُطعم المساكين من:',['أوسط ما يطعم أهله','أردأ الطعام','أفخر الطعام'],'نص القرآن.'],
  ['من خصال كفارة اليمين:',['تحرير رقبة','حج','زكاة'],'أحد الخصال الثلاث.']]),

L('النذر','النذر التزام عبادة، ولا يُحمد ابتداءً لكن يجب الوفاء به إن كان طاعة.',[

  'نذر المعصية لا يجوز الوفاء به.']],

 'قال ﷺ: «من نذر أن يطيع الله فليطعه، ومن نذر أن يعصي الله فلا يعصه».',

  ['من عجز عن الوفاء بالنذر:',['عليه كفارة يمين','لا شيء','يصوم سنة'],'قاله جمهور الفقهاء.'],
  ['النذر ابتداءً:',['مكروه','مستحب','واجب'],'لأنه لا يأتي بخير.']])

C('mawarith','الوصايا والمواريث والوقف','الوصية والوقف والفرائض والعصبات',190,'pie',[
L('الوصية','الوصية تبرّع مضاف إلى ما بعد الموت، وقد شرعها الله رحمة بالإنسان وأهله.',[

L('الوقف','الوقف صدقة جارية يبقى أصلها وينتفع بثمرتها.',[
 ['معناه وشروطه',[

L('الفرائض: أصحاب الفروض','علم الفرائض يقسّم التركة بين الورثة بعدل وفق ما حدّده القرآن.',[

L('العصبات وموانع الإرث','بعد أصحاب الفروض يأخذ العصبة الباقي، وتمنع بعض الأسباب من الميراث.',[

  ['من يحجب الأخ؟',['الابن','الجار','الصديق'],'الأقرب يحجب الأبعد.']])
]);

C('hudud','الجنايات والحدود والقضاء','القصاص والحدود والتعزير والقضاء',10,'gavel',[
L('القتل والقصاص والديات','حفظ النفس من مقاصد الشريعة، ولذلك عظّمت جريمة القتل.',[
 ['أنواع القتل',[

L('الحدود','الحدود عقوبات مقدّرة شرعًا، شُرعت زجرًا وصيانة للمجتمع.',[

 'الحدود لا تقام إلا ببينة مكتملة وسلطة قضائية، وهي زاجرة وليست غاية في ذاتها.',

  ['من شروط حد السرقة:',['بلوغ النصاب وأخذه من حرز','أي مبلغ','السرقة من الجائع'],'ودرء الشبهات.'],
  ['الستر على المسلم:',['مندوب ما لم يبلغ الحاكم','محرم','واجب إعلانه'],'قال ﷺ: «من ستر مسلمًا ستره الله».']]),

L('التعزير','التعزير عقوبة غير مقدّرة تُفرض على ما لا حدّ فيه ولا كفارة.',[
 ['معناه وصوره',[

C('tawhid','التوحيد','أقسامه ومعنى لا إله إلا الله والشرك والعبادة',200,'sun',[
L('أقسام التوحيد','التوحيد أصل الدين وأول ما دعت إليه الرسل، وعليه يقوم قبول الأعمال كلها.',[
 ['معناه وأقسامه',[
  '<b>التوحيد:</b> إفراد الله تعالى بما يختص به من الربوبية والألوهية والأسماء والصفات.',
  '<b>توحيد الربوبية:</b> الإقرار بأن الله وحده الخالق الرازق المدبّر لشؤون الكون.',
  '<b>توحيد الألوهية (العبادة):</b> إفراد الله وحده بالعبادة كالدعاء والصلاة والنذر والتوكل.',
  '<b>توحيد الأسماء والصفات:</b> إثبات ما أثبته الله لنفسه من الأسماء والصفات على الوجه اللائق به.']],
 ['الحكمة من خلق الخلق',[
  'قال تعالى: ﴿وما خلقت الجن والإنس إلا ليعبدون﴾.',
  'أقرّ مشركو قريش بالربوبية، ومع ذلك لم يدخلوا في الإسلام لأنهم أشركوا في العبادة.',
  'أول ما بدأت به دعوة الرسل: «اعبدوا الله ما لكم من إله غيره».']]],
 'هذا التقسيم مستنبط من نصوص القرآن والسنة، وهو يُيسّر فهم مسائل التوحيد.',
 [['أيّ أقسام التوحيد يتعلق بأفعال الله كالخلق والرزق؟',['توحيد الربوبية','توحيد الألوهية','توحيد الأسماء والصفات'],'الربوبية هي إفراد الله بالخلق والرزق والتدبير.'],
  ['توحيد الألوهية هو:',['إفراد الله بالعبادة','الإقرار بأن الله خالق','إثبات الأسماء الحسنى'],'ويسمى توحيد العبادة.'],
  ['لماذا لم يدخل مشركو قريش في الإسلام مع إقرارهم بأن الله هو الخالق؟',['لأنهم أشركوا في العبادة','لأنهم أنكروا وجود الله','لأنهم جهلوا لغة القرآن'],'الإقرار بالربوبية وحده لا يكفي لدخول الإسلام.'],
  ['الحكمة من خلق الجن والإنس هي:',['عبادة الله','جمع المال','العمارة فقط'],'﴿وما خلقت الجن والإنس إلا ليعبدون﴾.'],
  ['بأي شيء بدأت دعوة الرسل؟',['بالأمر بعبادة الله وحده','بالأمر بالزكاة','بالأمر بالجهاد'],'«اعبدوا الله ما لكم من إله غيره».']]),

L('معنى لا إله إلا الله وشروطها','كلمة التوحيد هي مفتاح الإسلام، ولها معنى وشروط وأركان.',[
 ['المعنى والأركان',[
  'معناها: لا معبود بحق إلا الله.',
  '<b>ركنها الأول (النفي):</b> «لا إله» تنفي العبادة عن كل ما سوى الله.',
  '<b>ركنها الثاني (الإثبات):</b> «إلا الله» تثبت العبادة لله وحده.']],
 ['شروطها السبعة',[
  '<b>العلم</b> المنافي للجهل بمعناها.',
  '<b>اليقين</b> المنافي للشك.',

  '<b>الصدق</b> المنافي للكذب، و<b>الإخلاص</b> المنافي للشرك.',
  '<b>المحبة</b> المنافية للبغض.']]],
 'قال ﷺ: «من قال لا إله إلا الله خالصًا من قلبه دخل الجنة»، فلا بد من تحقق الشروط لا النطق وحده.',
 [['معنى «لا إله إلا الله»:',['لا معبود بحق إلا الله','لا خالق إلا الله فقط','لا ملك إلا الله فقط'],'فهي تتضمن نفي الألوهية عن غير الله وإثباتها له.'],
  ['ماذا يقابل ركن «النفي» في الكلمة؟',['لا إله','إلا الله','محمد رسول الله'],'يفيد نفي العبادة عما سوى الله.'],
  ['من شروط لا إله إلا الله:',['الإخلاص','كثرة المال','حفظ الكتب'],'من شروطها السبعة: العلم واليقين والقبول والانقياد والصدق والإخلاص والمحبة.'],
  ['اليقين في الكلمة ينافي:',['الشك','الجهل','الكذب'],'فلا تنفع قولًا مع شك.'],
  ['هل يكفي النطق بالكلمة دون تحقق الشروط؟',['لا، لا بد من تحقق الشروط','نعم دائمًا','نعم إن كثر الذكر'],'النطق مع العلم والاعتقاد والعمل.']]),

L('الشرك وأنواعه','الشرك أعظم الذنوب، وهو صرف شيء من حق الله إلى غيره.',[
 ['الشرك الأكبر',[

  'قال تعالى: ﴿إن الله لا يغفر أن يُشرك به ويغفر ما دون ذلك لمن يشاء﴾.']],
 ['الشرك الأصغر والخفي',[

  'من الوسائل المنهي عنها المؤدية إلى الشرك: الغلو في الصالحين وتعظيم القبور.']]],
 'قال ﷺ: «أخوف ما أخاف عليكم الشرك الأصغر، الرياء».',
 [['الشرك الأكبر:',['يُخرج من الملة','يُغفر دائمًا','ليس بذنب'],'ومن مات عليه لم يُغفر له.'],
  ['الرياء من أنواع:',['الشرك الأصغر','الشرك الأكبر','الكفر بالقدر'],'لأنه يقصد به الناس مع الله.'],
  ['الدعاء لغير الله فيما لا يقدر عليه إلا الله:',['شرك أكبر','مباح','مكروه'],'الدعاء عبادة لا تُصرف إلا لله.'],
  ['ما حكم الذبح لغير الله تعظيمًا له؟',['شرك أكبر','سنة','مباح'],'الذبح عبادة، قال تعالى: ﴿فصل لربك وانحر﴾.'],
  ['من وسائل الشرك المنهي عنها:',['الغلو في الصالحين','الصدقة','قراءة القرآن'],'سدًّا لذريعة الشرك.']]),

  ['العبادة تشمل:',['الأقوال والأعمال الظاهرة والباطنة','الصلاة فقط','الشعائر فقط'],'كل ما يحبه الله ويرضاه.']])

C('asma','الأسماء والصفات','أسماء الله الحسنى وصفاته وكلامه',45,'star',[

  ['هل حصر الحديث أسماء الله في تسعة وتسعين؟',['لا، بل بيّن فضل إحصائها','نعم تمامًا','لا يُعرف'],'لله أسماء أخرى استأثر بها في علم الغيب.'],

L('صفات الله ومنهج أهل السنة','الإيمان بصفات الله من أصول العقيدة، ومنهج أهل السنة فيها وسط بين التعطيل والتشبيه.',[

C('malaika','الإيمان بالملائكة','خلقهم وصفاتهم ووظائفهم',335,'wing',[
L('خلق الملائكة وصفاتهم','الإيمان بالملائكة ركن من أركان الإيمان الستة، وهم عالم غيبي من خلق الله.',[

 ['الواجب نحوهم',[
  'الإيمان بوجودهم وبما صحّ من أسمائهم وأفعالهم.',
  'محبتهم وعدم عبادتهم أو دعائهم.',
  'تعظيمهم دون غلو، والاعتقاد أنهم لا يملكون نفعًا ولا ضرًا.']]],
 'قال تعالى: ﴿ومن يكفر بالله وملائكته وكتبه ورسله واليوم الآخر فقد ضل ضلالًا بعيدًا﴾.',
 [['الملائكة خُلقوا من:',['نور','طين','نار'],'جاء في صحيح مسلم.'],

  ['الملائكة بالنسبة للذكورة والأنوثة:',['ليسوا ذكورًا ولا إناثًا','ذكور','إناث'],'ونسبتهم إلى الأنوثة افتراء.'],

C('rusul','الإيمان بالكتب والرسل','الكتب السماوية والأنبياء وخصائص الرسل',15,'flag',[
L('الكتب السماوية','أنزل الله على رسله كتبًا فيها الهدى والنور، والإيمان بها ركن من أركان الإيمان.',[
 ['الكتب المسماة',[
  '<b>التوراة</b> على موسى عليه السلام.',
  '<b>الإنجيل</b> على عيسى عليه السلام.',
  '<b>الزبور</b> على داود عليه السلام.',
  '<b>صحف إبراهيم وموسى</b>، و<b>القرآن</b> على محمد ﷺ.']],

 'تؤمن بالكتب جملةً فيما لم يُسمَّ، وتفصيلًا فيما سمّاه الله.',
 [['الكتاب المنزل على عيسى عليه السلام:',['الإنجيل','التوراة','الزبور'],'والتوراة على موسى والزبور على داود.'],
  ['القرآن بالنسبة للكتب السابقة:',['مصدّق لها ومهيمن عليها','مكرّر لها','لا علاقة له بها'],'قال تعالى: ﴿مصدقًا لما بين يديه من الكتاب ومهيمنًا عليه﴾.'],

  ['الزبور أنزل على:',['داود عليه السلام','موسى عليه السلام','عيسى عليه السلام'],'ذكره القرآن.'],

L('الأنبياء والرسل','أرسل الله رسلًا لهداية البشر، وجعل نبوة محمد ﷺ خاتمة النبوات.',[

  '<b>النبي:</b> من أُوحي إليه ولم يُؤمر بالتبليغ عند بعض العلماء، وقيل هما بمعنى متقارب.',
  '<b>أول الرسل:</b> نوح عليه السلام، و<b>آخرهم:</b> محمد ﷺ.',

 ['الإيمان بهم',[
  'نؤمن بجميعهم ولا نفرّق بين أحد منهم.',
  'من كفر برسول واحد فقد كفر بالجميع.',
  'عدد الأنبياء لا يعلمه إلا الله، وذكر القرآن منهم خمسة وعشرين.']]],
 'قال تعالى: ﴿لا نفرّق بين أحد من رسله﴾.',
 [['أول الرسل:',['نوح عليه السلام','إبراهيم عليه السلام','موسى عليه السلام'],'وهو أول رسول إلى أهل الأرض.'],
  ['خاتم الأنبياء والمرسلين:',['محمد ﷺ','عيسى عليه السلام','إبراهيم عليه السلام'],'﴿وخاتم النبيين﴾.'],
  ['من أولو العزم من الرسل؟',['نوح وإبراهيم وموسى وعيسى ومحمد','يوسف وأيوب','هود وصالح وشعيب'],'هم أصحاب العزم والثبات.'],
  ['حكم التفريق بين الرسل في الإيمان:',['لا يجوز','يجوز','مستحب'],'نؤمن بالجميع.'],
  ['من كفر برسول واحد:',['كفر بالرسل جميعًا','لا شيء عليه','كفر به وحده'],'لأن دعوتهم واحدة.']]),

L('خصائص الرسل والمعجزات','اصطفى الله رسله بصفات تليق بمقام النبوة، وأيدهم بالمعجزات.',[
 ['صفاتهم',[
  'الصدق والأمانة والفطانة وتبليغ الرسالة.',
  'عصمتهم فيما يبلّغونه عن الله.',
  'بشر لا يُعبدون ولا يملكون من الربوبية شيئًا: ﴿قل إنما أنا بشر مثلكم يوحى إليّ﴾.']],
 ['المعجزات والختم',[
  '<b>المعجزة:</b> أمر خارق للعادة يؤيد الله به نبيّه شاهدًا على صدقه.',
  'من أمثلتها: عصا موسى، وإحياء عيسى الموتى بإذن الله.',
  'معجزة محمد ﷺ الكبرى القرآن الباقي إلى يوم القيامة.',
  'ختم الله النبوة بمحمد ﷺ فلا نبي بعده.']]],
 'من ادعى النبوة بعد محمد ﷺ فهو كاذب، ومن صدّقه فقد كذّب القرآن.',
 [['المعجزة هي:',['أمر خارق للعادة يؤيد الله به نبيّه','عمل صالح','حيلة بشرية'],'تكون دليلًا على صدق النبي.'],
  ['معجزة محمد ﷺ الكبرى:',['القرآن الكريم','عصا','ناقة'],'باقية إلى يوم القيامة.'],
  ['الأنبياء بالنسبة للبشرية:',['بشر لا يُعبدون','ملائكة','آلهة'],'﴿إنما أنا بشر مثلكم﴾.'],
  ['حكم ادعاء النبوة بعد محمد ﷺ:',['كذب وضلال','جائز','مباح لمن بلغ الكمال'],'ختم الله به النبوة.'],
  ['من صفات الرسل:',['الصدق والأمانة والتبليغ','الكذب','الكتمان'],'وهي من لوازم الرسالة.']])
]);

C('akhira','الإيمان باليوم الآخر','البرزخ والأشراط والبعث والحساب والجنة والنار',270,'hourglass',[
L('البرزخ وعذاب القبر ونعيمه','اليوم الآخر يبدأ بالموت وما بعده من البرزخ، ثم القيامة.',[

  'البرزخ هو الحياة التي بين الموت والبعث.',

L('أشراط الساعة','للساعة علامات تدل على قربها، منها صغرى وكبرى.',[

  ['من علامات الساعة الكبرى:',['خروج يأجوج ومأجوج','ازدياد المطر','كثرة التجارة'],'ورد ذلك في القرآن والسنة.'],

L('البعث والحشر والحساب','بعد النفخ في الصور يقوم الناس من قبورهم للحساب.',[

  '<b>الحوض:</b> حوض النبي ﷺ يشرب منه المؤمنون.',

 'قال تعالى: ﴿فمن يعمل مثقال ذرة خيرًا يره، ومن يعمل مثقال ذرة شرًا يره﴾.',

  ['الميزان في القيامة توزن به:',['الأعمال بالعدل','الأموال','الأنساب'],'فلا يُظلم أحد.'],
  ['كيف يأخذ المؤمن كتابه؟',['بيمينه','بشماله','من وراء ظهره'],'قال تعالى: ﴿فأما من أوتي كتابه بيمينه﴾.'],
  ['الصراط:',['جسر على جهنم يمر عليه الناس','باب الجنة','جبل'],'ويمرون بحسب أعمالهم.'],
  ['حوض النبي ﷺ:',['يشرب منه المؤمنون','في الدنيا','للكفار'],'ثبتت به الأحاديث.']]),

L('الجنة والنار والشفاعة والرؤية','المآل الأخير للخلق إما الجنة وإما النار، والإيمان بهما من أصول العقيدة.',[

 ['الشفاعة والرؤية',[

  '<b>رؤية الله:</b> يرى المؤمنون ربهم يوم القيامة بأبصارهم دون إحاطة.']]],
 'قال تعالى: ﴿وجوه يومئذ ناضرة، إلى ربها ناظرة﴾.',
 [['الجنة والنار الآن:',['مخلوقتان باقيتان','لم تُخلقا','تفنيان'],'وهما باقيتان أبدًا.'],
  ['الشفاعة العظمى لـ:',['نبينا محمد ﷺ','موسى عليه السلام','جبريل'],'في فصل القضاء بين الخلق.'],
  ['رؤية المؤمنين لربهم يوم القيامة:',['ثابتة','مستحيلة','مجازية'],'ثبتت بالقرآن والسنة.'],
  ['من يخرج من النار بشفاعة وبرحمة الله؟',['من كان في قلبه إيمان من أهل التوحيد','الكفار','الجميع'],'بعد التطهير.'],
  ['الجنة دار:',['النعيم للمؤمنين','العذاب','البرزخ'],'وصفها الله بما لا عين رأت ولا أذن سمعت.']])
]);

C('qadar','الإيمان بالقدر','مراتبه وعلاقته بالاختيار',130,'pen',[
L('مراتب القدر','الإيمان بالقدر خيره وشره ركن من أركان الإيمان الستة.',[
 ['المراتب الأربع',[
  '<b>العلم:</b> أن الله علم كل شيء قبل وقوعه.',
  '<b>الكتابة:</b> أن الله كتب مقادير الخلائق في اللوح المحفوظ.',
  '<b>المشيئة:</b> أن ما شاء الله كان وما لم يشأ لم يكن.',

 ['أدلتها',[
  '﴿إنا كل شيء خلقناه بقدر﴾.',

 'قال النبي ﷺ: «واعلم أن ما أصابك لم يكن ليخطئك وما أخطأك لم يكن ليصيبك».',
 [['كم مراتب الإيمان بالقدر؟',['أربع','ثلاث','ست'],'العلم والكتابة والمشيئة والخلق.'],
  ['مرتبة الكتابة تعني:',['أن الله كتب المقادير في اللوح المحفوظ','أن العباد يكتبون أعمالهم','أن الملائكة تكتب فقط'],'قبل خلق السماوات والأرض.'],
  ['من مراتب القدر:',['المشيئة','الاجتهاد','الصبر'],'ما شاء الله كان.'],
  ['معنى مرتبة العلم:',['علم الله بكل شيء قبل وقوعه','علم الإنسان بالغيب','تعلّم العباد'],'علمه محيط بكل شيء.'],
  ['الإيمان بالقدر ركن:',['من أركان الإيمان','مستحب','من الآداب'],'«وتؤمن بالقدر خيره وشره».']]),

L('القدر والاختيار','هل الإنسان مجبر أم مختار؟ منهج أهل السنة وسط بين الجبر ونفي القدر.',[
 ['مشيئة العبد',[
  'للعبد مشيئة واختيار حقيقيان، لكنهما تابعان لمشيئة الله: ﴿وما تشاؤون إلا أن يشاء الله﴾.',

 ['ثمرات الإيمان بالقدر',[

const LESSONS=[];
CH.forEach(c=>c.ls.forEach((l,li)=>{l.id=c.id+'-'+li;l.ch=c;l.idx=li;LESSONS.push(l);}));
const TOTAL=LESSONS.length;

/* ---------- الحالة والحفظ ---------- */
const KEY='fiqh-maysar-v2';
const EXAM_N=10, PASS_PCT=80;
let mem=null;
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&typeof o==='object')return Object.assign({name:'',lessons:{},days:[],exams:{}},o);}}catch(e){}
  return mem||{name:'',lessons:{},days:[],exams:{}};
}
let S=load();
if(!S.exams)S.exams={};
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const nf=new Intl.NumberFormat('ar-EG');
const n=x=>nf.format(x);
const pc=x=>n(Math.round(x))+'٪';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function streak(){
  const set=new Set(S.days);let d=new Date();
  if(!set.has(dstr(d)))d.setDate(d.getDate()-1);
  let c=0;while(set.has(dstr(d))){c++;d.setDate(d.getDate()-1);}
  return c;
}
function commit(){
  const set=new Set(S.days);const d=new Date();let c=0;
  for(let i=0;i<30;i++){if(set.has(dstr(d)))c++;d.setDate(d.getDate()-1);}
  return Math.round(c/30*100);
}
const rec=l=>S.lessons[l.id]||{best:0,done:false,attempts:0};
const exRec=c=>S.exams[c.id]||{best:0,attempts:0,passed:false};
const passMark=t=>Math.ceil(t*0.6);
const lessonsDone=c=>c.ls.filter(l=>rec(l).done).length;
const allLessons=c=>lessonsDone(c)===c.ls.length;
const chComplete=c=>allLessons(c)&&exRec(c).passed;
const chSteps=c=>c.ls.length+1;
const stepsDone=c=>lessonsDone(c)+(exRec(c).passed?1:0);
const secOf=k=>CH.filter(c=>c.sec===k);
const prevCh=c=>{const L=secOf(c.sec);const i=L.indexOf(c);return i>0?L[i-1]:null;};
const nextCh=c=>{const L=secOf(c.sec);const i=L.indexOf(c);return i<L.length-1?L[i+1]:null;};
const unlocked=c=>{const p=prevCh(c);return !p||chComplete(p);};
const doneCount=()=>LESSONS.filter(l=>rec(l).done).length;
function points(){
  const a=LESSONS.reduce((s,l)=>{const r=rec(l);return s+r.best*10+(r.done?20:0);},0);
  const b=CH.reduce((s,c)=>{const r=exRec(c);return s+(r.passed?50:0)+Math.round(r.best/10);},0);
  return a+b;
}
