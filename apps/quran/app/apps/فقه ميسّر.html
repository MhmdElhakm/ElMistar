<style>
/* Layout concept: single-column study app (max 760px). Chapters as tinted cards, lesson reader, one-question-at-a-time quiz, profile with progress. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface2:#E8EFEB; --fg:#13201B; --muted:#587068; --line:#D3DED8;
  --accent:#0E6B50; --accent-fg:#FFFFFF; --accent-soft:#D9EEE5; --gold:#9A6E0E; --gold-soft:#F6EBCB;
  --good:#1B7F4B; --good-soft:#DDF1E5; --bad:#B23A2B; --bad-soft:#F8E2DE;
  --k-l:.5; --k-c:.11; --t-l:.955;
  --font-d:'Cairo','Tajawal',Tahoma,sans-serif;
  --font-b:'Cairo','Tajawal',Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1512; --surface:#15201B; --surface2:#1C2A24; --fg:#E7F0EB; --muted:#93A59C; --line:#27372F;
    --accent:#4CC39A; --accent-fg:#06221A; --accent-soft:#16332A; --gold:#E0B04A; --gold-soft:#33290F;
    --good:#5FD08F; --good-soft:#14301F; --bad:#F08A7A; --bad-soft:#3A1B16;
    --k-l:.78; --t-l:.25; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1512; --surface:#15201B; --surface2:#1C2A24; --fg:#E7F0EB; --muted:#93A59C; --line:#27372F;
  --accent:#4CC39A; --accent-fg:#06221A; --accent-soft:#16332A; --gold:#E0B04A; --gold-soft:#33290F;
  --good:#5FD08F; --good-soft:#14301F; --bad:#F08A7A; --bad-soft:#3A1B16;
  --k-l:.78; --t-l:.25; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-b); font-size:16px; line-height:1.85;
  direction:rtl; padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px; min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--font-d);font-weight:800;line-height:1.45;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin-inline:auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-size:22px;font-weight:700;color:var(--accent);background:none;border:0;padding:0}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}

/* hero */
.hero{margin-top:20px;background:var(--accent);color:var(--accent-fg);border-radius:20px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.hero h1{font-size:25px}
.hero p{opacity:.88;font-size:15px;margin-top:4px}
.ring{position:relative;width:88px;height:88px}
.ring svg{width:88px;height:88px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:currentColor;opacity:.22}
.ring .fg{stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:19px;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1.5px solid transparent;padding:10px 18px;font-weight:600;background:var(--accent);color:var(--accent-fg);min-height:44px}
.btn.alt{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.light{background:var(--accent-fg);color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:hover{filter:brightness(1.06)}
.hero .btn{margin-top:14px}
.sec-title{font-size:20px;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.sec-title small{font-family:var(--font-b);font-size:14px;color:var(--muted);font-weight:400}

/* chapters */
.chap{--ck:oklch(var(--k-l) var(--k-c) var(--h));--ct:oklch(var(--t-l) .04 var(--h))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:start;display:flex;flex-direction:column;gap:10px;width:100%;min-width:0}
button.card:hover{border-color:var(--ck)}
.ico{width:46px;height:46px;border-radius:13px;background:var(--ct);color:var(--ck);display:grid;place-items:center}
.ico svg{width:26px;height:26px}
.card h3{font-size:19px}
.card .sub{color:var(--muted);font-size:14px;line-height:1.7}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ck,var(--accent));border-radius:99px;transition:width .5s ease}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* back + crumbs */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);padding:14px 0 6px;font-weight:500}
.chead{display:flex;gap:14px;align-items:center;margin:6px 0 18px}
.chead h1{font-size:27px}
.chead p{color:var(--muted);font-size:14px}

/* lesson rows */
.lrow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;width:100%;text-align:start;margin-bottom:10px}
.lrow:hover{border-color:var(--ck)}
.lrow .n{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:600;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.lrow.done .n{background:var(--ck);border-color:var(--ck);color:var(--surface)}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font-weight:600}
.lrow .t span{font-size:13px;color:var(--muted)}
.score{font-size:13px;font-weight:600;color:var(--ck);white-space:nowrap;font-variant-numeric:tabular-nums}

/* lesson reader */
.lesson h1{font-size:28px;margin:6px 0 6px}
.tag{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--ck);background:var(--ct);padding:2px 12px;border-radius:999px}
.prose{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:16px;font-size:17px}
.prose .intro{margin-bottom:14px}
.prose ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.prose li{position:relative;padding-inline-start:26px}
.prose li::before{content:"";position:absolute;inset-inline-start:2px;top:.85em;width:9px;height:9px;border-radius:3px;background:var(--ck);transform:rotate(45deg)}
.prose li b{color:var(--ck);font-weight:600}
.note{margin-top:16px;background:var(--gold-soft);color:var(--fg);border-radius:12px;padding:14px 16px;font-size:16px}
.note strong{font-family:var(--font-d);color:var(--gold);display:block;margin-bottom:2px}
.cta{margin-top:20px;display:flex;justify-content:center}

/* quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px}
.dots i{width:26px;height:6px;border-radius:9px;background:var(--surface2)}
.dots i.on{background:var(--ck)}
.quiz h2{font-size:21px;margin-bottom:14px;line-height:1.7}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--ck)}
.opt .l{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .l{background:var(--good);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .l{background:var(--bad);color:var(--surface)}
.expl{margin-top:6px;border-radius:12px;padding:12px 14px;font-size:15.5px}
.expl.ok{background:var(--good-soft)}
.expl.no{background:var(--bad-soft)}
.expl b{display:block}
.result{text-align:center;padding:10px 0}
.result .big{font-family:var(--font-d);font-size:54px;color:var(--ck);font-variant-numeric:tabular-nums;line-height:1.2}
.result h2{margin:6px 0}
.result p{color:var(--muted)}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* profile */
.pro-head{margin-top:20px;display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.avatar{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--font-d);font-size:30px;flex:none}
.pro-head .who{flex:1;min-width:0}
.name-in{width:100%;font:inherit;font-family:var(--font-d);font-size:22px;background:transparent;border:0;border-bottom:1.5px dashed var(--line);color:var(--fg);padding:2px 0}
.name-in:focus{outline:none;border-bottom-color:var(--accent)}
.lvl{font-size:14px;color:var(--muted);margin-top:4px}
.lvl b{color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--font-d);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:13px;color:var(--muted)}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:grid;gap:8px}
.prow .h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.prow .h span{display:flex;align-items:center;gap:10px;font-weight:600}
.prow .ico{width:34px;height:34px;border-radius:10px}
.prow .ico svg{width:20px;height:20px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;text-align:center;font-size:13px;line-height:1.5;display:grid;gap:6px;justify-items:center}
.badge .ico{width:48px;height:48px;border-radius:50%}
.badge.off{opacity:.55}
.badge.off .ico{background:var(--surface2);color:var(--muted)}
.badge small{color:var(--muted);font-size:12px}
.reset{margin-top:26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fine{margin-top:26px;font-size:13px;color:var(--muted);line-height:1.8;text-align:center}
.story-launch{width:100%;margin:18px 0 4px;padding:16px;border:1px solid #cbded7;border-radius:18px;background:linear-gradient(135deg,#fff,#e9f5ef);color:#18263D;display:flex;align-items:center;gap:14px;text-align:right;box-shadow:0 8px 22px #173d2b0d;transition:transform .18s,box-shadow .18s}
.story-launch:hover{transform:translateY(-2px);box-shadow:0 12px 28px #173d2b16}
.story-launch .story-mark{width:48px;height:48px;flex:none;border-radius:15px;display:grid;place-items:center;background:var(--accent);color:#fff}
.story-launch .story-mark svg{width:25px;height:25px}
.story-launch .story-copy{flex:1;min-width:0}
.story-launch b{display:block;font:700 17px var(--font-d)}
.story-launch small{display:block;color:#52677D;font-size:13px;line-height:1.7;margin-top:3px;font-weight:600}
.story-launch .story-arrow{color:var(--accent);font-size:24px;font-weight:800}
.stories-page{height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);padding:0}
.stories-toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.stories-toolbar strong{font:700 16px var(--font-d)}
.stories-back{border:0;border-radius:999px;padding:8px 13px;background:var(--accent-soft);color:var(--accent);font:600 13px var(--font-b)}
.stories-frame{display:block;flex:1;min-height:0;width:100%;height:auto;border:0;background:var(--bg)}
html:has(.stories-page),body:has(.stories-page){height:100dvh;overflow:hidden}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:9;display:flex;justify-content:center;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.nav div{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:5px;width:min(100%,380px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:13px;padding:6px 8px;font-size:13px;font-weight:500;color:var(--muted);min-height:50px}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg.i{width:22px;height:22px}

@media (max-width:480px){
  .hero{grid-template-columns:1fr;text-align:start}
  .ring{justify-self:start;order:-1}
  .hero h1{font-size:22px}
  .pro-head{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>

body{background:var(--bg)}
.wrap{max-width:480px}
#app.wrap{min-height:100dvh;padding:0 14px 96px;background:var(--surface);border-radius:30px;box-shadow:0 18px 48px rgba(40,76,106,.12)}

{id:'tahara',t:'الطهارة',s:'أحكام المياه، والوضوء، ونواقضه',h:215,ic:'drop',ls:[
 {t:'أنواع المياه',intro:'الطهارة شرط لصحة الصلاة، وأول ما يتعلمه المسلم معرفة الماء الذي يتطهر به.',
  pts:['<b>الماء الطهور:</b> الباقي على أصل خلقته كماء المطر والبحر والنهر والبئر. هو طاهر في نفسه ومطهِّر لغيره، فيرفع الحدث ويزيل النجاسة.',
       '<b>الماء النجس:</b> ما تغيّر لونه أو طعمه أو ريحه بسبب نجاسة وقعت فيه، فلا يُتطهر به.',
       '<b>الماء الطاهر غير المطهِّر:</b> كماء الورد والعصائر وما خالطه شيء غيّر اسمه. هو طاهر لكنه لا يرفع الحدث.'],
  note:'ماء البحر طهور، لقول النبي ﷺ: «هو الطَّهور ماؤه، الحِلُّ ميتته».',
  q:[{q:'ما حكم الوضوء بماء البحر؟',o:['يصح لأنه ماء طهور','لا يصح لأن فيه ملحًا','يصح عند الضرورة فقط'],a:0,e:'ماء البحر طهور بنص الحديث، فيصح الوضوء به دون شرط.'},
     {q:'متى يصير الماء نجسًا؟',o:['إذا تغيّر أحد أوصافه بنجاسة','إذا شرب منه حيوان','إذا بقي ساكنًا مدة طويلة'],a:0,e:'تغيّر اللون أو الطعم أو الريح بالنجاسة يجعل الماء نجسًا باتفاق العلماء.'},
     {q:'هل يرفع عصير الليمون الحدث؟',o:['لا، فهو طاهر وليس طهورًا','نعم، لأنه سائل نظيف','نعم إذا كان صافيًا'],a:0,e:'الماء المقيَّد كالعصير طاهر في نفسه، لكنه لا يرفع الحدث.'}]},
 {t:'فروض الوضوء وسننه',intro:'للوضوء أركان لا يصح بدونها، وسنن يزداد بها الأجر. وفروضه الأربعة منصوص عليها في آية المائدة.',
  pts:['<b>غسل الوجه</b> كاملًا.','<b>غسل اليدين</b> إلى المرفقين.','<b>مسح الرأس.</b>','<b>غسل الرجلين</b> إلى الكعبين.',
       '<b>من السنن:</b> التسمية، والسواك، وغسل الكفين أولًا، والمضمضة والاستنشاق، والتثليث، والبدء بالجهة اليمنى.'],
  note:'الواجب غسل العضو مرة واحدة تعمّه، والتثليث سنة. وفي الترتيب خلاف: فرض عند الشافعية والحنابلة، وسنة عند الحنفية والمالكية.',
  q:[{q:'كم عدد فروض الوضوء المنصوص عليها في القرآن؟',o:['ثلاثة','أربعة','ستة'],a:1,e:'هي غسل الوجه واليدين، ومسح الرأس، وغسل الرجلين.'},
     {q:'أيٌّ مما يلي من سنن الوضوء؟',o:['السواك','مسح الرأس','غسل الوجه'],a:0,e:'السواك سنة، أما مسح الرأس وغسل الوجه فمن الفروض.'},
     {q:'ما القدر الواجب في غسل العضو؟',o:['مرة واحدة تعمّ العضو','ثلاث مرات','مرتان'],a:0,e:'الواجب مرة واحدة، والثلاث سنة.'}]},
 {t:'نواقض الوضوء',intro:'نواقض الوضوء هي الأمور التي تُبطل الطهارة، فيحتاج المسلم إلى وضوء جديد بعد حدوثها.',
  pts:['<b>خروج شيء من السبيلين:</b> كالبول والغائط والريح.','<b>زوال العقل:</b> بالنوم المستغرق أو الإغماء أو الجنون أو السكر.',
       '<b>أمور اختلف فيها الفقهاء:</b> كمسّ الفرج، ولمس المرأة، وأكل لحم الإبل. فيُرجع فيها إلى مذهب الإنسان أو فتوى عالمه.'],
  note:'القاعدة: «اليقين لا يزول بالشك». من تيقّن الطهارة ثم شكّ في حدوث الحدث، فهو على طهارته.',

     {q:'تيقّنتَ أنك متوضئ ثم شككتَ هل أحدثت. ما الحكم؟',o:['تبقى على وضوئك','يجب عليك الوضوء من جديد','تبطل صلاتك'],a:0,e:'اليقين لا يزول بالشك، فالأصل بقاء الطهارة.'},
     {q:'لماذا ينقض الإغماء الوضوء؟',o:['لأنه يُزيل العقل','لأنه يخرج منه شيء','لأنه يطول أكثر من ساعة'],a:0,e:'زوال العقل بالإغماء أو النوم المستغرق ناقض للوضوء.'}]}

{id:'salah',t:'الصلاة',s:'شروطها وأركانها وسجود السهو',h:160,ic:'pray',ls:[
 {t:'شروط الصلاة',intro:'الصلاة عمود الدين، وهي خمس صلوات في اليوم والليلة. ولا تصح إلا بتحقق شروطها.',
  pts:['<b>الإسلام والعقل والتمييز.</b>','<b>دخول الوقت.</b>','<b>الطهارة</b> من الحدث، وطهارة البدن والثوب والمكان من النجاسة.','<b>ستر العورة.</b>','<b>استقبال القبلة.</b>','<b>النية.</b>'],
  note:'الشرط يكون قبل الصلاة ويستمر فيها، أما الركن فهو جزء من الصلاة نفسها.',
  q:[{q:'ما الفرق بين الشرط والركن في الصلاة؟',o:['الشرط قبل الصلاة ويستمر فيها، والركن جزء منها','الركن قبل الصلاة والشرط بعدها','لا فرق بينهما'],a:0,e:'الوضوء شرط يسبق الصلاة، أما الركوع فجزء داخل الصلاة.'},
     {q:'كم عدد الصلوات المفروضة في اليوم والليلة؟',o:['ثلاث','خمس','ست'],a:1,e:'الفجر والظهر والعصر والمغرب والعشاء.'},
     {q:'أيٌّ من هذه شرط لصحة الصلاة؟',o:['استقبال القبلة','السجود','التسليم'],a:0,e:'الاستقبال شرط، ويسقط عند العجز كحال الخوف الشديد. أما السجود والتسليم فأركان.'}]},
 {t:'أركان الصلاة',intro:'أركان الصلاة هي أجزاؤها الأساسية التي لا تصح بدونها. وتتفق المذاهب على عامتها، وتختلف في تفاصيل عدّها.',
  pts:['<b>النية</b> وتكبيرة الإحرام.','<b>القيام</b> لمن قدر عليه.','<b>قراءة الفاتحة</b> ركن عند الجمهور، وعند الحنفية القراءة ركن والفاتحة واجبة.','<b>الركوع</b> ثم الاعتدال قائمًا.','<b>السجود</b> مرتين في كل ركعة، وبينهما جلوس.','<b>التشهد الأخير</b> والجلوس له.','<b>التسليم</b> والطمأنينة في الأركان.'],
  note:'من ترك ركنًا عمدًا بطلت صلاته. ومن تركه سهوًا أتى به ثم يسجد للسهو.',
  q:[{q:'ما حكم من ترك ركنًا من أركان الصلاة عمدًا؟',o:['تبطل صلاته','صلاته صحيحة','يسجد للسهو فقط'],a:0,e:'الركن لا تصح الصلاة بدونه، والتعمد يبطلها.'},
     {q:'كم سجدة في كل ركعة؟',o:['سجدة واحدة','سجدتان','ثلاث سجدات'],a:1,e:'في كل ركعة سجدتان يفصل بينهما جلوس.'},
     {q:'بماذا تفتتح الصلاة؟',o:['تكبيرة الإحرام','التسليم','الاستعاذة'],a:0,e:'تحريمها التكبير وتحليلها التسليم.'}]},
 {t:'سجود السهو',intro:'سجود السهو سجدتان يجبر بهما المصلي خللًا حدث في صلاته من غير قصد.',
  pts:['<b>متى يُشرع؟</b> عند زيادة فعل في الصلاة، أو نقص واجب، أو الشك في عدد الركعات.','<b>كيفيته:</b> سجدتان كسجود الصلاة، قبل السلام أو بعده بحسب المذهب.','<b>الشك في العدد:</b> يبني المصلي على الأقل المتيقَّن عند الجمهور، ثم يكمل ويسجد للسهو.'],
  note:'الركن المتروك لا يجبره سجود السهو، بل يجب الإتيان به.',

const LESSONS=[];
CH.forEach((c,ci)=>c.ls.forEach((l,li)=>{l.id=c.id+'-'+li;l.ch=c;l.idx=li;LESSONS.push(l);}));
const TOTAL=LESSONS.length;

/* ---------- الحالة والحفظ ---------- */
const KEY='fiqh-maysar-v1';
let mem=null;
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&typeof o==='object')return Object.assign({name:'',lessons:{},days:[]},o);}}catch(e){}
  return mem||{name:'',lessons:{},days:[]};
}
let S=load();
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const nf=new Intl.NumberFormat('ar-EG');
const n=x=>nf.format(x);
const pc=x=>n(Math.round(x))+'٪';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function streak(){
  const set=new Set(S.days);let d=new Date();
  if(!set.has(dstr(d)))d.setDate(d.getDate()-1);
  let c=0;while(set.has(dstr(d))){c++;d.setDate(d.getDate()-1);}
  return c;
}
const rec=l=>S.lessons[l.id]||{best:0,done:false,attempts:0};
const chDone=c=>c.ls.filter(l=>rec(l).done).length;
const doneCount=()=>LESSONS.filter(l=>rec(l).done).length;
function points(){return LESSONS.reduce((s,l)=>{const r=rec(l);return s+r.best*10+(r.done?20:0);},0);}
const LEVELS=[[0,'مبتدئ'],[150,'طالب علم'],[350,'متعلّم متقدّم'],[600,'متفقّه'],[850,'متقن']];
function level(p){let i=0;LEVELS.forEach((l,k)=>{if(p>=l[0])i=k;});return i;}
function avg(){const r=LESSONS.filter(l=>rec(l).attempts>0);return r.length?r.reduce((s,l)=>s+rec(l).best/3*100,0)/r.length:0;}
function badges(){
  const b=[{ic:'star',t:'أول درس',d:'أنجز درسًا',on:doneCount()>=1},
           {ic:'check',t:'علامة كاملة',d:'٣ من ٣ في اختبار',on:LESSONS.some(l=>rec(l).best===3)},
           {ic:'flame',t:'ثلاثة أيام',d:'تعلّم ٣ أيام متتالية',on:streak()>=3||(S.maxStreak||0)>=3}];
  CH.forEach(c=>b.push({ic:c.ic,t:'باب '+c.t,d:'أنجز كل دروسه',on:chDone(c)===c.ls.length,h:c.h}));
  return b;
}

/* ---------- العرض ---------- */
const app=document.getElementById('app');
let V={name:'home'};            // home | chapter | lesson | profile
let Q=null;                     // حالة الاختبار
let confirmReset=false;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const chStyle=c=>'class="chap" style="--h:'+c.h+'"';

function ring(p){
  const r=34,C=2*Math.PI*r;
  return '<div class="ring" role="img" aria-label="التقدم الكلي '+pc(p)+'"><svg viewBox="0 0 88 88"><circle class="bg" cx="44" cy="44" r="'+r+'"/><circle class="fg" cx="44" cy="44" r="'+r+'" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-p/100)).toFixed(1)+'"/></svg><b>'+pc(p)+'</b></div>';
}
function header(){
  return '<header class="top"><div class="wrap"><button class="brand" data-a="home" aria-label="الصفحة الرئيسية"><span class="mark">'+ic('book')+'</span>فقه ميسّر</button><span class="chip" title="نقاطك">'+ic('star')+n(points())+' نقطة</span></div></header>';
}
function nextLesson(){return LESSONS.find(l=>!rec(l).done);}

function viewHome(){
  const done=doneCount(),p=done/TOTAL*100,nx=nextLesson();
  const greet=S.name?('السلام عليكم، '+esc(S.name)):'السلام عليكم ورحمة الله';
  let h=header()+'<main>';
  h+='<section class="hero"><div><h1>'+greet+'</h1><p>'+(done===0?'ابدأ رحلتك في تعلّم الفقه خطوة بخطوة. كل درس يتبعه اختبار قصير.':'أنجزت '+n(done)+' من '+n(TOTAL)+' درسًا.')+'</p>';
  h+=nx?'<button class="btn light" data-a="lesson" data-id="'+nx.id+'">'+(done?'تابع: ':'ابدأ: ')+esc(nx.t)+ic('left')+'</button>':'<p style="margin-top:10px"><b>أتممت جميع الدروس. بارك الله في علمك.</b></p>';
  h+='</div>'+ring(p)+'</section>';
  h+='<div class="sec-title"><h2>أبواب الفقه</h2><small>'+n(CH.length)+' أبواب</small></div><div class="grid">';
  CH.forEach(c=>{
    const d=chDone(c),t=c.ls.length;
    h+='<button class="card chap" style="--h:'+c.h+'" data-a="chapter" data-id="'+c.id+'"><span class="ico">'+ic(c.ic)+'</span><h3>'+c.t+'</h3><span class="sub">'+c.s+'</span><div class="bar" role="progressbar" aria-valuenow="'+d+'" aria-valuemin="0" aria-valuemax="'+t+'"><i style="width:'+(d/t*100)+'%"></i></div><div class="meta"><span>'+n(d)+' من '+n(t)+' دروس</span><span>'+(d===t?'مكتمل':'')+'</span></div></button>';
  });
  h+='</div><button class="story-launch" data-a="stories"><span class="story-mark">'+ic('book')+'</span><span class="story-copy"><b>قصص القرآن للأطفال</b><small>رحلة ممتعة بين قصص الأنبياء، مع أسئلة تفاعلية وتقدّم محفوظ.</small></span><span class="story-arrow">‹</span></button><p class="fine">المحتوى للتعلّم العام ويعرض المتفق عليه غالبًا، وينبّه على مواضع الخلاف. وفي المسائل الخاصة يُرجع إلى عالم موثوق.</p></main>';
  return h;
}
function viewChapter(){
  const c=CH.find(x=>x.id===V.id);
  let h=header()+'<main '+chStyle(c)+'><button class="back" data-a="home">'+ic('right')+'كل الأبواب</button>';
  h+='<div class="chead"><span class="ico">'+ic(c.ic)+'</span><div><h1>'+c.t+'</h1><p>'+c.s+'</p></div></div>';
  const d=chDone(c);
  h+='<div class="bar" style="margin-bottom:6px"><i style="width:'+(d/c.ls.length*100)+'%"></i></div><div class="meta" style="margin-bottom:18px"><span>'+n(d)+' من '+n(c.ls.length)+' دروس</span></div>';
  c.ls.forEach((l,i)=>{
    const r=rec(l);
    h+='<button class="lrow'+(r.done?' done':'')+'" data-a="lesson" data-id="'+l.id+'"><span class="n">'+(r.done?ic('check'):n(i+1))+'</span><span class="t"><b>'+l.t+'</b><span>'+n(l.q.length)+' أسئلة'+(r.done?' · أُنجز':'')+'</span></span>'+(r.attempts?'<span class="score">أفضل نتيجة '+n(r.best)+'/'+n(l.q.length)+'</span>':'')+ic('left')+'</button>';
  });
  return h+'</main>';
}
function viewLesson(){
  const l=LESSONS.find(x=>x.id===V.id),c=l.ch;
  let h=header()+'<main class="lesson" '+chStyle(c)+'><button class="back" data-a="chapter" data-id="'+c.id+'">'+ic('right')+'باب '+c.t+'</button>';
  h+='<span class="tag">'+ic(c.ic)+'الدرس '+n(l.idx+1)+' من '+n(c.ls.length)+'</span><h1>'+l.t+'</h1>';
  if(!Q||Q.id!==l.id||Q.phase==='read'){
    h+='<article class="prose"><p class="intro">'+l.intro+'</p><ul>'+l.pts.map(p=>'<li>'+p+'</li>').join('')+'</ul><div class="note"><strong>فائدة</strong>'+l.note+'</div></article>';
    const r=rec(l);
    h+='<div class="cta"><button class="btn" data-a="start" data-id="'+l.id+'">'+(r.attempts?'أعد الاختبار':'ابدأ الاختبار')+ic('left')+'</button></div>';
  }else if(Q.phase==='quiz'){
    const it=Q.items[Q.i],tot=Q.items.length;
    h+='<section class="quiz"><div class="qhead"><span>السؤال '+n(Q.i+1)+' من '+n(tot)+'</span><span class="dots" aria-hidden="true">'+Q.items.map((_,k)=>'<i class="'+(k<=Q.i?'on':'')+'"></i>').join('')+'</span></div><h2>'+it.q+'</h2>';
    const L=['أ','ب','ج','د'];
    it.opts.forEach((o,k)=>{
      let cls='opt',mark=L[k];
      if(Q.picked!==null){if(o.ok){cls+=' ok';mark=ic('check');}else if(k===Q.picked){cls+=' no';mark=ic('x');}}
      h+='<button class="'+cls+'" data-a="pick" data-k="'+k+'" '+(Q.picked!==null?'disabled':'')+'><span class="l">'+mark+'</span><span>'+o.t+'</span></button>';
    });
    if(Q.picked!==null){
      const good=it.opts[Q.picked].ok;
      h+='<div class="expl '+(good?'ok':'no')+'" role="status"><b>'+(good?'إجابة صحيحة':'إجابة غير صحيحة')+'</b>'+it.e+'</div>';
      h+='<div class="cta"><button class="btn" data-a="next">'+(Q.i+1<tot?'السؤال التالي':'عرض النتيجة')+ic('left')+'</button></div>';
    }
    h+='</section>';
  }else{
    const tot=Q.items.length,ok=Q.score>=2,nx=LESSONS[LESSONS.indexOf(l)+1];
    h+='<section class="quiz"><div class="result"><div class="big">'+n(Q.score)+'/'+n(tot)+'</div><h2>'+(Q.score===tot?'ممتاز، أتقنت الدرس':ok?'أحسنت، أنجزت الدرس':'راجع الدرس وأعد المحاولة')+'</h2><p>'+(ok?'أضفتَ إلى ملفك '+n(Q.gain)+' نقطة.':'تحتاج إلى إجابتين صحيحتين على الأقل لإنجاز الدرس.')+'</p>';
    if(Q.newBadges.length)h+='<p style="color:var(--gold);margin-top:8px"><b>شارة جديدة: '+Q.newBadges.map(esc).join('، ')+'</b></p>';
    h+='<div class="acts"><button class="btn alt" data-a="start" data-id="'+l.id+'">أعد الاختبار</button><button class="btn alt" data-a="read" data-id="'+l.id+'">راجع الدرس</button>';
    if(ok&&nx)h+='<button class="btn" data-a="lesson" data-id="'+nx.id+'">الدرس التالي'+ic('left')+'</button>';
    else h+='<button class="btn" data-a="chapter" data-id="'+c.id+'">العودة للباب</button>';
    h+='</div></div></section>';
  }
  return h+'</main>';
}
function viewProfile(){
  const p=points(),lv=level(p),done=doneCount(),nxL=LEVELS[lv+1];
  let h=header()+'<main>';
  h+='<section class="pro-head"><span class="avatar" aria-hidden="true">'+esc((S.name||'ط').trim().charAt(0)||'ط')+'</span><div class="who"><label for="nameIn" class="sr" style="position:absolute;left:-9999px">اسمك</label><input id="nameIn" class="name-in" type="text" maxlength="24" placeholder="اكتب اسمك" value="'+esc(S.name)+'" autocomplete="off"><div class="lvl">المستوى: <b>'+LEVELS[lv][1]+'</b>'+(nxL?' · تبقّى '+n(nxL[0]-p)+' نقطة للمستوى «'+nxL[1]+'»':' · بلغتَ أعلى مستوى')+'</div></div></section>';
  h+='<section class="stats"><div class="stat"><b>'+n(done)+'/'+n(TOTAL)+'</b><span>دروس مكتملة</span></div><div class="stat"><b>'+n(p)+'</b><span>نقطة</span></div><div class="stat"><b>'+n(streak())+'</b><span>أيام متتالية</span></div><div class="stat"><b>'+pc(avg())+'</b><span>متوسط الاختبارات</span></div></section>';
  h+='<div class="sec-title"><h2>التقدم في الأبواب</h2></div>';
  CH.forEach(c=>{const d=chDone(c),t=c.ls.length;
    h+='<div class="prow chap" style="--h:'+c.h+'"><div class="h"><span><span class="ico">'+ic(c.ic)+'</span>'+c.t+'</span><span class="meta" style="font-weight:400">'+n(d)+' من '+n(t)+'</span></div><div class="bar"><i style="width:'+(d/t*100)+'%"></i></div></div>';});
  const bs=badges();
  h+='<div class="sec-title"><h2>الشارات</h2><small>'+n(bs.filter(b=>b.on).length)+' من '+n(bs.length)+'</small></div><div class="badges">';
  bs.forEach(b=>{h+='<div class="badge chap'+(b.on?'':' off')+'" style="--h:'+(b.h!==undefined?b.h:85)+'"><span class="ico">'+ic(b.ic)+'</span><b>'+b.t+'</b><small>'+(b.on?'تم الحصول عليها':b.d)+'</small></div>';});
  h+='</div><div class="reset">';
  h+=confirmReset?'<span>هل تريد حذف كل تقدمك؟</span><button class="btn danger" data-a="reset-yes">نعم، احذف</button><button class="btn alt" data-a="reset-no">إلغاء</button>':'<button class="btn alt" data-a="reset">إعادة ضبط التقدم</button>';
  h+='</div><p class="fine">يُحفظ تقدمك في هذا المتصفح على هذا الجهاز.</p></main>';
  return h;
}
function viewStories(){
  return '<section class="stories-page" dir="rtl"><div class="stories-toolbar"><strong>قصص القرآن للأطفال</strong></div><iframe id="storiesFrame" class="stories-frame" title="قصص القرآن للأطفال" loading="eager"></iframe></section>';
}
function render(keepScroll){
  const y=window.scrollY;
  app.innerHTML=V.name==='home'?viewHome():V.name==='chapter'?viewChapter():V.name==='lesson'?viewLesson():V.name==='stories'?viewStories():viewProfile();
  const nav=document.getElementById('nav');if(nav)nav.hidden=V.name==='stories';
  if(V.name==='stories'){const frame=document.getElementById('storiesFrame');if(frame)frame.srcdoc=decodeStoriesPage();}
  document.querySelectorAll('#nav [data-tab]').forEach(b=>{
    const on=(b.dataset.tab==='profile')===(V.name==='profile');
    if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  window.scrollTo(0,keepScroll?y:0);
}
function go(v,keep){V=v;if(v.name!=='lesson')Q=null;confirmReset=false;render(keep);}

/* ---------- الأحداث ---------- */
function startQuiz(id){
  const l=LESSONS.find(x=>x.id===id);
  Q={id:id,phase:'quiz',i:0,picked:null,score:0,gain:0,newBadges:[],
     items:l.q.map(q=>({q:q.q,e:q.e,opts:shuffle(q.o.map((t,k)=>({t:t,ok:k===q.a})))}))};
  V={name:'lesson',id:id};render();
}
function finishQuiz(){
  const l=LESSONS.find(x=>x.id===Q.id);
  const before=points(),bb=badges().filter(b=>b.on).map(b=>b.t);
  const r=S.lessons[l.id]||{best:0,done:false,attempts:0};
  r.attempts++;r.best=Math.max(r.best,Q.score);if(Q.score>=2)r.done=true;
  S.lessons[l.id]=r;
  const t=dstr(new Date());if(S.days.indexOf(t)<0)S.days.push(t);
  S.maxStreak=Math.max(S.maxStreak||0,streak());
  save();
  Q.gain=points()-before;
  Q.newBadges=badges().filter(b=>b.on&&bb.indexOf(b.t)<0).map(b=>b.t);
  Q.phase='result';render();
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  if(a==='home')go({name:'home'});
  else if(a==='stories')go({name:'stories'});
  else if(a==='chapter')go({name:'chapter',id:b.dataset.id});
  else if(a==='lesson'){Q=null;go({name:'lesson',id:b.dataset.id});}
  else if(a==='read'){Q.phase='read';render();}
  else if(a==='start')startQuiz(b.dataset.id);
  else if(a==='pick'){if(Q.picked!==null)return;const k=+b.dataset.k;Q.picked=k;if(Q.items[Q.i].opts[k].ok)Q.score++;render(true);}
  else if(a==='next'){if(Q.i+1<Q.items.length){Q.i++;Q.picked=null;render();}else finishQuiz();}
  else if(a==='reset'){confirmReset=true;render(true);}
  else if(a==='reset-no'){confirmReset=false;render(true);}
  else if(a==='reset-yes'){S={name:S.name,lessons:{},days:[]};save();confirmReset=false;render();}
});
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  go({name:b.dataset.a==='profile'?'profile':'home'});
});
app.addEventListener('change',e=>{
  if(e.target.id==='nameIn'){S.name=e.target.value.trim();save();render(true);}
});
render();
})();
</script>

</body></html>
