<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الأدمن · كلماتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0b2b;--bg2:#1c1650;--card:#1b1749;--card2:#25205f;--field:#120f36;--line:rgba(255,255,255,.11);--ink:#f5f3ff;--muted:#a9a5d6;--pri:#9686ff;--onpri:#16103f;--soft:#2f2979;--bad:#ff6f88;--ok:#4fdc9c;--warn:#ffb347}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--bg2),var(--bg) 420px) var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.logo{font-weight:800;font-size:26px;direction:ltr;letter-spacing:-.5px}.logo b{color:var(--pri)}.logo i{font-style:normal;color:#ffb066}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.top .tt{display:flex;align-items:center;gap:12px}.top .tt small{background:var(--soft);padding:3px 12px;border-radius:99px;color:#cfc8ff;font-weight:700;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;background:var(--pri);color:var(--onpri);font-weight:800}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.bad{background:var(--bad);color:#2a0710}
.btn.sm{min-height:36px;padding:0 12px;border-radius:11px;font-size:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px}
.inp{width:100%;min-height:48px;padding:6px 14px;border-radius:14px;border:2px solid var(--line);background:var(--field);font-size:16px}
.inp:focus{outline:none;border-color:var(--pri)}
label{display:block;font-weight:700;font-size:14px;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
/* login */
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:6px}
.login h1{margin:14px 0 2px;font-size:26px}.login p{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.err{background:rgba(255,111,136,.12);border:1.5px solid rgba(255,111,136,.4);color:#ff9db0;border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;margin-bottom:12px}
.err[hidden]{display:none}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}.stat small{color:var(--muted);font-weight:700;font-size:13px}.stat b{display:block;font-size:28px;line-height:1.2;margin-top:2px}
/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.tools .inp{flex:1;min-width:200px}.tools select.inp{flex:0 0 auto;width:auto;min-width:170px}
/* table */
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px}
.tbl th{font-size:13px;color:var(--muted);font-weight:700;text-align:start;padding:0 12px 2px;white-space:nowrap}
.tbl td{background:var(--card);padding:10px 12px;vertical-align:middle;border-block:1.5px solid var(--line)}
.tbl td:first-child{border-inline-start:1.5px solid var(--line);border-start-start-radius:16px;border-end-start-radius:16px}
.tbl td:last-child{border-inline-end:1.5px solid var(--line);border-start-end-radius:16px;border-end-end-radius:16px}
.tbl tr.sel td{background:var(--soft)}
.av{width:46px;height:46px;border-radius:50%;background:var(--card2);display:grid;place-items:center;overflow:hidden;font-weight:800;color:var(--pri);flex:none;border:2px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover}
.nm{display:flex;align-items:center;gap:12px;min-width:200px}.nm b{display:block}.nm small{color:var(--muted);font-size:12.5px;direction:ltr;display:inline-block}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--soft);color:#cfc8ff}
.tag.bad{background:rgba(255,111,136,.16);color:#ff9db0}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.act{display:flex;gap:6px;justify-content:flex-end}
.chk{width:20px;height:20px;accent-color:var(--pri)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;color:var(--muted)}
.bulk{display:none;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:10px 14px;margin-bottom:12px}
.bulk.on{display:flex}.bulk span{flex:1;font-weight:700}
/* modal */
.mod{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(6,4,24,.75);backdrop-filter:blur(4px)}
.mod[hidden]{display:none}
.mc{width:min(460px,100%);max-height:94vh;overflow:auto;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.mc h3{margin:0 0 4px;font-size:20px}.mc p{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.mrow{display:flex;gap:10px;margin-top:6px}.mrow .btn{flex:1}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:14px}.ph .av{width:72px;height:72px;font-size:26px}
.hint{color:var(--muted);font-size:12.5px;margin-top:5px}
.zone{margin-top:16px;padding-top:14px;border-top:1.5px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:92vw;background:#f5f3ff;color:#16103f;font-weight:800;padding:12px 20px;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:99;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.spin{display:inline-block;width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--pri);animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:760px){
 .tbl thead{display:none}.tbl,.tbl tbody,.tbl tr,.tbl td{display:block}
 .tbl tr{background:var(--card);border:1.5px solid var(--line);border-radius:18px;margin-bottom:10px;padding:6px 4px}
 .tbl td{background:none!important;border:0!important;padding:6px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
 .tbl td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:13px;font-weight:700}
 .tbl td.c0{order:-2}.nm{min-width:0}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="mod" id="mod" hidden></div>
<div class="toast" id="toast" role="status"></div>
<script>
/* ---------- config (same public project as the app) ---------- */
const SB={url:'https://fuocyaddfypuvpblenve.supabase.co',key:'sb_publishable_p2W0A3R0_acZSfsz9ObkeA_S7t8nNIa'};
const GRADES=['الصف الأول الابتدائي','الصف الثاني الابتدائي','الصف الثالث الابتدائي','الصف الرابع الابتدائي','الصف الخامس الابتدائي','الصف السادس الابتدائي','الصف الأول الإعدادي','الصف الثاني الإعدادي','الصف الثالث الإعدادي'];
const PAGE=20,SKEY='kx-admin-session';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let SESS=null,ROWS=[],PH={},AV={},Q='',GF='',SORT='xp',PG=0,SELECTED=new Set(),LOADING=false;

/* ---------- api ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800);}
const loadSess=()=>{try{return JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){return null;}};
const saveSess=s=>{try{s?localStorage.setItem(SKEY,JSON.stringify(s)):localStorage.removeItem(SKEY);}catch(e){}};
async function raw(path,o){
  o=o||{};const h=Object.assign({apikey:SB.key,'Content-Type':'application/json'},o.headers||{});
  if(o.token)h.Authorization='Bearer '+o.token;
  return fetch(SB.url+path,{method:o.method||'GET',headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined});
}
function keep(j,prev){return {access_token:j.access_token,refresh_token:j.refresh_token||(prev&&prev.refresh_token),exp:Date.now()+(j.expires_in||3600)*1000,uid:(j.user&&j.user.id)||(prev&&prev.uid),email:(j.user&&j.user.email)||(prev&&prev.email)};}
async function refresh(){
  if(!SESS||!SESS.refresh_token)return false;
  try{const r=await raw('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:SESS.refresh_token}});
   if(!r.ok){SESS=null;saveSess(null);return false;}SESS=keep(await r.json(),SESS);saveSess(SESS);return true;}catch(e){return false;}
}
async function api(path,o,retry){
  if(!SESS)throw new Error('انتهت الجلسة، سجّل الدخول من جديد');
  if(SESS.exp-Date.now()<60000)await refresh();
  const r=await raw(path,Object.assign({},o,{token:SESS&&SESS.access_token}));
  if(r.status===401&&retry!==false&&await refresh())return api(path,o,false);
  if(r.status===401){SESS=null;saveSess(null);draw();throw new Error('انتهت الجلسة، سجّل الدخول من جديد');}
  return r;
}
async function must(r){
  if(r.ok)return r;
  let j={};try{j=await r.json();}catch(e){}
  const c=j.code||'',m=j.message||'';
  if(c==='42501'||r.status===403||/forbidden/i.test(m))throw new Error('ليست لديك صلاحية. شغّل ملف admin_setup.sql وأضف حسابك إلى جدول admins.');
  if(c==='PGRST205'||c==='42P01'||c==='PGRST202')throw new Error('إعداد قاعدة البيانات ناقص، شغّل ملف admin_setup.sql في Supabase.');
  throw new Error('خطأ في قاعدة البيانات ('+r.status+(m?': '+m.slice(0,120):'')+')');
}
/* ---------- auth ---------- */
async function login(email,pw){
  const r=await raw('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password:pw}});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error(/Invalid login/i.test(j.msg||j.error_description||j.message||'')?'البريد أو كلمة المرور غير صحيحة':(j.msg||j.error_description||j.message||'تعذّر تسجيل الدخول'));
  SESS=keep(j,null);saveSess(SESS);
  const a=await raw('/rest/v1/rpc/is_admin',{method:'POST',token:SESS.access_token,body:{}});
  const ok=a.ok&&(await a.json())===true;
  if(!ok){SESS=null;saveSess(null);throw new Error(a.ok?'هذا الحساب ليس مشرفًا. أضِفه إلى جدول admins (راجع admin_setup.sql).':'لم يتم إعداد صلاحيات الأدمن بعد. شغّل ملف admin_setup.sql في Supabase.');}
}
function logout(){SESS=null;saveSess(null);ROWS=[];PH={};AV={};SELECTED.clear();draw();}
/* ---------- data ---------- */
async function loadAll(){
  LOADING=true;draw();
  try{
    const r=await must(await api('/rest/v1/profiles?select=id,name,grade,xp,streak,updated_at&order=xp.desc,name.asc&limit=2000'));
    ROWS=await r.json();
    PH={};AV={};
    const u=await must(await api('/rest/v1/user_data?select=user_id,profile:state->profile&limit=2000'));
    (await u.json()).forEach(x=>{PH[x.user_id]=(x.profile&&x.profile.phone)||'';});
    SELECTED.clear();PG=0;
  }catch(e){toast(e.message);ROWS=[];window.__err=e.message;}
  LOADING=false;draw();loadAvatars();
}
async function loadAvatars(){
  const ids=view().slice(PG*PAGE,PG*PAGE+PAGE).map(r=>r.id).filter(id=>!(id in AV));
  if(!ids.length)return;
  try{
    const r=await must(await api('/rest/v1/profiles?select=id,avatar&id=in.('+ids.join(',')+')'));
    const got={};(await r.json()).forEach(x=>got[x.id]=x.avatar||'');
    ids.forEach(id=>AV[id]=got[id]||'');
    drawTable();
  }catch(e){}
}
function view(){
  const q=Q.trim().toLowerCase();
  let l=ROWS.filter(r=>(GF===''||String(r.grade)===GF)&&(!q||(r.name||'').toLowerCase().includes(q)||(PH[r.id]||'').includes(q)));
  const s={xp:(a,b)=>(b.xp||0)-(a.xp||0),name:(a,b)=>(a.name||'').localeCompare(b.name||'','ar'),new:(a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||''))}[SORT];
  return l.sort(s);
}
/* ---------- ui ---------- */
function draw(){
  const a=$('#app');
  if(!SESS){a.innerHTML=loginHtml();return;}
  const v=view();
  a.innerHTML=`<div class="top"><div class="tt"><div class="logo">Kal<b>i</b>m<i>a</i>ty</div><small>لوحة الأدمن</small></div>
   <div style="display:flex;gap:8px"><button class="btn ghost sm" data-a="reload">تحديث</button><button class="btn ghost sm" data-a="csv">تصدير CSV</button><button class="btn ghost sm" data-a="logout">خروج</button></div></div>
   <div class="stats">
    <div class="card stat"><small>عدد الطلاب</small><b>${ROWS.length}</b></div>
    <div class="card stat"><small>المعروض الآن</small><b>${v.length}</b></div>
    <div class="card stat"><small>أعلى نقاط</small><b>${ROWS.length?Math.max(...ROWS.map(r=>r.xp||0)):0}</b></div>
    <div class="card stat"><small>متوسط النقاط</small><b>${ROWS.length?Math.round(ROWS.reduce((s,r)=>s+(r.xp||0),0)/ROWS.length):0}</b></div></div>
   <div class="tools"><input class="inp" id="q" placeholder="ابحث بالاسم أو رقم الهاتف..." value="${esc(Q)}">
    <select class="inp" id="gf"><option value="">كل الصفوف</option>${GRADES.map((g,i)=>`<option value="${i+1}" ${GF===String(i+1)?'selected':''}>${g}</option>`).join('')}</select>
    <select class="inp" id="so"><option value="xp" ${SORT==='xp'?'selected':''}>الأعلى نقاطًا</option><option value="name" ${SORT==='name'?'selected':''}>الاسم</option><option value="new" ${SORT==='new'?'selected':''}>آخر نشاط</option></select></div>
   <div class="bulk" id="bulk"><span id="bulkN"></span><button class="btn bad sm" data-a="bulkdel">حذف المحدد</button><button class="btn ghost sm" data-a="unsel">إلغاء التحديد</button></div>
   <div id="tbl"></div>`;
  drawTable();
}
function drawTable(){
  const box=$('#tbl');if(!box)return;
  if(LOADING){box.innerHTML='<div class="empty"><span class="spin"></span> جارٍ تحميل الطلاب...</div>';return;}
  const v=view(),pages=Math.max(1,Math.ceil(v.length/PAGE));if(PG>=pages)PG=pages-1;
  const rows=v.slice(PG*PAGE,PG*PAGE+PAGE);
  if(!rows.length){box.innerHTML=`<div class="empty">${window.__err?esc(window.__err):'لا يوجد طلاب مطابقون.'}</div>`;updBulk();return;}
  box.innerHTML=`<table class="tbl"><thead><tr><th></th><th>الطالب</th><th>الصف</th><th>النقاط</th><th>الهاتف</th><th>آخر نشاط</th><th></th></tr></thead><tbody>${rows.map(r=>{
    const has=r.id in AV,photo=AV[r.id];
    return `<tr class="${SELECTED.has(r.id)?'sel':''}"><td class="c0"><input type="checkbox" class="chk" data-id="${r.id}" ${SELECTED.has(r.id)?'checked':''} aria-label="تحديد"></td>
    <td><div class="nm"><div class="av">${photo?`<img src="${esc(photo)}" alt="">`:esc((r.name||'?').charAt(0))}</div><div><b>${esc(r.name)}</b>${has&&!photo?'<span class="tag bad">بدون صورة</span>':''}</div></div></td>
    <td data-l="الصف">${esc(GRADES[(r.grade||1)-1]||'—')}</td><td data-l="النقاط"><span class="num">${r.xp||0}</span></td>
    <td data-l="الهاتف"><span class="num">${esc(PH[r.id]||'—')}</span></td><td data-l="آخر نشاط">${r.updated_at?new Date(r.updated_at).toLocaleDateString('ar-EG',{day:'numeric',month:'short'}):'—'}</td>
    <td><div class="act"><button class="btn ghost sm" data-a="edit" data-id="${r.id}">تعديل</button><button class="btn bad sm" data-a="del" data-id="${r.id}">حذف</button></div></td></tr>`;}).join('')}</tbody></table>
   <div class="pager"><button class="btn ghost sm" data-a="prev" ${PG?'':'disabled'}>السابق</button><span>صفحة ${PG+1} من ${pages}</span><button class="btn ghost sm" data-a="next" ${PG+1<pages?'':'disabled'}>التالي</button></div>`;
  updBulk();
}
function updBulk(){const b=$('#bulk');if(!b)return;b.classList.toggle('on',SELECTED.size>0);const n=$('#bulkN');if(n)n.textContent=SELECTED.size+' طالب محدد';}
function loginHtml(){
  return `<div class="login card"><div class="logo">Kal<b>i</b>m<i>a</i>ty</div><h1>دخول الأدمن</h1><p>هذه الصفحة للمشرفين فقط. سجّل الدخول بحساب المشرف.</p>
   <div class="err" id="lerr" hidden></div>
   <div class="field"><label for="em">البريد الإلكتروني</label><input class="inp" id="em" type="email" dir="ltr" autocomplete="username"></div>
   <div class="field"><label for="pw">كلمة المرور</label><input class="inp" id="pw" type="password" dir="ltr" autocomplete="current-password"></div>
   <button class="btn" id="lgo" data-a="login">تسجيل الدخول</button></div>`;
}
function modal(h){const m=$('#mod');m.innerHTML=`<div class="mc" role="dialog" aria-modal="true">${h}</div>`;m.hidden=false;}
function closeModal(){const m=$('#mod');m.hidden=true;m.innerHTML='';}
/* ---------- actions ---------- */
function cropImg(file){
  return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
   img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=192;c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,192,192);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82));};
   img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('تعذّر فتح الصورة'));};img.src=u;});
}
let EDIT=null;
async function openEdit(id){
  const r=ROWS.find(x=>x.id===id);if(!r)return;
  EDIT={id,name:r.name||'',grade:r.grade||1,photo:id in AV?AV[id]:null,newPhoto:undefined};
  if(EDIT.photo===null){try{const a=await must(await api('/rest/v1/profiles?select=avatar&id=eq.'+id));EDIT.photo=((await a.json())[0]||{}).avatar||'';AV[id]=EDIT.photo;}catch(e){EDIT.photo='';}}
  renderEdit();
}
function renderEdit(){
  const e=EDIT,shown=e.newPhoto!==undefined?e.newPhoto:e.photo;
  modal(`<h3>تعديل بيانات الطالب</h3><p>رقم الهاتف: <span class="num">${esc(PH[e.id]||'—')}</span></p>
   <div class="err" id="merr" hidden></div>
   <div class="ph"><div class="av">${shown?`<img src="${esc(shown)}" alt="">`:esc((e.name||'?').charAt(0))}</div>
    <div><button class="btn ghost sm" data-a="pick">${shown?'تغيير الصورة':'رفع صورة'}</button><input type="file" id="pf" accept="image/*" hidden><div class="hint">الصورة إلزامية للطالب عند التسجيل</div></div></div>
   <div class="field"><label for="en">اسم الطالب</label><input class="inp" id="en" maxlength="30" value="${esc(e.name)}"><div class="hint">يتغيّر الاسم المعروض فقط؛ يظل الطالب يدخل بالاسم الذي سجّل به أول مرة.</div></div>
   <div class="field"><label for="eg">الصف الدراسي</label><select class="inp" id="eg">${GRADES.map((g,i)=>`<option value="${i+1}" ${+e.grade===i+1?'selected':''}>${g}</option>`).join('')}</select></div>
   <div class="mrow"><button class="btn" id="esave" data-a="save">حفظ التعديلات</button><button class="btn ghost" data-a="close">إلغاء</button></div>
   <div class="zone"><button class="btn ghost sm" data-a="reset" data-id="${e.id}">تصفير تقدم الطالب (النقاط والكلمات)</button></div>`);
}
function merr(m){const x=$('#merr');if(x){x.textContent=m;x.hidden=!m;}}
async function saveEdit(){
  const e=EDIT,name=($('#en').value||'').trim().replace(/\s+/g,' '),grade=+$('#eg').value;
  if(name.length<2)return merr('اكتب اسم الطالب (حرفان على الأقل).');
  const photo=e.newPhoto!==undefined?e.newPhoto:e.photo;
  if(!photo)return merr('الصورة الشخصية إلزامية، ارفع صورة للطالب.');
  const b=$('#esave');b.disabled=true;b.textContent='جارٍ الحفظ...';
  try{
    const patch={name,grade};if(e.newPhoto!==undefined)patch.avatar=e.newPhoto;
    await must(await api('/rest/v1/profiles?id=eq.'+e.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:patch}));
    await patchState(e.id,st=>{st.profile=Object.assign({},st.profile||{},{name,grade:grade-1});st.name=name;});
    const r=ROWS.find(x=>x.id===e.id);if(r){r.name=name;r.grade=grade;}
    if(e.newPhoto!==undefined)AV[e.id]=e.newPhoto;
    closeModal();draw();loadAvatars();toast('تم حفظ التعديلات');
  }catch(x){merr(x.message);b.disabled=false;b.textContent='حفظ التعديلات';}
}
/* update the student's synced progress so the change reaches their device */
async function patchState(id,fn){
  const r=await must(await api('/rest/v1/user_data?select=state&user_id=eq.'+id));
  const row=(await r.json())[0];if(!row||!row.state||typeof row.state!=='object')return false;
  const st=row.state;fn(st);st.kxMod=Date.now();
  await must(await api('/rest/v1/user_data?user_id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:{state:st,updated_at:new Date().toISOString()}}));
  return true;
}
function confirmBox(title,text,btn,fn){
  modal(`<h3>${title}</h3><p>${text}</p><div class="err" id="merr" hidden></div><div class="mrow"><button class="btn bad" id="cgo">${btn}</button><button class="btn ghost" data-a="close">إلغاء</button></div>`);
  $('#cgo').onclick=async()=>{const b=$('#cgo');b.disabled=true;b.textContent='لحظات...';try{await fn();}catch(x){merr(x.message);b.disabled=false;b.textContent=btn;}};
}
function resetStudent(id){
  const r=ROWS.find(x=>x.id===id);
  confirmBox('تصفير التقدم','سيتم مسح نقاط وكلمات وشارات «'+esc(r&&r.name)+'» ويبدأ من الصفر. لا يمكن التراجع.','تصفير',async()=>{
    await must(await api('/rest/v1/profiles?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:{xp:0,streak:0}}));
    await patchState(id,st=>{st.items=[];st.log={};st.xp=0;st.badges=[];st.stats={lessons:0,sentences:0,perfect:0,added:0};st.test={last:null,best:null};});
    if(r){r.xp=0;r.streak=0;}closeModal();draw();loadAvatars();toast('تم تصفير التقدم');
  });
}
async function deleteIds(ids){
  for(const id of ids)await must(await api('/rest/v1/rpc/admin_delete_student',{method:'POST',body:{target:id}}));
  ROWS=ROWS.filter(r=>!ids.includes(r.id));ids.forEach(id=>{SELECTED.delete(id);delete AV[id];delete PH[id];});
  closeModal();draw();loadAvatars();toast('تم حذف '+ids.length+(ids.length>1?' طلاب':' طالب'));
}
function delStudent(id){
  const r=ROWS.find(x=>x.id===id);if(!r)return;
  confirmBox('حذف الطالب','سيتم حذف «'+esc(r.name)+'» نهائيًا مع حسابه وكل تقدمه ويختفي من المتصدرين. لا يمكن التراجع.','حذف نهائيًا',()=>deleteIds([id]));
}
function exportCsv(){
  const rows=[['الاسم','الصف','النقاط','الهاتف','آخر نشاط']].concat(view().map(r=>[r.name,GRADES[(r.grade||1)-1]||'',r.xp||0,PH[r.id]||'',r.updated_at||'']));
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='students.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='login'){
    const em=$('#em').value.trim(),pw=$('#pw').value,er=$('#lerr');er.hidden=true;
    if(!em||!pw){er.textContent='اكتب البريد وكلمة المرور.';er.hidden=false;return;}
    b.disabled=true;b.textContent='لحظات...';
    try{await login(em,pw);await loadAll();}catch(x){er.textContent=x.message;er.hidden=false;b.disabled=false;b.textContent='تسجيل الدخول';}
  }
  else if(a==='logout')logout();
  else if(a==='reload')loadAll();
  else if(a==='csv')exportCsv();
  else if(a==='edit')openEdit(id);
  else if(a==='del')delStudent(id);
  else if(a==='reset')resetStudent(id);
  else if(a==='save')saveEdit();
  else if(a==='close')closeModal();
  else if(a==='pick')$('#pf').click();
  else if(a==='prev'){PG=Math.max(0,PG-1);drawTable();loadAvatars();}
  else if(a==='next'){PG++;drawTable();loadAvatars();}
  else if(a==='unsel'){SELECTED.clear();drawTable();}
  else if(a==='bulkdel'){const ids=[...SELECTED];confirmBox('حذف '+ids.length+' طالب','سيتم حذف الطلاب المحددين نهائيًا مع حساباتهم وتقدمهم. لا يمكن التراجع.','حذف الكل',()=>deleteIds(ids));}
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.classList&&t.classList.contains('chk')){t.checked?SELECTED.add(t.dataset.id):SELECTED.delete(t.dataset.id);t.closest('tr').classList.toggle('sel',t.checked);updBulk();}
  else if(t.id==='gf'){GF=t.value;PG=0;drawTable();loadAvatars();}
  else if(t.id==='so'){SORT=t.value;PG=0;drawTable();loadAvatars();}
  else if(t.id==='pf'){const f=t.files&&t.files[0];t.value='';if(f){try{EDIT.newPhoto=await cropImg(f);const n=$('#en'),g=$('#eg');EDIT.name=n.value;EDIT.grade=+g.value;renderEdit();}catch(x){merr(x.message);}}}
});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){Q=ev.target.value;PG=0;drawTable();clearTimeout(window.__av);window.__av=setTimeout(loadAvatars,150);}});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&(ev.target.id==='em'||ev.target.id==='pw')){ev.preventDefault();const b=$('#lgo');if(b)b.click();}
  if(ev.key==='Escape'&&!$('#mod').hidden)closeModal();
});
$('#mod').addEventListener('click',e=>{if(e.target.id==='mod')closeModal();});
/* ---------- boot ---------- */
SESS=loadSess();
if(SESS){refresh().then(()=>{if(SESS)loadAll();else draw();});}else draw();
</script>
</body>
</html>
