<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FFB800" />
<title>ناقصنا ايه | مشتريات البيت</title>
<link rel="icon" type="image/png" href="logo.png" />
<link rel="apple-touch-icon" href="logo.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ناقصنا إيه" />
<meta name="application-name" content="ناقصنا إيه" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8FF;
    --bg-paper: #FFFFFF;
    --card: #FFFFFF;
    --text: #1E1B2E;
    --text-sec: #6B6580;
    --text-muted: #A8A3C0;
    --border: #EDE9FE;
    --primary: #7C3AED;
    --primary-dark: #6D28D9;
    --primary-light: #F1EAFE;
    --primary-soft: #E9DFFF;
    --grad: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 55%, #6D28D9 100%);
    --grad-soft: linear-gradient(135deg, #EDE9FE 0%, #FDF4FF 60%, #EFF6FF 100%);
    --grad-sun: linear-gradient(135deg, #FBBF24 0%, #FB7185 100%);
    --success: #10B981;
    --success-light: #DCFCE7;
    --danger: #F43F5E;
    --danger-light: #FFE4E6;
    --pending: #F59E0B;
    --pending-light: #FEF3C7;
    --accent: #06B6D4;
    --accent-light: #CFFAFE;
    --pink: #EC4899;
    --pink-light: #FCE7F3;
    --mint: #14B8A6;
    --mint-light: #CCFBF1;
    --nav-h: 76px;
    --radius: 22px;
    --radius-sm: 16px;
    --radius-xs: 12px;
    --shadow-sm: 0 2px 8px rgba(124,58,237,.07);
    --shadow: 0 8px 28px rgba(124,58,237,.10);
    --shadow-lg: 0 16px 48px rgba(124,58,237,.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Cairo", "Nunito", sans-serif;
    background: var(--bg);
    background-image: radial-gradient(600px 320px at 85% -60px, #EDE9FE 0%, transparent 60%), radial-gradient(500px 300px at 0% 0%, #FCE7F3 0%, transparent 55%), radial-gradient(700px 420px at 50% 110%, #E0F2FE 0%, transparent 60%);
    background-attachment: fixed;
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    overflow-x: hidden;
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; font-weight: 700; }
  input, select, textarea { font-family: inherit; font-size: 15px; font-weight: 600; }
  .hidden { display: none !important; }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    padding-bottom: calc(var(--nav-h) + 28px);
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 15px 20px;
    border-radius: 18px;
    font-size: 15px; font-weight: 800;
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    min-height: 54px;
    border: none;
    background: #fff;
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 19px; height: 19px; }
  .btn-primary { background: var(--grad); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 12px 26px rgba(124,58,237,.38); letter-spacing: .1px; }
  .btn-primary:active { box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 5px 12px rgba(124,58,237,.3); }
  .btn-success { background: linear-gradient(135deg,#34D399,#10B981); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 12px 26px rgba(16,185,129,.32); }
  .btn-danger { background: linear-gradient(135deg,#FB7185,#F43F5E); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 12px 26px rgba(244,63,94,.3); }
  .btn-group .btn:not(.btn-primary):not(.btn-success):not(.btn-danger), .btn-secondary { background: #fff; color: var(--primary-dark); border: 1.5px solid rgba(124,58,237,.28); box-shadow: 0 4px 12px rgba(124,58,237,.08); }
  .btn-group .btn:not(.btn-primary):not(.btn-success):not(.btn-danger):active { background: var(--primary-light); }
  .btn:disabled { opacity: .45; filter: grayscale(.5); transform: none !important; box-shadow: none !important; cursor: not-allowed; }
  /* ===== Items review (per-item classification) ===== */
  #itemsReview { margin-bottom: 4px; }
  .review-title { font-size: 12.5px; font-weight: 900; color: var(--primary-dark); margin-bottom: 8px; }
  .rv-row { display: flex; align-items: center; gap: 9px; background: #fff; border: 1.5px solid var(--border); border-radius: 14px; padding: 9px 11px; margin-bottom: 7px; animation: popIn .2s ease-out; }
  .rv-row.missing { border-color: var(--danger); background: var(--danger-light); }
  .rv-name { flex: 1; min-width: 0; font-weight: 800; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rv-badge { display: inline-flex; align-items: center; gap: 4px; padding: 5px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 800; flex-shrink: 0; }
  .rv-badge svg { width: 15px; height: 15px; }
  .rv-select { border: 1.5px solid var(--danger); border-radius: 10px; padding: 7px 9px; font-family: inherit; font-size: 12px; font-weight: 800; color: var(--danger); background: #fff; max-width: 150px; }
  .btn-ghost { background: transparent; border: none; box-shadow: none; width: auto; padding: 8px 14px; min-height: auto; font-weight: 800; color: var(--primary); }
  .btn-group { display: flex; flex-direction: column; gap: 12px; }
  .btn-sm { padding: 9px 15px; min-height: 38px; font-size: 13px; width: auto; border-radius: 14px; }

  .form-card {
    width: 100%; background: var(--card); border-radius: 24px;
    padding: 28px 22px 24px; border: 1px solid rgba(124,58,237,.08);
    box-shadow: var(--shadow);
    animation: pop .35s ease-out;
  }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .form-title { font-size: 22px; font-weight: 900; margin-bottom: 6px; text-align: center; }
  .form-subtitle { color: var(--text-sec); margin-bottom: 20px; text-align: center; font-size: 14px; font-weight: 600; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 800; margin-bottom: 6px; font-size: 14px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 13px 14px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); transition: all .2s; color: var(--text);
    box-shadow: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,.12);
  }
  .field input.error { border-color: var(--danger); background: var(--danger-light); }
  .help-text { color: var(--text-muted); font-size: 12px; margin-top: 4px; font-weight: 600; }
  .error-text { color: var(--danger); background: var(--danger-light); padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 14px; font-size: 14px; font-weight: 600; border: 1px solid var(--danger); }

  .onboarding { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px 20px; }
  .welcome-card { width: 100%; text-align: center; max-width: 420px; }
  .brand-icon {
    width: 100px; height: 100px; margin: 0 auto 20px;
    background: var(--primary-light); border: none;
    border-radius: 24px; display: flex; align-items: center; justify-content: center;
    font-size: 48px; animation: pop .5s ease-out;
    box-shadow: 0 8px 24px rgba(59,130,246,.2);
  }
  .brand-title { font-size: 34px; font-weight: 900; color: var(--primary-dark); margin-bottom: 8px; }
  .brand-desc { font-size: 15px; color: var(--text-sec); margin-bottom: 36px; font-weight: 600; line-height: 1.8; }
  /* ===== Welcome hero ===== */
  .onboarding.wb { position: relative; overflow: hidden; }
  .wb-blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; pointer-events: none; }
  .wb-blob.b1 { width: 280px; height: 280px; background: #DDD0FE; top: -90px; right: -80px; animation: blobFloat 7s ease-in-out infinite; }
  .wb-blob.b2 { width: 220px; height: 220px; background: #FBCFE8; bottom: -70px; left: -60px; animation: blobFloat 8s ease-in-out 1s infinite reverse; }
  @keyframes blobFloat { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-18px,16px) scale(1.08); } }
  .welcome-card { position: relative; z-index: 1; }
  .welcome-card .noura-card { margin: 0 0 16px; }
  .brand-icon.xl { width: 112px; height: 112px; border-radius: 32px; }
  .brand-icon.xl svg { width: 52px; height: 52px; }
  .app-logo { position: relative; overflow: hidden; padding: 0; }
  .app-logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* ===== App logo showcase ===== */
  .logo-show { position: relative; width: 136px; height: 136px; margin: 6px auto 18px; animation: logoFloat 3.4s ease-in-out infinite; }
  .logo-show .logo-ring { position: absolute; inset: 0; border-radius: 40px; background: conic-gradient(from 0deg, #FBBF24, #EC4899, #8B5CF6, #14B8A6, #FBBF24); animation: ringSpin 6s linear infinite; filter: saturate(1.2); }
  .logo-show .logo-fallback { position: absolute; inset: 5px; border-radius: 35px; background: var(--grad); display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 40px rgba(124,58,237,.4); }
  .logo-show img { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); object-fit: cover; border-radius: 35px; box-shadow: 0 18px 40px rgba(124,58,237,.4); }
  @keyframes logoFloat { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-10px) rotate(1.5deg); } }
  .brand-title.grad { font-size: 40px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 6px; }
  .feat-row { display: flex; gap: 8px; justify-content: center; margin: -22px 0 14px; }
  .feat-pill { display: flex; align-items: center; gap: 7px; background: #fff; border: 1.5px solid rgba(124,58,237,.14); border-radius: 999px; padding: 7px 13px 7px 8px; font-size: 12px; font-weight: 800; box-shadow: var(--shadow-sm); }
  .feat-ico { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .btn-xl { min-height: 58px; font-size: 17px; border-radius: 20px; }
  .trust-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; font-size: 11.5px; font-weight: 800; color: var(--text-muted); }
  .trust-row i { width: 4px; height: 4px; border-radius: 50%; background: var(--text-muted); opacity: .6; }
  @keyframes wUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  .w-anim { animation: wUp .55s cubic-bezier(.22,1,.36,1) both; }
  .w-anim.d1 { animation-delay: .08s; } .w-anim.d2 { animation-delay: .16s; }
  .w-anim.d3 { animation-delay: .24s; } .w-anim.d4 { animation-delay: .32s; }
  .w-anim.d5 { animation-delay: .4s; } .w-anim.d6 { animation-delay: .48s; }
  .home-code-box {
    background: var(--primary-light); border: 1.5px solid var(--primary);
    border-radius: var(--radius); padding: 20px; text-align: center; margin: 16px 0 20px;
  }
  .home-code { font-size: 28px; font-weight: 900; color: var(--primary-dark); letter-spacing: 3px; font-family: monospace; }
  .home-code-label { font-size: 12px; color: var(--text-sec); margin-bottom: 6px; font-weight: 700; }
  .success-icon { width: 72px; height: 72px; margin: 0 auto 14px; background: var(--success-light); border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; animation: pop .5s ease-out; box-shadow: 0 6px 16px rgba(16,185,129,.2); }

  .topbar { padding: 16px 18px 6px; position: sticky; top: 0; background: var(--bg); z-index: 10; border-bottom: 1px solid var(--border); }
  .topbar .greeting { font-size: 20px; font-weight: 800; }
  .page-title { font-size: 22px; font-weight: 900; margin: 10px 18px 12px; }
  .section { padding: 0 18px; margin-bottom: 18px; }
  .page { animation: fadePage .2s ease-out; }
  @keyframes fadePage { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card {
    background: var(--card); border-radius: var(--radius); padding: 14px;
    border: none; box-shadow: var(--shadow-sm);
  }
  .stat-icon { font-size: 22px; margin-bottom: 6px; }
  .stat-label { font-size: 12px; color: var(--text-sec); font-weight: 700; margin-bottom: 2px; }
  .stat-value { font-size: 20px; font-weight: 900; }
  .stat-value .currency { font-size: 13px; font-weight: 700; }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .section-header h3 { font-size: 16px; font-weight: 800; }
  .section-header a { color: var(--primary); font-size: 13px; font-weight: 700; text-decoration: none; }

  .filters-wrap { padding: 0 18px 10px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  .filters-wrap::-webkit-scrollbar { display: none; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--card); color: var(--text-sec); font-weight: 700; font-size: 13px;
    margin-left: 6px; border: 1.5px solid var(--border); transition: all .15s;
  }
  .filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .search-bar { padding: 0 18px 12px; }
  .search-box { position: relative; }
  .search-box input { width: 100%; padding: 12px 14px 12px 40px; background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
  .search-box .sicon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; }

  .category-group { margin-bottom: 14px; padding: 0 14px; }
  .category-card { background: var(--card); border-radius: var(--radius); overflow: hidden; border: none; box-shadow: var(--shadow-sm); }
  .category-card-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .category-card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .category-card-info { flex: 1; }
  .category-card-name { font-size: 15px; font-weight: 800; }
  .category-card-count { font-size: 12px; font-weight: 700; opacity: .7; }
  .category-card-badge { padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; flex-shrink: 0; }
  .category-card-orders { padding: 4px 10px 10px; }

  .order-card {
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 12px; margin: 0 0 6px;
    border: none;
    display: flex; align-items: center; gap: 10px;
    transition: transform .1s; cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  .order-card:active { transform: scale(.98); }
  .order-card.purchased { opacity: .7; background: var(--success-light); }
  .order-main { flex: 1; min-width: 0; }
  .order-name { font-size: 15px; font-weight: 800; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .order-name.purchased-name { text-decoration: line-through; color: var(--text-muted); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; border: none; }
  .badge-pending { background: var(--pending-light); color: #B7950B; }
  .badge-done { background: var(--success-light); color: #1E8449; }
  .order-meta { font-size: 12px; color: var(--text-sec); display: flex; flex-wrap: wrap; gap: 6px; }
  .meta-item { display: inline-flex; align-items: center; gap: 3px; }
  .purchase-info { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); font-size: 13px; }
  .purchase-info .price { color: var(--success); font-weight: 800; font-size: 14px; }

  .context-menu {
    position: fixed; background: var(--card); border-radius: var(--radius);
    border: none; box-shadow: var(--shadow-lg);
    z-index: 9999; min-width: 170px; padding: 6px;
    animation: pop .15s ease-out;
  }
  .context-menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700;
    transition: background .1s; cursor: pointer; border: none; background: none;
    width: 100%; color: var(--text); text-align: right;
  }
  .context-menu-item:active { background: var(--bg); }
  .context-menu-item .ctx-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .context-menu-item.buy .ctx-icon { background: var(--success-light); }
  .context-menu-item.edit .ctx-icon { background: var(--primary-light); }
  .context-menu-item.delete .ctx-icon { background: var(--danger-light); }
  .context-menu-item.delete { color: var(--danger); }
  .context-menu-sep { height: 1px; background: var(--border); margin: 3px 10px; }
  .ctx-backdrop { position: fixed; inset: 0; z-index: 9998; background: transparent; animation: fadeIn .15s ease-out; }
  .order-card { -webkit-touch-callout: none; touch-action: pan-x pan-y; }

  .empty { text-align: center; padding: 40px 24px; }
  .empty-icon { font-size: 56px; margin-bottom: 12px; }
  .empty-title { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
  .empty-desc { color: var(--text-sec); font-size: 14px; margin-bottom: 16px; }
  .empty .btn { width: auto; display: inline-flex; min-width: 180px; }

  .speech-bubble {
    position: relative; background: var(--card); border: none;
    border-radius: 14px; padding: 12px 16px; margin: 0 18px 12px;
    box-shadow: var(--shadow-sm);
    font-size: 14px; font-weight: 700; color: var(--text-sec); line-height: 1.7;
  }
  .speech-bubble::after {
    content: ''; position: absolute; bottom: -8px; right: 24px;
    width: 0; height: 0;
    border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-top: 8px solid var(--card);
  }
  .speech-bubble.wife { background: #FFF0F8; }
  .speech-bubble.wife::after { border-top-color: #FFF0F8; }
  .speech-bubble.husband { background: #EBF5FB; }
  .speech-bubble.husband::after { border-top-color: #EBF5FB; right: auto; left: 24px; }
  .speech-bubble.app-msg { background: var(--primary-light); }
  .speech-bubble.app-msg::after { border-top-color: var(--primary-light); }
  .bubble-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; background: var(--bg); }
  .parent-avatar { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; padding: 0; background: #fff; border: 2px solid #fff; box-shadow: var(--shadow-sm); }
  .parent-avatar svg { width: 100%; height: 100%; }
  .family-duo { display: flex; align-items: flex-end; }
  .family-duo svg { margin-left: -8px; border-radius: 50%; background: rgba(255,255,255,.2); }
  .fam-photo { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.65); display: block; margin-left: -10px; }
  .fam-photo:first-child { margin-left: 0; }
  .fam-photo svg, .fam-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-row { display: flex; gap: 10px; padding: 4px 16px 14px; }
  .photo-slot { flex: 1; background: var(--bg); border-radius: 18px; padding: 10px; text-align: center; }
  .photo-slot .ph { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; margin: 0 auto 6px; background: #fff; box-shadow: var(--shadow-sm); }
  .photo-slot .ph svg, .photo-slot .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-slot b { font-size: 12px; display: block; margin-bottom: 6px; }
  /* ===== Collapsible pro sections ===== */
  .collapsible-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; text-align: right; border-radius: 20px; transition: background .18s; }
  .collapsible-head:active { background: var(--primary-light); }
  .collapsible-head.sub { padding: 6px 0 10px; border-radius: 12px; }
  .ch-icon { width: 44px; height: 44px; border-radius: 15px; background: var(--grad); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 6px 14px rgba(124,58,237,.3); }
  .ch-texts { flex: 1; min-width: 0; }
  .ch-texts b { display: block; font-size: 15px; font-weight: 900; }
  .ch-texts small { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-sec); margin-top: 1px; }
  .collapsible-head .chev { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-light); color: var(--primary); font-size: 21px; font-weight: 900; display: flex; align-items: center; justify-content: center; transform: rotate(-90deg); transition: transform .25s, background .25s; line-height: 1; flex-shrink: 0; }

  function handlePhotoUpload(type, file) {
    if (!file || !file.type.startsWith('image/')) { toast('اختر صورة صحيحة', 'error'); return; }
    const img = new Image();
    const rd = new FileReader();
    rd.onload = () => {
      img.onload = () => {
        const max = 256;
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        if (!state.photos) state.photos = { mom: '', dad: '' };
        state.photos[type] = c.toDataURL('image/jpeg', .82);
        persist(); render();
        toast(type === 'mom' ? 'تم حفظ صورة الأم' : 'تم حفظ صورة الأب', 'success');
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  }

  function normalizeTerm(s) {
    if (!s) return '';
    return s.toLowerCase().trim().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[ؤئ]/g, 'ء').replace(/\s+/g, ' ');

  function classifyOrder(name, opts) {
    opts = opts || {};
    if (opts.forceCategory && (CATEGORIES[opts.forceCategory] || isCustomCat(opts.forceCategory))) return { categoryId: opts.forceCategory, source: 'forced' };
    const norm = normalizeTerm(name);
    if (state.learnedMap[norm] && (CATEGORIES[state.learnedMap[norm]] || isCustomCat(state.learnedMap[norm]))) return { categoryId: state.learnedMap[norm], source: 'learned' };
    for (const cat of Object.keys(CLASSIFIER_MAP)) {
      for (const kw of CLASSIFIER_MAP[cat]) {
        if (norm === normalizeTerm(kw)) return { categoryId: cat, source: 'exact' };
      }
    }
    for (const cat of Object.keys(CLASSIFIER_MAP)) {
      for (const kw of CLASSIFIER_MAP[cat]) {
        if (norm.includes(normalizeTerm(kw)) || normalizeTerm(kw).includes(norm)) return { categoryId: cat, source: 'partial' };
      }
    }
    return { categoryId: 'other', source: 'unknown' };
  }

  function renderOrders() {
    const { orderFilter, categoryFilter, searchQuery } = state;
    let list = state.orders.filter(o => !(o.status === 'purchased' && o.purchase && !isSameDay(o.purchase.purchasedAt)));
    if (orderFilter === 'pending') list = list.filter(o => o.status === 'pending');
    else if (orderFilter === 'done') list = list.filter(o => o.status === 'purchased');
    if (categoryFilter !== 'all') list = list.filter(o => o.categoryId === categoryFilter);
    if (searchQuery) { const q = normalizeTerm(searchQuery); list = list.filter(o => normalizeTerm(o.name).includes(q)); }
    const cats = allCats();
    const grouped = {}; for (const c of cats) grouped[c.id] = [];
    for (const o of list) { if (!grouped[o.categoryId]) grouped[o.categoryId] = []; grouped[o.categoryId].push(o); }
    for (const k of Object.keys(grouped)) grouped[k].sort((a, b) => ((b.urgent && b.status !== 'purchased') ? 1 : 0) - ((a.urgent && a.status !== 'purchased') ? 1 : 0));
    const urgentList = list.filter(o => o.urgent && o.status === 'pending');

      }).join('')}

  function renderDonut(breakdown, total) {
    const entries = Object.keys(breakdown).map(id => ({ id, name: getCategoryName(id), color: catColor(id), value: breakdown[id] || 0 })).filter(e => e.value > 0);
    if (!entries.length) return `<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px;">مفيش بيانات الشهر ده</div>`;
    let cumulative = 0;
    const segments = entries.map(e => { const start = (cumulative / total) * 360; cumulative += e.value; const end = (cumulative / total) * 360; return { ...e, start, end, pct: total ? (e.value / total * 100) : 0 }; });
    const R = 68, CX = 70, CY = 70;
    const arcPath = (start, end) => { if (end - start >= 359.99) return `M ${CX} ${CY - R} A ${R} ${R} 0 1 1 ${CX - 0.001} ${CY - R} Z`; const s = polar(CX, CY, R, start - 90), e = polar(CX, CY, R, end - 90); return `M ${CX} ${CY} L ${s.x} ${s.y} A ${R} ${R} 0 ${(end - start) > 180 ? 1 : 0} 1 ${e.x} ${e.y} Z`; };
    return `<div class="donut-wrap"><svg viewBox="0 0 140 140" width="140" height="140">${segments.map(s => `<path d="${arcPath(s.start, s.end)}" fill="${s.color}"/>`).join('')}</svg><div class="donut-legend">${segments.map(s => `<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span><span>${s.name}</span><span class="legend-pct">${s.pct.toFixed(0)}%</span></div>`).join('')}</div></div>`;
  }
  function polar(cx, cy, r, deg) { const rad = deg * Math.PI / 180; return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) }; }
  function renderBarChart(days) {
    const max = Math.max(1, ...days.map(d => d.total)); const maxIdx = days.reduce((iMax, d, i, arr) => d.total > arr[iMax].total ? i : iMax, 0);
    return `<div class="barchart">${days.map((d, i) => { const h = (d.total / max) * 100; return `<div class="bar-item"><div class="bar-fill" style="height:${Math.max(h, 2)}%"></div><div class="bar-label">${d.label}</div></div>`; }).join('')}</div>`;
  }
  function renderBarChartSparse(days) {
    const sampled = []; const step = days.length > 16 ? 3 : days.length > 10 ? 2 : 1;
    for (let i = 0; i < days.length; i += step) sampled.push(days[i]);
    const max = Math.max(1, ...sampled.map(d => d.total));
    return `<div class="barchart" style="height:110px;">${sampled.map(d => { const h = (d.total / max) * 100; return `<div class="bar-item"><div class="bar-fill" style="height:${Math.max(h, 2)}%"></div><div class="bar-label">${d.label}</div></div>`; }).join('')}</div>`;
  }

  function memeTone(ctx, dest, o) {
    const t0 = ctx.currentTime + (o.t || 0);
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(30, o.f2), t0 + o.d);
    if (o.vib) {
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = o.vib; lg.gain.value = o.vibAmt || 200;
      lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t0); lfo.stop(t0 + o.d + 0.05);
    }
    if (o.trem) {
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.type = 'square'; lfo.frequency.value = o.trem; lg.gain.value = 0.5;
      lfo.connect(lg); lg.connect(g.gain); lfo.start(t0); lfo.stop(t0 + o.d + 0.05);
    }
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.min(1, o.v || 0.8), t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.d);
    osc.connect(g); g.connect(dest);
    osc.start(t0); osc.stop(t0 + o.d + 0.05);
  }

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.min(1, o.v || 0.5), t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.d);
    src.connect(f); f.connect(g); g.connect(dest);
    src.start(t0); src.stop(t0 + o.d + 0.05);

  function handleDeleteOrder(id) {
    const o = state.orders.find(x => x.id === id); if (!o) return;
    confirmDialog({ title: 'نحذف الطلب ده؟', message: `"${o.name}" هيمسح نهائياً.`, confirmText: '🗑️ امسحه', cancelText: '↩️ لا', danger: true }).then(ok => {
      if (ok) { if (o.purchase) { const exp = state.expenses.find(e => e.sourceType === 'order' && e.sourceId === id); if (exp) deleteExpense(exp.id); } deleteOrder(id); toast('اتمسح ✓', 'success'); render(); }
    });
  }
  function handleDeleteExpense(id) {
    confirmDialog({ title: 'نحذف المصروف؟', message: 'هيمسح نهائياً.', confirmText: '🗑️ امسحه', cancelText: '↩️ لا', danger: true }).then(ok => { if (ok) { deleteExpense(id); toast('اتمسح ✓', 'success'); render(); } });

  function openPurchaseModal(orderId) {
    const o = state.orders.find(x => x.id === orderId); if (!o) return;
    const html = `<div class="modal-handle"></div>
      <h2>تم شراء "${escapeHTML(o.name)}"؟</h2>
      <p class="m-sub">اكتب السعر عشان نسجله</p>
      <div class="field"><label>السعر *</label><input type="number" id="finalPrice" min="0" step="0.01" placeholder="مثلا: 25.50" /></div>
      <div class="btn-group"><button class="btn btn-success" id="confirmBuy">تأكيد الشراء</button><button class="btn" id="cancelBuy">رجوع</button></div>`;
    const m = openModal(html); const fin = m.querySelector('#finalPrice');
    m.querySelector('#cancelBuy').onclick = () => closeModal(m);
    m.querySelector('#confirmBuy').onclick = () => {
      const finalV = Number(fin.value);
      if (!(finalV > 0)) { fin.classList.add('error'); fin.focus(); toast('اكتب السعر يا حبيبي', 'warning'); return; }
      markPurchased(orderId, { originalPrice: finalV, finalPrice: finalV });
      const doneOrder = state.orders.find(x => x.id === orderId);
      pushNotif('order_done', { names: doneOrder ? [doneOrder.name] : [], orderIds: [orderId] });
      toast(pickMsg(MSG.purchaseDone), 'success');
      closeModal(m); render();
    };
  }

  function encDownload(name, text, mime) {
    try {
      const blob = new Blob(["\ufeff" + text], { type: (mime || 'text/plain') + ';charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    } catch { toast('مقدرتش أنزّل الملف', 'error'); }
  }
  function encSplitCSV(line) {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',' || ch === ';') { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur); return out.map(s => s.trim());
  }
  function encResolveDept(v) {
    if (!v) return null; const t = String(v).trim();
    const all = encDepts();
    if (all[t]) return t;
    const k = normalizeTerm(t);
    for (const id of Object.keys(all)) { if (normalizeTerm(all[id].n) === k) return id; }
    return null;
  }
  function encResolveBrand(v) {
    if (!v) return 'generic'; const t = String(v).trim();
    let f = ENC.brands.find(b => b.id === t); if (f) return f.id;
    const k = normalizeTerm(t);
    f = ENC.brands.find(b => normalizeTerm(b.ar) === k || normalizeTerm(b.en) === k); if (f) return f.id;
    const id = 'b' + Date.now().toString(36) + Math.floor(Math.random() * 99);
    ENC.brands.push({ id, ar: t, en: '', co: '' });
    return id;
  }
  function encImportCSV(text) {
    encInit();
    const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (!lines.length) return { added: 0, updated: 0, errors: [{ line: 0, msg: 'الملف فاضي' }] };
    let start = 0;
    const head = encSplitCSV(lines[0]).map(c => normalizeTerm(c));
    if (head.includes('ar') || head.join(' ').indexOf('اسم') >= 0 || isNaN(Number(encSplitCSV(lines[0])[9]))) start = 1;
    const seenBc = new Set(ENC.products.map(p => p.c).filter(Boolean));
    const fileBc = new Set();
    let added = 0, updated = 0; const errors = [];
    for (let li = start; li < lines.length; li++) {
      const c = encSplitCSV(lines[li]);
      try {
        const [id, ar, en, dept, sub, group, brand, flavor, size, price, old, barcode, stock, tags, isnew] = c;
        if (!ar) throw new Error('اسم المنتج مطلوب');
        const pr = Number(price); if (!(pr > 0)) throw new Error('السعر غير صالح');
        const dId = encResolveDept(dept); if (!dId) throw new Error('القسم غير معروف: ' + (dept || '—'));
        const dd = encDept(dId);
        const subN = (sub || dd.subs[0] || '').trim();
        const bId = encResolveBrand(brand);
        const bc = String(barcode || '').trim();
        if (bc) {
          if (fileBc.has(bc)) throw new Error('باركود مكرر في الملف: ' + bc);
          fileBc.add(bc);
          const dup = ENC.products.find(p => p.c === bc && p.id !== (id || '').trim());
          if (dup) throw new Error('الباركود موجود لمنتج تاني: ' + dup.ar);
        }
        const rec = { d: dId, s: subN, g: (group || '').trim(), ar: ar.trim(), en: (en || '').trim(), b: bId, f: (flavor || '').trim(), z: (size || '').trim(), p: pr, o: Number(old) || 0, k: stock === '' || stock == null ? 20 : Number(stock), t: String(tags || '').split('|').map(x => x.trim()).filter(Boolean), nw: String(isnew || '').trim() === '1' };
        const eid = (id || '').trim();
        const ex = eid && ENC.products.find(p => p.id === eid);
        if (ex) { Object.assign(ex, rec); if (bc) ex.c = bc; updated++; }
        else {
          if (bc && seenBc.has(bc)) throw new Error('الباركود موجود: ' + bc);
          const nid = 'p' + Date.now().toString(36) + li;
          ENC.products.push(Object.assign({ id: nid, c: bc || String(622199000000 + ENC.products.length), r: 4, n: 5, sold: 0 }, rec));
          if (bc) seenBc.add(bc);
          added++;
        }
      } catch (err) { errors.push({ line: li + 1, msg: err.message || 'صف غير صالح' }); }
    }
    encSave();
    return { added, updated, errors };
  }

        if (base) { if (!base[5].includes(nm)) base[5].push(nm); }
        else { const c = (ENC.customDepts || []).find(d => d.id === did); if (c && !c.subs.includes(nm)) c.subs.push(nm); }
        encSave(); toast('اتضاف القسم الفرعي', 'success'); closeModal(m); render();
      };
      body.querySelector('#admDAdd').onclick = () => {
        const nm = body.querySelector('#admDName').value.trim();
        if (!nm) { toast('اكتب اسم القسم', 'warning'); return; }
        ENC.customDepts = ENC.customDepts || [];
        ENC.customDepts.push({ id: 'c' + Date.now().toString(36), n: nm, em: '📦', c: '#7C3AED', oc: 'other', subs: ['عام'], custom: true });
        encSave(); toast('اتضاف القسم', 'success'); closeModal(m); render();
      };
      body.querySelectorAll('[data-ddel]').forEach(b => b.onclick = () => {
        if ((ENC.products.filter(p => p.d === b.dataset.ddel)).length) { toast('القسم فيه منتجات — انقلها الأول', 'error'); return; }
        ENC.customDepts = (ENC.customDepts || []).filter(d => d.id !== b.dataset.ddel); encSave(); closeModal(m); render();
      });
    };
    m.querySelector('#admBrand').onclick = () => {
      body.innerHTML = `<div class="field" style="margin-top:10px;"><label>اسم العلامة *</label><input id="admBAr" placeholder="مثال: المراعي" /></div>
        <div class="row-2"><div class="field"><label>بالإنجليزية</label><input id="admBEn" placeholder="Almarai" /></div><div class="field"><label>الدولة</label><input id="admBCo" placeholder="السعودية" /></div></div>
        <div class="field"><label>وصف مختصر</label><textarea id="admBDe" rows="2"></textarea></div>
        <div class="btn-group"><button class="btn btn-primary" id="admBSave">حفظ العلامة</button></div>`;
      body.querySelector('#admBSave').onclick = () => {
        const ar = body.querySelector('#admBAr').value.trim();
        if (!ar) { toast('اكتب اسم العلامة', 'warning'); return; }
        ENC.brands.push({ id: 'b' + Date.now().toString(36), ar, en: body.querySelector('#admBEn').value.trim(), co: body.querySelector('#admBCo').value.trim(), desc: body.querySelector('#admBDe').value.trim() });
        encSave(); toast('اتضافت العلامة', 'success'); closeModal(m); render();
      };
    };
    m.querySelector('#admImport').onclick = () => {
      body.innerHTML = `<div class="field" style="margin-top:10px;"><label>الصق CSV أو اختار ملف</label>
        <textarea id="admCSV" class="csv-area" placeholder="ID,ar,en,dept,sub,group,brand,flavor,size,price,old,barcode,stock,tags,new"></textarea>
        <div class="help-text">الأعمدة: ID,ar,en,dept,sub,group,brand,flavor,size,price,old,barcode,stock,tags,new — أول صف عناوين اختياري. الباركود المكرر مرفوض.</div></div>
        <div class="btn-group"><button class="btn" id="admPick">📁 اختار ملف CSV/Excel</button><input type="file" id="admFile" accept=".csv,.txt" class="hidden" /><button class="btn btn-primary" id="admGo">استيراد</button></div><div id="admRep"></div>`;
      const ta = body.querySelector('#admCSV');
      body.querySelector('#admPick').onclick = () => body.querySelector('#admFile').click();
      body.querySelector('#admFile').onchange = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => ta.value = String(r.result || ''); r.readAsText(f); };
      body.querySelector('#admGo').onclick = () => {
        const r = encImportCSV(ta.value);
        body.querySelector('#admRep').innerHTML = `<div class="report-card" style="margin:10px 0;">اتضاف: <b>${r.added}</b> • اتحدّث: <b>${r.updated}</b> • أخطاء: <b>${r.errors.length}</b>${r.errors.slice(0, 8).map(e => `<div class="exp-detail">سطر ${e.line}: ${escapeHTML(e.msg)}</div>`).join('')}</div>`;
        toast('اتضاف ' + r.added + ' واتحدّث ' + r.updated, r.errors.length ? 'warning' : 'success');
        render();
      };
    };
    m.querySelector('#admExport').onclick = () => {
      body.innerHTML = `<div class="btn-group" style="margin-top:10px;"><button class="btn" id="expCSV">📥 تنزيل CSV (${ENC.products.length} منتج)</button><button class="btn" id="expJSON">📥 تنزيل JSON نسخة احتياطية</button></div>`;
      body.querySelector('#expCSV').onclick = encExportCSV;
      body.querySelector('#expJSON').onclick = () => encDownload('products-backup.json', JSON.stringify(ENC, null, 1), 'application/json');
    };
  }
  function openEncProductForm(id, done) {
    const p = id ? encProduct(id) : null;
    const all = encDepts();
    const m = openModal(`<div class="modal-handle"></div>
      <h2>${p ? 'تعديل منتج' : 'منتج جديد'}</h2>
      <p class="m-sub">${p ? escapeHTML(p.ar) : 'املأ البيانات — الباركود المكرر مرفوض'}</p>
      <div class="field"><label>اسم المنتج *</label><input id="pfAr" value="${escapeHTML(p?.ar || '')}" placeholder="مثال: شيبسي جبنة 50 جم" /></div>
      <div class="field"><label>الاسم الإنجليزي</label><input id="pfEn" value="${escapeHTML(p?.en || '')}" dir="ltr" /></div>
      <div class="row-2"><div class="field"><label>القسم *</label><select id="pfDept">${Object.values(all).map(d => `<option value="${d.id}" ${p?.d === d.id ? 'selected' : ''}>${escapeHTML(d.n)}</option>`).join('')}</select></div>
      <div class="field"><label>القسم الفرعي</label><input id="pfSub" list="pfSubs" value="${escapeHTML(p?.s || '')}" /><datalist id="pfSubs"></datalist></div></div>
      <div class="row-2"><div class="field"><label>المجموعة</label><input id="pfGroup" value="${escapeHTML(p?.g || '')}" placeholder="شيبسي / حليب..." /></div>
      <div class="field"><label>العلامة التجارية</label><select id="pfBrand">${ENC.brands.map(b => `<option value="${b.id}" ${p?.b === b.id ? 'selected' : ''}>${escapeHTML(b.ar)}</option>`).join('')}</select></div></div>
      <div class="row-2"><div class="field"><label>النكهة / النوع</label><input id="pfFlavor" value="${escapeHTML(p?.f || '')}" placeholder="جبنة / شوكولاتة..." /></div>
      <div class="field"><label>الحجم / الوزن</label><input id="pfSize" value="${escapeHTML(p?.z || '')}" placeholder="50 جم / 1 لتر..." /></div></div>
      <div class="row-2"><div class="field"><label>السعر *</label><input id="pfPrice" type="number" min="0" step="0.5" value="${p?.p ?? ''}" /></div>
      <div class="field"><label>قبل الخصم</label><input id="pfOld" type="number" min="0" step="0.5" value="${p?.o || ''}" /></div></div>
      <div class="row-2"><div class="field"><label>الباركود</label><input id="pfBarcode" value="${escapeHTML(p?.c || '')}" inputmode="numeric" /></div>
      <div class="field"><label>المخزون</label><input id="pfStock" type="number" min="0" step="1" value="${p?.k ?? 20}" /></div></div>
      <div class="field"><label>وسوم (| للفصل: صحي|طبيعي|أطفال)</label><input id="pfTags" value="${escapeHTML((p?.t || []).join('|'))}" /></div>
      <label class="urgent-toggle" style="background:var(--success-light);border-color:var(--success);color:var(--success);" id="pfNewW"><input type="checkbox" id="pfNew" ${p?.nw ? 'checked' : ''} /><span class="ut-switch"></span><span class="ut-text">منتج جديد (وصل حديثًا)</span></label>
      <div class="btn-group"><button class="btn btn-primary" id="pfSave">حفظ المنتج</button><button class="btn" id="pfBack">رجوع</button></div>`);
    const deptSel = m.querySelector('#pfDept'); const subDL = m.querySelector('#pfSubs');
    const fillSubs = () => { const d = all[deptSel.value]; subDL.innerHTML = d ? d.subs.map(s => `<option value="${escapeHTML(s)}">`).join('') : ''; };
    deptSel.onchange = fillSubs; fillSubs();
    m.querySelector('#pfBack').onclick = () => closeModal(m);
    m.querySelector('#pfSave').onclick = () => {
      const ar = m.querySelector('#pfAr').value.trim();
      const price = Number(m.querySelector('#pfPrice').value);
      const bc = m.querySelector('#pfBarcode').value.trim();
      if (!ar) { toast('اكتب اسم المنتج', 'warning'); return; }
      if (!(price > 0)) { toast('اكتب سعر صالح', 'warning'); return; }
      if (bc && ENC.products.some(x => x.c === bc && x.id !== (p ? p.id : ''))) { toast('الباركود ده موجود لمنتج تاني', 'error'); return; }
      const rec = { d: deptSel.value, s: m.querySelector('#pfSub').value.trim() || (all[deptSel.value]?.subs[0] || ''), g: m.querySelector('#pfGroup').value.trim(), ar, en: m.querySelector('#pfEn').value.trim(), b: m.querySelector('#pfBrand').value, f: m.querySelector('#pfFlavor').value.trim(), z: m.querySelector('#pfSize').value.trim(), p: price, o: Number(m.querySelector('#pfOld').value) || 0, c: bc || (p ? p.c : String(622199000000 + ENC.products.length)), k: Math.max(0, Number(m.querySelector('#pfStock').value) || 0), t: m.querySelector('#pfTags').value.split('|').map(x => x.trim()).filter(Boolean), nw: m.querySelector('#pfNew').checked };
      if (p) Object.assign(p, rec);
      else ENC.products.push(Object.assign({ id: 'p' + Date.now().toString(36), r: 4, n: 5, sold: 0 }, rec));
      encSave(); toast('اتحفظ المنتج ✓', 'success'); closeModal(m); if (done) done(); else render();
    };
  }

  /* =============================
     INIT
     ============================= */
  function init() {
    restore();
    if (state.initialized && state.home && state.user) state._onboardingStep = null;
    else if (!state.home || !state.user) state._onboardingStep = 'welcome';
    try {
      const h = String(location.hash || '').replace('#', '');
      if (['home', 'orders', 'enc', 'notifs', 'expenses', 'reports', 'settings'].includes(h) && state.initialized) state.currentTab = h;
    } catch {}
    render();
    attachCloud();
    try { PushSys.refreshOnLoad(); } catch {}
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', (e) => {
          if (e && e.data && e.data.type === 'PUSH_RESUBSCRIBE') { try { PushSys.refreshOnLoad(); } catch {} }
        });
      }
    } catch {}
    try { syncAppBadge(); } catch {}
    const poll = () => { if (!state.initialized || !state.home || !state.user) { bindOnboarding(); requestAnimationFrame(() => setTimeout(poll, 400)); } };
    if (!state.initialized || !state.user) poll();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  setInterval(() => { if (!state.initialized || !state.home || !state.user) bindOnboarding(); }, 150);
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
</html>
