<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>ناقصنا ايه | مشتريات البيت</title>
<link rel="icon" type="image/png" href="icon-192.png" />

<style>
  :root {
    --bg: #FAF8FF;
    --bg-paper: #FFFFFF;
    --card: #FFFFFF;
    --text: #1E1B2E;
    --text-sec: #6B6580;
    --text-muted: #A8A3C0;
    --border: #EDE9FE;
    --primary: #7C3AED;
    --primary-dark: #6D28D9;
    --primary-light: #F1EAFE;
    --primary-soft: #E9DFFF;
    --grad: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 55%, #6D28D9 100%);
    --grad-soft: linear-gradient(135deg, #EDE9FE 0%, #FDF4FF 60%, #EFF6FF 100%);
    --grad-sun: linear-gradient(135deg, #FBBF24 0%, #FB7185 100%);
    --success: #10B981;
    --success-light: #DCFCE7;
    --danger: #F43F5E;
    --danger-light: #FFE4E6;
    --pending: #F59E0B;
    --pending-light: #FEF3C7;
    --accent: #06B6D4;
    --accent-light: #CFFAFE;
    --pink: #EC4899;
    --pink-light: #FCE7F3;
    --mint: #14B8A6;
    --mint-light: #CCFBF1;
    --nav-h: 76px;
    --radius: 22px;
    --radius-sm: 16px;
    --radius-xs: 12px;
    --shadow-sm: 0 2px 8px rgba(124,58,237,.07);
    --shadow: 0 8px 28px rgba(124,58,237,.10);
    --shadow-lg: 0 16px 48px rgba(124,58,237,.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Cairo", "Nunito", sans-serif;
    background: var(--bg);
    background-image: radial-gradient(600px 320px at 85% -60px, #EDE9FE 0%, transparent 60%), radial-gradient(500px 300px at 0% 0%, #FCE7F3 0%, transparent 55%), radial-gradient(700px 420px at 50% 110%, #E0F2FE 0%, transparent 60%);
    background-attachment: fixed;
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    overflow-x: hidden;
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; font-weight: 700; }
  input, select, textarea { font-family: inherit; font-size: 15px; font-weight: 600; }
  .hidden { display: none !important; }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    padding-bottom: calc(var(--nav-h) + 28px);
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 15px 20px;
    border-radius: 18px;
    font-size: 15px; font-weight: 800;
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    min-height: 54px;
    border: none;
    background: #fff;
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 19px; height: 19px; }
  .btn-primary { background: var(--grad); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 12px 26px rgba(124,58,237,.38); letter-spacing: .1px; }
  .btn-primary:active { box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 5px 12px rgba(124,58,237,.3); }
  .btn-success { background: linear-gradient(135deg,#34D399,#10B981); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 12px 26px rgba(16,185,129,.32); }
  .btn-danger { background: linear-gradient(135deg,#FB7185,#F43F5E); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 12px 26px rgba(244,63,94,.3); }
  .btn-group .btn:not(.btn-primary):not(.btn-success):not(.btn-danger), .btn-secondary { background: #fff; color: var(--primary-dark); border: 1.5px solid rgba(124,58,237,.28); box-shadow: 0 4px 12px rgba(124,58,237,.08); }
  .btn-group .btn:not(.btn-primary):not(.btn-success):not(.btn-danger):active { background: var(--primary-light); }
  .btn:disabled { opacity: .45; filter: grayscale(.5); transform: none !important; box-shadow: none !important; cursor: not-allowed; }
  /* ===== Orders: pro collapsed items + voice + add-new ===== */
  .order-exp .filter-chip { margin: 0; }
  .ord-chev { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-light); color: var(--primary); font-size: 20px; font-weight: 900; display: flex; align-items: center; justify-content: center; transform: rotate(-90deg); transition: transform .22s; flex-shrink: 0; line-height: 1; }
  .ord-chev.open { transform: rotate(90deg); background: var(--primary); color: #fff; }
  .qty-pill { display: inline-flex; align-items: center; gap: 4px; background: #EEF2FF; color: #4338CA; border: 1px solid #C7D2FE; padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 800; }

  .search-voice-wrap { display: flex; gap: 8px; align-items: center; }
  .search-voice-wrap .search-box { flex: 1; min-width: 0; }
  .voice-mic-mini { width: 44px; height: 44px; border-radius: 50%; background: var(--grad); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 18px rgba(124,58,237,.35); }
  .voice-mic-mini svg { width: 20px; height: 20px; }
  .voice-mic-mini:active { transform: scale(.92); }
  .voice-mic-mini.recording { background: linear-gradient(135deg,#FB7185,#E11D48); animation: micPulse 1.2s ease-out infinite; }
  /* ===== Pro voice-search row (modal) ===== */
  .pick-search-row { display: flex; gap: 8px; align-items: center; }
  .pick-search { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border: 1.5px solid var(--border); border-radius: 14px; background: #fff; font-size: 13.5px; font-weight: 700; color: var(--text); box-shadow: var(--shadow-sm); }
  .pick-search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124,58,237,.12); }
  .pick-search::placeholder { color: var(--text-muted); font-weight: 600; }
  .addnew-card { background: linear-gradient(180deg,#F5F0FF,#fff 70%); border: 1.5px dashed var(--primary); border-radius: 16px; padding: 12px; margin-top: 8px; animation: popIn .2s ease-out; }
  .addnew-card b { font-size: 13.5px; font-weight: 900; display: block; margin-bottom: 8px; }
  .addnew-card .row { display: flex; gap: 8px; }
  .addnew-card input, .addnew-card select { flex: 1; min-width: 0; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 12px; background: #fff; font-weight: 800; font-size: 13px; color: var(--text); }
  .addnew-cats { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; max-height: 120px; overflow-y: auto; }
  .addnew-cats .filter-chip { margin: 0; }
  .rv-row { display: flex; align-items: center; gap: 9px; background: #fff; border: 1.5px solid var(--border); border-radius: 14px; padding: 9px 11px; margin-bottom: 7px; animation: popIn .2s ease-out; }
  .pq-row { flex-direction: column; align-items: stretch; gap: 8px; }
  .pq-top { display: flex; align-items: center; gap: 8px; }
  .pq-top .rv-name { flex: 1; }
  .pq-details { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 800; padding: 5px 11px; border-radius: 999px; border: 1.5px solid; flex-shrink: 0; }
  .pq-details .pq-chev { display: inline-block; font-size: 10px; transition: transform .3s; }
  .pq-details.open .pq-chev { transform: rotate(180deg); }
  .pq-qty { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .35s cubic-bezier(.22,1,.36,1), opacity .3s; }
  .pq-qty.open { grid-template-rows: 1fr; opacity: 1; }
  .pq-qty-in { overflow: hidden; min-height: 0; }
  .pq-qty-in-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; background: var(--bg); border-radius: 12px; padding: 8px 10px; }
  .pq-lbl { font-size: 12px; font-weight: 800; color: var(--text-sec); }
  .pq-chip { padding: 6px 16px; border-radius: 999px; background: #fff; border: 1.5px solid var(--border); font-size: 12.5px; font-weight: 800; color: var(--text-sec); }
  .pq-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(124,58,237,.3); }
  .pq-ctl { display: flex; align-items: center; gap: 6px; }
  .pq-ctl b { min-width: 26px; text-align: center; font-size: 14px; font-weight: 900; }
  .pq-step { width: 30px; height: 30px; border-radius: 10px; background: #fff; border: 1.5px solid var(--primary); color: var(--primary-dark); font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .pq-step:active { background: var(--primary-light); }
  .pq-sel { border: 1.5px solid var(--border); border-radius: 10px; padding: 7px 8px; font-size: 12px; font-weight: 800; background: #fff; color: var(--text); max-width: 96px; }
  .pq-drop { position: relative; }
  .pq-drop-btn { display: flex; align-items: center; gap: 5px; background: #fff; border: 1.5px solid var(--border); border-radius: 10px; padding: 5px 6px 5px 10px; font-size: 12px; font-weight: 800; color: var(--text); min-height: 32px; }
  .pq-chev { font-size: 17px; font-weight: 900; color: var(--primary); line-height: 1; transform: rotate(-90deg); transition: transform .2s; display: inline-block; }
  .pq-drop.open .pq-chev { transform: rotate(90deg); }
  .pq-drop.open .pq-drop-btn { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124,58,237,.12); }
  .pq-menu { position: absolute; bottom: calc(100% + 6px); right: 0; background: #fff; border: 1.5px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 4px; min-width: 112px; z-index: 50; animation: menuPop .22s cubic-bezier(.22,1,.36,1); transform-origin: bottom right; }
  @keyframes menuPop { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: none; } }
  .pq-menu button { display: flex; width: 100%; align-items: center; justify-content: center; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 800; color: var(--text); }
  .pq-menu button:active { background: var(--primary-light); }
  .pq-menu button.sel { color: var(--primary-dark); background: var(--primary-light); }
  /* ===== Pro pick section: depts + product rows ===== */
  .pick-depts { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px !important; scrollbar-width: thin; }
  .pick-depts::-webkit-scrollbar { height: 4px; }
  .pick-depts::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  .pick-depts .filter-chip { flex-shrink: 0; margin: 0; box-shadow: var(--shadow-sm); }
  .pick-list-card { background: #fff; border: 1.5px solid var(--border); border-radius: 16px; padding: 5px; max-height: 272px; overflow-y: auto; box-shadow: var(--shadow-sm); scrollbar-width: thin; }
  .pick-list-card::-webkit-scrollbar { width: 5px; }
  .pick-list-card::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  .pick-list-card .help-text { text-align: center; padding: 14px 8px; }
  .pick-list-card .sug-row { min-height: 50px; padding: 7px 10px; border-radius: 0; gap: 10px; transition: background .15s; }
  .pick-list-card .sug-row + .sug-row { border-top: 1px solid var(--border); margin-top: 0; }
  .pick-list-card .sug-row:hover { background: var(--bg); }
  .pick-list-card .sug-row:active { background: var(--primary-light); }
  .pick-list-card .sug-ico { width: 38px; height: 38px; border-radius: 12px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.7), 0 3px 8px rgba(0,0,0,.06); }
  .pick-list-card .sug-ico svg { width: 20px; height: 20px; }
  .pick-list-card .sug-name { font-size: 14px; }
  .pick-list-card .sug-cat { background: var(--bg); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; font-size: 10.5px; }
  .pick-list-card .addnew-card { margin: 6px 2px 2px; }
  .pick-sub-head { position: sticky; top: -5px; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; padding: 9px 10px 7px; font-size: 13px; font-weight: 900; color: var(--primary-dark); }
  .pick-sub-head .cnt { font-size: 10.5px; font-weight: 800; color: var(--text-sec); background: var(--bg); border: 1px solid var(--border); padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .pick-sub-head.sub { color: var(--text); font-size: 12.5px; }
  .pick-sub-head.sub:not(:first-child) { margin-top: 4px; border-top: 1px solid var(--border); }
  .pick-depts .chip-cnt { font-size: 10.5px; font-weight: 900; background: rgba(124,58,237,.12); color: var(--primary-dark); padding: 1px 8px; border-radius: 999px; }
  .pick-depts .filter-chip.active .chip-cnt { background: rgba(255,255,255,.28); color: #fff; }
  .fin-cats { display: flex; flex-wrap: wrap; gap: 6px; }
  .fin-cats .filter-chip { margin: 0; }
  /* ===== Finance pro redesign ===== */
  .fin-hero { margin: 0 20px 14px; background: var(--grad); border-radius: 24px; padding: 18px; color: #fff; position: relative; overflow: hidden; box-shadow: 0 16px 36px rgba(124,58,237,.32); animation: popIn .4s ease-out; }
  .fin-hero::before, .fin-hero::after { content: ''; position: absolute; border-radius: 50%; background: rgba(255,255,255,.14); }
  .fin-hero::before { width: 170px; height: 170px; left: -50px; top: -70px; }
  .fin-hero::after { width: 110px; height: 110px; right: -30px; bottom: -50px; }
  .fin-hero-head { position: relative; z-index: 1; font-size: 12.5px; font-weight: 800; opacity: .9; }
  .fin-hero-net { position: relative; z-index: 1; text-align: center; margin: 6px 0 12px; }
  .fin-hero-net small { display: block; font-size: 11.5px; font-weight: 700; opacity: .85; }
  .fin-hero-net b { font-size: 30px; font-weight: 900; letter-spacing: -.3px; }
  .fin-hero-cols { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .fin-hero-cols > div { background: rgba(255,255,255,.16); border-radius: 16px; padding: 10px 6px; text-align: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
  .fin-hero-cols small { display: block; font-size: 10.5px; font-weight: 800; opacity: .9; margin-bottom: 2px; }
  .fin-hero-cols b { font-size: 14px; font-weight: 900; }
  .fin-pill { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 900; padding: 2px 9px; border-radius: 999px; }
  .fin-seg { display: flex; background: var(--bg); border: 1.5px solid var(--border); border-radius: 16px; padding: 4px; gap: 4px; }
  .fin-seg button { flex: 1; padding: 11px 4px; border-radius: 12px; font-size: 13px; font-weight: 800; color: var(--text-sec); transition: all .18s; }
  .fin-seg button.active { background: #fff; color: var(--text); box-shadow: var(--shadow-sm); }
  .fin-seg button:active { transform: scale(.96); }
  .finm-hero { display: flex; gap: 12px; align-items: center; border-radius: 22px; padding: 16px 15px; color: #fff; margin-bottom: 12px; position: relative; overflow: hidden; box-shadow: 0 14px 30px rgba(0,0,0,.18); transition: background .25s; }
  .finm-hero.kind-expense { background: linear-gradient(135deg,#FB7185,#F43F5E 60%,#BE123C); box-shadow: 0 14px 30px rgba(244,63,94,.35); }
  .finm-hero.kind-income { background: linear-gradient(135deg,#34D399,#10B981 60%,#047857); box-shadow: 0 14px 30px rgba(16,185,129,.35); }
  .finm-hero.kind-debt { background: linear-gradient(135deg,#FBBF24,#F59E0B 60%,#B45309); box-shadow: 0 14px 30px rgba(245,158,11,.35); }
  .finm-hero::before, .finm-hero::after { content: ''; position: absolute; border-radius: 50%; background: rgba(255,255,255,.14); }
  .finm-hero::before { width: 130px; height: 130px; left: -40px; top: -60px; }
  .finm-hero::after { width: 90px; height: 90px; right: 30px; bottom: -55px; }
  .finm-ico { width: 54px; height: 54px; border-radius: 17px; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; font-size: 27px; flex-shrink: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.4); position: relative; z-index: 1; }
  .finm-hero h2 { font-size: 20px; font-weight: 900; position: relative; z-index: 1; }
  .finm-hero p { font-size: 12.5px; opacity: .93; font-weight: 700; position: relative; z-index: 1; }
  .finm-kinds { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .finm-kind { background: #fff; border: 1.5px solid var(--border); border-radius: 16px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: all .18s; box-shadow: var(--shadow-sm); }
  .finm-kind:active { transform: scale(.95); }
  .finm-kind .k-ico { width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .finm-kind[data-finkind="expense"] .k-ico { background: #FFE4E6; }
  .finm-kind[data-finkind="income"] .k-ico { background: #DCFCE7; }
  .finm-kind[data-finkind="debt"] .k-ico { background: #FEF3C7; }
  .fin-ctl-card { background: #fff; border: 1.5px solid var(--border); border-radius: 20px; padding: 12px; margin-bottom: 10px; box-shadow: var(--shadow-sm); }
  .fin-ctl-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .fin-ctl-add { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--grad); color: #fff; font-weight: 900; font-size: 14px; padding: 13px; border-radius: 15px; text-decoration: none; box-shadow: 0 10px 22px rgba(124,58,237,.35), inset 0 1px 0 rgba(255,255,255,.35); transition: transform .15s; }
  .fin-ctl-add:active { transform: scale(.97); }
  .fin-ctl-add .plus { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; }
  .fin-ctl-count { min-width: 74px; text-align: center; background: var(--bg); border: 1.5px solid var(--border); border-radius: 15px; padding: 9px 10px; }
  .fin-ctl-count b { display: block; font-size: 17px; font-weight: 900; }
  .fin-ctl-count small { display: block; font-size: 10px; font-weight: 800; color: var(--text-muted); }
  .fin-ctl-seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 15px; padding: 5px; }
  .fin-ctl-seg button { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 10px 4px; border-radius: 11px; font-size: 12.5px; font-weight: 900; color: var(--text-sec); transition: all .18s; }
  .fin-ctl-seg button:active { transform: scale(.95); }
  .fin-ctl-seg button .n { font-size: 10.5px; font-weight: 900; background: rgba(0,0,0,.07); padding: 1px 8px; border-radius: 999px; }
  .fin-ctl-seg button[data-expkind="expense"].active { background: linear-gradient(135deg,#FB7185,#F43F5E); color: #fff; box-shadow: 0 6px 14px rgba(244,63,94,.35); }
  .fin-ctl-seg button[data-expkind="income"].active { background: linear-gradient(135deg,#34D399,#059669); color: #fff; box-shadow: 0 6px 14px rgba(16,185,129,.35); }
  .fin-ctl-seg button[data-expkind="debt"].active { background: linear-gradient(135deg,#FBBF24,#D97706); color: #fff; box-shadow: 0 6px 14px rgba(245,158,11,.35); }
  .fin-ctl-seg button.active .n { background: rgba(255,255,255,.28); }
  .finm-kind b { font-size: 12.5px; font-weight: 900; }
  .finm-kind small { font-size: 10px; color: var(--text-muted); font-weight: 700; }
  .finm-kind[data-finkind="expense"].active { border-color: #F43F5E; background: #FFF1F2; box-shadow: 0 8px 18px rgba(244,63,94,.22); }
  .finm-kind[data-finkind="income"].active { border-color: #10B981; background: #ECFDF5; box-shadow: 0 8px 18px rgba(16,185,129,.22); }
  .finm-kind[data-finkind="debt"].active { border-color: #F59E0B; background: #FFFBEB; box-shadow: 0 8px 18px rgba(245,158,11,.22); }
  .finm-body { animation: fadePage .3s ease-out; }
  .finm-field { background: #fff; border: 1.5px solid var(--border); border-radius: 16px; padding: 10px 12px 12px; margin-bottom: 10px; box-shadow: var(--shadow-sm); }
  .finm-field > label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; margin-bottom: 8px; }
  .finm-field > label i { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-style: normal; flex-shrink: 0; }
  .finm-field input, .finm-field textarea { width: 100%; border: none; background: var(--bg); border-radius: 12px; padding: 12px 13px; font-weight: 800; font-size: 14px; color: var(--text); }
  .finm-field input:focus, .finm-field textarea:focus { outline: none; background: #fff; box-shadow: 0 0 0 2px var(--fin-accent, var(--primary)); }

  .finm-field textarea { resize: vertical; min-height: 56px; }

  function handlePhotoUpload(type, file) {
    if (!file || !file.type.startsWith('image/')) { toast('اختر صورة صحيحة', 'error'); return; }
    const img = new Image();
    const rd = new FileReader();
    rd.onload = () => {
      img.onload = () => {
        const max = 256;
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        if (!state.photos) state.photos = { mom: '', dad: '' };
        state.photos[type] = c.toDataURL('image/jpeg', .82);
        persist(); render();
        toast(type === 'mom' ? 'تم حفظ صورة الأم' : 'تم حفظ صورة الأب', 'success');
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  }

    return Promise.resolve(fallbackCopy(text));
  }
  function fallbackCopy(text) { try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); return true; } catch { return false; } }
  function shareHomeCode(code, name) {
    const text = `تعالى ا joining بيتنا 🏠\nكود הבית: ${code}`;
    if (navigator.share) return navigator.share({ title: 'ناقصنا ايه', text }).then(() => true).catch(() => false);
    return copyToClipboard(text).then(ok => { toast(ok ? 'تم نسخ الكود ✓' : 'مقدرش أنسخ', ok ? 'success' : 'error'); return ok; });
  }
  function openModal(html, opts) {
    opts = opts || {};
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `<div class="modal ${opts.classes || ''}" role="dialog">${html}</div>`;
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop && opts.dismissible !== false) closeModal(backdrop); });
    setTimeout(() => { const f = backdrop.querySelector('input, select, textarea'); if (f) f.focus(); }, 50);
    backdrop._close = () => closeModal(backdrop);
    backdrop._node = backdrop.querySelector('.modal');
    return backdrop;
  }
  function closeModal(b) { stopVoice(); const n = b._node || b.querySelector('.modal'); if (n) { n.style.animation = 'toastOut .15s ease-in forwards'; setTimeout(() => b.remove(), 150); } else b.remove(); }
  function confirmDialog({ title, message, confirmText, cancelText, danger }) {
    return new Promise((resolve) => {
      const iconBg = danger ? 'var(--danger-light)' : 'var(--primary-light)';
      const iconColor = danger ? 'var(--danger)' : 'var(--primary)';
      const okIcon = danger ? svgIcon('trash', 17) : '';
      const html = `<div class="confirm-dialog">
        <div class="confirm-icon" style="background:${iconBg};color:${iconColor};">${svgIcon(danger ? 'warn' : 'help', 30)}</div>
        <h3>${title}</h3><p>${message}</p>
        <div class="confirm-buttons">
          <button class="btn" id="cancelBtn">${cancelText || 'لا'}</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="okBtn">${okIcon}${confirmText || 'تمام'}</button>
        </div></div>`;
      const m = openModal(html, { dismissible: false });
      m.querySelector('#cancelBtn').onclick = () => { closeModal(m); resolve(false); };
      m.querySelector('#okBtn').onclick = () => { closeModal(m); resolve(true); };
    });
  }
  function promptDialog({ title, message, confirmText, cancelText, initial }) {
    return new Promise((resolve) => {
      const html = `<div class="confirm-dialog">
        <div class="confirm-icon" style="background:var(--primary-light);color:var(--primary);;">${svgIcon('pencil', 26)}</div>
        <h3>${title}</h3><p>${message || ''}</p>
        <div class="field" style="margin:0 0 4px;"><input type="text" id="promptInput" maxlength="40" value="${escapeHTML(initial || '')}" placeholder="اكتب هنا..." /></div>
        <div class="confirm-buttons">
          <button class="btn" id="cancelBtn">${cancelText || 'رجوع'}</button>
          <button class="btn btn-primary" id="okBtn">${confirmText || 'تمام'}</button>
        </div></div>`;
      const m = openModal(html, { dismissible: false });
      const inp = m.querySelector('#promptInput');
      setTimeout(() => { try { inp.focus(); inp.select(); } catch {} }, 60);
      m.querySelector('#cancelBtn').onclick = () => { closeModal(m); resolve(null); };
      m.querySelector('#okBtn').onclick = () => { const v = inp.value.trim(); closeModal(m); resolve(v || null); };
    });
  }

  function renderDonut(breakdown, total) {
    const entries = Object.keys(breakdown).map(id => ({ id, name: getCategoryName(id), color: catColor(id), value: breakdown[id] || 0 })).filter(e => e.value > 0);
    if (!entries.length) return `<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px;">مفيش بيانات الشهر ده</div>`;
    let cumulative = 0;
    const segments = entries.map(e => { const start = (cumulative / total) * 360; cumulative += e.value; const end = (cumulative / total) * 360; return { ...e, start, end, pct: total ? (e.value / total * 100) : 0 }; });
    const R = 68, CX = 70, CY = 70;
    const arcPath = (start, end) => { if (end - start >= 359.99) return `M ${CX} ${CY - R} A ${R} ${R} 0 1 1 ${CX - 0.001} ${CY - R} Z`; const s = polar(CX, CY, R, start - 90), e = polar(CX, CY, R, end - 90); return `M ${CX} ${CY} L ${s.x} ${s.y} A ${R} ${R} 0 ${(end - start) > 180 ? 1 : 0} 1 ${e.x} ${e.y} Z`; };
    return `<div class="donut-wrap"><svg viewBox="0 0 140 140" width="140" height="140">${segments.map(s => `<path d="${arcPath(s.start, s.end)}" fill="${s.color}"/>`).join('')}</svg><div class="donut-legend">${segments.map(s => `<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span><span>${s.name}</span><span class="legend-pct">${s.pct.toFixed(0)}%</span></div>`).join('')}</div></div>`;
  }
  function polar(cx, cy, r, deg) { const rad = deg * Math.PI / 180; return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) }; }
  function renderBarChart(days) {
    const max = Math.max(1, ...days.map(d => d.total)); const maxIdx = days.reduce((iMax, d, i, arr) => d.total > arr[iMax].total ? i : iMax, 0);
    return `<div class="barchart">${days.map((d, i) => { const h = (d.total / max) * 100; return `<div class="bar-item"><div class="bar-fill" style="height:${Math.max(h, 2)}%"></div><div class="bar-label">${d.label}</div></div>`; }).join('')}</div>`;
  }
  function renderBarChartSparse(days) {
    const sampled = []; const step = days.length > 16 ? 3 : days.length > 10 ? 2 : 1;
    for (let i = 0; i < days.length; i += step) sampled.push(days[i]);
    const max = Math.max(1, ...sampled.map(d => d.total));
    return `<div class="barchart" style="height:110px;">${sampled.map(d => { const h = (d.total / max) * 100; return `<div class="bar-item"><div class="bar-fill" style="height:${Math.max(h, 2)}%"></div><div class="bar-label">${d.label}</div></div>`; }).join('')}</div>`;
  }

  function showContextMenuAt(x, y, orderId) {
    closeContextMenu();

    const purchased = o.status === 'purchased';
    const back = document.createElement('div'); back.className = 'ctx-backdrop'; back.id = 'ctxBackdrop';
    const menu = document.createElement('div'); menu.className = 'context-menu'; menu.id = 'activeContextMenu';
    const isUrg = !purchased && (o.priority === 'high' || o.urgent);
    let items = '';
    if (!purchased) items += `<button class="context-menu-item buy" data-ctx-buy="${orderId}"><span class="ctx-icon" style="color:var(--success);">${svgIcon('check', 18)}</span><span>جبتها يا بطل</span></button>`;

    menu.innerHTML = items;
    document.body.appendChild(back);
    document.body.appendChild(menu);
    const rect = menu.getBoundingClientRect();
    if (x + rect.width > window.innerWidth - 10) x = window.innerWidth - rect.width - 10;
    if (y + rect.height > window.innerHeight - 10) y = window.innerHeight - rect.height - 10;
    if (x < 10) x = 10; if (y < 10) y = 10;
    menu.style.left = x + 'px'; menu.style.top = y + 'px';
    back.addEventListener('click', closeContextMenu);
    back.addEventListener('touchend', (ev) => { ev.preventDefault(); closeContextMenu(); });
    let acted = false;

  function deleteCatItemFull(key) {

  function moveCatItem(deptId, subName, ar, dir) {

    { id: 'w_2', text: 'الطلبات اتسجلت بنجاح.. جهزي بقى للإجابة على سؤال: هو البقدونس لونه إيه وشكله إيه؟ 🌿🤣', target: 'wife', audio_id: 'funny_04', is_active: true, usage_count: 0 },
    { id: 'w_3', text: 'قائمة محترمة! يا رب يفتكر العيش السخن وينسى يرن يسألك الجبنة في أنهي رف 🧀🤭', target: 'wife', audio_id: 'surprise_02', is_active: true, usage_count: 0 },
    { id: 'w_4', text: 'رسالة سيستم: لو جاب نص الطلبات صح اعتبريه إنجاز تاريخي وكافئيه! 🏆👏', target: 'wife', audio_id: 'success_02', is_active: true, usage_count: 0 },
    { id: 'w_5', text: 'تم حفظ الطلبات.. اجهزي عشان هيجيب الملوخية ناشفة بدل خضرا وهيقولك هي دي بالظبط! 🥬😂', target: 'wife', audio_id: 'funny_05', is_active: true, usage_count: 0 },
    { id: 'c_1', text: 'طلب البيت تم بحمد الله.. نتمنى تنتهي الرحلة بسلام وبدون مكالمات طوارئ في السوبرماركت! 🛒❤️', target: 'couple', audio_id: 'success_03', is_active: true, usage_count: 0 },
    { id: 'c_2', text: 'البيت اللي فيه طلبات كتير.. فيه خير كتير وفيه زوج بيلف حولين نفسه! 🏠😄', target: 'couple', audio_id: 'funny_06', is_active: true, usage_count: 0 },
    { id: 'c_3', text: 'التسوق الزوجي السعيد: قائمة واضحة، فلوس جاهزة، ونفس راضية! 🤝✨', target: 'couple', audio_id: 'new_message_01', is_active: true, usage_count: 0 },
    { id: 'c_4', text: 'تم الانتهاء من كتابة الطلبات! المحفظة تبكي الآن في صمت ولكن الحب ينتصر! 💸❤️', target: 'couple', audio_id: 'failure_02', is_active: true, usage_count: 0 }
  ];
  function lsGet(k, fb) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch { return fb; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  function getComedyPool() {
    let arr = lsGet('naqisna_comedy_messages', null);
    if (!arr || !arr.length) { arr = COUPLE_SEED.slice(); lsSet('naqisna_comedy_messages', arr); }
    return arr.filter(m => m && m.is_active !== false && m.text);
  }
  function comedyForRole(role) {
    const pool = getComedyPool();
    // strict classification: husband -> husband+couple | wife -> wife+couple | unknown -> couple only
    const mine = pool.filter(m => role === 'husband' ? (m.target === 'husband' || m.target === 'couple') : role === 'wife' ? (m.target === 'wife' || m.target === 'couple') : (m.target === 'couple'));
    return mine.length ? mine : pool.filter(m => m.target === 'couple');
  }
  function pickComedy(role) {
    const pool = comedyForRole(role);
    if (!pool.length) return null;
    const lastId = lsGet('naqisna_last_joke', {}).__last || '';
    let pick = pool[Math.floor(Math.random() * pool.length)];
    if (pool.length > 1 && pick.id === lastId) pick = pool[(pool.findIndex(x => x.id === pick.id) + 1) % pool.length];
    return pick;
  }
  function bumpJokeUsage(id) {
    try {
      const arr = lsGet('naqisna_comedy_messages', []);
      const m = arr.find(x => x.id === id);
      if (m) { m.usage_count = (m.usage_count || 0) + 1; lsSet('naqisna_comedy_messages', arr); }
      if (db) db.collection('comedy_messages').doc(id).set({ usage_count: (m?.usage_count || 1) }, { merge: true }).catch(() => {});
    } catch {}
  }
  function logActivity(entry) {
    try {
      const arr = lsGet('naqisna_activities_log', []);
      arr.unshift({ id: 'act_' + uid(), time: Date.now(), ...entry });
      lsSet('naqisna_activities_log', arr.slice(0, 60));
    } catch {}
  }
  function syncUserToAdminDir() {
    try {
      if (!state.user) return;
      const list = lsGet('naqisna_users_list', []);
      const ordersCount = (state.orders || []).filter(o => o.status !== 'purchased' || true).length;
      const rec = {
        id: state.user.id, name: state.user.name || (state.user.role === 'wife' ? 'الزوجة' : 'الزوج'),
        role: state.user.role || 'husband', whatsapp: state.user.whatsapp || '',
        ordersCount, activitiesCount: Math.min(99, 2 + (state.orders || []).length + (state.expenses || []).length),
        joinedAt: state.user.joinedAt || nowISO(), lastSeen: Date.now(), homeCode: state.home?.code || ''
      };
      const i = list.findIndex(u => u.id === rec.id);
      if (i >= 0) list[i] = { ...list[i], ...rec };
      else list.push(rec);
      lsSet('naqisna_users_list', list);
      lsSet('naqisna_user', { id: rec.id, name: rec.name, role: rec.role, whatsapp: rec.whatsapp, joinedAt: rec.joinedAt });
      if (db) db.collection('users').doc(rec.id).set(rec, { merge: true }).catch(() => {});
    } catch {}
  }
  function getActiveAds() {
    const ads = lsGet('naqisna_ads', []);
    return (ads || []).filter(a => a && a.is_active && a.image);
  }
  function adBannerHTML(ad) {
    const img = String(ad.image || '');
    const inner = `<img src="${escapeHTML(img)}" alt="${escapeHTML(ad.title || 'إعلان')}" loading="lazy" onerror="this.closest('.ad-banner').style.display='none'" />`;
    const cap = `<div class="ad-cap"><span>📢 ${escapeHTML(ad.title || 'إعلان')}</span><small>إعلان</small></div>`;
    if (ad.link) return `<div class="ad-banner"><a href="${escapeHTML(ad.link)}" target="_blank" rel="noopener">${inner}</a>${cap}</div>`;
    return `<div class="ad-banner">${inner}${cap}</div>`;
  }
  function adsByPosition(pos) { return getActiveAds().filter(a => (a.position || 'top') === pos).map(adBannerHTML).join(''); }
  function buildOrderWaText(joke) {
    const pend = (state.orders || []).filter(o => o.status === 'pending');
    const lines = pend.slice(0, 30).map((o, i) => `${i + 1}. ${o.name}${o.qty?.v ? ` (${o.qty.v} ${o.qty.u || ''})` : ''}`);
    const who = state.user?.role === 'wife' ? 'الزوجة 👩' : 'الزوج 👨';
    return `🛒 *قائمة طلبات البيت (${state.home?.name || 'بيتنا'})*\n👤 بواسطة: ${state.user?.name || ''} (${who})\n━━━━━━━━━━\n${lines.length ? lines.join('\n') : 'لا توجد طلبات معلقة'}\n━━━━━━━━━━\n😂 ${joke?.text || ''}\n\nتم الإرسال من تطبيق ناقصنا إيه 🏠`;
  }
  function openFinishOrdersFlow() {
    const pend = (state.orders || []).filter(o => o.status === 'pending');
    if (!pend.length) { toast('مفيش طلبات معلقة عشان ننهيها 😄', 'warning'); return; }
    try { window.Character && Character.notify('SEND', {}); } catch {}
    const role = state.user?.role || 'husband';
    const joke = pickComedy(role);
    if (joke) {
      try { bumpJokeUsage(joke.id); } catch {}
      try { logActivity({ user: (state.user?.name || '') + (role === 'wife' ? ' (الزوجة)' : ' (الزوج)'), type: 'order_complete', text: 'أنهى كتابة قائمة الطلبات 🛒' }); } catch {}
      try { logActivity({ user: 'النظام', type: 'joke_served', text: 'عرض نكتة: ' + String(joke.text).slice(0, 40) + '... 😂' }); } catch {}
      // play linked funny sound
      try {
        if (joke.audio_id) {
          const lib = lsGet('naqisna_audio_items', []);
          const au = lib.find(a => a.id === joke.audio_id);
          if (au?.file) { const x = new Audio(); x.src = au.file; x.play().catch(() => {}); }
          else MemeSound.playEvent('TASK_COMPLETED', { force: true });
        } else MemeSound.playEvent('TASK_COMPLETED', { force: true });
      } catch {}
      try { syncUserToAdminDir(); } catch {}
    }
    const badge = !joke ? '' : joke.target === 'husband' ? '<span class="joke-badge husband">👨 رسالة للزوج فقط</span>' : joke.target === 'wife' ? '<span class="joke-badge wife">👩 رسالة للزوجة فقط</span>' : '<span class="joke-badge couple">💑 رسالة النظام للزوجين</span>';
    const waNum = normalizeEgyptPhone(state.user?.whatsapp || '');
    const waIntl = waNum.startsWith('01') ? '2' + waNum : waNum;
    const waUrl = `https://wa.me/${waIntl}?text=${encodeURIComponent(buildOrderWaText(joke))}`;
    const m = openModal(`
      <div class="modal-handle"></div>
      <div class="m-hero"><span class="m-hero-ico">📱</span><div class="m-hero-txt"><h2>القائمة جاهزة للإرسال</h2><p>${pend.length} طلبات • ابعتها واتساب في ضغطة واحدة</p></div></div>
      <div class="joke-modal-card">
        ${badge}
        <div class="joke-text-box">${escapeHTML(joke?.text || 'القائمة جاهزة... ربنا يقوي قلبه 😂❤️')}</div>
        <div class="help-text" style="margin-bottom:12px;">🔊 اشتغل صوت مضحك تلقائياً • الرسالة دي مخصصة لـ ${role === 'wife' ? 'الزوجة 👩' : 'الزوج 👨'} حسب اختيارك أول مرة</div>
      </div>
      <div class="btn-group">
        <a class="btn btn-success" id="sendWaAuto" href="${waUrl}" target="_blank" rel="noopener">📱 إرسال فقط</a>
        <button class="btn" id="jokeAgain">🎭 نكتة تانية على مقاسك</button>
        <button class="btn btn-primary" id="jokeClose">تمام، قفل 😄</button>
      </div>`);
    m.querySelector('#jokeClose').onclick = () => closeModal(m);
    m.querySelector('#sendWaAuto').onclick = () => { toast('اتفتح واتساب بالرسالة التلقائية 📱', 'success'); };
    m.querySelector('#jokeAgain').onclick = () => { closeModal(m); setTimeout(openFinishOrdersFlow, 150); };
  }
  window.openFinishOrdersFlow = openFinishOrdersFlow;

  /* =============================
     INIT
     ============================= */
  function init() {
    restore();
    // migrate old accounts: keep them logged but force profile completion once
    try {
      if (state.initialized && state.home && state.user && (!state.user.role || !state.user.whatsapp)) {
        state._pendingRole = state.user.role || '';
        state._onboardingStep = 'username';
      } else if (state.initialized && state.home && state.user) state._onboardingStep = null;
      else if (!state.home || !state.user) state._onboardingStep = 'welcome';
    } catch {
      if (state.initialized && state.home && state.user) state._onboardingStep = null;
      else if (!state.home || !state.user) state._onboardingStep = 'welcome';
    }
    if (state.currentTab === 'notifs') state.currentTab = 'orders';
    render();
    attachCloud();
    try { migrateAudioSettings(); } catch {}
    try { AudioManager.loadLibrary(); } catch {}
    try {
      if ('serviceWorker' in navigator) {
        const upd = () => { try { navigator.serviceWorker.ready.then(r => r.update().catch(() => {})).catch(() => {}); } catch {} };
        try {
          let lastUpd = 0;
          try { lastUpd = Number(localStorage.getItem('naqisna_swupd') || 0); } catch {}
          document.addEventListener('visibilitychange', () => {
            if (!document.hidden && Date.now() - lastUpd > 3600000) {
              lastUpd = Date.now();
              try { localStorage.setItem('naqisna_swupd', String(lastUpd)); } catch {}
              upd();
            }
          });
        } catch {}
        setInterval(upd, 6 * 3600 * 1000);
        navigator.serviceWorker.ready.then(reg => {
          try {
            reg.addEventListener('updatefound', () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed' && navigator.serviceWorker.controller && reg.waiting) {
                  try { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch {}
                }
              });
            });
          } catch {}
        }).catch(() => {});
        let ccTold = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (ccTold) return; ccTold = true;
          toast('نزل تحديث جديد للتطبيق — حدّث الصفحة', 'info');
        });
      }
    } catch {}
    const poll = () => { if (!state.initialized || !state.home || !state.user) { bindOnboarding(); requestAnimationFrame(() => setTimeout(poll, 400)); } };
    if (!state.initialized || !state.user) poll();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  setInterval(() => { if (!state.initialized || !state.home || !state.user) bindOnboarding(); }, 150);
})();
</script>
<script src="character.js"></script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
