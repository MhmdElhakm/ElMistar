  function handlePhotoUpload(type, file) {
    if (!file || !file.type.startsWith('image/')) { toast('اختر صورة صحيحة', 'error'); return; }
    const img = new Image();
    const rd = new FileReader();
    rd.onload = () => {
      img.onload = () => {
        const max = 256;
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        if (!state.photos) state.photos = { mom: '', dad: '' };
        state.photos[type] = c.toDataURL('image/jpeg', .82);
        persist(); render();
        toast(type === 'mom' ? 'تم حفظ صورة الأم' : 'تم حفظ صورة الأب', 'success');
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  }

  function openModal(html, opts) {
    opts = opts || {};
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `<div class="modal ${opts.classes || ''}" role="dialog">${html}</div>`;
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop && opts.dismissible !== false) closeModal(backdrop); });
    setTimeout(() => { const f = backdrop.querySelector('input, select, textarea'); if (f) f.focus(); }, 50);
    backdrop._close = () => closeModal(backdrop);
    backdrop._node = backdrop.querySelector('.modal');
    return backdrop;
  }
  function closeModal(b) { const n = b._node || b.querySelector('.modal'); if (n) { n.style.animation = 'toastOut .15s ease-in forwards'; setTimeout(() => b.remove(), 150); } else b.remove(); }
  function confirmDialog({ title, message, confirmText, cancelText, danger }) {
    return new Promise((resolve) => {
      const iconBg = danger ? 'var(--danger-light)' : 'var(--primary-light)';
      const iconColor = danger ? 'var(--danger)' : 'var(--primary)';
      const okIcon = danger ? svgIcon('trash', 17) : '';
      const html = `<div class="confirm-dialog">
        <div class="confirm-icon" style="background:${iconBg};color:${iconColor};">${svgIcon(danger ? 'warn' : 'help', 30)}</div>
        <h3>${title}</h3><p>${message}</p>
        <div class="confirm-buttons">
          <button class="btn" id="cancelBtn">${cancelText || 'لا'}</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="okBtn">${okIcon}${confirmText || 'تمام'}</button>
        </div></div>`;
      const m = openModal(html, { dismissible: false });
      m.querySelector('#cancelBtn').onclick = () => { closeModal(m); resolve(false); };
      m.querySelector('#okBtn').onclick = () => { closeModal(m); resolve(true); };
    });
  }
  function promptDialog({ title, message, confirmText, cancelText, initial }) {
    return new Promise((resolve) => {
      const html = `<div class="confirm-dialog">
        <div class="confirm-icon" style="background:var(--primary-light);color:var(--primary);;">${svgIcon('pencil', 26)}</div>
        <h3>${title}</h3><p>${message || ''}</p>

          <button class="btn btn-primary" id="okBtn">${confirmText || 'تمام'}</button>
        </div></div>`;
      const m = openModal(html, { dismissible: false });
      const inp = m.querySelector('#promptInput');
      setTimeout(() => { try { inp.focus(); inp.select(); } catch {} }, 60);
      m.querySelector('#cancelBtn').onclick = () => { closeModal(m); resolve(null); };
      m.querySelector('#okBtn').onclick = () => { const v = inp.value.trim(); closeModal(m); resolve(v || null); };
    });
  }

    const loc = d.startsWith('002') ? d.slice(3) : (d.startsWith('2') && d.length === 12 ? d.slice(1) : d);
    return /^01[0-9]{9}$/.test(loc);
  }
  function normalizeEgyptPhone(v) {
    let d = String(v || '').replace(/\D/g, '');
    if (d.startsWith('002')) d = d.slice(3);

  function renderDonut(breakdown, total) {
    const entries = Object.keys(breakdown).map(id => ({ id, name: getCategoryName(id), color: catColor(id), value: breakdown[id] || 0 })).filter(e => e.value > 0);
    if (!entries.length) return `<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px;">مفيش بيانات الشهر ده</div>`;
    let cumulative = 0;
    const segments = entries.map(e => { const start = (cumulative / total) * 360; cumulative += e.value; const end = (cumulative / total) * 360; return { ...e, start, end, pct: total ? (e.value / total * 100) : 0 }; });
    const R = 68, CX = 70, CY = 70;
    const arcPath = (start, end) => { if (end - start >= 359.99) return `M ${CX} ${CY - R} A ${R} ${R} 0 1 1 ${CX - 0.001} ${CY - R} Z`; const s = polar(CX, CY, R, start - 90), e = polar(CX, CY, R, end - 90); return `M ${CX} ${CY} L ${s.x} ${s.y} A ${R} ${R} 0 ${(end - start) > 180 ? 1 : 0} 1 ${e.x} ${e.y} Z`; };
    return `<div class="donut-wrap"><svg viewBox="0 0 140 140" width="140" height="140">${segments.map(s => `<path d="${arcPath(s.start, s.end)}" fill="${s.color}"/>`).join('')}</svg><div class="donut-legend">${segments.map(s => `<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span><span>${s.name}</span><span class="legend-pct">${s.pct.toFixed(0)}%</span></div>`).join('')}</div></div>`;
  }
  function polar(cx, cy, r, deg) { const rad = deg * Math.PI / 180; return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) }; }
  function renderBarChart(days) {
    const max = Math.max(1, ...days.map(d => d.total)); const maxIdx = days.reduce((iMax, d, i, arr) => d.total > arr[iMax].total ? i : iMax, 0);
    return `<div class="barchart">${days.map((d, i) => { const h = (d.total / max) * 100; return `<div class="bar-item"><div class="bar-fill" style="height:${Math.max(h, 2)}%"></div><div class="bar-label">${d.label}</div></div>`; }).join('')}</div>`;
  }
  function renderBarChartSparse(days) {
    const sampled = []; const step = days.length > 16 ? 3 : days.length > 10 ? 2 : 1;
    for (let i = 0; i < days.length; i += step) sampled.push(days[i]);
    const max = Math.max(1, ...sampled.map(d => d.total));
    return `<div class="barchart" style="height:110px;">${sampled.map(d => { const h = (d.total / max) * 100; return `<div class="bar-item"><div class="bar-fill" style="height:${Math.max(h, 2)}%"></div><div class="bar-label">${d.label}</div></div>`; }).join('')}</div>`;
  }

  function bindOnboarding() {
    const b = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    b('goCreate', () => { state._onboardingStep = 'create'; render(); });
    b('goJoin', () => { state._onboardingStep = 'join'; render(); });
    b('backWelcome', () => { state._onboardingStep = 'welcome'; render(); });
    b('backWelcome2', () => { state._onboardingStep = 'welcome'; render(); });
    b('submitCreate', () => {
      const nameInput = document.getElementById('homeNameInput');
      const name = (nameInput.value || '').trim() || 'بيتنا';
      const code = genHomeCode();
      state._pendingName = name; state._pendingCode = code;
      state.home = { code, name, createdAt: nowISO() }; persist();
      try { initSupabaseSync(); } catch {}
      state._onboardingStep = 'created-success'; render();
    });
    b('copyCodeBtn', () => { const code = document.getElementById('codeDisplay').textContent; copyToClipboard(code).then(ok => toast(ok ? 'تم النسخ ✓' : 'مقدرش أنسخ', ok ? 'success' : 'error')); });
    b('gotoUsername', () => { state._onboardingStep = 'username'; render(); });
    b('submitJoin', async () => {
      const inp = document.getElementById('joinCodeInput'); const err = document.getElementById('joinError');
      const showErr = () => { err.classList.remove('hidden'); inp.classList.add('error'); setTimeout(() => inp.classList.remove('error'), 1500); };
      let code = inp.value.trim().toUpperCase();
      if (!/^HOME-\d{4,}$/.test(code)) code = 'HOME-' + (code.replace(/\D/g, ''));
      if (!code || code === 'HOME-') { showErr(); return; }
      const acceptJoin = (remote) => {
        state.home = remote.home;
        state._pendingCode = code; state._pendingName = remote.home.name;
        state._pendingCloud = remote;
        try {
          const mems = remote.members || [];
          const pw = remote.partnerWhatsapp || (mems.length ? mems[0].whatsapp : '') || (remote.user?.whatsapp || '');
          const pn = remote.partnerName || (mems.length ? mems[0].name : '') || (remote.user?.name || '');
          if (pw && isValidEgyptPhone(pw)) state._detectedPartner = { name: pn || '', whatsapp: normalizeEgyptPhone(pw), role: (mems.length ? mems[0].role : remote.user?.role) || '', auto: true };
          else state._detectedPartner = null;
          state._pendingPartnerWa = state._detectedPartner?.whatsapp || '';
          state._pendingPartnerName = state._detectedPartner?.name || '';
        } catch { state._detectedPartner = null; }
        state._onboardingStep = 'username'; render();
      };
      if (state.home && state.home.code && code === state.home.code) {
        state._pendingCode = code; state._pendingName = state.home.name; state._onboardingStep = 'username'; render(); return;
      }
      try {
        const raw = localStorage.getItem('baytna_home_' + code);
        if (raw) {
          const saved = JSON.parse(raw);
          if (saved && saved.home) { acceptJoin(saved); return; }
        }
      } catch {}
      // أهم إصلاح: اسحب بيانات البيت من السحابة قبل إنشاء بيت فاضي يمسح الشير
      try {
        if (window.NaqisnaSupabase && window.NaqisnaSupabase.isConfigured()) {
          inp.disabled = true;
          const remoteData = await window.NaqisnaSupabase.fetchHomeData(code);
          inp.disabled = false;
          if (remoteData && ((remoteData.orders && remoteData.orders.length) || (remoteData.expenses && remoteData.expenses.length) || remoteData.name || (remoteData.members && remoteData.members.length) || remoteData.user)) {
            acceptJoin({
              home: { code, name: remoteData.name || 'بيتنا', createdAt: nowISO() },
              orders: (remoteData.orders || []).map(normRemoteOrder).filter(Boolean),
              expenses: (remoteData.expenses || []).map(normRemoteExpense).filter(Boolean),
              orderLists: remoteData.orderLists || [],
              members: remoteData.members || (remoteData.user ? [remoteData.user] : []),
              partnerWhatsapp: remoteData.partnerWhatsapp || '',
              partnerName: remoteData.partnerName || '',
              user: remoteData.user || null,
              updatedAt: Number(remoteData.updatedAtMs) || Date.now()
            });
            return;
          }
        }
      } catch { try { inp.disabled = false; } catch {} }
      if (/^HOME-\d{4,}$/.test(code)) {
        state.home = { code, name: 'بيتنا', createdAt: nowISO() };
        state._pendingCode = code;
        state._pendingName = state.home.name;
        state._onboardingStep = 'username';
        render();
        return;
      }
      showErr();
    });
    const rh = document.getElementById('roleHusband'), rw = document.getElementById('roleWife');
    const paintRole = () => {
      if (rh) rh.className = 'role-card' + (state._pendingRole === 'husband' ? ' sel-husband' : '');
      if (rw) rw.className = 'role-card' + (state._pendingRole === 'wife' ? ' sel-wife' : '');
      const re = document.getElementById('roleError'); if (re) re.classList.add('hidden');
      try {
        const lbl = document.getElementById('partnerNameLabel');
        if (lbl) lbl.textContent = state._pendingRole === 'husband' ? '👩 اسم الزوجة' : state._pendingRole === 'wife' ? '👨 اسم الزوج' : '💑 اسم الطرف الآخر';
        const det = getDetectedPartner();
        const pWa = document.getElementById('partnerWaInput'), pNm = document.getElementById('partnerNameInput');
        if (det && det.whatsapp && pWa && !pWa.value) pWa.value = det.whatsapp;
        if (det && det.name && pNm && !pNm.value) pNm.value = det.name;
        if (det && det.role && state._pendingRole && det.role === state._pendingRole && pWa) {
          const alt = ((state._pendingCloud?.members) || []).find(m => m && m.role !== state._pendingRole && m.whatsapp);
          if (alt) { if (pWa) pWa.value = normalizeEgyptPhone(alt.whatsapp); if (pNm && !pNm.value) pNm.value = alt.name || ''; }
        }
      } catch {}
    };
    if (rh) rh.onclick = () => { state._pendingRole = 'husband'; paintRole(); };
    if (rw) rw.onclick = () => { state._pendingRole = 'wife'; paintRole(); };
    const udp = document.getElementById('useDetectedPartner');
    if (udp) udp.onclick = () => {
      try {
        const det = getDetectedPartner(); if (!det) return;
        const pWa = document.getElementById('partnerWaInput'), pNm = document.getElementById('partnerNameInput');
        if (pWa) { pWa.value = det.whatsapp; pWa.classList.remove('error'); }
        if (pNm && det.name) pNm.value = det.name;
        state._pendingPartnerWa = det.whatsapp; state._pendingPartnerName = det.name || '';
        toast('اتملى رقم الطرف الآخر تلقائي ✅', 'success');
      } catch {}
    };
    const pWaLive = document.getElementById('partnerWaInput'), pNmLive = document.getElementById('partnerNameInput');
    if (pWaLive) pWaLive.oninput = () => { state._pendingPartnerWa = pWaLive.value.trim(); const e = document.getElementById('partnerWaError'); if (e) e.classList.add('hidden'); pWaLive.classList.remove('error'); };
    if (pNmLive) pNmLive.oninput = () => { state._pendingPartnerName = pNmLive.value.trim(); };
    b('submitUsername', () => {
      const inp = document.getElementById('userNameInput'); const name = (inp.value || '').trim();
      const waInp = document.getElementById('userWaInput'); const waRaw = (waInp?.value || '').trim();
      const pNmInp = document.getElementById('partnerNameInput'); const pName = (pNmInp?.value || '').trim().slice(0, 20);
      const pWaInp = document.getElementById('partnerWaInput'); const pWaRaw = (pWaInp?.value || '').trim();
      const roleErr = document.getElementById('roleError'), waErr = document.getElementById('waError'), pWaErr = document.getElementById('partnerWaError');
      const role = state._pendingRole || state.user?.role || '';
      let ok = true;
      if (!role) { if (roleErr) roleErr.classList.remove('hidden'); ok = false; }
      if (!name) { inp.classList.add('error'); inp.focus(); ok = false; } else inp.classList.remove('error');
      if (!isValidEgyptPhone(waRaw)) { if (waErr) waErr.classList.remove('hidden'); if (waInp) { waInp.classList.add('error'); waInp.focus(); } ok = false; }
      else { if (waErr) waErr.classList.add('hidden'); if (waInp) waInp.classList.remove('error'); }
      if (pWaRaw && !isValidEgyptPhone(pWaRaw)) { if (pWaErr) pWaErr.classList.remove('hidden'); if (pWaInp) { pWaInp.classList.add('error'); pWaInp.focus(); } ok = false; }
      else { if (pWaErr) pWaErr.classList.add('hidden'); if (pWaInp) pWaInp.classList.remove('error'); }
      if (!ok) return;
      const whatsapp = normalizeEgyptPhone(waRaw);
      const prevId = state.user?.id;
      state.user = { id: prevId || uid(), name, role, whatsapp, joinedAt: state.user?.joinedAt || nowISO() };
      if (state._pendingCloud && state._pendingCloud.home) {
        const rc = state._pendingCloud;
        for (const k of ['orders', 'expenses', 'learnedMap', 'usageFreq', 'categoryColors', 'categoryNames', 'categoryIcons', 'productIcons', 'customCats', 'hiddenCats', 'photos', 'catalogCustom', 'updatedAt', 'members']) {
          if (rc[k] !== undefined) state[k] = rc[k];
        }
        state._pendingCloud = null;
      }
      if (!state.home) state.home = { code: state._pendingCode || genHomeCode(), name: state._pendingName || 'بيتنا', createdAt: nowISO() };
      const pNorm = pWaRaw ? normalizeEgyptPhone(pWaRaw) : (getDetectedPartner()?.whatsapp || '');
      const pFin = pNorm && isValidEgyptPhone(pNorm) ? pNorm : '';
      const nFin = pName || getDetectedPartner()?.name || '';
      if (pFin || nFin) savePartnerInfo(pFin, nFin);
      else { state._pendingPartnerWa = ''; state._pendingPartnerName = ''; }
      state._pendingRole = null; state._detectedPartner = null;
      state._pendingPartnerWa = null; state._pendingPartnerName = null;
      state.initialized = true; state.currentTab = 'home'; state._onboardingStep = null; persist();
      try { initSupabaseSync(); } catch {}
      try { syncUserToAdminDir(); } catch {}
      const rl = state.user.role === 'wife' ? 'يا ست الكل 👩' : 'يا بطل 👨';
      toast(`أهلاً ${rl} ${name}! 👋`, 'success'); render();

    try {
      if (state.initialized && state.user && (!state.user.role || !state.user.whatsapp)) {
        const __origRender = null;
      }
    } catch {}

  function showContextMenu(e, orderId) {
    let x, y;
    if (e.touches?.length) { x = e.touches[0].clientX; y = e.touches[0].clientY; } else { x = e.clientX; y = e.clientY; }
    showContextMenuAt(x, y, orderId);
  }
  function showContextMenuAt(x, y, orderId) {
    closeContextMenu();
    const o = state.orders.find(x => x.id === orderId); if (!o) return;
    const purchased = o.status === 'purchased';
    const back = document.createElement('div'); back.className = 'ctx-backdrop'; back.id = 'ctxBackdrop';
    const menu = document.createElement('div'); menu.className = 'context-menu'; menu.id = 'activeContextMenu';
    const isUrg = !purchased && (o.priority === 'high' || o.urgent);
    let items = '';
    if (!purchased) items += `<button class="context-menu-item buy" data-ctx-buy="${orderId}"><span class="ctx-icon" style="color:var(--success);">${svgIcon('check', 18)}</span><span>جبتها يا بطل</span></button>`;
    if (!purchased) items += `<button class="context-menu-item urg ${isUrg ? 'is-on' : ''}" data-ctx-urg="${orderId}"><span class="ctx-icon">🔥</span><span>${isUrg ? 'إلغاء الضروري' : 'اجعلها ضروري'}</span></button>`;
    items += `<button class="context-menu-item edit" data-ctx-edit="${orderId}"><span class="ctx-icon" style="color:var(--primary);">${svgIcon('pencil', 18)}</span><span>تعديل</span></button>`;
    items += `<div class="context-menu-sep"></div><button class="context-menu-item delete" data-ctx-del="${orderId}"><span class="ctx-icon">${svgIcon('trash', 18)}</span><span>خلاص بلاش دي</span></button>`;
    menu.innerHTML = items;
    document.body.appendChild(back);
    document.body.appendChild(menu);
    const rect = menu.getBoundingClientRect();
    if (x + rect.width > window.innerWidth - 10) x = window.innerWidth - rect.width - 10;
    if (y + rect.height > window.innerHeight - 10) y = window.innerHeight - rect.height - 10;
    if (x < 10) x = 10; if (y < 10) y = 10;
    menu.style.left = x + 'px'; menu.style.top = y + 'px';
    back.addEventListener('click', closeContextMenu);
    back.addEventListener('touchend', (ev) => { ev.preventDefault(); closeContextMenu(); });
    let acted = false;
    const act = (fn) => (ev) => { if (acted) return; acted = true; ev.preventDefault(); ev.stopPropagation(); closeContextMenu(); setTimeout(fn, 30); };
    menu.querySelector('[data-ctx-buy]')?.addEventListener('click', act(() => openPurchaseModal(orderId)));
    menu.querySelector('[data-ctx-buy]')?.addEventListener('touchend', act(() => openPurchaseModal(orderId)));
    const urgFn = () => {
      const ord = state.orders.find(x => x.id === orderId); if (!ord) return;
      const on = !(ord.priority === 'high' || ord.urgent);
      updateOrder(orderId, { priority: on ? 'high' : 'medium' });
      toast(on ? 'بقت ضروري 🔥' : 'رجعت عادية ✓', on ? 'warning' : 'success'); render();
    };
    menu.querySelector('[data-ctx-urg]')?.addEventListener('click', act(urgFn));
    menu.querySelector('[data-ctx-urg]')?.addEventListener('touchend', act(urgFn));
    menu.querySelector('[data-ctx-edit]')?.addEventListener('click', act(() => openEditOrderModal(orderId)));
    menu.querySelector('[data-ctx-edit]')?.addEventListener('touchend', act(() => openEditOrderModal(orderId)));
    menu.querySelector('[data-ctx-del]')?.addEventListener('click', act(() => handleDeleteOrder(orderId)));
    menu.querySelector('[data-ctx-del]')?.addEventListener('touchend', act(() => handleDeleteOrder(orderId)));
  }
  function closeContextMenu() { const m = document.getElementById('activeContextMenu'); if (m) m.remove(); const bd = document.getElementById('ctxBackdrop'); if (bd) bd.remove(); }

  function notifFire(kind, title, body) {
    let shown = false;

  function notifDayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function notifTimePassed(hhmm) { try { const p = String(hhmm || '00:00').split(':'); const h = Number(p[0]) || 0, m = Number(p[1]) || 0; const n = new Date(); return (n.getHours() * 60 + n.getMinutes()) >= (h * 60 + m); } catch { return false; } }
  function notifTick() {
    try {
      if (!state || !state.initialized) return;
      if (state._notifOn !== true) return;
      const st = notifStore(); const now = Date.now(); const tk = notifDayKey();
      const pend = (state.orders || []).filter(o => o && o.status !== 'purchased');
      if (state._notifOrders !== false && pend.length) {
        if (!st.ordTs) { st.ordTs = now; notifSave(st); }
        else if (now - st.ordTs > 6 * 3600 * 1000) {
          st.ordTs = now; notifSave(st);
          notifFire('orders', '🛒 تذكير الطلبات', pickMsg(NOTIF_ORDERS).replace('{n}', pend.length));
        }
      } else if (!pend.length && st.ordTs) { st.ordTs = now; notifSave(st); }
      if (state._notifExp !== false && notifTimePassed(state._notifExpTime || '21:00') && st.expDay !== tk) {
        const hasToday = (state.expenses || []).some(e => { try { return new Date(e.createdAt).toDateString() === new Date().toDateString(); } catch { return false; } });
        if (!hasToday) { st.expDay = tk; notifSave(st); notifFire('exp', '💸 تذكير المصروفات', pickMsg(NOTIF_EXP)); }
      }
      if (state._notifDaily !== false && notifTimePassed(state._notifDailyTime || '22:00') && st.dailyDay !== tk) {
        st.dailyDay = tk; notifSave(st);
        const list = (state.expenses || []).filter(e => { try { return new Date(e.createdAt).toDateString() === new Date().toDateString() && (e.kind || 'expense') === 'expense'; } catch { return false; } });
        const t = list.reduce((a, e) => a + (Number(e.amount) || 0), 0);
        notifFire('daily', '📊 التقرير اليومي', t > 0 ? `تقرير اليوم: صرفت ${formatCurrency(t)} ج.م في ${list.length} عمليات` : 'تقرير اليوم: مصرفتش حاجة');

  }

  function buildOrderWaText() {
    const pend = (state.orders || []).filter(o => o.status === 'pending');
    const lines = pend.slice(0, 30).map((o, i) => `${i + 1}. ${o.name}${o.qty?.v ? ` (${o.qty.v} ${o.qty.u || ''})` : ''}`);
    const who = state.user?.role === 'wife' ? 'الزوجة 👩' : 'الزوج 👨';
    return `🛒 *قائمة طلبات البيت (${state.home?.name || 'بيتنا'})*\n👤 بواسطة: ${state.user?.name || ''} (${who})\n━━━━━━━━━━\n${lines.length ? lines.join('\n') : 'لا توجد طلبات معلقة'}\n━━━━━━━━━━\n\nتم الإرسال من تطبيق ناقصنا إيه 🏠`;
  }
  function openFinishOrdersFlow() {
    const pend = (state.orders || []).filter(o => o.status === 'pending');
    if (!pend.length) { toast('مفيش طلبات معلقة عشان ننهيها', 'warning'); return; }
    const role = state.user?.role || 'husband';
    try { logActivity({ user: (state.user?.name || '') + (role === 'wife' ? ' (الزوجة)' : ' (الزوج)'), type: 'order_complete', text: 'أنهى كتابة قائمة الطلبات 🛒' }); } catch {}
    try { syncUserToAdminDir(); } catch {}
    const partner = getPartnerPhone();
    if (!partner) { sendBasketToPartner(pend); return; }
    const waUrl = `https://wa.me/${toWaIntl(partner)}?text=${encodeURIComponent(buildPartnerWaMessage(pend))}`;
    try { window.open(waUrl, '_blank'); toast('اتبعتت الرسالة واتساب 💌', 'success'); } catch {}
  }
  function normRemoteOrder(ro) {
    if (!ro) return null;
    if (ro.categoryId !== undefined || ro.listId !== undefined || (ro.name && ro.list_id === undefined)) {
      if (!ro.id || !ro.name) return null;
      return ro;
    }
    if (!ro.id || !ro.name) return null;
    return {
      id: ro.id,
      listId: ro.list_id || 'main',
      name: ro.name,
      qty: ro.qty,
      unit: ro.unit,
      categoryId: ro.category_id,
      priority: ro.priority,
      status: ro.status,
      purchased: ro.status === 'purchased',
      purchasedBy: ro.purchased_by,
      purchasedAt: ro.purchased_at,
      price: ro.price,
      notes: ro.notes,
      createdAt: ro.created_at
    };
  }
  function normRemoteExpense(re) {
    if (!re) return null;
    if (re.categoryId !== undefined || re.title !== undefined || (re.amount !== undefined && re.category_id === undefined)) {
      if (!re.id) return null;
      return re;
    }
    if (!re.id) return null;
    return {
      id: re.id,
      type: re.type,
      amount: re.amount,
      title: re.title,
      categoryId: re.category_id,
      date: re.date,
      notes: re.notes,
      paidBy: re.paid_by
    };
  }
  function mergeRemoteList(localArr, remoteArr, normFn, remoteMs) {
    const remoteMap = new Map();
    (remoteArr || []).forEach(r => { const n = normFn(r); if (n && n.id) remoteMap.set(String(n.id), n); });
    const merged = [];
    // 1) كل عناصر الريموت موجودة (إضافة + تحديث + حذف المنفذ)
    remoteMap.forEach(v => merged.push(v));
    // 2) عناصر محلية غير موجودة في الريموت: نحتفظ بها فقط لو أجدد من سنابشوت الريموت (تعديل محلي لم يُرفع بعد)
    (localArr || []).forEach(lo => {
      if (!lo || !lo.id) return;
      if (remoteMap.has(String(lo.id))) return;
      const localTs = Number(lo.updatedAt) || Number(state.updatedAt) || 0;
      if (localTs > Number(remoteMs || 0)) merged.push(lo);
      // غير ذلك: اتمسح من الطرف الآخر → لا نرجّعه (حل مشكلة إحياء المحذوفات)
    });
    return merged;
  }
  function syncSig() {
    try { return JSON.stringify([(state.orders || []).map(o => o.id + ':' + o.status + ':' + (o.updatedAt || '')), (state.expenses || []).map(e => e.id + ':' + e.amount), state.home && state.home.name]); } catch { return String(Date.now()); }
  }
  function applyRemoteData(remoteData) {
    if (!remoteData) return false;
    const rMs = Number(remoteData.updatedAtMs) || 0;
    // تجاهل صدى الكتابة الخاصة بنا: نفس الطابع الزمني ونفس المحتوى
    if (rMs && rMs <= Number(state.updatedAt || 0)) {
      const rs = JSON.stringify([(remoteData.orders || []).map(o => (o.id || '') + ':' + (o.status || ''))]);
      const ls = JSON.stringify([(state.orders || []).map(o => (o.id || '') + ':' + (o.status || ''))]);
      if (rs === ls) return false;
    }
    const before = syncSig();
    _syncLock = true;
    try {
      const hasRemoteContent = (remoteData.orders && remoteData.orders.length) || (remoteData.expenses && remoteData.expenses.length) || remoteData.name;
      const localEmpty = !(state.orders && state.orders.length) && !(state.expenses && state.expenses.length);
      if (localEmpty && hasRemoteContent) {
        // جهاز جديد بينضم بكود موجود: استبدال كامل بدون دمج يمسح السحابة
        state.orders = (remoteData.orders || []).map(normRemoteOrder).filter(Boolean);
        if (shareExpensesOn()) state.expenses = (remoteData.expenses || []).map(normRemoteExpense).filter(Boolean);
        if (Array.isArray(remoteData.orderLists)) state.orderLists = remoteData.orderLists;
        if (remoteData.name && state.home) state.home.name = remoteData.name;
        if (rMs) state.updatedAt = Math.max(Number(state.updatedAt) || 0, rMs);
      } else {
        state.orders = mergeRemoteList(state.orders, remoteData.orders, normRemoteOrder, rMs);
        if (shareExpensesOn()) state.expenses = mergeRemoteList(state.expenses, remoteData.expenses, normRemoteExpense, rMs);
        // وضع الخصوصية: المصروفات تفضل محلية ولا تُسحب من السحابة
        if (Array.isArray(remoteData.orderLists) && remoteData.orderLists.length) {
          const lm = new Map((state.orderLists || []).map(l => [String(l.id), l]));
          remoteData.orderLists.forEach(rl => { if (rl && rl.id) lm.set(String(rl.id), rl); });
          state.orderLists = Array.from(lm.values());
        }
        if (remoteData.name && state.home && !state.home.name) state.home.name = remoteData.name;
      }
      // مزامنة اسم ورقم الطرف الآخر والأعضاء للاكتشاف التلقائي
      try {
        if (remoteData.partnerWhatsapp && !state.partnerWhatsapp) {
          state.partnerWhatsapp = remoteData.partnerWhatsapp;
          if (state.home) state.home.partnerWhatsapp = remoteData.partnerWhatsapp;
          try { localStorage.setItem('naqisna_partner_wa', remoteData.partnerWhatsapp); } catch {}
        }
        if (remoteData.partnerName && !getPartnerName()) {
          state.partnerName = remoteData.partnerName;
          if (state.home) state.home.partnerName = remoteData.partnerName;
          try { localStorage.setItem('naqisna_partner_name', remoteData.partnerName); } catch {}
        }
        if (remoteData.deliveryWhatsapp && !getDeliveryInfo().phone) {
          state.deliveryWhatsapp = remoteData.deliveryWhatsapp;
          if (state.home) state.home.deliveryWhatsapp = remoteData.deliveryWhatsapp;
          try { localStorage.setItem('naqisna_delivery_wa', remoteData.deliveryWhatsapp); } catch {}
        }
        if (remoteData.deliveryName && !getDeliveryInfo().name) {
          state.deliveryName = remoteData.deliveryName;
          if (state.home) state.home.deliveryName = remoteData.deliveryName;
          try { localStorage.setItem('naqisna_delivery_name', remoteData.deliveryName); } catch {}
        }
        if (Array.isArray(remoteData.members) && remoteData.members.length) {
          if (!state.members) state.members = [];
          const mmap = new Map(state.members.map(m => [String(m.id || m.whatsapp), m]));
          remoteData.members.forEach(rm => { if (rm && (rm.id || rm.whatsapp)) mmap.set(String(rm.id || rm.whatsapp), { ...(mmap.get(String(rm.id || rm.whatsapp)) || {}), ...rm }); });
          state.members = [...mmap.values()].slice(0, 10);
          if ((!state.partnerWhatsapp || !getPartnerName()) && state.user) {
            const pm = state.members.find(m => m && m.whatsapp && String(m.id) !== String(state.user.id));
            if (pm) {
              if (!state.partnerWhatsapp) { state.partnerWhatsapp = pm.whatsapp; if (state.home) state.home.partnerWhatsapp = pm.whatsapp; }
              if (!getPartnerName() && pm.name) { state.partnerName = pm.name; if (state.home) state.home.partnerName = pm.name; }
            }
          }
        }
      } catch {}
      if (syncSig() === before && state.partnerWhatsapp) { try { Storage.save(state); } catch {} return false; }
      if (syncSig() === before) return false;
      Storage.save(state);
      try { if (state.home?.code) localStorage.setItem('baytna_home_' + state.home.code, JSON.stringify({ home: state.home, orders: state.orders, expenses: state.expenses, orderLists: state.orderLists, updatedAt: state.updatedAt })); } catch {}
    } finally { _syncLock = false; }
    return true;
  }
  let _syncSubscribed = null, _syncPoll = null;
  async function initSupabaseSync() {
    if (!window.NaqisnaSupabase || !window.NaqisnaSupabase.isConfigured() || !state.home?.code) return;
    try {
      const homeCode = state.home.code;
      // ensure row exists
      try { await window.NaqisnaSupabase.joinOrCreateHome(homeCode, state.home.name || 'بيتنا'); } catch {}
      const remoteData = await window.NaqisnaSupabase.fetchHomeData(homeCode);
      if (remoteData) {
        applyRemoteData(remoteData);
        // ادمج أي إضافات محلية لم تُرفع بعد ثم ارفع النسخة المدموجة مرة واحدة
        try { await window.NaqisnaSupabase.pushFullState(homeCode, state); } catch {}
        render();
      } else {
        // لا يوجد صف سحابي: ارفع الحالة المحلية الحالية (أول جهاز ينشئ البيت)
        if ((state.orders && state.orders.length) || (state.expenses && state.expenses.length)) {
          try { await window.NaqisnaSupabase.pushFullState(homeCode, state); } catch {}
        }
      }
      if (_syncSubscribed === homeCode) return;
      _syncSubscribed = homeCode;
      window.NaqisnaSupabase.subscribeToHomeChanges(homeCode, async () => {
        try {
          const refreshed = await window.NaqisnaSupabase.fetchHomeData(homeCode);
          if (refreshed && applyRemoteData(refreshed)) render();
        } catch {}
      });
      // fallback polling لو Realtime مقفول في المشروع
      if (_syncPoll) clearInterval(_syncPoll);
      _syncPoll = setInterval(async () => {
        try {
          if (!state.home?.code || state.home.code !== homeCode) return;
          if (document.hidden) return;
          const r = await window.NaqisnaSupabase.fetchHomeData(homeCode);
          if (r && Number(r.updatedAtMs || 0) > Number(state.updatedAt || 0)) {
            if (applyRemoteData(r)) render();
          }
        } catch {}
      }, 8000);
    } catch (e) {
      console.warn('Supabase sync init failed:', e);
    }
  }

  /* =============================
     INIT
     ============================= */
  function init() {
    restore();
    // migrate old accounts: keep them logged but force profile completion once
    try {
      if (state.initialized && state.home && state.user && (!state.user.role || !state.user.whatsapp)) {
        state._pendingRole = state.user.role || '';
        state._onboardingStep = 'username';
      } else if (state.initialized && state.home && state.user) state._onboardingStep = null;
      else if (!state.home || !state.user) state._onboardingStep = 'welcome';
    } catch {
      if (state.initialized && state.home && state.user) state._onboardingStep = null;
      else if (!state.home || !state.user) state._onboardingStep = 'welcome';
    }
    if (state.currentTab === 'notifs') state.currentTab = 'orders';
    render();
    initSupabaseSync();
    try { setInterval(notifTick, 60000); setTimeout(notifTick, 15000); } catch {}
    try {
      if ('serviceWorker' in navigator) {
        const upd = () => { try { navigator.serviceWorker.ready.then(r => r.update().catch(() => {})).catch(() => {}); } catch {} };
        try {
          let lastUpd = 0;
          try { lastUpd = Number(localStorage.getItem('naqisna_swupd') || 0); } catch {}
          document.addEventListener('visibilitychange', () => {
            if (!document.hidden && Date.now() - lastUpd > 3600000) {
              lastUpd = Date.now();
              try { localStorage.setItem('naqisna_swupd', String(lastUpd)); } catch {}
              upd();
            }
          });
        } catch {}
        setInterval(upd, 6 * 3600 * 1000);
        navigator.serviceWorker.ready.then(reg => {
          try {
            reg.addEventListener('updatefound', () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed' && navigator.serviceWorker.controller && reg.waiting) {
                  try { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch {}
                }
              });
            });
          } catch {}
        }).catch(() => {});
        let ccTold = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (ccTold) return; ccTold = true;
          toast('نزل تحديث جديد للتطبيق — حدّث الصفحة', 'info');
        });
      }
    } catch {}
    const poll = () => { if (!state.initialized || !state.home || !state.user) { bindOnboarding(); requestAnimationFrame(() => setTimeout(poll, 400)); } };
    if (!state.initialized || !state.user) poll();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  setInterval(() => { if (!state.initialized || !state.home || !state.user) bindOnboarding(); }, 150);
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
