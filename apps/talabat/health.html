<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جُرْعَةُ شِفَاء</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1524;--bg2:#0e1d31;--card:#12243a;--card2:#183049;--line:#25445f;
  --txt:#e9f2fc;--mut:#8ca6c0;--acc:#5bb8ff;--accd:#0b2a44;
  --y:#f2b84b;--yb:rgba(242,184,75,.14);--p:#ff6b9d;--pb:rgba(255,107,157,.13);--g:#4ade80;--gb:rgba(74,222,128,.12);--bb:rgba(91,184,255,.13);
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
[data-theme=light]{
  --bg:#eef4fa;--bg2:#e3edf7;--card:#ffffff;--card2:#f2f7fc;--line:#cfdeec;
  --txt:#14283d;--mut:#5f7890;--acc:#1b8be0;--accd:#ffffff;
  --y:#b97a00;--yb:rgba(242,184,75,.22);--p:#d6336c;--pb:rgba(255,107,157,.15);--g:#16a34a;--gb:rgba(74,222,128,.18);--bb:rgba(27,139,224,.12);
  --shadow:0 8px 24px rgba(30,60,100,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;color:var(--txt);min-height:100vh;
  background:radial-gradient(900px 400px at 100% -10%,var(--bg2),transparent),var(--bg);line-height:1.6}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
.app{max-width:480px;margin:0 auto;padding:16px 16px 40px;position:relative}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.date{font-size:12px;color:var(--mut)}
h1{font-size:30px;font-weight:800;color:var(--acc);line-height:1.2;margin-top:2px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px 6px;padding-inline:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--txt);white-space:nowrap;transition:.2s}
.tab.on{background:var(--acc);color:var(--accd);border-color:var(--acc);box-shadow:0 4px 14px rgba(91,184,255,.35)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--yb);border:1px solid rgba(242,184,75,.35);border-radius:16px;padding:12px 14px;font-size:13px;margin:8px 0 14px;color:var(--txt)}
.banner b{color:var(--y)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:left;direction:rtl;position:relative;overflow:hidden;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.stat::before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:var(--bb);left:-40px;bottom:-50px}
.stat .v{font-size:30px;font-weight:800;color:var(--acc);text-align:left;direction:ltr;position:relative}
.stat .l{font-size:12px;color:var(--mut);text-align:right;position:relative}
.panel{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:26px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.panel-h h2{font-size:21px;font-weight:800}
.panel-h small{display:block;color:var(--mut);font-size:12px;font-weight:500}
.sq{width:48px;height:48px;border-radius:16px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;flex:none}
.routine{display:flex;align-items:center;gap:12px;border-radius:20px;padding:12px 14px;margin-bottom:10px;border:1.5px solid;transition:.2s}
.routine.y{background:var(--yb);border-color:var(--y)}
.routine.b{background:var(--bb);border-color:var(--acc)}
.routine.p{background:var(--pb);border-color:var(--p)}
.routine .ic{width:50px;height:50px;border-radius:16px;background:rgba(0,0,0,.22);display:grid;place-items:center;font-size:24px;flex:none}
[data-theme=light] .routine .ic{background:rgba(255,255,255,.7)}
.routine .tx{flex:1;min-width:0}
.routine .tt{font-weight:800;font-size:16px}
.routine .mm{font-size:12px;color:var(--mut)}
.routine.done .tt{text-decoration:line-through;opacity:.6}
.chk{width:34px;height:34px;border-radius:50%;border:2.5px solid;flex:none;display:grid;place-items:center;font-size:16px;font-weight:800}
.y .chk{border-color:var(--y);color:var(--y)}.b .chk{border-color:var(--acc);color:var(--acc)}.p .chk{border-color:var(--p);color:var(--p)}
.done .chk{background:currentColor}.done .chk span{color:var(--bg)}
.tipcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;cursor:pointer}
.tipcard .tp{flex:1;min-width:0}
.tipcard .tt{font-weight:700;font-size:15px;min-height:48px}
.dots{display:flex;gap:6px;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.3s}
.dots i.on{width:22px;border-radius:8px;background:var(--acc)}
.bowl{width:66px;height:66px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-size:32px;border:4px solid rgba(255,255,255,.25);flex:none;box-shadow:0 6px 18px rgba(242,184,75,.4)}
.sec-t{font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:14px;transition:.15s}
.chip.on{background:var(--acc);color:var(--accd);border-color:var(--acc)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:10px 4px;font-weight:800;font-size:14px}
.seg button small{display:block;font-size:10.5px;font-weight:500;color:var(--mut);margin-top:2px}
.seg button.on{background:var(--acc);color:var(--accd);border-color:var(--acc)}
.seg button.on small{color:var(--accd);opacity:.8}
.symgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sym{background:var(--card2);border:1.5px solid var(--line);border-radius:18px;padding:12px 4px;text-align:center;font-weight:800;font-size:13.5px;transition:.15s}
.sym .e{font-size:26px;display:block;margin-bottom:2px}
.sym.on{border-color:var(--acc);background:var(--bb);box-shadow:0 0 0 2px rgba(91,184,255,.25)}
.flag{background:var(--pb);border:1px solid rgba(255,107,157,.45);border-radius:16px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.flag b{color:var(--p)}
.rem{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.rem .k{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.k.drink{background:var(--bb)}.k.food{background:var(--gb)}.k.tip{background:var(--yb)}
.rem .bd{flex:1;min-width:0}
.rem .bd b{display:block;font-size:15px}
.rem .bd p{font-size:13px;color:var(--mut);margin-top:2px}
.star{font-size:22px;color:var(--mut);padding:2px;flex:none}
.star.on{color:var(--y)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.lnk{padding:8px 12px;border-radius:12px;background:var(--bb);color:var(--acc);font-weight:700;font-size:13px;border:1px solid rgba(91,184,255,.3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.pt{display:flex;gap:14px}
.pt .dg{width:112px;flex:none;background:var(--card2);border-radius:16px;border:1px solid var(--line);padding:4px}
.pt h3{font-size:17px;font-weight:800}
.pt .sub{font-size:12px;color:var(--acc);font-weight:700}
.pt p{font-size:13px;margin-top:6px}
.pt p b{color:var(--acc)}
.care{font-size:12px;color:var(--y);margin-top:8px;background:var(--yb);padding:7px 10px;border-radius:10px}
.howto{background:var(--bb);border-radius:16px;padding:12px 14px;font-size:13px;margin-bottom:14px;border:1px solid rgba(91,184,255,.25)}
.pulse{animation:pl 1.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%{transform:scale(.8);opacity:1}70%{transform:scale(1.9);opacity:.15}100%{transform:scale(.8);opacity:1}}
.rc summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center}
.rc summary::-webkit-details-marker{display:none}
.rc .em{width:50px;height:50px;border-radius:16px;background:var(--bb);display:grid;place-items:center;font-size:26px;flex:none}
.rc .nm{font-weight:800;font-size:16px}.rc .sm{font-size:12px;color:var(--mut)}
.rc .body{margin-top:12px;font-size:13.5px;border-top:1px dashed var(--line);padding-top:12px}
.rc ul,.rc ol{padding-inline-start:20px;margin:4px 0 10px}
.rc h4{color:var(--acc);font-size:13px;margin-top:6px}
.breath{text-align:center}
.bwrap{height:210px;display:grid;place-items:center;position:relative}
.bc{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--acc),#2a6fb0);display:grid;place-items:center;transform:scale(.55);box-shadow:0 0 50px rgba(91,184,255,.45);color:#06223a;font-weight:800}
.bc div{font-size:20px}.bc small{display:block;font-size:34px;line-height:1}
.btn{background:var(--acc);color:var(--accd);font-weight:800;border-radius:16px;padding:12px 26px;font-size:15px;box-shadow:0 4px 14px rgba(91,184,255,.35)}
.btn.ghost{background:var(--card2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.steps{counter-reset:s;list-style:none;padding:0;margin-top:8px}
.steps li{counter-increment:s;display:flex;gap:10px;font-size:13.5px;margin-bottom:8px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--accd);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.stick{width:130px;flex:none;background:var(--card2);border-radius:16px;border:1px solid var(--line);color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--bg2);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
nav .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--mut);padding:6px 22px;border-radius:16px}
nav button .ni{font-size:20px;padding:4px 18px;border-radius:14px}
nav button.on{color:var(--acc)}nav button.on .ni{background:var(--bb)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--line);padding:10px 18px;border-radius:14px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{font-size:11.5px;color:var(--mut);text-align:center;margin-top:6px;padding:0 6px}
.view{animation:fi .25s}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pt.pp{display:block}
.pp .dg{width:100%;max-width:300px;margin:0 auto 12px;background:radial-gradient(circle at 50% 30%,var(--card2),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:8px}
.capt{text-align:center;font-size:11.5px;color:var(--mut);margin-top:2px}
.mini{font-size:12px;background:var(--bb);border-radius:12px;padding:8px 10px;margin-top:10px}
.rip{fill:none;stroke:#ff4d87;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:rp 1.8s infinite}
.rip.d2{animation-delay:.9s}
@keyframes rp{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.press{animation:cir 2.2s linear infinite}
@keyframes cir{0%{transform:translate(0,-5px)}25%{transform:translate(5px,0)}50%{transform:translate(0,5px)}75%{transform:translate(-5px,0)}100%{transform:translate(0,-5px)}}
@media(prefers-reduced-motion:reduce){.press,.rip{animation:none}}

/* ===== v3: top navigation + hero + polish ===== */
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--p);color:#fff;font-size:11px;font-weight:800;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.icon-btn{position:relative;transition:.2s}.icon-btn:active{transform:scale(.92)}.icon-btn.on{border-color:var(--y);box-shadow:0 0 0 3px var(--yb)}
.snav{position:sticky;top:8px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;margin:0 0 16px;background:rgba(18,36,58,.78);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
[data-theme=light] .snav{background:rgba(255,255,255,.82);box-shadow:0 10px 30px rgba(30,60,100,.15)}
.snav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 7px;border-radius:18px;font-size:11.5px;font-weight:700;color:var(--mut);transition:all .3s cubic-bezier(.3,1.4,.5,1)}
.snav button .i{font-size:20px;line-height:1.3;transition:.3s}
.snav button.on{background:linear-gradient(135deg,#3b8fd4,var(--acc));color:#fff;box-shadow:0 8px 18px -4px rgba(91,184,255,.6);transform:translateY(-1px)}
.snav button.on .i{transform:scale(1.18) translateY(-1px)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px;margin-bottom:16px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 16px 36px -14px var(--g1);display:flex;justify-content:space-between;align-items:center;gap:10px;animation:up .5s both}
.hero-t{position:relative;z-index:2;flex:1;min-width:0}
.hero-k{font-size:12.5px;font-weight:700;opacity:.9;letter-spacing:.2px}
.hero h2{font-size:25px;font-weight:800;line-height:1.25;margin:2px 0 6px}
.hero p{font-size:13px;opacity:.93;line-height:1.6}
.hero-s{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hero-s span{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px)}
.hero-e{position:relative;z-index:2;font-size:60px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.28));animation:flt 4s ease-in-out infinite}
.hero .o1,.hero .o2{position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hero .o1{width:190px;height:190px;left:-60px;top:-70px}.hero .o2{width:120px;height:120px;left:60px;bottom:-60px;background:rgba(255,255,255,.1)}
@keyframes flt{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#view>*{animation:up .5s both}
#view>*:nth-child(2){animation-delay:.05s}#view>*:nth-child(3){animation-delay:.1s}#view>*:nth-child(4){animation-delay:.15s}#view>*:nth-child(5){animation-delay:.2s}#view>*:nth-child(n+6){animation-delay:.25s}
.view{animation:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{position:relative;overflow:hidden;text-align:right;padding:16px 14px 14px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);transition:.25s;display:flex;flex-direction:column;gap:6px;min-height:168px}
.tile::after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:radial-gradient(var(--g1),transparent 70%);opacity:.22;left:-40px;top:-40px;transition:.3s}
.tile:hover::after{opacity:.4;transform:scale(1.2)}.tile:active{transform:scale(.96)}
.tile .ti{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 20px -8px var(--g1);position:relative;z-index:1}
.tile b{font-size:16.5px;font-weight:800;position:relative;z-index:1}
.tile span{font-size:12px;color:var(--mut);line-height:1.55;position:relative;z-index:1}
.tile em{margin-top:auto;font-style:normal;font-size:12px;font-weight:800;color:var(--acc);position:relative;z-index:1}
.sec-t{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt);letter-spacing:.2px}
.sec-t::before{content:"";width:4px;height:15px;border-radius:3px;background:var(--acc)}
.panel{background:linear-gradient(180deg,var(--card),var(--card2));border-top-width:1px;border-top-color:var(--line);box-shadow:var(--shadow)}
.panel-h h2{font-size:19px}
.card,.rem,.routine,.stat{transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover,.rem:hover{border-color:var(--acc)}
.rem{border-radius:20px;background:linear-gradient(180deg,var(--card2),var(--card))}
.rem .k{width:46px;height:46px;border-radius:15px;font-size:22px}
.stat{background:linear-gradient(160deg,var(--card),var(--card2))}
.sym{box-shadow:0 2px 0 rgba(0,0,0,.12)}.sym:active{transform:scale(.95)}
.pp.card{padding:18px}.pp h3{font-size:19px}
.tipcard{background:linear-gradient(135deg,var(--card),var(--card2));box-shadow:var(--shadow)}
header{margin-bottom:16px}h1{font-size:28px;background:linear-gradient(90deg,var(--acc),#9ad7ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="sk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d3b3"/><stop offset=".55" stop-color="#e5b48c"/><stop offset="1" stop-color="#cf9870"/></linearGradient>
<linearGradient id="sk2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9a47c"/><stop offset=".45" stop-color="#f3cba8"/><stop offset="1" stop-color="#dba982"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3326"/><stop offset="1" stop-color="#2a1b13"/></linearGradient>
</defs></svg>
<div class="app">
  <header>
    <div>
      <div class="date" id="date"></div>
      <h1>جُرْعَةُ شِفَاء</h1>
    </div>
    <div style="display:flex;gap:8px"><button class="icon-btn" id="favb" onclick="go('favs')" aria-label="المفضلة">⭐<b id="favn" class="badge"></b></button><button class="icon-btn" id="theme" aria-label="تبديل السمة">☀️</button></div>
  </header>
  
  <div id="hero"></div>
  <div id="view" class="view"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ البيانات ============ */
const AGES={b:['رضّع','أقل من سنة'],c:['أطفال','١ – ١٢ سنة'],a:['بالغون','١٣ – ٥٩'],s:['كبار السن','٦٠+']};
const KIND={drink:'🍵',food:'🥣',tip:'💡'};

const SYM=[
{id:'head',n:'صداع',e:'🤕',pts:['yintang','li4','gb20','lv3'],ex:['box','neck'],
 flag:'اطلب الطبيب فوراً عند صداع مفاجئ وشديد، أو مع حمى وتيبّس الرقبة، أو اضطراب الرؤية أو الكلام، أو بعد إصابة في الرأس.',
 r:[

  stopBreath();S.tab=tab;save('tab',tab);

  let lab='';
  if(p.lab){let t=p.lab[2],w=t.length*6.4+22,cx=Math.max(w/2+4,Math.min(236-w/2,p.lab[0])),cy=p.lab[1];
    p.pts.forEach(q=>{s+=`<path d="M${q[0]} ${q[1]} L${cx} ${cy-12}" stroke="#ff4d87" stroke-width="1.5" stroke-dasharray="4 3" fill="none" opacity=".8"/>`});
    lab=`<rect x="${cx-w/2}" y="${cy-12}" width="${w}" height="24" rx="12" fill="#ff2d6f"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" font-family="Tajawal,sans-serif" direction="rtl">${t}</text>`}
  p.pts.forEach((q,i)=>{s+=fingerSvg(q[0],q[1],p.ang[i]||0)});
  p.pts.forEach(q=>{s+=pdot(q[0],q[1])});
  return `<svg viewBox="0 0 240 296" width="100%" role="img" aria-label="${p.cap}">${s}${lab}</svg>`;
}

/* ============ العروض ============ */
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function hero(){
  const hr=new Date().getHours();
  const gr=hr<12?'صباح الخير ☀️':hr<17?'طاب يومك 🌤':'مساء الخير 🌙';
  const H={
   today:['#1d6fb8','#5bb8ff','🌿',gr,'صحتك الطبيعية','خطوات بسيطة وآمنة من العطّار لصحة أفضل اليوم',['🌿 ٣ عادات يومية','🍂 موسم '+season()]],
   sym:['#6b46d6','#a78bfa','🔎','ابحث بالعَرَض','ما الذي تشعر به؟','اختر العَرَض والفئة العمرية لتظهر لك الحلول الطبيعية المناسبة فقط',['٩ أعراض','٤ فئات عمرية','علامات الخطر']],
   press:['#c2255c','#ff8fb1','👆','العلاج بالضغط','نقاط الضغط','مواضع دقيقة بالرسوم المتحركة لراحة فورية في اليد والقدم والرأس',['٩ نقاط','رسوم متحركة','قياس بالأصابع']],
   rec:['#0f8a5f','#4ade80','🍵','من العطّار','مشروبات وأغذية','وصفات دافئة بالمكوّنات والطريقة والمحاذير لتهدئة الأعراض',[AR(REC.length)+' وصفة','مشروبات','أغذية']],
   ex:['#0e7490','#22d3ee','🧘','تنفّس واسترخِ','التمارين والتنفس','تمارين تنفس تفاعلية وإطالات بخطوات مصوّرة لتخفيف التوتر والآلام',['٣ تمارين تنفس','٤ إطالات']],
   favs:['#b7791f','#f2b84b','⭐','محفوظاتك','المفضلة','الحلول الطبيعية التي حفظتها لتعود إليها بسرعة',[AR(S.favs.length)+' محفوظ']]
  }[S.tab];
  return `<section class="hero" style="--g1:${H[0]};--g2:${H[1]}"><div class="hero-t"><div class="hero-k">${H[3]}</div><h2>${H[4]}</h2><p>${H[5]}</p><div class="hero-s">${H[6].map(c=>`<span>${c}</span>`).join('')}</div></div><div class="hero-e">${H[2]}</div><i class="o1"></i><i class="o2"></i></section>`;
}
function render(){
  $('#hero').innerHTML=hero();
  const v=$('#view');v.style.animation='none';void v.offsetWidth;v.style.animation='';
  ({today:vToday,sym:vSym,press:vPress,rec:vRec,ex:vEx,favs:vFavs})[S.tab]();
}

function vToday(){
  const dn=S.done.filter(Boolean).length;
  const rows=[['y','☀️','m'],['b','🍲','n'],['p','🌙','e']];
  const labels=['الصباح','الظهيرة','المساء'];
  $('#view').innerHTML=`
  <div class="banner"><span>🩺</span><div><b>تنبيه:</b> هذا التطبيق للتعامل مع الأعراض البسيطة وبعض الوقاية، ولا يغني عن الطبيب. لا توقف دواءً موصوفاً دون استشارته، واستشر الطبيب خصوصاً مع الحمل أو الأمراض المزمنة أو عند ظهور أعراض شديدة.</div></div>
  <div class="stats">
   <div class="stat"><div class="v">${dn}/3</div><div class="l">عادات صحية تمّت اليوم</div></div>
   <div class="stat"><div class="v" style="font-size:28px">${season()}</div><div class="l">موسم اليوم</div></div>
  </div>
  <div class="panel">
   <div class="panel-h"><div style="display:flex;gap:10px;align-items:center"><button class="sq" onclick="reroll()" aria-label="اقتراحات جديدة">🔄</button></div>
   <div style="flex:1;text-align:right"><h2>روتين اليوم</h2><small>🌿 عادات طبيعية بسيطة</small></div><div class="sq">🧺</div></div>
   ${rows.map((r,i)=>{const it=POOL[r[2]][S.rot[i]%4];return `<div class="routine ${r[0]} ${S.done[i]?'done':''}" onclick="toggleDone(${i})">
     <div class="chk"><span>${S.done[i]?'✓':''}</span></div>
     <div class="tx" style="text-align:right"><div class="tt">${it[0]}</div><div class="mm">${labels[i]} · ${it[1]}</div></div>
     <div class="ic">${r[1]}</div></div>`}).join('')}
  </div>
  <div class="tipcard" onclick="nextTip(true)"><div class="tp"><div class="tt" id="tiptxt">${TIPS[S.tip]}</div><div class="dots" id="dots">${TIPS.map((_,i)=>`<i class="${i===S.tip?'on':''}"></i>`).join('')}</div></div><div class="bowl">🍯</div></div>
  <div class="sec-t">استكشف الأقسام</div>
  <div class="tiles">${[['sym','🔎','الأعراض','اختر ما تشعر به واحصل على حلول تناسب عمرك','٩ أعراض','#6b46d6','#a78bfa'],['press','👆','نقاط الضغط','مواضع دقيقة برسوم متحركة لراحة فورية','٩ نقاط','#c2255c','#ff8fb1'],['rec','🍵','المشروبات','وصفات دافئة وأغذية تهدّئ الأعراض','١٣ وصفة','#0f8a5f','#4ade80'],['ex','🧘','التمارين','تنفّس تفاعلي وإطالات لتخفيف التوتر','٧ تمارين','#0e7490','#22d3ee']].map(t=>`<button class="tile" style="--g1:${t[5]};--g2:${t[6]}" onclick="go('${t[0]}')"><div class="ti">${t[1]}</div><b>${t[2]}</b><span>${t[3]}</span><em>${t[4]} ←</em></button>`).join('')}</div>`;
}
function toggleDone(i){S.done[i]=!S.done[i];save('done_'+todayKey,S.done);vToday()}
function reroll(){S.rot=S.rot.map(x=>(x+1)%4);save('rot_'+todayKey,S.rot);S.done=[false,false,false];save('done_'+todayKey,S.done);vToday()}
function nextTip(manual){S.tip=(S.tip+1)%TIPS.length;const t=$('#tiptxt');if(t){t.textContent=TIPS[S.tip];$('#dots').innerHTML=TIPS.map((_,i)=>`<i class="${i===S.tip?'on':''}"></i>`).join('')}}
setInterval(()=>{if(S.tab==='today')nextTip()},6000);

function favId(s,i){return s+':'+i}
function toggleFav(id,title,desc,k){
  const ix=S.favs.findIndex(f=>f.id===id);
  if(ix>-1){S.favs.splice(ix,1);toast('أُزيلت من المفضلة')}else{S.favs.push({id,title,desc,k});toast('⭐ حُفظت في المفضلة')}
  save('favs',S.favs);updFav();S.tab==='favs'?vFavs():vSym(true);
}
function vSym(keepScroll){
  const sy=window.scrollY;
  const sm=SYM.find(x=>x.id===S.sym);
  const list=sm.r.filter(r=>r[3].includes(S.age));
  const infant=S.age==='b';
  $('#view').innerHTML=`
  <div class="panel">
   <div class="panel-h"><div style="flex:1;text-align:right"><h2>ما الذي تشعر به؟</h2><small>اختر العَرَض والفئة العمرية</small></div><div class="sq">🔎</div></div>
   <div class="symgrid">${SYM.map(x=>`<button class="sym ${x.id===S.sym?'on':''}" onclick="setSym('${x.id}')"><span class="e">${x.e}</span>${x.n}</button>`).join('')}</div>
   <div class="sec-t">الفئة العمرية</div>
   <div class="seg">${Object.entries(AGES).map(([k,a])=>`<button class="${S.age===k?'on':''}" onclick="setAge('${k}')">${a[0]}<small>${a[1]}</small></button>`).join('')}</div>
  </div>
  <div class="flag"><b>⚠️ متى تراجع الطبيب؟</b><br>${sm.flag}</div>
  ${infant?`<div class="flag" style="background:var(--yb);border-color:rgba(242,184,75,.4)"><b style="color:var(--y)">👶 الرضّع:</b> لا تُعطِ الرضيع أعشاباً أو عسلاً أو أدوية دون توجيه الطبيب.</div>`:''}
  <div class="sec-t" style="margin-top:4px">الحلول الطبيعية المناسبة (${list.length})</div>
  ${list.map(r=>{const i=sm.r.indexOf(r),id=favId(sm.id,i),on=S.favs.some(f=>f.id===id);
    return `<div class="rem"><div class="k ${r[2]}">${KIND[r[2]]}</div><div class="bd"><b>${r[0]}</b><p>${r[1]}</p></div>
    <button class="star ${on?'on':''}" onclick="toggleFav('${id}','${r[0].replace(/'/g,'')}','${r[1].replace(/'/g,'')}','${r[2]}')" aria-label="حفظ">${on?'★':'☆'}</button></div>`}).join('')}
  ${infant?'':`<div class="sec-t">نقاط ضغط مقترحة</div>
  <div class="links">${sm.pts.map(p=>`<button class="lnk" onclick="go('press','pt-${p}')">👆 ${P[p].n}</button>`).join('')}</div>
  <div class="sec-t">تمارين مقترحة</div>
  <div class="links">${sm.ex.map(e=>`<button class="lnk" onclick="go('ex','ex-${e}')">🧘 ${(BT[e]||ST[e]).n}</button>`).join('')}</div>`}
  <p class="foot" style="margin-top:18px">النصائح عامة وداعمة وليست تشخيصاً أو بديلاً عن العلاج الطبي. إن لم يتحسن العَرَض خلال أيام قليلة فاستشر الطبيب.</p>`;
  if(keepScroll===true)window.scrollTo({top:sy});
}
function setSym(id){S.sym=id;save('sym',id);vSym()}
function setAge(a){S.age=a;save('age',a);vSym(true)}

function vPress(){
  $('#view').innerHTML=`
  <div class="howto"><b>👆 طريقة الضغط:</b> ${HOW}</div>
  ${Object.entries(P).map(([id,p])=>`<div class="card pt pp" id="pt-${id}">
   <div class="dg">${diagram(p)}<div class="capt">${p.cap} · النقطة الوردية هي موضع الضغط</div></div>
   <h3>${p.n}</h3><div class="sub">${p.s}</div>
   <p><b>مكانها:</b> ${p.where}</p><p><b>تفيد في:</b> ${p.good}</p>
   ${p.care?`<div class="care">⚠️ ${p.care}</div>`:''}
   <div class="mini">① ضع طرف الإصبع على النقطة · ② دوّر دورات صغيرة ٣٠–٦٠ ثانية · ③ تنفّس ببطء</div></div>`).join('')}
  <p class="foot">الرسوم توضيحية متحركة وليست صوراً فوتوغرافية؛ تتفاوت الأبعاد بين شخص وآخر، فاستخدم عرض أصابعك أنت للقياس.</p>`;
}

function vRec(){
  const l=REC.filter(r=>S.rf==='all'||r.k===S.rf);
  $('#view').innerHTML=`
  <div class="chips" style="margin-bottom:14px">
   ${[['all','الكل'],['drink','🍵 مشروبات'],['food','🥣 أغذية']].map(c=>`<button class="chip ${S.rf===c[0]?'on':''}" onclick="S.rf='${c[0]}';vRec()">${c[1]}</button>`).join('')}</div>
  ${l.map(r=>`<details class="card rc"><summary><div class="em">${r.e}</div><div style="flex:1"><div class="nm">${r.n}</div><div class="sm">⏱ ${r.t} · ${r.ages}</div></div><span style="color:var(--mut)">▾</span></summary>
   <div class="body"><h4>المكوّنات</h4><ul>${r.ing.map(i=>`<li>${i}</li>`).join('')}</ul>
   <h4>الطريقة</h4><ol>${r.st.map(i=>`<li>${i}</li>`).join('')}</ol>
   <h4>فائدتها</h4><p>${r.good}</p>${r.care?`<div class="care">⚠️ ${r.care}</div>`:''}</div></details>`).join('')}
  <p class="foot">تأكد من مصدر الأعشاب (عطّار موثوق، مجففة ونظيفة)، وابدأ بكمية قليلة لتتأكد من عدم وجود حساسية. أوقف أي نبات يسبب أعراضاً.</p>`;
}

function vEx(){
  $('#view').innerHTML=`
  <div class="sec-t" style="margin-top:0">🌬 تمارين التنفس التفاعلية</div>
  ${Object.entries(BT).map(([id,b])=>`<div class="card breath" id="ex-${id}"><div style="font-weight:800;font-size:17px">${b.n}</div><div style="font-size:13px;color:var(--mut);margin:2px 0 6px">${b.d}</div>
   <div class="bwrap"><div class="bc" id="bc-${id}"><div><small id="bn-${id}">·</small><span id="bl-${id}">جاهز</span></div></div></div>
   <div style="font-size:12px;color:var(--mut);margin-bottom:10px" id="bcy-${id}">الدورات: ٠</div>
   <button class="btn" id="bb-${id}" onclick="startBreath('${id}')">ابدأ</button></div>`).join('')}
  <div class="sec-t">🤸 تمارين الإطالة</div>
  ${Object.entries(ST).map(([id,s])=>`<div class="card" id="ex-${id}"><div class="pt"><svg class="stick" viewBox="0 0 120 100" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="currentColor" style="height:100px">${s.fig}</svg>
   <div style="flex:1;min-width:0"><h3>${s.n}</h3><div class="sub" style="color:var(--mut)">${s.d}</div></div></div>
   <ol class="steps">${s.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div>`).join('')}
  <p class="foot">توقف عند أي ألم حاد أو دوخة. الرسوم تقريبية للتوضيح.</p>`;
}
function startBreath(id){
  const wasRunning=document.getElementById('bb-'+id).dataset.run==='1';
  stopBreath();
  document.querySelectorAll('[id^=bb-]').forEach(b=>{b.textContent='ابدأ';b.dataset.run='0';b.classList.remove('ghost')});
  document.querySelectorAll('.bc').forEach(c=>{c.style.transition='transform .6s';c.style.transform='scale(.55)'});
  document.querySelectorAll('[id^=bl-]').forEach(e=>e.textContent='جاهز');document.querySelectorAll('[id^=bn-]').forEach(e=>e.textContent='·');
  if(wasRunning)return;
  const b=BT[id],btn=document.getElementById('bb-'+id),c=document.getElementById('bc-'+id),
    lb=document.getElementById('bl-'+id),nm=document.getElementById('bn-'+id),cy=document.getElementById('bcy-'+id);
  btn.textContent='إيقاف';btn.dataset.run='1';btn.classList.add('ghost');
  let i=0,cycles=0;
  const arab=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
  function step(){
    const p=b.ph[i%b.ph.length];let left=p[1];
    if(i%b.ph.length===0&&i>0){cycles++;cy.textContent='الدورات: '+arab(cycles)}
    lb.textContent=p[0];nm.textContent=arab(left);
    c.style.transition=`transform ${p[1]}s ease-in-out`;c.style.transform=`scale(${p[2]})`;
    clearInterval(bTick);
    bTick=setInterval(()=>{left--;if(left>0)nm.textContent=arab(left)},1000);
    bTimer=setTimeout(()=>{i++;step()},p[1]*1000);
  }
  step();
}

function vFavs(){
  $('#view').innerHTML=`
  <div class="panel"><div class="panel-h"><div style="flex:1;text-align:right"><h2>المفضلة</h2><small>حلولك الطبيعية المحفوظة</small></div><div class="sq">⭐</div></div>
  ${S.favs.length?S.favs.map(f=>`<div class="rem"><div class="k ${f.k}">${KIND[f.k]}</div><div class="bd"><b>${f.title}</b><p>${f.desc}</p></div>
   <button class="star on" onclick="toggleFav('${f.id}')" aria-label="إزالة">★</button></div>`).join('')
   :`<div class="empty">لا توجد عناصر محفوظة بعد.<br>اضغط ☆ بجانب أي حل في صفحة الأعراض لحفظه هنا.</div>`}
  </div>`;
}

/* ============ تهيئة ============ */
$('#date').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const th=load('theme','dark');document.documentElement.dataset.theme=th;$('#theme').textContent=th==='dark'?'☀️':'🌙';
$('#theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;$('#theme').textContent=n==='dark'?'☀️':'🌙';save('theme',n)};
renderChrome();render();
</script>
