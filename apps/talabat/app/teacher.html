<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بورتفوليو المعلم | EduSmart</title>
<link rel="icon" type="image/png" href="../logo.png">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<script>
(function(){var t=localStorage.getItem('elmistar-theme');if(!t){t='light';}document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  --bg:#eef4ff;--card:#ffffff;--card2:#f6f9ff;--text:#0f172a;--muted:#64748b;--sec:#475569;
  --accent:#2563eb;--accent2:#7c3aed;--border:#dbe6fb;--green:#16a34a;--amber:#f59e0b;
  --shadow:0 10px 30px rgba(37,99,235,.12);--r:20px;
}
[data-theme="dark"]{
  --bg:#0d1117;--card:#161b22;--card2:#1c2230;--text:#e2e8f0;--muted:#94a3b8;--sec:#94a3b8;
  --border:rgba(255,255,255,.1);--shadow:0 10px 30px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(600px 320px at 85% -60px,rgba(37,99,235,.14),transparent 60%),radial-gradient(500px 300px at 0% 0%,rgba(124,58,237,.1),transparent 55%);background-attachment:fixed}
.wrap{max-width:620px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.top img{width:40px;height:40px;border-radius:12px;object-fit:cover}
.top b{display:block;font-size:15px;font-weight:900}
.top small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.top .sp{flex:1}
.theme-btn{width:38px;height:38px;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer;font-size:17px;color:var(--text)}
.hero{background:var(--card);border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero-band{background:linear-gradient(135deg,#2563eb,#7c3aed 60%,#06b6d4);padding:26px 18px 60px;text-align:center;position:relative;overflow:hidden;color:#fff}
.hero-band::before,.hero-band::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hero-band::before{width:160px;height:160px;left:-50px;top:-70px}
.hero-band::after{width:110px;height:110px;right:20px;bottom:-60px}
.photo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 10px 26px rgba(0,0,0,.3);margin:-52px auto 8px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;position:relative;z-index:2;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.hero-body{padding:6px 18px 20px;text-align:center}
.hero-body h2{font-size:22px;font-weight:900}
.hero-body .en{font-size:12.5px;color:var(--muted);font-weight:700;direction:ltr}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.bdg{font-size:11.5px;font-weight:800;padding:4px 14px;border-radius:999px;border:1px solid}
.bdg.title{background:rgba(37,99,235,.1);color:#2563eb;border-color:rgba(37,99,235,.3)}
.bdg.exp{background:rgba(245,158,11,.12);color:#b45309;border-color:rgba(245,158,11,.35)}
[data-theme="dark"] .bdg.title{color:#93c5fd}
[data-theme="dark"] .bdg.exp{color:#fbbf24}
.spec{font-size:13.5px;font-weight:800;color:var(--sec);line-height:1.9;margin-bottom:10px}
.quote{background:var(--card2);border:1px solid var(--border);border-right:4px solid var(--accent);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700;color:var(--sec);line-height:2;white-space:pre-wrap;word-break:break-word;margin-bottom:12px;text-align:right}
.contact{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cbtn{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;border-radius:999px;font-family:inherit;font-weight:900;font-size:13.5px;text-decoration:none;transition:.2s;border:none;cursor:pointer}
.cbtn.wa{background:#22c55e;color:#fff;box-shadow:0 8px 20px rgba(34,197,94,.35)}
.cbtn.fb{background:#1877f2;color:#fff;box-shadow:0 8px 20px rgba(24,119,242,.35)}
.cbtn:active{transform:scale(.96)}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px 16px;box-shadow:var(--shadow);text-align:center;margin-bottom:12px}
.card h2{font-size:18px;font-weight:900;margin-bottom:4px}
.card>p{font-size:12.5px;color:var(--sec);font-weight:700;margin-bottom:14px;line-height:1.9}
.inp{display:flex;flex-direction:column;gap:5px;background:var(--card2);border:1.5px solid var(--border);border-radius:14px;padding:9px 13px;margin-bottom:12px;text-align:right}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.inp label{font-size:11.5px;font-weight:800;color:var(--muted)}
.inp input{border:none;background:transparent;color:var(--text);font-family:inherit;font-size:17px;font-weight:800;outline:none;width:100%}
.phone-inp{padding:7px 12px;margin-bottom:10px}
.phone-inp input{font-size:15px;text-align:center;letter-spacing:0}
.phone-inp input::placeholder{text-align:center;font-size:14px;font-weight:700;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 20px;border-radius:14px;font-family:inherit;font-weight:800;font-size:14.5px;cursor:pointer;border:none;width:100%;min-height:52px;transition:.2s;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;box-shadow:0 8px 22px rgba(37,99,235,.4)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:var(--card2);color:var(--sec);border:1px solid var(--border)}
/* ===== Follow card (collapsible, professional) ===== */
.follow-card{padding:14px}
.follow-head{display:flex;align-items:center;gap:12px;width:100%;background:linear-gradient(135deg,rgba(37,99,235,.12),rgba(124,58,237,.12));border:1px solid var(--border);border-radius:16px;padding:12px 14px;cursor:pointer;font-family:inherit;color:var(--text);text-align:right;transition:.2s}
.follow-head:hover{border-color:var(--accent)}
.follow-head:active{transform:scale(.99)}
.follow-ic{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;color:#fff;box-shadow:0 8px 18px rgba(59,130,246,.4)}
.follow-tx{flex:1;min-width:0}
.follow-tx b{display:block;font-size:16.5px;font-weight:900}
.follow-tx small{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.follow-chev{width:32px;height:32px;border-radius:50%;background:var(--card2);border:1px solid var(--border);color:var(--sec);font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;transform:rotate(-90deg);transition:transform .25s;line-height:1}
.follow-chev.open{transform:rotate(90deg);background:var(--accent);border-color:var(--accent);color:#fff}
.follow-desc{font-size:12.5px;color:var(--sec);font-weight:700;margin:12px 2px;line-height:1.9}
#followBody{animation:pop .25s ease}
.err{display:none;background:rgba(239,68,68,.12);color:#dc2626;border:1px solid rgba(239,68,68,.4);border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:800;margin-top:10px}
.err.show{display:block}
.hidden{display:none!important}
.ch-row{display:flex;align-items:center;gap:11px;background:var(--card2);border:1.5px solid var(--border);border-radius:15px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:.18s;text-align:right;width:100%;font-family:inherit;color:var(--text)}
.ch-row:active{transform:scale(.98)}
.ch-av{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;color:#fff;flex-shrink:0;overflow:hidden}
.ch-av img{width:100%;height:100%;object-fit:cover}
.ch-row b{display:block;font-size:14.5px;font-weight:900}
.ch-row small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.d-head{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(37,99,235,.1),rgba(124,58,237,.1));border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;text-align:right}
.d-head .avatar{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;flex-shrink:0;overflow:hidden;border:2px solid var(--border)}
.d-head .avatar img{width:100%;height:100%;object-fit:cover}
.d-head h3{font-size:17px;font-weight:900}
.badges2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.b2{font-size:11px;font-weight:800;padding:2px 10px;border-radius:12px;border:1px solid}
.b2.grade{background:rgba(37,99,235,.1);color:#2563eb;border-color:rgba(37,99,235,.3)}
.b2.clear{background:rgba(34,197,94,.12);color:#16a34a;border-color:rgba(34,197,94,.3)}
.b2.late{background:rgba(245,158,11,.12);color:#b45309;border-color:rgba(245,158,11,.35)}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.d-item{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:10px 12px;display:flex;gap:9px;align-items:center;text-align:right;min-width:0}
.d-item .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.d-item small{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
.d-item b{font-size:13px;font-weight:800}
.d-sec{background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:10px;text-align:right}
.d-sec-title{font-weight:900;font-size:13.5px;display:flex;align-items:center;gap:7px;margin-bottom:9px}
.d-sec-title i{color:var(--accent);font-size:17px}
.d-report{background:var(--card);border-right:3px solid var(--accent);border-radius:10px;padding:10px 12px;line-height:2;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.dots{display:flex;gap:7px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--card);border:1.5px solid var(--border);color:var(--muted)}
.dot.on{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:#22c55e;color:#fff}
.pay-row{display:flex;gap:9px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 11px;margin-bottom:6px;font-size:12.5px}
.loader-page{text-align:center;padding:52px 20px;color:var(--muted);font-weight:800}
.lp-logo{width:92px;height:92px;margin:0 auto 14px;border-radius:26px;overflow:hidden;box-shadow:0 12px 30px rgba(37,99,235,.35);animation:lpFloat 2.4s ease-in-out infinite}
.lp-logo img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes lpFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.lp-name{font-weight:900;font-size:22px;color:var(--text);margin-bottom:16px}
.lp-spin{position:relative;width:78px;height:78px;margin:2px auto 0}
.lp-spin .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(59,130,246,.65);animation:lpRipple 1.8s ease-out infinite}
.lp-spin .ring.r2{animation-delay:.6s}
.lp-spin .ring.r1{animation-delay:1.2s}
@keyframes lpRipple{0%{transform:scale(.32);opacity:1}100%{transform:scale(1);opacity:0}}
.lp-spin .arc{position:absolute;inset:10px;border-radius:50%;background:conic-gradient(from 0deg,transparent 5%,#3b82f6 35%,#8b5cf6 55%,transparent 85%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));animation:lpRot 1.1s linear infinite}
@keyframes lpRot{to{transform:rotate(360deg)}}
.lp-spin .core{position:absolute;inset:29px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);box-shadow:0 0 18px rgba(59,130,246,.8);animation:lpCore 1.6s ease-in-out infinite}
@keyframes lpCore{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.loading{text-align:center;padding:30px;color:var(--muted);font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img id="topLogo" src="../logo.png" alt="EduSmart" onerror="this.style.display='none'">
    <div><b id="topName">بورتفوليو المعلم 🎓</b><small id="topSub">الصفحة التعريفية + متابعة الطلاب</small></div>
    <div class="sp"></div>
    <button class="theme-btn" id="themeBtn" title="الوضع الليلي / النهاري">🌙</button>
  </header>

  <div id="loadBox" class="loader-page"><div class="lp-logo"><img src="../logo.png" alt="EduSmart"></div><div class="lp-name">EduSmart</div><div class="lp-spin"><span class="ring r1"></span><span class="ring r2"></span><span class="arc"></span><span class="core"></span></div></div>
  <div id="errBox" class="card hidden"><h2>تعذر فتح الصفحة</h2><p id="errMsg">الرابط غير مكتمل</p></div>

  <div id="profileBox" class="hidden">
    <section class="hero">
      <div class="hero-band"></div>
      <div class="photo" id="tPhoto"><img src="../logo.png" alt="شعار التطبيق"></div>
      <div class="hero-body">
        <h2 id="tName">—</h2>
        <div class="en" id="tEn">—</div>
        <div class="badges"><span class="bdg title" id="tTitle">—</span><span class="bdg exp" id="tExp">—</span></div>
        <div class="spec" id="tSpec"></div>
        <div class="quote hidden" id="tQuoteBox">“<span id="tQuote"></span>”</div>
        <div class="contact">
          <a class="cbtn wa hidden" id="tWa" target="_blank"><i class="bx bxl-whatsapp"></i> واتساب المعلم</a>
          <a class="cbtn fb hidden" id="tFb" target="_blank"><i class="bx bxl-facebook"></i> فيسبوك</a>
        </div>
      </div>
    </section>

    <div id="loginView" class="card follow-card">
      <button class="follow-head" id="followToggle" type="button">
        <span class="follow-ic">🔍</span>
        <span class="follow-tx"><b>متابعة مستوى ابنك</b><small>اضغط للفتح — تابع بيانات الطالب برقم الهاتف</small></span>
        <span class="follow-chev" id="followChev">‹</span>
      </button>
      <div id="followBody" class="hidden">
        <p class="follow-desc">اكتب رقم الهاتف المسجّل عند المعلم وستظهر بيانات الطالب</p>
        <div class="inp phone-inp"><input id="phInput" inputmode="numeric" placeholder="رقم الهاتف" style="text-align:center" autocomplete="off"></div>
        <button class="btn btn-primary" id="loginBtn">عرض بيانات الطالب ←</button>
        <div class="err" id="loginErr"></div>
      </div>
    </div>

    <div id="chooseView" class="card hidden">
      <h2>اختر الطالب</h2>
      <p id="chooseSub"></p>
      <div id="chooseList" style="text-align:right"></div>
      <button class="btn btn-ghost" id="backBtn" style="margin-top:6px">رجوع</button>
    </div>

    <div id="stuView" class="hidden">
      <div class="d-head">
        <div class="avatar" id="vAvatar">؟</div>
        <div style="flex:1;min-width:0"><h3 id="vName">—</h3><div class="badges2" id="vBadges"></div></div>
      </div>
      <div class="d-grid" id="vGrid"></div>
      <div class="d-sec"><div class="d-sec-title"><i class="bx bx-note"></i> تقرير المعلم</div><div class="d-report" id="vReport"></div></div>
      <div class="d-sec"><div class="d-sec-title"><i class="bx bx-calendar-check"></i> الحضور <span id="vMonth" style="margin-right:auto;font-size:11.5px;color:var(--muted)"></span></div><div class="dots" id="vDots"></div></div>
      <div class="d-sec"><div class="d-sec-title"><i class="bx bx-wallet"></i> سجل المدفوعات</div><div id="vPays"></div></div>
      <div style="display:flex;gap:8px"><button class="btn btn-ghost" id="switchBtn" style="flex:1"><i class="bx bx-transfer" style="font-size:18px;color:var(--accent)"></i> طالب آخر</button><button class="btn btn-ghost" id="logoutBtn" style="flex:1"><i class="bx bx-log-out" style="font-size:18px;color:var(--accent)"></i> خروج</button></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var SESS_PRICE=20,SESS_EIGHTH=10;
function $(id){return document.getElementById(id);}
function esc(s){if(s==null)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function normPhone(p){p=(p||'').toString().replace(/\D/g,'');p=p.replace(/^0020/,'');p=p.replace(/^20/,'');p=p.replace(/^0+/,'');return p;}
function gradeSafe(g){if(!g)return 'غير محدد';var t=String(g).trim();var m={"0":"مرحلة الكي جي والتأسيس","تأسيس":"مرحلة الكي جي والتأسيس","1":"الصف الأول الابتدائي","2":"الصف الثاني الابتدائي","3":"الصف الثالث الابتدائي","4":"الصف الرابع الابتدائي","5":"الصف الخامس الابتدائي","6":"الصف السادس الابتدائي"};return m[t]||t;}
function dueForSessions(n){n=Math.max(0,parseInt(n)||0);if(n<=7)return n*SESS_PRICE;return 7*SESS_PRICE+SESS_EIGHTH+(n-8)*SESS_PRICE;}
function coveredSessions(a){a=Math.max(0,parseInt(a)||0);var pack=7*SESS_PRICE+SESS_EIGHTH;if(a<pack)return Math.min(7,Math.floor(a/SESS_PRICE));return 8+Math.floor((a-pack)/SESS_PRICE);}
function attListOf(s){var a=s?s.attendance:null;if(Array.isArray(a))return a.slice().sort(function(x,y){return x-y;});var n=parseInt(a)||0,r=[];for(var i=0;i<n;i++)r.push(0);return r;}
function fin(st){var c=attListOf(st).length;var net=Math.max(0,(parseInt(st.paid)||0)-(parseInt(st.otherExpenses)||0));var due=dueForSessions(c);var sess=coveredSessions(net);var un=Math.max(0,c-sess);var rest=Math.max(0,due-net);return{count:c,unpaid:un,rest:rest,clear:un===0};}
var themeBtn=$('themeBtn');
function syncTheme(){var t=document.documentElement.getAttribute('data-theme');themeBtn.textContent=t==='dark'?'☀️':'🌙';}
syncTheme();
themeBtn.onclick=function(){var h=document.documentElement;var n=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',n);try{localStorage.setItem('elmistar-theme',n);}catch(e){}syncTheme();};

var DB={students:[],groups:[],teacher:null};
function cleanU(s){return String(s||'').trim().toLowerCase().replace(/[^a-z0-9-_]/g,'');}
function getParams(){var q={f:'',a:'',s:'',u:''};try{var sp=new URLSearchParams(location.search);q.f=sp.get('f')||'';q.a=sp.get('a')||'';q.s=sp.get('s')||'';q.u=cleanU(sp.get('u')||'');}catch(e){}if(!q.u){try{var h=String(location.hash||'').replace(/^#\/?/,'').split('?')[0].split('/')[0];h=cleanU(h);if(h)q.u=h;}catch(e){}}if(!q.u){try{var p=String(location.pathname||'');var m=p.match(/teacher\.html\/([A-Za-z0-9-_]+)/);if(m&&m[1])q.u=cleanU(m[1]);}catch(e){}}return q;}
function applyRegistryEntry(q,e){if(!e||typeof e!=='object')return false;if(e.f){q.f=e.f;return true;}if(e.a){q.a=e.a;return true;}if(e.s){q.s=e.s;return true;}return false;}
function fetchRegistry(u,cb){
  var done=false;function fin(v){if(done)return;done=true;try{cb(v);}catch(e){}}
  var timer=setTimeout(function(){fin(null);},8000);
  function ok(v){clearTimeout(timer);fin(v);}
  try{
    var reg=null;try{reg=JSON.parse(localStorage.getItem('elmistar_teacher_registry')||'null');}catch(e){}
    if(reg&&reg[u]){var q0={f:'',a:'',s:'',u:u};if(applyRegistryEntry(q0,reg[u])){ok(q0);return;}}
  }catch(e){}
  try{
    fetch('teachers.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
      var all=(j&&j.teachers)||j||{};
      var e=all[u];
      if(e){var q1={f:'',a:'',s:'',u:u};if(applyRegistryEntry(q1,e)){ok(q1);return;}}
      ok(null);
    }).catch(function(){ok(null);});
  }catch(e){ok(null);}
}
function showErr(m){$('loadBox').classList.add('hidden');$('errBox').classList.remove('hidden');$('errMsg').textContent=m;}
function restVal(f){if(!f||typeof f!=='object')return f;if('stringValue' in f)return f.stringValue;if('integerValue' in f)return Number(f.integerValue);if('doubleValue' in f)return Number(f.doubleValue);if('booleanValue' in f)return !!f.booleanValue;if('nullValue' in f)return null;if('timestampValue' in f)return f.timestampValue;if('arrayValue' in f){var vs=(f.arrayValue&&f.arrayValue.values)||[];return vs.map(restVal);}if('mapValue' in f){var fs=(f.mapValue&&f.mapValue.fields)||{};var o={};for(var k in fs)o[k]=restVal(fs[k]);return o;}var o2={},any=false;for(var k2 in f){o2[k2]=restVal(f[k2]);any=true;}return any?o2:null;}
function restGet(projectId,apiKey,path,cb){
  fetch('https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(projectId)+'/databases/(default)/documents/'+path+'?key='+encodeURIComponent(apiKey))
  .then(function(r){return r.json();}).then(function(doc){
    if(!doc||!doc.fields){cb(null);return;}
    cb(restVal(doc.fields));
  }).catch(function(){cb(null);});
}
function normTeacher(t){t=t||{};var p=t.profile||t;return{firstName:p.firstName||'',lastName:p.lastName||'',enName:p.enName||'',title:p.title||'معلم',exp:p.exp||'',specialty:p.specialty||'',quote:p.quote||'',whatsapp:String(p.whatsapp||'').replace(/\D/g,''),facebook:p.facebook||'',username:String(p.username||'').toLowerCase(),photo:p.photo||''};}
function shKey(k){return String(k==null?'':k).replace(/[\s_ـ]+/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');}
function shPick(o,names){for(var i=0;i<names.length;i++){var w=shKey(names[i]);for(var k in o){if(shKey(k)===w){var v=o[k];if(v!=null&&String(v).trim()!=='')return v;}}}return '';}
function ensureGroup(name){name=String(name||'').trim();if(!name)return '';var f=null;try{f=DB.groups.find(function(g){return (g.name||'')===name;});}catch(e){}if(f)return f.id;var g={id:'PG'+Date.now().toString(36)+Math.floor(Math.random()*1e4),name:name};DB.groups.push(g);return g.id;}
function mapRow(r,i){var name=String(shPick(r,['name','الاسم','الطالب'])||'').trim();if(!name)return null;var grp=String(shPick(r,['group','المجموعة','المجموعه'])||'').trim();return{id:'SH_'+i,name:name,phone:String(shPick(r,['phone','الهاتف','موبايل','mobile'])||'').replace(/\D/g,''),grade:gradeSafe(shPick(r,['grade','الصف'])||''),groupId:grp?ensureGroup(grp):'',day:String(shPick(r,['day','اليوم'])||''),hour:String(shPick(r,['hour','time','الموعد','الوقت'])||''),level:'',paid:parseInt(shPick(r,['paid','المدفوع']) )||0,otherExpenses:0,report:'',profileImage:'',attendance:parseInt(shPick(r,['sessions','الحصص']) )||0,isActivated:true,payments:[]};}
function groupOf(id){return DB.groups.find(function(g){return g.id===id;})||null;}

function renderProfile(){
  var t=DB.teacher||{};
  var full=((t.firstName||'')+' '+(t.lastName||'')).trim()||'المعلم';
  document.title=full+' | بورتفوليو المعلم';
  $('tName').textContent=full;
  $('topName').textContent=full+' 🎓';
  $('tEn').textContent=t.enName||'';
  $('tEn').style.display=t.enName?'':'none';
  $('tTitle').textContent=t.title||'معلم';
  $('tExp').textContent=t.exp?('خبرة '+t.exp+' سنة'):'';
  $('tExp').style.display=t.exp?'':'none';
  $('tSpec').textContent=t.specialty||'';
  $('tSpec').style.display=t.specialty?'':'none';
  if(t.quote){$('tQuoteBox').classList.remove('hidden');$('tQuote').textContent=t.quote;}else{$('tQuoteBox').classList.add('hidden');}
  if(t.photo){$('tPhoto').innerHTML='<img src="'+t.photo+'">';}else{$('tPhoto').innerHTML='<img src="../logo.png" alt="شعار التطبيق">';}
  if(t.whatsapp){var w=$('tWa');w.classList.remove('hidden');var ph=String(t.whatsapp).replace(/\D/g,'');var intl=ph;if(ph.length===11&&ph.charAt(0)==='0')intl='20'+ph.slice(1);w.href='https://wa.me/'+intl;}
  if(t.facebook){var f=$('tFb');f.classList.remove('hidden');f.href=t.facebook;}
  try{var ss=$('stStudents');if(ss)ss.textContent=DB.students.length;}catch(e){}
  try{var sg=$('stGroups');if(sg)sg.textContent=DB.groups.length;}catch(e){}
  $('loadBox').classList.add('hidden');
  $('profileBox').classList.remove('hidden');
}

function show(which){['loginView','chooseView','stuView'].forEach(function(id){$(id).classList.toggle('hidden',id!==which);});if(which==='loginView'){try{var fb=$('followBody');if(fb)fb.classList.remove('hidden');var fc=$('followChev');if(fc)fc.classList.add('open');}catch(e){}}window.scrollTo({top:document.getElementById('loginView')?document.getElementById('loginView').offsetTop-20:0,behavior:'smooth'});}
function loginErr(m){var e=$('loginErr');if(!m){e.classList.remove('show');e.textContent='';return;}e.textContent=m;e.classList.add('show');}
function doLogin(){
  loginErr('');
  var q=normPhone($('phInput').value);
  if(!q||q.length<9){loginErr('اكتب رقم هاتف صحيح (11 رقم يبدأ بـ 01)');return;}
  var found=DB.students.filter(function(s){return normPhone(s.phone)===q;});
  if(!found.length){loginErr('لا يوجد طالب مسجل بهذا الرقم — تواصل مع المعلم');return;}
  try{sessionStorage.setItem('t_phone',q);}catch(e){}
  if(found.length===1){openStudent(found[0].id);return;}
  $('chooseSub').textContent='وجدنا '+found.length+' طلاب بهذا الرقم — اختر واحداً';
  var box=$('chooseList');box.innerHTML='';
  found.forEach(function(s){var g=groupOf(s.groupId);var b=document.createElement('button');b.className='ch-row';b.innerHTML='<div class="ch-av">'+(s.profileImage?'<img src="'+s.profileImage+'">':esc((s.name||'?').charAt(0)))+'</div><div style="flex:1;min-width:0"><b>'+esc(s.name||'—')+'</b><small>'+esc(gradeSafe(s.grade))+(g?' • '+esc(g.name):'')+'</small></div><span style="color:var(--accent);font-weight:900">‹</span>';b.onclick=function(){openStudent(s.id);};box.appendChild(b);});
  show('chooseView');
}
function finBadge(st){var f=fin(st);if(f.clear)return '<span class="b2 clear">خالص 🟢</span>';return '<span class="b2 late">'+f.unpaid+' حصة ('+f.rest+' ج) 🟡</span>';}
function openStudent(id){
  var s=DB.students.find(function(x){return x.id===id;});if(!s)return;
  try{sessionStorage.setItem('t_sid',id);}catch(e){}
  var g=groupOf(s.groupId),f=fin(s);
  $('vAvatar').innerHTML=s.profileImage?'<img src="'+s.profileImage+'">':esc((s.name||'?').charAt(0));
  $('vName').textContent=s.name||'—';
  $('vBadges').innerHTML='<span class="b2 grade">'+esc(gradeSafe(s.grade))+'</span>'+(g?'<span class="b2 grade">'+esc(g.name)+'</span>':'')+finBadge(s);
  var att=attListOf(s),total=att.length,month=Math.floor(total/8)+1,pos=total%8;
  $('vGrid').innerHTML='<div class="d-item"><div class="ic" style="background:rgba(37,99,235,.12);color:#2563eb">📅</div><div><small>موعد الحصة</small><b>'+esc((((s.day||'—')+' '+(s.hour||'')).trim()))+'</b></div></div>'
    +'<div class="d-item"><div class="ic" style="background:rgba(34,197,94,.12);color:#16a34a">✅</div><div><small>الحصص الحاضرة</small><b>'+total+' حصة</b></div></div>'
    +'<div class="d-item"><div class="ic" style="background:rgba(245,158,11,.14);color:#b45309">💵</div><div><small>المدفوع</small><b>'+(s.paid||0)+' ج.م</b></div></div>'
    +'<div class="d-item"><div class="ic" style="background:rgba(239,68,68,.1);color:#dc2626">🧾</div><div><small>المتبقي</small><b>'+f.rest+' ج.م</b></div></div>';
  $('vReport').textContent=(s.report||'').trim()||'لا يوجد تقرير بعد —';
  var dots='';var cur=pos===0?(total>0?8:0):pos;for(var i=1;i<=8;i++){dots+='<span class="dot'+(i<=cur?' on':'')+'">'+i+'</span>';}
  $('vMonth').textContent='الشهر '+month+' ('+cur+'/8)';
  $('vDots').innerHTML=dots;
  var pays=Array.isArray(s.payments)?s.payments.slice(-6).reverse():[];
  $('vPays').innerHTML=pays.length?pays.map(function(p){var dt='';try{dt=new Date(p.date).toLocaleDateString('ar-EG',{day:'numeric',month:'short'});}catch(e){}return '<div class="pay-row"><span>✅</span><div style="flex:1"><b>'+(parseInt(p.amount)||0)+' ج.م</b> <small>'+esc(p.month||'')+(dt?' • '+esc(dt):'')+'</small></div></div>';}).join(''):'<div style="text-align:center;color:var(--muted);font-size:12.5px;font-weight:700;padding:8px">لا توجد مدفوعات مسجلة بعد</div>';
  show('stuView');
}
$('loginBtn').onclick=doLogin;
try{var ft=$('followToggle');if(ft)ft.onclick=function(){var b=$('followBody');if(!b)return;b.classList.toggle('hidden');var c=$('followChev');if(c)c.classList.toggle('open',!b.classList.contains('hidden'))};}catch(e){}
$('phInput').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
$('backBtn').onclick=function(){show('loginView');};

(function boot(){
try{
  setTimeout(function(){try{if($('profileBox').classList.contains('hidden')&&$('errBox').classList.contains('hidden'))showErr('تعذر فتح الصفحة — تحقق من الإنترنت ثم أعد تحميل الصفحة');}catch(e){}},20000);
  var q=getParams();
  function localTeacher(u){try{var local=JSON.parse(localStorage.getItem('elmistar_teacher_v2')||'null');if(local){var t=normTeacher(local);if(!u||t.username===u)return t;}}catch(e){}return null;}
  function localStudents(){var s=[],g=[];try{s=JSON.parse(localStorage.getItem('elmistar_students_v1')||'[]')||[];}catch(e){}try{g=JSON.parse(localStorage.getItem('elmistar_groups_v1')||'[]')||[];}catch(e){}return{students:Array.isArray(s)?s:[],groups:Array.isArray(g)?g:[]};}
  if(!q.u){
    var autoT=localTeacher('');
    if(autoT&&autoT.username){DB.teacher=autoT;var ls=localStudents();DB.students=ls.students;DB.groups=ls.groups;renderProfile();return;}
    showErr('رابط ناقص — افتح صفحة المعلم من الرابط المختصر (teacher.html?u=اليوزر)');return;
  }
  if(!q.f&&!q.a&&!q.s){
    fetchRegistry(q.u,function(found){
      if(found&&(found.f||found.a||found.s)){q.f=found.f||'';q.a=found.a||'';q.s=found.s||'';loadWithSource(q);return;}
      var lt=localTeacher(q.u);
      if(lt){DB.teacher=lt;var lss=localStudents();DB.students=lss.students;DB.groups=lss.groups;renderProfile();return;}
      showErr('لم يتم العثور على صفحة "'+q.u+'" — تأكد من رفع ملف teachers.json مع الموقع، أو افتح الرابط الكامل من التطبيق');return;
    });
    return;
  }
  loadWithSource(q);
  function loadWithSource(q){
  if(q.f){
    var dot=q.f.indexOf('.');
    if(dot<=0){showErr('رابط فايربيز غير صالح');return;}
    var pid=decodeURIComponent(q.f.slice(0,dot)),pkey=decodeURIComponent(q.f.slice(dot+1));
    restGet(pid,pkey,'elmistar/main',function(main){
      restGet(pid,pkey,'teachers/'+encodeURIComponent(q.u),function(tDoc){
        var teacher=tDoc?normTeacher(tDoc):(main&&main.teacher?normTeacher(main.teacher):null);
        if(!teacher||!teacher.username||teacher.username!==q.u){
          var fbLocal=localTeacher(q.u);
          if(fbLocal){teacher=fbLocal;}
          else if(main&&Array.isArray(main.students)){
            teacher={firstName:q.u,title:'معلم',exp:'',specialty:'',quote:'',whatsapp:'',facebook:'',username:q.u,photo:'',enName:'',lastName:''};
          }
          else{showErr('لم يتم العثور على المعلم "'+q.u+'" في قاعدة البيانات — تأكد من حفظ بيانات المعلم ورفعها');return;}
        }
        DB.teacher=teacher;
        DB.students=(main&&Array.isArray(main.students))?main.students:[];
        DB.groups=(main&&Array.isArray(main.groups))?main.groups:[];
        renderProfile();
      });
    });
    return;
  }
  var appUrl=q.a||'';
  if(appUrl){
    fetch(appUrl+(appUrl.indexOf('?')>=0?'&':'?')+'action=pull').then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok){showErr('تعذر قراءة بيانات المعلم من الرابط');return;}
      (d.groups||[]).forEach(function(g){if(g&&g.name)ensureGroup(g.name);});
      var out=[];(d.students||[]).forEach(function(r,i){var s=mapRow(r,i);if(s)out.push(s);});
      DB.students=out;
      var t=d.teacher?normTeacher(d.teacher):null;
      if(!t||!t.username||t.username!==q.u){
        var appLocal=localTeacher(q.u);
        if(appLocal){DB.teacher=appLocal;renderProfile();return;}
        if(!t||!t.username){
          DB.teacher={firstName:q.u,title:'معلم',exp:'',specialty:'',quote:'',whatsapp:'',facebook:'',username:q.u,photo:'',enName:'',lastName:''};
          renderProfile();return;
        }
        showErr('اليوزر "'+q.u+'" غير مطابق لبيانات المعلم المحفوظة — حدّث كود الـ Web App (انسخ الكود الجديد من الإعدادات وأعد النشر بإصدار جديد) ثم احفظ بيانات المعلم مرة أخرى');return;
      }
      DB.teacher=t;renderProfile();
    }).catch(function(){showErr('تعذر الاتصال برابط المعلم — تحقق من الإنترنت');});
    return;
  }
  if(q.s){
    var sLocal=localTeacher(q.u);
    if(sLocal){DB.teacher=sLocal;}else{DB.teacher={firstName:q.u,title:'معلم',exp:'',specialty:'',quote:'',whatsapp:'',facebook:'',username:q.u,photo:'',enName:'',lastName:''};}
    var tabs=['students','الطلاب','Sheet1',''],ti=0;
    (function next(){
      if(ti>=tabs.length){var ls=localStudents();if(ls.students.length){DB.students=ls.students;DB.groups=ls.groups;}renderProfile();return;}
      var tab=tabs[ti++];
      var gu='https://docs.google.com/spreadsheets/d/'+encodeURIComponent(q.s)+'/gviz/tq?tqx=out:json'+(tab?('&sheet='+encodeURIComponent(tab)):'');
      fetch(gu).then(function(r){return r.text();}).then(function(txt){
        var m=String(txt||'').match(/setResponse\(([\s\S]+)\)\s*;?\s*$/);
        if(!m)throw 0;
        var j=JSON.parse(m[1]);if(!j||j.status==='error')throw 0;
        var cols=(j.table.cols||[]).map(function(c,ci){return c.label||c.id||('c'+ci);});
        var rows=(j.table.rows||[]).map(function(rw){var o={};(rw.c||[]).forEach(function(c,ci){o[cols[ci]]=(c&&(c.v!=null?c.v:''));});return o;}).filter(function(o){return Object.keys(o).some(function(k){return String(o[k]).trim()!=='';});});
        if(!rows.length)throw 0;
        var out=[];rows.forEach(function(r,ix){var s=mapRow(r,ix);if(s)out.push(s);});
        DB.students=out;renderProfile();
      }).catch(function(){next();});
    })();
    return;
  }
  try{
    var local=JSON.parse(localStorage.getItem('elmistar_teacher_v2')||'null');
    if(local&&String(local.username||'').toLowerCase()===q.u){
      DB.teacher=normTeacher(local);
      try{DB.students=JSON.parse(localStorage.getItem('elmistar_students_v1')||'[]')||[];}catch(e){}
      try{DB.groups=JSON.parse(localStorage.getItem('elmistar_groups_v1')||'[]')||[];}catch(e){}
      renderProfile();return;
    }
  }catch(e){}
  showErr('رابط ناقص — افتح الصفحة من رابط البورتفوليو الكامل داخل التطبيق');
  }
}catch(err){try{showErr('حدث خطأ أثناء فتح الصفحة — أعد تحميلها');}catch(e){}}
})();
})();
