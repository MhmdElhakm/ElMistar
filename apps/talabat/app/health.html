<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صحتي الطبيعية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#150f3d;--bg2:#1c1550;--card:#241b63;--card2:#2c2374;--line:rgba(255,255,255,.09);--txt:#f2f0ff;--mut:#a7a2d6;--acc:#8f80ff;--accT:#ffffff;--navOn:#cfc8ff;--amb:#ffd070;--pink:#ff8f9a;--grn:#6fe0b0;--red:#ff7b7b;--shadow:0 14px 34px rgba(5,2,30,.45)}
[data-theme=light]{--bg:#f1efff;--bg2:#ffffff;--card:#ffffff;--card2:#f3f1ff;--line:rgba(70,50,160,.12);--txt:#1c1450;--mut:#6b65a0;--acc:#6a58f0;--accT:#ffffff;--navOn:#5a48e0;--amb:#a86a00;--pink:#d6455d;--grn:#17895a;--red:#d33a3a;--shadow:0 12px 28px rgba(70,50,160,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Cairo',Tahoma,'Segoe UI',sans-serif;background:radial-gradient(800px 420px at 90% -5%,color-mix(in srgb,var(--acc) 22%,transparent),transparent),var(--bg);color:var(--txt);min-height:100vh;line-height:1.6}
button{font-family:inherit;color:inherit}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.app{max-width:480px;margin:auto;padding:16px 16px 190px}
header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.date{color:var(--mut);font-size:12.5px}
.brand{font-size:23px;font-weight:800;color:var(--acc);display:flex;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--acc);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}

/* hero */
.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 38%,var(--card)),var(--card) 70%);border:1px solid var(--line);border-radius:30px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:14px;cursor:pointer}
.hero::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07);top:-70px;inset-inline-start:-30px}
.hrow{display:flex;align-items:center;gap:12px;position:relative}
.hav{width:62px;height:62px;border-radius:50%;border:3px solid var(--amb);background:var(--bg2);display:grid;place-items:center;color:var(--grn);flex:none}
.hgrow{flex:1}
.hgrow small{color:var(--mut);font-size:13px}
.hgrow h2{margin:0;font-size:24px;font-weight:800}
.hpill{background:rgba(255,255,255,.1);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap;color:var(--txt)}
.hpill .i{color:var(--amb)}
.hmsg{margin:14px 0;background:color-mix(in srgb,var(--bg) 65%,transparent);border-radius:18px;padding:13px 14px;text-align:center;font-weight:700;font-size:14.5px;position:relative}
.week{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;position:relative}
.week::before{content:"";position:absolute;top:21px;inset-inline:22px;height:3px;background:var(--line)}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:10px;color:var(--mut);font-weight:600;flex:1}
.wc{width:42px;height:42px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:#fff;border:2px solid transparent}
.wc.done{background:var(--acc);box-shadow:0 0 16px color-mix(in srgb,var(--acc) 55%,transparent)}
.wc.today{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent)}
.wd.fl{flex:none;color:var(--amb);padding-top:5px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{border:0;border-radius:28px;height:168px;padding:16px;position:relative;overflow:hidden;cursor:pointer;color:#fff;text-align:start;box-shadow:var(--shadow)}
.tile::before{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14);top:-40px;inset-inline-end:-30px}
.tile.purple{background:linear-gradient(150deg,#a595ff,#7461f2)}
.tile.green{background:linear-gradient(150deg,#78e3b2,#3fbf86)}
.tile.coral{background:linear-gradient(150deg,#ffa3a0,#f2686f)}
.tile.yellow{background:linear-gradient(150deg,#ffdc82,#f4be3f);color:#3a2a00}
.ticon{width:54px;height:54px;border-radius:18px;background:rgba(255,255,255,.25);display:grid;place-items:center;position:absolute;top:16px;inset-inline-start:16px;right:auto}
.ticon{inset-inline-start:auto;inset-inline-end:16px}
.ttxt{position:absolute;bottom:16px;inset-inline-end:16px;text-align:end;max-width:calc(100% - 66px)}
.ttxt b{display:block;font-size:21px;font-weight:800;line-height:1.3}
.ttxt span{font-size:12.5px;opacity:.9}
.tarr{position:absolute;bottom:16px;inset-inline-start:14px;width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center}
.tile.purple .tarr{color:#6a58f0}.tile.green .tarr{color:#1f8e60}.tile.coral .tarr{color:#d84a55}.tile.yellow .tarr{color:#8a6100}
.wide{width:100%;border:1px solid var(--line);background:var(--card);border-radius:24px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:14px;box-shadow:var(--shadow);text-align:start}
.wide b{display:block;font-size:16px}.wide span.s{color:var(--mut);font-size:12.5px}
.wide .tarr{position:static;background:var(--acc);color:#fff}

.banner{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--amb) 12%,transparent);border:1px solid color-mix(in srgb,var(--amb) 40%,transparent);color:var(--amb);padding:12px 14px;border-radius:18px;font-size:13px;line-height:1.8;margin:12px 0}
.banner.red{background:color-mix(in srgb,var(--red) 12%,transparent);border-color:color-mix(in srgb,var(--red) 40%,transparent);color:var(--red)}
.banner.blue{background:color-mix(in srgb,var(--acc) 14%,transparent);border-color:color-mix(in srgb,var(--acc) 40%,transparent);color:var(--navOn)}
.banner .i{margin-top:5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:color-mix(in srgb,var(--acc) 14%,transparent);inset-inline-start:-35px;bottom:-45px}
.stat b{display:block;font-size:24px;color:var(--acc);font-weight:800;position:relative;z-index:1}
.stat span{color:var(--mut);font-size:12px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:19px;font-weight:800}
.sub{color:var(--mut);font-size:12.5px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.head .grow{flex:1}
.hico{width:46px;height:46px;border-radius:15px;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);display:grid;place-items:center;flex:none}
.hico.red{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.hico.grn{background:color-mix(in srgb,var(--grn) 16%,transparent);color:var(--grn)}
.hico.amb{background:color-mix(in srgb,var(--amb) 16%,transparent);color:var(--amb)}
.sq{width:46px;height:46px;border-radius:15px;border:0;background:var(--acc);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 45%,transparent);flex:none}
.lbl{color:var(--mut);font-size:12px;margin:12px 4px 6px;font-weight:700}
.seg{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 0 10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-width:84px;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:18px;padding:10px 8px;cursor:pointer;text-align:center}
.seg button b{display:block;font-size:14px}
.seg button small{color:var(--mut);font-size:11px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 45%,transparent)}
.seg button.on small{color:#fff;opacity:.85}
.pills{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.pill{flex:1 0 auto;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.pill.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 45%,transparent)}
.srow{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.field{flex:1;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:0 14px;height:56px;color:var(--mut)}
.field input{flex:1;border:0;background:transparent;color:var(--txt);font-family:inherit;font-size:15px;outline:none;min-width:0}
.field:focus-within{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.dd{position:relative;margin-bottom:6px}
.ddb{width:100%;display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:10px 14px;cursor:pointer;text-align:start;min-height:60px;transition:.15s}
.ddb:hover{border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.dd.open .ddb{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 20%,transparent)}
.ddi{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);display:grid;place-items:center;flex:none}
.ddv{flex:1;display:flex;flex-direction:column;line-height:1.35;min-width:0}
.ddv b{font-size:15px;font-weight:700}
.ddv small{color:var(--mut);font-size:12px}
.ddc{color:var(--mut);transition:transform .2s;display:grid}
.dd.open .ddc{transform:rotate(180deg);color:var(--acc)}
.ddp{display:none;position:absolute;top:calc(100% + 8px);inset-inline:0;background:var(--bg2);border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 50px rgba(5,2,30,.55);z-index:25;padding:8px;animation:ddin .16s ease-out}
.dd.open .ddp{display:block}
@keyframes ddin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ddsearch{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px;color:var(--mut);margin-bottom:6px}
.ddsearch input{flex:1;border:0;background:transparent;color:var(--txt);font-family:inherit;font-size:14px;outline:none;min-width:0}
.ddl{max-height:280px;overflow-y:auto;scrollbar-width:thin}
.ddo{width:100%;display:flex;align-items:center;gap:12px;background:transparent;border:0;border-radius:14px;padding:8px 10px;cursor:pointer;text-align:start;color:var(--txt)}
.ddo:hover{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.ddo.on{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--navOn)}
.ddo.on .i:last-child{color:var(--acc)}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip .i{color:var(--acc)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.chip.on .i{color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:11px 14px;margin-top:6px;cursor:pointer;font-size:14px}
.toggle span{display:flex;gap:8px;align-items:center}
.sw{width:44px;height:25px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}
.sw.on::after{inset-inline-start:22px}
.item{background:var(--card2);border-radius:22px;padding:12px 14px;margin-bottom:10px;border-right:4px solid var(--c)}
.item .row{display:flex;align-items:center;gap:12px;cursor:pointer}
.ico{width:46px;height:46px;border-radius:15px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);display:grid;place-items:center;flex:none}
.item h3{margin:0;font-size:15px;font-weight:700}
.meta{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:4px}
.tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--c);background:transparent;cursor:pointer;color:#fff;display:grid;place-items:center;flex:none}
.tick.on{background:var(--c)}
.chev{color:var(--mut);transition:.2s}
.item.open .chev{transform:rotate(180deg)}
.det{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13.5px;line-height:1.9}
.item.open .det{display:block}
.det h4{margin:6px 0 2px;color:var(--acc);font-size:13px}
.det ul,.det ol{margin:0;padding-inline-start:20px}
.tip{background:color-mix(in srgb,var(--amb) 13%,transparent);color:var(--amb);padding:9px 11px;border-radius:14px;margin-top:8px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.tip .i{margin-top:5px}
.caut{background:color-mix(in srgb,var(--red) 11%,transparent);color:var(--red);padding:9px 11px;border-radius:14px;margin-top:8px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.caut .i{margin-top:5px}
.empty{text-align:center;color:var(--mut);padding:18px;font-size:14px}
ul.flags{margin:0;padding-inline-start:20px;font-size:14px;line-height:2}
ul.tl{list-style:none;margin:0;padding:0}
ul.tl li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
ul.tl li:last-child{border:0}
ul.tl .i{color:var(--acc)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.mini{border-radius:26px;padding:16px;min-height:150px;border:1px solid var(--line);cursor:pointer;text-align:start;display:flex;flex-direction:column;justify-content:space-between}
.mini.blue{background:linear-gradient(160deg,#1f3a6e,#193056);color:#d9e8ff}
.mini.maroon{background:linear-gradient(160deg,#5a2236,#43192a);color:#ffd9e0;cursor:default}
[data-theme=light] .mini.blue{background:linear-gradient(160deg,#dbe8ff,#c9dcff);color:#17356b}
[data-theme=light] .mini.maroon{background:linear-gradient(160deg,#ffe0e6,#ffd0d9);color:#7a1f36}
.mini b{display:block;font-size:17px;font-weight:800;margin-top:10px}
.mini span{font-size:12.5px;opacity:.85;line-height:1.7}
.svgbox{background:var(--card2);border-radius:22px;padding:10px;text-align:center;border:1px solid var(--line)}
.svgbox svg{width:100%;max-width:250px;height:auto}
.pt{cursor:pointer}
.pt circle.dot{fill:var(--amb);stroke:#fff;stroke-width:2}
.pt.on circle.dot{fill:var(--pink)}
.pt circle.ring{fill:none;stroke:var(--amb);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s infinite}
.pt.on circle.ring{stroke:var(--pink)}
@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(2.2);opacity:0}}
.pt text{fill:var(--txt);font-size:11px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--card2);stroke-width:3px}
.bwrap{background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),var(--bg);border:1px solid var(--line);border-radius:26px;padding:18px 12px 16px;margin-bottom:14px;text-align:center}
.breath{--pc:var(--acc);width:250px;height:250px;margin:0 auto;position:relative;display:grid;place-items:center}
.brs{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.brs .tr{fill:none;stroke:var(--line);stroke-width:6}
.brs .pg{fill:none;stroke:var(--pc);stroke-width:6;stroke-linecap:round;stroke-dasharray:691.15;stroke-dashoffset:691.15;filter:drop-shadow(0 0 6px var(--pc));transition:stroke .4s}
.halo{position:absolute;width:176px;height:176px;border-radius:50%;background:var(--pc);opacity:.18;filter:blur(18px);transform:scale(.62);transition:transform 4s linear,background .4s}
.bc{position:absolute;width:176px;height:176px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff8,transparent 42%),radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--pc) 70%,#fff),var(--pc) 62%,color-mix(in srgb,var(--pc) 60%,#000));transform:scale(.62);transition:transform 4s linear,background .4s;box-shadow:0 0 40px color-mix(in srgb,var(--pc) 45%,transparent),inset 0 -10px 24px rgba(0,0,0,.18)}
.breath.idle .bc,.breath.idle .halo{animation:idle 3.2s ease-in-out infinite}
@keyframes idle{50%{transform:scale(.68)}}
.bt{position:relative;z-index:1;color:#fff;display:flex;flex-direction:column;align-items:center;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.bt .bl{font-size:17px;font-weight:700;opacity:.95;margin-bottom:4px}
.bt .bn{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;min-height:60px;display:grid;place-items:center}
.bsteps{display:flex;justify-content:center;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.bstep{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--mut);transition:.25s}
.bstep i{font-style:normal;font-variant-numeric:tabular-nums}
.bstep.on{color:#fff;background:var(--c);border-color:var(--c);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 45%,transparent)}
.bcyc{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.bcyc i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:.3s}
.bcyc i.done{background:var(--acc)}
.bcyc i.cur{background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 28%,transparent)}
.big{width:100%;border:0;border-radius:20px;padding:14px;background:var(--acc);color:#fff;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 10px 24px color-mix(in srgb,var(--acc) 45%,transparent)}
.big.stop{background:var(--card2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.stretch{display:flex;gap:12px;align-items:center;background:var(--card2);border-radius:22px;padding:10px 12px;margin-bottom:10px}
.stretch svg{flex:none;background:var(--bg);border-radius:16px}
.stretch h3{margin:0 0 2px;font-size:15px}
.stretch ol{margin:4px 0 0;padding-inline-start:18px;font-size:13px;line-height:1.8}
.cups{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.cup{border:1px solid var(--line);background:var(--card2);border-radius:16px;padding:12px 0;cursor:pointer;color:var(--mut);display:grid;place-items:center}
.cup.on{color:var(--acc);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.tipcard{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
.tipcard p{margin:0 0 12px;font-weight:700;font-size:15px;line-height:1.8}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block;cursor:pointer}
.dots i.on{width:22px;border-radius:8px;background:var(--acc)}
.badge{width:62px;height:62px;border-radius:50%;background:var(--amb);display:grid;place-items:center;flex:none;color:#3a2a00;box-shadow:0 0 22px color-mix(in srgb,var(--amb) 45%,transparent)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:30px 30px 0 0;display:flex;justify-content:space-around;padding:10px 10px 14px;z-index:30;box-shadow:0 -10px 30px rgba(5,2,30,.35)}
.nav button{border:0;background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700;flex:1;max-width:84px}
.nav button.on{color:var(--navOn);background:color-mix(in srgb,var(--acc) 22%,transparent)}
.foot{color:var(--mut);font-size:11.5px;text-align:center;margin:16px 0 8px;line-height:1.8}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="sprite"></defs></svg>
<div class="app">

 return `<div class="card">${chead('wind','تمارين التنفس',b.s)}
 ${dd2('br','التمرين',{icon:'wind',n:b.n,s:b.s},BR.map((x,i)=>({a:'pickbr',d:`data-i="${i}"`,n:x.n,s:x.s,icon:'wind',on:i===S.br})))}
 <div class="bwrap"><div class="breath idle" id="breath"><svg class="brs" viewBox="0 0 250 250"><circle class="tr" cx="125" cy="125" r="110"/><circle class="pg" id="bpg" cx="125" cy="125" r="110"/></svg><div class="halo" id="bhalo"></div><div class="bc" id="bc"></div><div class="bt"><span class="bl" id="bl">جاهز</span><span class="bn" id="bn">${ic('wind',44)}</span></div></div>
 <div class="bsteps" id="bsteps">${b.ph.map((x,i)=>`<span class="bstep" data-i="${i}" style="--c:${phC(x[0])}">${x[0]} <i>${x[1]}ث</i></span>`).join('')}</div>
 <div class="bcyc" id="bcyc">${Array.from({length:b.cyc},()=>'<i></i>').join('')}</div>
 <div class="sub" id="bcy">${b.cyc} دورات · نحو ${Math.round(b.ph.reduce((t,x)=>t+x[1],0)*b.cyc/60*10)/10} دقيقة</div></div>
 <button class="big" id="bgo" data-a="brgo">ابدأ التمرين</button>
 <div class="tip">${ic('bulb',16)}<div>${b.note}</div></div><div class="caut">${ic('alert',16)}<div>توقف إن شعرت بدوخة أو ضيق. ولا يغني عن علاج نوبات الهلع الشديدة أو مشاكل التنفس.</div></div></div>
 <div class="card" id="stretch">${chead('activity','تمارين الإطالة','خطوات مصورة بسيطة بحركة لطيفة','grn')}
 ${STR.map(s=>`<div class="stretch">${fig(s.pose)}<div><h3>${s.n}</h3><div class="meta">${ic('clock',12)} ${s.time}</div><ol>${s.st.map(x=>`<li>${x}</li>`).join('')}</ol></div></div>`).join('')}
 <div class="caut">${ic('alert',16)}<div>تحرك ببطء ولا تتجاوز حد الألم. استشر الطبيب عند وجود إصابة أو مرض في العمود الفقري أو المفاصل.</div></div></div>`;
}
function viewDay(){
 const d=S.day,hd=d.h.length;
 return `<div class="stats"><div class="stat"><b>${hd}/${HAB.length}</b><span>عادات منجزة اليوم</span></div><div class="stat"><b>${d.w}/8</b><span>أكواب الماء</span></div></div>
 <div class="card">${chead('calendar','عادات اليوم','أنجز 3 عادات أو أكثر لتزيد سلسلتك')}
 ${HAB.map((h,i)=>{const on=d.h.includes(i);return `<div class="item" style="--c:var(--acc)"><div class="row" data-a="hab" data-i="${i}"><div class="ico">${ic(h[0],22)}</div><div style="flex:1"><h3>${h[1]}</h3></div><button class="tick ${on?'on':''}">${on?ic('check',16):''}</button></div></div>`}).join('')}</div>
 <div class="card">${chead('droplet','الماء','اضغط على الكوب الذي شربته','')}
 <div class="cups">${Array.from({length:8},(_,i)=>`<button class="cup ${i<d.w?'on':''}" data-a="water" data-i="${i}" aria-label="كوب ${i+1}">${ic('glass',26)}</button>`).join('')}</div></div>
 <div class="card">${chead('shield','نصائح وقائية','','amb')}
 <ul class="tl">${TIPS.map(t=>`<li>${ic(t[0],20)}<span>${t[1]}</span></li>`).join('')}</ul></div>`;
}
const views={home:viewHome,sym:viewSym,herb:viewHerb,acu:viewAcu,ex:viewEx,day:viewDay};
const NAV=[['home','الرئيسية','home'],['sym','الأعراض','stethoscope'],['herb','العطار','leaf'],['acu','الضغط','hand'],['ex','التمارين','wind']];
$('#nav').innerHTML=NAV.map(n=>`<button data-a="nav" data-v="${n[0]}">${ic(n[2],24)}${n[1]}</button>`).join('');
function render(){
 stopBreath();
 $('#view').innerHTML=views[S.view]();
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view||(S.view==='day'&&b.dataset.v==='home')));
}

/* ---------- التنفس ---------- */
let bT=null,bI=null,bRun=false;
const phC=l=>/احبس/.test(l)?'var(--amb)':/زفير|افرغ/.test(l)?'var(--grn)':'var(--acc)';
const CIRC=691.15;
function resetBreathUI(label,html){
 const br=$('#breath');if(!br)return;
 br.classList.add('idle');br.style.removeProperty('--pc');
 ['#bc','#bhalo'].forEach(q=>{const e=$(q);e.style.transitionDuration='.6s';e.style.transform=''});
 const pg=$('#bpg');pg.style.transition='none';pg.style.strokeDashoffset=CIRC;
 $('#bl').textContent=label;$('#bn').innerHTML=html;
 document.querySelectorAll('.bstep').forEach(x=>x.classList.remove('on'));
 document.querySelectorAll('#bcyc i').forEach(x=>x.className='');
}
function stopBreath(){bRun=false;clearTimeout(bT);clearInterval(bI);const g=$('#bgo');if(g){g.textContent='ابدأ التمرين';g.classList.remove('stop');resetBreathUI('جاهز',ic('wind',44))}}
function startBreath(){
 const b=BR[S.br];let ph=0,cy=0;bRun=true;
 const g=$('#bgo');g.textContent='إيقاف';g.classList.add('stop');
 $('#breath').classList.remove('idle');
 const step=()=>{
  if(!bRun)return;
  const [lab,sec,sc]=b.ph[ph],col=phC(lab);
  const br=$('#breath');br.style.setProperty('--pc',col);
  const k=.62+(sc-.55)/.45*.38;
  ['#bc','#bhalo'].forEach(q=>{const e=$(q);e.style.transitionDuration=sec+'s';e.style.transform=`scale(${k})`});
  const pg=$('#bpg');pg.style.transition='none';pg.style.strokeDashoffset=CIRC;void pg.getBoundingClientRect();
  pg.style.transition=`stroke-dashoffset ${sec}s linear,stroke .4s`;pg.style.strokeDashoffset=0;
  $('#bl').textContent=lab;
  document.querySelectorAll('.bstep').forEach((x,i)=>x.classList.toggle('on',i===ph));
  document.querySelectorAll('#bcyc i').forEach((x,i)=>x.className=i<cy?'done':i===cy?'cur':'');
  $('#bcy').textContent=`الدورة ${cy+1} من ${b.cyc}`;
  let left=sec;$('#bn').textContent=left;
  clearInterval(bI);bI=setInterval(()=>{left--;if(left>0)$('#bn').textContent=left},1000);
  bT=setTimeout(()=>{ph++;if(ph>=b.ph.length){ph=0;cy++;if(cy>=b.cyc){bRun=false;clearInterval(bI);const g2=$('#bgo');g2.textContent='ابدأ التمرين';g2.classList.remove('stop');resetBreathUI('أحسنت',ic('check',48));document.querySelectorAll('#bcyc i').forEach(x=>x.className='done');$('#bcy').textContent='اكتمل التمرين';return}}step()},sec*1000);
 };
 step();
}

/* ---------- الأحداث ---------- */
const goTop=()=>scrollTo({top:0,behavior:'smooth'});
const saveDay=()=>{store.set('day-'+dayKey,S.day);const h=histGet();h[dayKey]=S.day.h.length;store.set('hist',h)};
const refreshHerb=()=>{const q=S.hq.trim();$('#hlist').innerHTML=herbList(HERBS.filter(h=>!q||h.n.includes(q)||h.u.includes(q)))};
const A={
 nav(d){S.view=d.v;render();goTop()},
 theme(){const h=document.documentElement;const n=h.dataset.theme==='dark'?'light':'dark';h.dataset.theme=n;$('#themeBtn').innerHTML=ic(n==='dark'?'sun':'moon',22);store.set('theme',n)},
 sym(d){S.sym=d.id;S.open=null;S.flt='all';render()},
 gosym(d){S.sym=d.id;S.open=null;S.flt='all';S.view='sym';render();goTop()},
 hsearch(){const q=S.q.trim();const m=SY.find(s=>!q||s.n.includes(q));if(m)A.gosym({id:m.id})},
 age(d){S.age=+d.i;if(S.age<2)S.preg=false;render()},
 dd(d){S.dd=S.dd===d.id?null:d.id;S.dq='';render();if(S.dd==='sym'){const i=$('#dq');i&&i.focus({preventScroll:true})}},
 picksym(d){S.sym=d.id;S.open=null;S.flt='all';S.dd=null;S.dq='';render()},
 pickage(d){S.age=+d.i;if(S.age<2)S.preg=false;S.dd=null;render()},
 preg(){S.preg=!S.preg;render()},
 flt(d){S.flt=d.f;render()},
 open(d){S.open=S.open===d.k?null:d.k;render()},
 tick(d){S.tried[d.k]=!S.tried[d.k];if(!S.tried[d.k])delete S.tried[d.k];store.set('tried-'+dayKey,S.tried);render()},
 reset(){const sy=SY.find(x=>x.id===S.sym);sy.r.forEach(r=>delete S.tried[r.k]);store.set('tried-'+dayKey,S.tried);render()},
 goacu(d){S.view='acu';S.pt=d.p;S.pview=PT[d.p].v;render();goTop()},
 goex(d){S.view='ex';S.br=+d.i;render();goTop()},
 gost(){S.view='ex';render();$('#stretch').scrollIntoView({behavior:'smooth'})},
 herb(d){S.hopen=S.hopen===d.n?null:d.n;refreshHerb()},
 pview(d){S.pview=d.v;render()},
 pickview(d){S.pview=d.v;S.dd=null;render()},
 pickflt(d){S.flt=d.f;S.dd=null;render()},
 pickbr(d){S.br=+d.i;S.dd=null;render()},
 pt(d){S.pt=d.p;render()},
 brsel(d){S.br=+d.i;render()},
 brgo(){bRun?stopBreath():startBreath()},
 hab(d){const i=+d.i,h=S.day.h;const x=h.indexOf(i);x>=0?h.splice(x,1):h.push(i);saveDay();render()},
 water(d){const i=+d.i+1;S.day.w=S.day.w===i?i-1:i;saveDay();render()},
};
document.addEventListener('click',e=>{
 if(S.dd&&!e.target.closest('.dd')){S.dd=null;render();return}
 const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.dd){S.dd=null;render()}});
document.addEventListener('input',e=>{
 if(e.target.id==='dq'){S.dq=e.target.value;$('#ddl').innerHTML=symOpts()}
 if(e.target.id==='hq2'){S.q=e.target.value;$('#hchips').innerHTML=chipsHTML('gosym')}
 if(e.target.id==='hq'){S.hq=e.target.value;refreshHerb()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='hq2')A.hsearch()});

/* ---------- البدء ---------- */
$('#brand').innerHTML=ic('leaf',24)+' صحتي الطبيعية';
$('#date').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const th=store.get('theme','dark');document.documentElement.dataset.theme=th;$('#themeBtn').innerHTML=ic(th==='dark'?'sun':'moon',22);
render();
</script>
</body>
</html>
