<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>مدرّب الكلمات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: sky-blue header card, tinted task-style cards, floating bottom tab bar. RTL, content hugs the right edge. */
:root{
  --bg:#EAF5FC; --glow:#FFF1D2; --surface:#FFFFFF; --field:#F3F9FD; --fg:#1D2B3A; --muted:#7A8DA0; --line:#DCE8F1;
  --accent:#1CB0F6; --accent-dark:#0E8FCC; --accent-soft:#D8F0FD; --accent-fg:#FFFFFF;
  --good:#17A34A; --good-soft:#DCFCE7; --bad:#E5484D; --bad-soft:#FEE2E2; --warn:#A8570A; --warn-soft:#FEF0C7;
  --amber-b:#FEF3C7; --amber-e:#F59E0B; --amber-i:#A8570A;
  --sky-b:#E0F1FD; --sky-e:#1CB0F6; --sky-i:#0B78AE;
  --rose-b:#FCE7F3; --rose-e:#EC4899; --rose-i:#B0155E;
  --mint-b:#D3F8EC; --mint-e:#14B8A6; --mint-i:#0B7A6E;
  --vio-b:#EDE5FF; --vio-e:#8B5CF6; --vio-i:#5B2FC9;
  --ora-b:#FFE8D3; --ora-e:#FF7A1A; --ora-i:#B04A00;
  --shadow:0 10px 28px rgba(28,110,160,.10);
  --f-ui:'Baloo Bhaijaan 2','Cairo','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1620; --glow:#14303C; --surface:#132431; --field:#0E1C27; --fg:#E8F2F9; --muted:#8FA6B8; --line:#233847;
    --accent:#38BDF8; --accent-dark:#1E93C9; --accent-soft:#12394D; --accent-fg:#04202E;
    --good:#4ADE80; --good-soft:#123222; --bad:#FF8A8E; --bad-soft:#3B1B1D; --warn:#F5B94D; --warn-soft:#3A2D10;
    --amber-b:#392E12; --amber-e:#F5B02E; --amber-i:#F6C453;
    --sky-b:#10303F; --sky-e:#38BDF8; --sky-i:#7DD3FC;
    --rose-b:#3A1830; --rose-e:#F472B6; --rose-i:#F9A8D4;
    --mint-b:#0F3330; --mint-e:#2DD4BF; --mint-i:#5EEAD4;
    --vio-b:#2B2150; --vio-e:#A78BFA; --vio-i:#C4B5FD;
    --ora-b:#3D2512; --ora-e:#FB923C; --ora-i:#FDBA74;
    --shadow:0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1620; --glow:#14303C; --surface:#132431; --field:#0E1C27; --fg:#E8F2F9; --muted:#8FA6B8; --line:#233847;
  --accent:#38BDF8; --accent-dark:#1E93C9; --accent-soft:#12394D; --accent-fg:#04202E;
  --good:#4ADE80; --good-soft:#123222; --bad:#FF8A8E; --bad-soft:#3B1B1D; --warn:#F5B94D; --warn-soft:#3A2D10;
  --amber-b:#392E12; --amber-e:#F5B02E; --amber-i:#F6C453;
  --sky-b:#10303F; --sky-e:#38BDF8; --sky-i:#7DD3FC;
  --rose-b:#3A1830; --rose-e:#F472B6; --rose-i:#F9A8D4;
  --mint-b:#0F3330; --mint-e:#2DD4BF; --mint-i:#5EEAD4;
    --vio-b:#2B2150; --vio-e:#A78BFA; --vio-i:#C4B5FD;
    --ora-b:#3D2512; --ora-e:#FB923C; --ora-i:#FDBA74;
  --shadow:0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}

/* Each stage has its own accent so the app changes colour as the student moves forward. */
body[data-stage="1"]{--accent:#8B5CF6;--accent-dark:#6D3FD6;--accent-soft:#EDE5FF;--glow:#FCE4F3}
body[data-stage="2"]{--accent:#FF7A1A;--accent-dark:#D05A04;--accent-soft:#FFE8D3;--glow:#FFF6C9}
body[data-stage="3"]{--accent:#12B76A;--accent-dark:#0B9453;--accent-soft:#D6F6E6;--glow:#DDF4FF}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body[data-stage="1"]{--accent:#A78BFA;--accent-dark:#7C5CE0;--accent-soft:#2A2150;--glow:#2A1A3F}
  :root:not([data-theme="light"]) body[data-stage="2"]{--accent:#FB923C;--accent-dark:#D9731F;--accent-soft:#40250F;--glow:#3A2410}
  :root:not([data-theme="light"]) body[data-stage="3"]{--accent:#34D399;--accent-dark:#1FA574;--accent-soft:#0F3A2B;--glow:#0F3A33}
}
:root[data-theme="dark"] body[data-stage="1"]{--accent:#A78BFA;--accent-dark:#7C5CE0;--accent-soft:#2A2150;--glow:#2A1A3F}
:root[data-theme="dark"] body[data-stage="2"]{--accent:#FB923C;--accent-dark:#D9731F;--accent-soft:#40250F;--glow:#3A2410}
:root[data-theme="dark"] body[data-stage="3"]{--accent:#34D399;--accent-dark:#1FA574;--accent-soft:#0F3A2B;--glow:#0F3A33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background-color:var(--bg);
  background-image:radial-gradient(120% 50% at 0 0,var(--glow),transparent 62%),radial-gradient(color-mix(in srgb,var(--accent) 14%,transparent) 1.8px,transparent 2px);
  background-size:auto,26px 26px;
  background-repeat:no-repeat,repeat;
  color:var(--fg);font-family:var(--f-ui);font-weight:500;font-size:17px;line-height:1.6;
  padding-block:16px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:680px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
p{margin:0}
h2{margin:0;font-size:1.25rem;font-weight:800;line-height:1.35;text-wrap:balance}
.hint{color:var(--muted);font-size:.95rem}
.center{text-align:center;align-items:center}

.head{background:var(--surface);border-radius:26px;border-top:5px solid var(--accent);padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.hico{width:58px;height:58px;border-radius:19px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 65%,#fff),var(--accent));display:grid;place-items:center;color:#fff;box-shadow:0 8px 16px color-mix(in srgb,var(--accent) 35%,transparent);flex:none}
.htx{flex:1;min-width:0}
.htx h1{margin:0;font-size:1.3rem;font-weight:800;line-height:1.3;white-space:nowrap}
.htx p{color:var(--muted);font-size:.85rem;line-height:1.35}
.sbtn{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;transition:background .2s,color .2s,border-color .2s}
.sbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -10px 30px rgba(20,90,140,.13);
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav-in{max-width:680px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.ni{border:0;background:none;font:inherit;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;cursor:pointer;min-height:62px;position:relative;line-height:1.2}
.ni .pill{width:60px;height:36px;border-radius:18px;display:grid;place-items:center;transition:background .25s,color .25s,transform .25s}
.ni::after{content:"";width:34px;height:4px;border-radius:4px;background:transparent;margin-top:2px;transition:background .25s}
.ni.on{color:var(--accent);font-weight:700}
.ni.on .pill{background:var(--accent-soft);color:var(--accent);transform:translateY(-2px)}
.ni.on::after{background:var(--accent)}
.ni:disabled{opacity:.4;cursor:default}
.ni .dot{position:absolute;top:2px;right:calc(50% - 30px);width:11px;height:11px;border-radius:50%;background:var(--good);border:2px solid var(--surface)}

.panel{background:var(--surface);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.mid{justify-content:center}
.row.between{justify-content:space-between}
.btn{
  font:inherit;font-weight:700;font-size:1rem;min-height:50px;padding:0 20px;border-radius:16px;border:2px solid var(--line);
  background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,background .2s;
}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:0 4px 0 var(--accent-dark)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--accent-dark)}
.btn.big{width:100%;min-height:58px;font-size:1.15rem;border-radius:18px}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.live{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{font:inherit;font-weight:800;font-size:1.08rem;min-height:58px;border-radius:20px;border:2px solid var(--line);background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 32%,transparent)}
.cnt{min-width:32px;height:32px;border-radius:16px;display:inline-grid;place-items:center;background:var(--line);color:var(--muted);font-size:.95rem;padding:0 8px}
.seg .on .cnt{background:rgba(255,255,255,.3);color:inherit}

.addrow{display:flex;flex-wrap:wrap;gap:10px}
.fld{position:relative;flex:1 1 150px;min-width:0}
.inp{width:100%;min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--field);color:var(--fg);padding:0 16px;font:inherit;font-size:1.08rem}
.inp.hasmic{padding-left:54px}
.fld .mini{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0}
.fld .mini.live{background:var(--accent);color:var(--accent-fg)}
.plus{flex:0 0 56px;height:56px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--accent-dark);padding:0}
.plus:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dark)}
textarea{width:100%;min-height:170px;resize:vertical;font:inherit;font-size:1.05rem;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--field);color:var(--fg);text-align:start;line-height:1.9}
.preview{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:baseline;background:var(--accent-soft);border-radius:10px;padding:2px 12px;font-size:.92rem}
.chip i{font-style:normal;color:var(--muted)}
.chip.nomean{background:var(--warn-soft)}

.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.t0{--tb:var(--amber-b);--te:var(--amber-e);--ti:var(--amber-i)}
.t1{--tb:var(--sky-b);--te:var(--sky-e);--ti:var(--sky-i)}
.t2{--tb:var(--rose-b);--te:var(--rose-e);--ti:var(--rose-i)}
.t3{--tb:var(--mint-b);--te:var(--mint-e);--ti:var(--mint-i)}
.t4{--tb:var(--vio-b);--te:var(--vio-e);--ti:var(--vio-i)}
.t5{--tb:var(--ora-b);--te:var(--ora-e);--ti:var(--ora-i)}
.wc{display:flex;align-items:center;gap:12px;background:var(--tb);border-radius:22px;border-inline-start:6px solid var(--te);padding:12px 14px 12px 8px;min-height:84px;box-shadow:inset 0 0 0 1px rgba(120,140,160,.12)}
.wc .chk{width:36px;height:36px;border-radius:50%;border:3px solid var(--te);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;transition:background .2s,border-color .2s}
.wc.m .chk{background:var(--good);border-color:var(--good)}
.wc:not(.m) .chk svg{display:none}
.wc .ico{width:50px;height:50px;border-radius:17px;background:var(--surface);color:var(--te);display:grid;place-items:center;border:0;cursor:pointer;flex:none;padding:0;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.wc .ico:active{transform:scale(.94)}
.wtx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.wtx b{font-size:1.2rem;font-weight:800;overflow-wrap:anywhere;text-align:start}
.wtx span{font-size:.95rem;color:var(--ti);overflow-wrap:anywhere}
.wc .x{border:0;background:none;color:var(--muted);width:42px;height:42px;border-radius:14px;cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.empty{border:2px dashed var(--line);border-radius:22px;padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

.why{font-size:.78rem;font-weight:700;background:var(--accent-soft);color:var(--ti,var(--accent));border-radius:10px;padding:0 10px;white-space:nowrap}
.prompt.sm{font-size:1.35rem;font-weight:700}
.pcard{display:flex;gap:10px;align-items:center;width:100%;text-align:start;direction:ltr;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:600 1rem var(--f-ui);cursor:pointer;margin:0}
.pcard.sel{border-color:var(--accent)}
.pcard.good{border-color:var(--good);background:var(--good-soft)}
.pcard.bad{border-color:var(--bad);background:var(--bad-soft)}
.pcard i{font-style:normal;font-weight:800;color:var(--accent);min-width:1.4em}
.plist{display:flex;flex-direction:column;gap:8px}
.ptag{margin:6px 0 0;font-weight:800;color:var(--muted)}
.xgrid{display:flex;flex-direction:column;gap:10px}
.xcard{display:flex;align-items:center;gap:12px;width:100%;text-align:start;font:inherit;padding:12px 14px;border-radius:20px;border:3px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.xcard:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.xcard.on{background:var(--tb);border-color:var(--te);box-shadow:0 4px 0 var(--te)}
.xcard.dis{opacity:.5;cursor:default}
.xcard .xi{width:46px;height:46px;border-radius:15px;background:var(--surface);color:var(--te,var(--accent));display:grid;place-items:center;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.xcard .xt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.xcard .xt b{font-size:1.08rem;font-weight:800}
.xcard .xt small{color:var(--muted);font-size:.85rem}
.xcard .xck{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.xcard.on .xck{background:var(--good);border-color:var(--good)}
.mtch{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mt{font:inherit;font-weight:800;font-size:1.1rem;min-height:56px;padding:6px 10px;border-radius:16px;border:3px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;box-shadow:0 4px 0 var(--line);overflow-wrap:anywhere;position:relative}
.mt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 4px 0 var(--accent-dark)}
.mt.ok{background:var(--tb);border-color:var(--te);color:var(--ti);box-shadow:none;cursor:default}
.mt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);animation:shake .3s}
.mt b{position:absolute;top:-8px;inset-inline-start:-6px;width:22px;height:22px;border-radius:50%;background:var(--te);color:#fff;font-size:.78rem;display:grid;place-items:center}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.lsay{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin:6px auto;cursor:pointer;box-shadow:0 6px 0 var(--accent-dark);padding:0}
.lsay:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-dark)}
.moti{display:flex;align-items:center;gap:10px;margin:0;padding:6px 14px 6px 12px;border-radius:22px;background:var(--surface);border:2px solid var(--accent-soft);font-weight:700;color:var(--fg);font-size:.95rem;line-height:1.5;text-align:start;box-shadow:0 4px 0 var(--accent-soft)}
.moti svg{flex:none}
.panel .moti{background:var(--accent-soft);border-color:transparent;box-shadow:none}
.xp{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:66px;font-weight:800;font-size:.9rem}
.xp b{display:flex;align-items:center;justify-content:center;gap:4px;background:var(--amber-b);border-radius:14px;padding:1px 10px;color:var(--amber-i);line-height:1.5}
.xp .lv{height:7px;border-radius:7px;background:var(--line);overflow:hidden}
.xp .lv i{display:block;height:100%;background:var(--amber-e);border-radius:7px;transition:width .5s}
.xp small{font-size:.7rem;color:var(--muted);text-align:center;line-height:1}
.hico svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.conf i{position:absolute;top:-16px;width:10px;height:14px;border-radius:3px;animation:fall var(--d,1.4s) ease-in forwards}
@keyframes fall{to{transform:translate(var(--x,0),105vh) rotate(var(--r,540deg));opacity:.85}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px) scale(1.12)}70%{transform:translateY(0) scale(.96)}}
.ni.on .pill svg{animation:hop .55s ease}
.note.good:not(.spinrow),.note.note.bad{padding-inline-start:64px;background-repeat:no-repeat;background-position:right 12px center;background-size:40px;min-height:62px}
.note.good:not(.spinrow){background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 52'><path d='M26 3l6.2 13.4 14.6 1.8-10.8 10 2.9 14.4L26 35.2 13.1 42.6 16 28.2 5.2 18.2l14.6-1.8z' fill='%23FFC83D' stroke='%23F59E0B' stroke-width='2.5' stroke-linejoin='round'/><circle cx='21' cy='25' r='2.4' fill='%23402a00'/><circle cx='31' cy='25' r='2.4' fill='%23402a00'/><circle cx='17.5' cy='29.5' r='2.4' fill='%23FF8FA3' opacity='.7'/><circle cx='34.5' cy='29.5' r='2.4' fill='%23FF8FA3' opacity='.7'/><path d='M21 30.5q5 5.5 10 0' stroke='%23402a00' stroke-width='2.2' fill='none' stroke-linecap='round'/></svg>")}
.note.note.bad{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 52'><path d='M26 3l6.2 13.4 14.6 1.8-10.8 10 2.9 14.4L26 35.2 13.1 42.6 16 28.2 5.2 18.2l14.6-1.8z' fill='%23FFC83D' stroke='%23F59E0B' stroke-width='2.5' stroke-linejoin='round'/><circle cx='21' cy='26' r='2.4' fill='%23402a00'/><circle cx='31' cy='26' r='2.4' fill='%23402a00'/><path d='M18 21l5 1.6M34 21l-5 1.6' stroke='%23402a00' stroke-width='2' stroke-linecap='round'/><path d='M21.5 34q4.5-4.5 9 0' stroke='%23402a00' stroke-width='2.2' fill='none' stroke-linecap='round'/></svg>")}
.panel{border:2px solid color-mix(in srgb,var(--accent) 14%,var(--line));border-bottom-width:5px}
.head{gap:10px;padding:14px;background:linear-gradient(135deg,var(--surface) 40%,color-mix(in srgb,var(--accent) 14%,var(--surface)))}

/* ---------- helpers ---------- */
var AR_RE=/[؀-ۿ]/, LAT_RE=/[A-Za-z]/, LETTER_RE=/[A-Za-z0-9ء-ي]/;
var EDGE=/^[\s\-–—=:|,.;\t>]+|[\s\-–—=:|,.;\t>]+$/g;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function stripDiac(s){return s.replace(/[ً-ٰٟـ]/g,'');}
function normAr(s){return stripDiac(s).replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^ء-ي0-9]/g,'');}
function normEn(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'');}
function normSp(s){return s.toLowerCase().replace(/[^a-z0-9\s']/g,'').replace(/\s+/g,' ').trim();}
function norm(s,l){return l==='ar'?normAr(s):normEn(s);}
function ansLang(){return S.dir==='en-ar'?'ar':'en';}
function promptLang(){return S.dir==='en-ar'?'en':'ar';}
function answersOf(w,l){
  if(l==='en')return [w.en];
  var a=w.ar.split(/[،؛;\/|]|,/).map(function(x){return x.trim();}).filter(Boolean);
  return a.length?a:[w.ar];
}
function isCorrect(input,w,l){var n=norm(input,l);return n.length>0&&answersOf(w,l).some(function(a){return norm(a,l)===n;});}
function dirOf(l){return l==='ar'?'rtl':'ltr';}
function hasMeaning(w){return !!w.ar;}
function promptOf(w){return S.dir==='en-ar'?w.en:w.ar;}

function parseWords(raw){
  var words=[],ignored=0,seen={};
  raw.split(/\r?\n/).forEach(function(line){
    var t=line.trim();if(!t)return;
    var en='',ar='',first=t.search(AR_RE);
    if(first===-1){en=t;}
    else{
      var last=t.length-1;while(last>=0&&!AR_RE.test(t[last]))last--;
      var pre=t.slice(0,first);
      if(first>0&&LAT_RE.test(pre)){en=pre;ar=t.slice(first);}
      else{ar=t.slice(0,last+1);en=t.slice(last+1);}
    }
    en=en.replace(EDGE,'').trim();ar=ar.replace(EDGE,'').trim();
    if(!en||!LAT_RE.test(en)){ignored++;return;}
    var key=en.toLowerCase();if(seen[key])return;seen[key]=1;
    words.push({en:en,ar:ar});
  });
  return {words:words,ignored:ignored};
}
function mergeWords(list){
  var have={};S.words.forEach(function(w){have[mkey(w)]=1;});
  var added=0;
  list.forEach(function(w){if(!have[mkey(w)]){have[mkey(w)]=1;S.words.push(w);added++;}});
  if(added){wordsChanged();save();}
  return added;
}

}

/* ---------- alignment + pronunciation tips ---------- */
function align(a,b){
  var n=a.length,m=b.length,d=[],i,j;
  for(i=0;i<=n;i++){d.push(new Array(m+1).fill(0));d[i][0]=i;}
  for(j=0;j<=m;j++)d[0][j]=j;
  for(i=1;i<=n;i++)for(j=1;j<=m;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  }
  var ops=[];i=n;j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&d[i][j]===d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){ops.push({t:a[i-1]===b[j-1]?'m':'s',a:a[i-1],b:b[j-1]});i--;j--;}
    else if(i>0&&d[i][j]===d[i-1][j]+1){ops.push({t:'d',a:a[i-1]});i--;}
    else{ops.push({t:'i',b:b[j-1]});j--;}
  }
  ops.reverse();
  return {ops:ops,dist:d[n][m]};
}
var RULES=[
  [/th/g,'صوت th: ضع طرف لسانك بين الأسنان العلوية والسفلية وأخرج الهواء بلطف. لا تنطقه ث أو س أو ز أو ت.'],
  [/sh/g,'صوت sh: استدر الشفتين قليلًا وأخرج هواءً مستمرًا مثل حرف «ش».'],
  [/ch/g,'صوت ch: يبدأ بتاء سريعة ثم شين، فيخرج مثل «تش».'],
  [/ng/g,'صوت ng: يخرج من الأنف بآخر اللسان، ولا تضف حرف g مستقلًا في النهاية.'],
  [/p/g,'حرف p: انفجار هواء من الشفتين بلا اهتزاز في الحلق. ضع ورقة أمام فمك فتتحرك. لا تنطقه باءً.'],
  [/v/g,'حرف v: ضع الأسنان العلوية على الشفة السفلى مع اهتزاز في الحلق. ليس فاءً.'],
  [/r/g,'حرف r: ارفع اللسان دون أن يلمس سقف الفم، ولا تكرر الراء.'],
  [/w/g,'حرف w: ضمّ الشفتين واستدرهما كحرف «و» دون أن تلمس الأسنان.'],
  [/[aeiou]+/g,'الحروف المتحركة a e i o u تحمل أكثر من صوت في الإنجليزية. استمع للكلمة ببطء وقلّد طول كل مقطع.']
];
function tipsFor(t,ops){
  var bad={},ti=0,extras=[],tips=[];
  ops.forEach(function(o){
    if(o.t==='i'){extras.push(o.b);return;}
    if(o.t!=='m')bad[ti]=true;
    ti++;
  });
  RULES.forEach(function(r){
    var re=new RegExp(r[0].source,'g'),m,hit=false;
    while((m=re.exec(t))){for(var k=m.index;k<m.index+m[0].length;k++){if(bad[k])hit=true;}if(m[0].length===0)re.lastIndex++;}
    if(hit)tips.push(r[1]);
  });
  var lastOp=ops.filter(function(o){return o.t!=='i';}).slice(-1)[0];
  if(lastOp&&lastOp.t==='d')tips.push('لا تُسقط الصوت الأخير من الكلمة، انطق آخر حرف بوضوح.');
  var ex=extras.filter(function(x){return x!==' ';});
  if(ex.length)tips.push('أضفت صوتًا زائدًا ('+ex.join(' ')+'). انطق الكلمة كما هي دون إضافات.');
  if(!tips.length)tips.push('كرّر الكلمة ببطء مقطعًا مقطعًا ثم انطقها كاملة.');
  return tips.slice(0,3);
}

var DEX=[

function chunk(ids,size){
  var g=[];ids=shuffle(ids.slice());
  for(var i=0;i<ids.length;i+=size)g.push(ids.slice(i,i+size));
  if(g.length>1&&g[g.length-1].length<2){var l=g.pop();g[g.length-1]=g[g.length-1].concat(l);}
  return g.filter(function(x){return x.length>=2;}).slice(0,3);
}
function drillItems(){
  var items=[],dw=drillWords(),on={};
  DEX.forEach(function(d){on[d.k]=dexOn(d.k)&&dexOk(d);});
  dw.forEach(function(i){
    if(on.blank)items.push({i:i,mode:'blank',st:null});
    if(on.scramble)items.push({i:i,mode:'scramble',st:null});
    if(on.choose)items.push({i:i,mode:'choose',st:null});
    if(on.listen)items.push({i:i,mode:'listen',st:null});
  });
  var verbs=[];
  S.words.forEach(function(w,wi){if(isVerb(w)&&w.pen){verbs.push(wi);if(on.vpair)items.push({v:wi,mode:'vpair',st:null});if(on.vreg)items.push({v:wi,mode:'vreg',st:null});}});
  if(on.match)chunk(dw,4).forEach(function(g){items.push({mode:'match',ids:g,st:null});});
  if(on.vmatch)chunk(verbs,4).forEach(function(g){items.push({mode:'vmatch',ids:g,st:null});});
  return items;
}
function initDrill(){
  S.drill={phase:'menu',queue:[],total:0,done:0,fb:null,msg:''};

function startDrill(){
  var items=drillItems();
  if(!items.length){S.drill.msg='اختر تمرينًا واحدًا على الأقل.';sfx('wrong');render();return;}
  shuffle(items);
  var U=units();
  function wiOf(it){return it.v!==undefined?it.v:(it.i!==undefined?U[it.i].wi:-1);}
  for(var k=1;k<items.length;k++){
    var a=wiOf(items[k]),b=wiOf(items[k-1]);
    if(a>=0&&a===b){for(var j=k+1;j<items.length;j++){var c=wiOf(items[j]);if(c!==b||c<0){var t=items[k];items[k]=items[j];items[j]=t;break;}}}
  }

  sfx('pop');render();
}

var TR_PROMPT='For each English word or phrase below give the most common short Arabic meaning (one or two Arabic words; if two meanings are needed separate them with ،). Reply with only a JSON array in the same order, like [{"en":"apple","ar":"تفاحة"}]. Words: ';
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);})]);}
async function webTranslate(w,rev,loose){
  if(typeof fetch!=='function')return '';
  var ctl=typeof AbortController==='function'?new AbortController():null;
  var t=setTimeout(function(){if(ctl)ctl.abort();},8000);
  try{
    var res=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair='+(rev?'ar|en':'en|ar'),ctl?{signal:ctl.signal}:undefined);
    if(!res.ok)return '';
    var j=await res.json();
    var tx=j&&j.responseData&&j.responseData.translatedText;
    if(typeof tx!=='string')return '';
    tx=tx.trim();
    if(!tx||/MYMEMORY|WARNING/i.test(tx))return '';
    if(rev){if(!LAT_RE.test(tx)||AR_RE.test(tx))return '';return tx;}
    if((!loose&&LAT_RE.test(tx))||!AR_RE.test(tx))return '';
    return tx;
  }catch(e){return '';}
  finally{clearTimeout(t);}
}

  }

}

var IRREG={be:'was',have:'had',do:'did',say:'said',go:'went',get:'got',make:'made',know:'knew',think:'thought',take:'took',see:'saw',come:'came',give:'gave',find:'found',tell:'told',become:'became',leave:'left',feel:'felt',bring:'brought',begin:'began',keep:'kept',hold:'held',write:'wrote',stand:'stood',hear:'heard',let:'let',mean:'meant',set:'set',meet:'met',run:'ran',pay:'paid',sit:'sat',speak:'spoke',lie:'lay',lead:'led',read:'read',grow:'grew',lose:'lost',fall:'fell',send:'sent',build:'built',understand:'understood',draw:'drew',break:'broke',spend:'spent',cut:'cut',rise:'rose',drive:'drove',buy:'bought',wear:'wore',choose:'chose',eat:'ate',drink:'drank',sleep:'slept',sing:'sang',swim:'swam',fly:'flew',forget:'forgot',teach:'taught',catch:'caught',sell:'sold',win:'won',fight:'fought',throw:'threw',hide:'hid',bite:'bit',blow:'blew',shake:'shook',steal:'stole',wake:'woke',ride:'rode',ring:'rang',shoot:'shot',sweep:'swept',swing:'swung',tear:'tore',hang:'hung',lend:'lent',bend:'bent',dig:'dug',feed:'fed',hit:'hit',hurt:'hurt',put:'put',quit:'quit',shut:'shut',spread:'spread',cost:'cost',bet:'bet',burst:'burst',cast:'cast',sink:'sank',spin:'spun',stick:'stuck',strike:'struck',swear:'swore',weep:'wept',lay:'laid',light:'lit',slide:'slid',seek:'sought',forgive:'forgave',withdraw:'withdrew',overcome:'overcame',freeze:'froze',deal:'dealt',fit:'fit',lean:'leant',leap:'leapt',kneel:'knelt',spill:'spilt',spoil:'spoilt'};
function pastOf(v,noIrr){
  v=String(v||'').toLowerCase().trim();if(!v)return '';
  var sp=v.indexOf(' ');
  if(sp>0)return pastOf(v.slice(0,sp),noIrr)+v.slice(sp);
  if(!noIrr&&IRREG[v])return IRREG[v];
  if(/e$/.test(v))return v+'d';
  if(/[^aeiou]y$/.test(v))return v.slice(0,-1)+'ied';
  if(/^[^aeiou]*[aeiou][^aeiouwxy]$/.test(v)&&v.length<=4)return v+v.slice(-1)+'ed';
  return v+'ed';
}
function thirdOf(v){
  v=String(v||'').toLowerCase().trim();
  var sp=v.indexOf(' ');if(sp>0)return thirdOf(v.slice(0,sp))+v.slice(sp);
  if(/(s|x|z|ch|sh|o)$/.test(v))return v+'es';
  if(/[^aeiou]y$/.test(v))return v.slice(0,-1)+'ies';
  return v+'s';
}
var VERB_TR_PROMPT='Each item below is a verb written in English or in Arabic. For each one give: "en" = the English base (present) form, "past" = its simple past form (regular or irregular), "ar" = the Arabic meaning of the present form written as a present-tense verb (for example يذهب), "arPast" = the Arabic meaning written as a past-tense verb (for example ذهب). Reply with only a JSON array in the same order as the items, like [{"en":"go","past":"went","ar":"يذهب","arPast":"ذهب"}]. Items: ';
var AR_WORD_PROMPT='For each Arabic word below give the most common single English word with that meaning. Reply with only a JSON array in the same order, like [{"ar":"تفاحة","en":"apple"}]. Words: ';
function cleanAr(tx){return String(tx||'').replace(/^\s*(هو|إنه|انه)\s+/,'').replace(/\s+(هو)\s*$/,'').trim();}
/* base form from an English inflection (goes / went / walked ...) */
function baseOf(tx){
  var w=String(tx||'').toLowerCase().replace(/[^a-z\s']/g,' ').trim();
  for(var g=0;g<3;g++)w=w.replace(/^(to|he|she|it|they|we|you|i)\s+/,'');
  w=w.split(/\s+/)[0]||'';
  if(!w)return {base:'',past:false};
  if(IRREG[w])return {base:w,past:false};
  for(var k in IRREG){if(IRREG[k]===w)return {base:k,past:true};}
  if(/ies$/.test(w))return {base:w.slice(0,-3)+'y',past:false};
  if(/(s|x|z|ch|sh|o)es$/.test(w))return {base:w.slice(0,-2),past:false};
  if(/ss$/.test(w))return {base:w,past:false};
  if(/s$/.test(w))return {base:w.slice(0,-1),past:false};
  if(/ied$/.test(w))return {base:w.slice(0,-3)+'y',past:true};
  if(/ed$/.test(w)){var b=w.slice(0,-2);if(/([^aeiou])\1$/.test(b))b=b.slice(0,-1);return {base:b,past:true};}
  return {base:w,past:false};
}
async function webVerb(inp){
  var isAr=AR_RE.test(inp)&&!LAT_RE.test(inp),en=inp,fromPast=false;
  if(isAr){
    var e=await webTranslate(inp,true);
    var b=baseOf(e);en=b.base;fromPast=b.past;
    if(!en)return {en:'',pen:'',ar:'',par:''};
  }
  var pen=pastOf(en);
  var rs=await Promise.all([webTranslate('he '+thirdOf(en)),webTranslate('he '+pen)]);
  var ar=cleanAr(rs[0]),par=cleanAr(rs[1]);
  if(isAr){if(fromPast)par=cleanAr(inp);else ar=cleanAr(inp);}
  return {en:en,pen:pen,ar:ar,par:par};
}
async function lookupVerbs(list){
  var out={};
  if(AIFN){
    try{
      var arr=await AIFN.json(VERB_TR_PROMPT+JSON.stringify(list),{modelTier:'quick'});
      if(Array.isArray(arr))arr.forEach(function(x,i){
        if(!x)return;
        var inp=list.length===arr.length?list[i]:String(x.en||'');
        var en=String(x.en||'').trim();
        if(!inp||!en)return;
        out[String(inp).toLowerCase().trim()]={en:en.toLowerCase(),pen:String(x.past||'').trim()||pastOf(en),ar:String(x.ar||'').trim(),par:String(x.arPast||'').trim()};
      });
      if(Object.keys(out).length)return {map:out,via:'claude'};
    }catch(e){}
  }
  var via='';
  for(var i=0;i<list.length;i+=2){
    var part=list.slice(i,i+2);
    var rs=await Promise.all(part.map(webVerb));
    part.forEach(function(w,k){
      var r=rs[k];
      if(!r.en&&!AR_RE.test(w))r={en:w,pen:pastOf(w),ar:'',par:''};

var SUFFIX=/(tion|sion|ment|ness|ity|ous|ive|able|ible|ful|less|ence|ance|ize|ise|ify|ical|ally)$/;
function pickSmart(text){
  var lines=String(text).split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  var tokRe=/[A-Za-z][A-Za-z'’-]*[A-Za-z]|[A-Za-z]/g;
  if(!lines.length)return [];
  var short=lines.filter(function(l){return (l.match(tokRe)||[]).length<=3;}).length;
  var out=[],seen={};
  if(short/lines.length>=0.6){
    lines.forEach(function(l){(l.match(tokRe)||[]).forEach(function(t){
      t=t.toLowerCase().replace(/’/g,"'");
      if(t.length<2||t.length>24||seen[t])return;seen[t]=1;out.push({en:t,ar:'',pick:true,why:'list'});
    });});
    return out.slice(0,150);
  }
  var cand=[],re=/[A-Za-z][A-Za-z'’-]*[A-Za-z]|[A-Za-z]/g,m,txt=String(text);
  while((m=re.exec(txt))){
    var raw=m[0],t=raw.toLowerCase().replace(/’/g,"'");
    if(t.length<4||t.length>24||STOP[t]||seen[t])continue;
    var before=txt.slice(0,m.index).replace(/[\s"'(\[]+$/,'');
    var sentStart=!before||/[.!?:]$/.test(before)||/\n\s*$/.test(txt.slice(0,m.index));
    if(/^[A-Z][a-z'’-]+$/.test(raw)&&!sentStart)continue;
    if(/^[A-Z]{2,}$/.test(raw))continue;
    seen[t]=1;
    cand.push({en:t,score:t.length+(SUFFIX.test(t)?2:0)+(/s$/.test(t)&&t.length>4?-0.5:0)});
  }
  cand.sort(function(a,b){return b.score-a.score;});
  return cand.slice(0,40).map(function(c,i){return {en:c.en,ar:'',pick:i<15,why:i<15?'key':'extra'};});
}

    catch(e){var c=e&&e.code;if(PHOTO_ERR[c]){S.photo={busy:false,msg:PHOTO_ERR[c]};sfx('wrong');render();return;}}
  }
  if(!list){
    S.photo.msg='جارٍ قراءة النص من الصورة...';render();
    try{list=await withTimeout(ocrWords(blob),60000);via='ocr';}
    catch(e){S.photo={busy:false,msg:'تعذّرت قراءة الصورة هنا. افتح الملف المستقل في Chrome، أو الصق الكلمات مباشرة.'};sfx('wrong');render();return;}
  }
  if(!list.length){S.photo={busy:false,msg:'لم أجد كلمات إنجليزية واضحة في الصورة. جرّب صورة أقرب وأوضح.'};sfx('wrong');render();return;}
  S.photo={busy:false,msg:''};
  var rows=mkRows(list);
  if(!rows.length){S.photo={busy:false,msg:'لم أجد في الصورة كلمات لها معنى. جرّب صورة أوضح.'};sfx('wrong');render();return;}
  S.rev={rows:rows,msg:pickMsg(rows,via),warn:false,busy:false,auto:true,via:via};
  sfx('done');render();
  analyze(rows,{drop:true});
}

}

/* ---------- speech in ---------- */
function recognize(onAlts,onFail,setBusy,lang){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){S.mic='unsupported';onFail('unsupported');return;}
  stopRec();try{speechSynthesis.cancel();}catch(e){}
  var r;try{r=new SR();}catch(e){S.mic='unsupported';onFail('unsupported');return;}
  rec=r;r.lang=lang||'en-US';r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
  var started=false,finished=false;
  function fail(k,m){if(finished)return;finished=true;clearTimeout(recTimer);setBusy(false);onFail(k,m);}
  r.onaudiostart=function(){started=true;};
  r.onresult=function(ev){
    if(finished)return;finished=true;clearTimeout(recTimer);setBusy(false);
    onAlts(Array.prototype.map.call(ev.results[0],function(x){return x.transcript;}));
  };
  r.onerror=function(ev){
    var e=ev.error;
    if(e==='aborted'){return;}
    if(e==='not-allowed'||e==='service-not-allowed'){S.mic='blocked';fail('blocked');}
    else if(e==='no-speech')fail('nospeech','لم أسمع صوتًا. اقترب من الميكروفون وتكلّم بصوت أوضح.');
    else if(e==='network')fail('network','تعذّر الاتصال بخدمة التعرف على الصوت. تحقق من الإنترنت.');
    else fail('other','تعذّر التعرف على الصوت ('+e+').');
  };
  r.onend=function(){if(rec===r)rec=null;fail('nospeech','لم أسمع صوتًا. حاول مرة أخرى.');};
  try{
    r.start();setBusy(true);
    recTimer=setTimeout(function(){
      if(finished)return;
      try{r.abort();}catch(e){}
      if(!started){S.mic='blocked';fail('blocked');}else fail('nospeech','لم أسمع صوتًا. حاول مرة أخرى.');
    },9000);
  }catch(e){S.mic='blocked';fail('blocked');}
}
function listen(){
  var P=S.pron,w=units()[P.i];
  recognize(function(alts){evaluate(w,alts);},
    function(k,m){P.listening=false;P.fb=(k==='blocked'||k==='unsupported')?null:{err:m};render();},
    function(b){P.listening=b;if(b){P.fb=null;sfx('micOn');}render();});
}
function evaluate(w,alts){
  var P=S.pron;P.listening=false;P.tries[P.i]=(P.tries[P.i]||0)+1;
  var t=normSp(w.en),best=null;
  alts.forEach(function(a){
    var h=normSp(a),al=align(t,h),sim=1-al.dist/Math.max(t.length,h.length,1);
    if(!best||sim>best.sim)best={raw:a,h:h,sim:sim,al:al};
  });
  var pass=best.al.dist===0;
  P.fb={msg:pass?rnd(PRAISE):'',heard:best.raw,pass:pass,near:!pass&&best.sim>=0.7,ops:best.al.ops,tips:pass?[]:tipsFor(t,best.al.ops)};
  if(pass){P.passed[P.i]=true;sfx('correct');buzz(20);award(1);}else{sfx('wrong');buzz([30,40,30]);}
  render();
}

/* ---------- voice dictation into answers ---------- */
function dictBlock(){
  var D=S.dict||{busy:false,msg:''};
  if(S.mic==='blocked'||S.mic==='unsupported'){
    return '<p class="hint" style="text-align:center">الإملاء الصوتي غير متاح داخل هذه الصفحة. افتح الملف المستقل في Chrome لتفعيله.</p>';
  }
  return '<div class="row mid"><button type="button" class="btn'+(D.busy?' live':'')+'" data-act="dict" aria-label="قل الكلمة بصوتك">'+ic('mic',20)+(D.busy?'أستمع إليك...':'قلها بصوتك')+'</button></div>'+
    (D.msg?'<p class="hint" style="text-align:center">'+esc(D.msg)+'</p>':'');
}
function startDictation(apply){
  S.dict={busy:false,msg:''};
  recognize(function(alts){S.dict.msg=apply(alts)||'';render();},
    function(k,m){S.dict.msg=(k==='blocked'||k==='unsupported')?'':(m||'');render();},
    function(b){S.dict.busy=b;if(b){S.dict.msg='';sfx('micOn');}render();});
}
function dictClick(){
  if(S.dict.busy){stopRec();S.dict={busy:false,msg:''};render();return;}
  if(S.stage===3){startDictation(applyFinal);return;}
  var D=S.drill,it=D&&D.queue[0];if(!it||D.fb)return;
  startDictation(it.mode==='blank'?applyBlank:applyScramble);
}
function applyBlank(alts){
  var st=S.drill.queue[0].st,pos=[];
  st.chars.forEach(function(c,i){if(LETTER_RE.test(c))pos.push(i);});
  for(var a=0;a<alts.length;a++){
    var h=normEn(alts[a]);
    if(h.length!==pos.length)continue;
    var used={},slots={},ok=true;
    Object.keys(st.hidden).map(Number).forEach(function(ci){
      if(!ok)return;
      var ch=h[pos.indexOf(ci)],t=null;
      for(var q=0;q<st.tiles.length;q++){if(!used[st.tiles[q].id]&&st.tiles[q].ch.toLowerCase()===ch){t=st.tiles[q];break;}}
      if(t){used[t.id]=1;slots[ci]=t.id;}else ok=false;
    });
    if(ok){st.slots=slots;return '';}
  }
  return 'سمعتك تقول «'+alts[0]+'» لكن حروفها لا تطابق الحروف المعروضة. قلها مرة أخرى بوضوح.';
}
function applyScramble(alts){
  var st=S.drill.queue[0].st;
  for(var a=0;a<alts.length;a++){
    var h=normEn(alts[a]);
    if(h.length!==st.all.length)continue;
    var used={},ids=[],ok=true;
    for(var k=0;k<h.length&&ok;k++){
      var ch=h[k],t=null;
      for(var q=0;q<st.all.length;q++){if(!used[st.all[q].id]&&st.all[q].ch.toLowerCase()===ch){t=st.all[q];break;}}
      if(t){used[t.id]=1;ids.push(t.id);}else ok=false;
    }
    if(ok){st.picked=ids;return '';}
  }
  return 'سمعتك تقول «'+alts[0]+'» لكن حروفها لا تطابق الحروف المعروضة. قلها مرة أخرى بوضوح.';
}
function applyFinal(alts){
  var v=(alts[0]||'').toLowerCase().replace(/[^a-z]/g,'');
  S.fin.draft=v;
  return '';
}

/* stage 2 */
var UID=0;
function makeState(it,w,l){
  var first=answersOf(w,l)[0];
  var target=(l==='ar'?stripDiac(first):first).trim();
  var chars=Array.from(target),idx=[];
  chars.forEach(function(c,i){if(LETTER_RE.test(c))idx.push(i);});
  if(it.mode==='blank'){
    var hn=Math.max(1,Math.round(idx.length*0.45));
    hn=Math.min(hn,Math.max(1,idx.length-1));
    var hidden={};shuffle(idx.slice()).slice(0,hn).forEach(function(i){hidden[i]=true;});
    var need=idx.filter(function(i){return hidden[i];}).map(function(i){return chars[i];});
    var pool=need.map(function(ch,k){return {id:k,ch:ch};});
    if(l==='en'){
      var have={};need.forEach(function(c){have[c.toLowerCase()]=1;});
      var extra=shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(function(c){return !have[c];})).slice(0,need.length>=4?3:2);
      extra.forEach(function(c){pool.push({id:pool.length,ch:c});});
    }
    return {uid:++UID,target:target,chars:chars,hidden:hidden,tiles:shuffle(pool),slots:{}};
  }
  var tiles=idx.map(function(ci,k){return {id:k,ch:chars[ci]};});
  var sh=tiles.slice(),tries=0;
  do{shuffle(sh);tries++;}while(sh.length>1&&sh.every(function(t,k){return t.id===k;})&&tries<12);
  return {uid:++UID,target:target,tiles:sh,all:tiles,picked:[]};
}
function noMeaning(){
  return '<section class="panel center"><h2>أضف معاني الكلمات</h2><p class="hint">التدريب والاختبار يحتاجان معنى لكل كلمة، مثل <bdi dir="ltr">apple - تفاحة</bdi>.</p><button type="button" class="btn primary" data-go="0">العودة إلى الكلمات</button></section>';
}
function curQ(){return S.stage===4?S.sp.queue:S.drill.queue;}
function usedIds(st){return Object.keys(st.slots).map(function(k){return st.slots[k];});}
function tileCh(st,id){for(var i=0;i<st.tiles.length;i++){if(st.tiles[i].id===id)return st.tiles[i].ch;}return '';}
function nextEmpty(st){
  var ks=Object.keys(st.hidden).map(Number).sort(function(a,b){return a-b;});
  for(var i=0;i<ks.length;i++){if(st.slots[ks[i]]===undefined)return ks[i];}
  return -1;
}
function viewDrill(){
  var D=S.drill;
  if(D.phase==='menu')return viewDrillMenu();
  var h=viewDrillRun();
  if(D.queue.length&&h.slice(-10)==='</section>')h=h.slice(0,-10)+'<div class="row mid"><button type="button" class="btn ghost" data-act="dmenu">تغيير التمارين</button></div></section>';
  return h;
}
function viewDrillRun(){
  var D=S.drill;
  if(!D.total)return noMeaning();
  if(!D.queue.length){
    return '<section class="panel center"><div class="score">'+ic('trophy',64)+'</div><h2>أحسنت، أنهيت التدريب</h2><p class="hint">أجبت عن كل التمارين بشكل صحيح. الخطوة التالية اختبار نهائي بلا أي مساعدة.</p><button type="button" class="btn primary big" data-act="tofinal">ابدأ الاختبار النهائي</button><button type="button" class="btn" data-act="dmenu">تمارين أخرى</button></section>';
  }
  if(D.queue[0].v!==undefined)return viewVerbDrill(D,D.queue[0]);
  if(D.queue[0].mode==='match'||D.queue[0].mode==='vmatch')return viewMatch(D,D.queue[0]);
  if(D.queue[0].mode==='choose'||D.queue[0].mode==='listen')return viewChoice(D,D.queue[0]);
  var it=D.queue[0],w=units()[it.i],l=ansLang(),pl=promptLang();
  if(!it.st)it.st=makeState(it,w,l);
  var st=it.st,pct=Math.round(D.done/D.total*100);
  var h='<section class="panel"><div class="meta"><span>المتبقي '+D.queue.length+' تمرين</span><span>'+pct+'%</span></div>'+
  '<div class="bar"><i style="width:'+pct+'%"></i></div>'+(S.moti?motiHtml(S.moti):'')+
  '<div class="wcard '+tint(w.wi)+'">'+tagHtml(w)+'<p class="label">'+(it.mode==='blank'?'أكمل الحروف الناقصة':'رتّب الحروف المبعثرة')+(l==='ar'?' لتكوين المعنى العربي':' لتكوين الكلمة الإنجليزية')+'</p>'+
  '<div class="prompt" dir="'+dirOf(pl)+'">'+esc(promptOf(w))+'</div></div>';
  if(it.mode==='blank'){
    var nxt=nextEmpty(st),filled=0,total=0;
    h+='<div class="cells letters'+(st.chars.length>9?' dense':'')+' '+tint(w.wi)+'" dir="'+dirOf(l)+'">'+st.chars.map(function(ch,ci){
      if(!LETTER_RE.test(ch))return ch===' '?'<span class="gap"></span>':'<span class="cell fixed">'+esc(ch)+'</span>';
      if(!st.hidden[ci])return '<span class="cell fixed">'+esc(ch)+'</span>';
      total++;
      var tid=st.slots[ci],tl=tid===undefined?'':tileCh(st,tid);
      if(tid!==undefined)filled++;
      if(D.fb){return '<span class="cell '+(norm(tl,l)===norm(ch,l)?'good':'bad')+'">'+(esc(tl)||'·')+'</span>';}
      if(tid!==undefined)return '<button type="button" class="cell filled" data-act="unslot" data-ci="'+ci+'" aria-label="إزالة الحرف">'+esc(tl)+'</button>';
      return '<span class="cell slot'+(ci===nxt?' next':'')+'" data-ci="'+ci+'"></span>';
    }).join('')+'</div>';
    if(!D.fb){
      var used=usedIds(st);
      h+='<div class="cells pool" dir="ltr">'+st.tiles.filter(function(t){return used.indexOf(t.id)===-1;}).map(function(t){return '<button type="button" class="tile" data-act="slotpick" data-id="'+t.id+'">'+esc(t.ch)+'</button>';}).join('')+'</div>'+dictBlock()+
      '<div class="row mid"><button type="button" class="btn" data-act="clearslots"'+(filled?'':' disabled')+'>مسح</button>'+
      '<button type="button" class="btn primary" data-act="dcheck"'+(filled===total?'':' disabled')+'>تحقق</button></div>';
    }
  }else{
    var picked=st.picked.map(function(id){return st.all[id];});
    var okAll=D.fb?norm(picked.map(function(t){return t.ch;}).join(''),l)===norm(st.target,l):null;
    h+='<div class="cells letters'+(st.all.length>9?' dense':'')+'" dir="'+dirOf(l)+'">'+
      picked.map(function(t){return '<button type="button" class="tile sel'+(D.fb?(okAll?' good':' bad'):'')+'" data-act="unpick" data-id="'+t.id+'"'+(D.fb?' disabled':'')+'>'+esc(t.ch)+'</button>';}).join('')+
      new Array(st.all.length-picked.length+1).join('<span class="tile slot"></span>')+'</div>';
    if(!D.fb){
      h+='<div class="cells pool" dir="'+dirOf(l)+'">'+st.tiles.filter(function(t){return st.picked.indexOf(t.id)===-1;}).map(function(t){return '<button type="button" class="tile" data-act="pick" data-id="'+t.id+'">'+esc(t.ch)+'</button>';}).join('')+'</div>'+dictBlock()+
      '<div class="row mid"><button type="button" class="btn" data-act="clearpick"'+(st.picked.length?'':' disabled')+'>مسح</button>'+
      '<button type="button" class="btn primary" data-act="dcheck"'+(st.picked.length===st.all.length?'':' disabled')+'>تحقق</button></div>';
    }
  }
  if(D.fb){
    h+=D.fb.ok?'<div class="note good">'+esc(D.fb.msg||'صحيح، أحسنت.')+'</div>':
      '<div class="note bad">'+esc(D.fb.msg||'')+'<br>الإجابة الصحيحة: <b dir="'+dirOf(l)+'">'+esc(answersOf(w,l).join(' / '))+'</b><br>سيعود هذا التمرين لاحقًا.</div><button type="button" class="btn primary big" data-act="dnext">التالي</button>';
  }
  return h+'</section>';
}
function drillHead(D,extra){
  var pct=Math.round(D.done/D.total*100);
  return '<section class="panel"><div class="meta"><span>المتبقي '+D.queue.length+' تمرين</span><span>'+pct+'%</span></div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+(S.moti?motiHtml(S.moti):'');

function makeChoiceState(it,w){

function sentTokens(en){
  var t=String(en||'').trim().split(/\s+/).map(function(x){return x.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g,'');}).filter(Boolean);
  if(t.length&&t[0]!=='I'&&!/^I'/.test(t[0])&&!/^[A-Z]{2,}$/.test(t[0]))t[0]=t[0].charAt(0).toLowerCase()+t[0].slice(1);

function gapIndex(sn){
  var t=sentTokens(sn.en),k,u;
  for(u=0;u<(sn.uses||[]).length;u++){
    for(k=0;k<t.length;k++){if(normEnS(t[k])===normEnS(sn.uses[u]))return k;}
  }
  var best=-1,len=3;
  t.forEach(function(x,i){if(x.length>len&&!/^(because|before|after|there|their|which|would|could|should)$/i.test(x)){len=x.length;best=i;}});
  return best;
}
function shortEn(en){return String(en||'').trim().split(/\s+/).length<=5;}
function splitSentences(text){
  var t=String(text||'').replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').trim();
  if(!t)return [];
  return t.split(/(?<=[.!?])\s+(?=["'A-Z])/).map(function(x){return x.trim();}).filter(function(x){
    var n=x.split(/\s+/).length;return n>=3&&n<=25&&LAT_RE.test(x)&&!AR_RE.test(x);
  });
}
function parseSentLines(raw){
  var out=[],lines=String(raw||'').split(/\n+/).map(function(x){return x.trim();}).filter(Boolean);
  lines.forEach(function(line){
    if(AR_RE.test(line)&&LAT_RE.test(line)){
      var ar=(line.match(/[؀-ۿ][؀-ۿ\s،؟!.]*/g)||[]).join(' ').trim();
      var en=line.replace(/[؀-ۿ][؀-ۿ\s،؟!.]*/g,' ').replace(EDGE,'').trim();
      if(en&&ar)out.push({en:en,ar:ar});
    }else if(LAT_RE.test(line)){
      var parts=splitSentences(line);
      if(!parts.length&&line.split(/\s+/).length>=2)parts=[line];
      parts.forEach(function(x){out.push({en:x,ar:''});});
    }
  });
  return {list:out,prose:lines.length<=2&&out.length>=3};
}

function makeSp(it){

    return {uid:++UID,target:tk.join(' '),tiles:notIdentity(shuffle(tiles.slice())),all:tiles,picked:[]};
  }
  if(it.k==='sgap'){
    var sn=S.sents[it.si],tk2=sentTokens(sn.en),gi=gapIndex(sn),tg=tk2[gi],seen={},pool=[tg];seen[normEnS(tg)]=1;
    var cands=[];

    S.words.forEach(function(w){cands.push(w.en);if(w.pen)cands.push(w.pen);});
    shuffle(cands).forEach(function(w){var k=normEnS(w);if(pool.length<4&&k&&!seen[k]&&tk2.map(normEnS).indexOf(k)<0){seen[k]=1;pool.push(w);}});
    return {uid:++UID,toks:tk2,gi:gi,target:tg,sel:null,tiles:shuffle(pool.map(function(c,k){return {id:k,ch:c};}))};
  }

    var idx=paraGroups()[it.pid],tl=idx.map(function(si,k){return {id:k,ch:S.sents[si].en};});
    return {uid:++UID,idx:idx,tiles:notIdentity(shuffle(tl.slice())),all:tl,picked:[]};
  }
  var u=units()[it.ui],forms=[],sn2={};
  shuffle(units().slice()).forEach(function(x){var k=normEnS(x.en);if(forms.length<11&&!sn2[k]&&k!==normEnS(u.en)){sn2[k]=1;forms.push(x.en);}});

  var words=st.picked.filter(function(w){return !/^[.?!,]$/.test(w);});
  var hasT=st.picked.some(function(w){return normEnS(w)===normEnS(st.u.en);});
  var struct=hasT&&words.length>=3;
  var ok=struct,extra='',note='';
  if(!hasT)note='لازم الجملة تحتوي على الكلمة <b dir="ltr">'+esc(st.u.en)+'</b>.';
  else if(words.length<3)note='الجملة قصيرة، خليها ٣ كلمات على الأقل.';
  if(struct&&AIFN){
    P.busy=true;render();
    try{
      var r=await AIFN.json(COMP_PROMPT+'Target word: "'+st.u.en+'". Sentence: "'+text+'"');
      if(S.sp!==P||P.queue[0]!==it)return;
      ok=!!(r&&r.ok===true);
      note=esc(String(r&&r.note||''));
      if(!ok&&r&&r.fixed)extra='<br>الصيغة الأفضل: <b dir="ltr">'+esc(String(r.fixed))+'</b>';
    }catch(e){ok=true;}
    P.busy=false;
  }
  P.fb={ok:ok,msg:ok?rnd(PRAISE):rnd(OOPS),extra:(note?note:'')+extra+(ok?'':'<br>سيعود هذا التمرين لاحقًا.')};
  if(ok){sfx('correct');buzz(20);award(1);speak(text,'en-US',0.9);drillTimer=setTimeout(spNext,2600);}
  else{sfx('wrong');buzz([30,40,30]);}
  render();
}
function spNext(){
  clearTimeout(drillTimer);
  var P=S.sp;if(!P||!P.fb)return;
  var it=P.queue.shift();
  if(P.fb.ok)P.done++;else{it.st=null;P.queue.push(it);}
  P.fb=null;
  if(!P.queue.length){S.done[4]=true;sfx('win');burst(true);}
  render();
}

/* ---------- events ---------- */
$nav.addEventListener('click',function(e){
  var b=e.target.closest('[data-go]');if(!b||b.disabled)return;
  sfx('nav');go(+b.getAttribute('data-go'));
});
$snd.addEventListener('click',function(){
  S.sound=!S.sound;save();
  if(S.sound)sfx('pop');
  render();
});
$stage.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');
  if(g){sfx('nav');go(+g.getAttribute('data-go'));return;}
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-act'),P=S.pron;
  var own={dex:1,dstart:1,mlt:1,mrt:1,sgen:1,sprac:1,cpick:1,cunpick:1,gap:1,vch:1,etoggle:1,rvtype:1,mic:1,dcheck:1,dict:1,dfield:1,selfok:1,pick:1,unpick:1,fsubmit:1,tofinal:1,analyze:1,sample:1,start:1,rvconfirm:1,rvsel:1,slotpick:1,unslot:1,qtrans:1,etrans:1,rvtrans:1,cam:1,gal:1};
  if(!own[a])sfx('tap');
  var wi=+b.getAttribute('data-i');
  if(a==='tab'){captureInputs();S.tab0=b.getAttribute('data-t')==='bulk'?'bulk':'list';S.addMsg='';render();}
  else if(a==='etoggle'){captureInputs();var ee=S.edit;ee.type=ee.type==='verb'?'word':'verb';if(ee.type==='verb'&&!ee.pen.trim())ee.pen=pastOf(ee.en.trim());sfx('tap');render();}
  else if(a==='rvtype'){captureInputs();var rt=S.rev.rows[wi];rt.type=rt.type==='verb'?'word':'verb';rt.cls=true;if(rt.type==='verb'&&!rt.pen.trim())rt.pen=pastOf(rt.en.trim());sfx('tap');render();autoTranslate([rt]);}
  else if(a==='analyze')analyzeText();
  else if(a==='cam'||a==='gal'){var fi=document.getElementById(a==='cam'?'camIn':'galIn');if(fi){fi.value='';fi.click();}}
  else if(a==='dfield')dictField(b.getAttribute('data-k'));
  else if(a==='wedit'){captureInputs();var ew=S.words[wi];S.edit={i:wi,type:isVerb(ew)?'verb':'word',en:ew.en,ar:ew.ar,pen:ew.pen||'',par:ew.par||'',msg:''};render();}
  else if(a==='ecancel'){S.edit=null;render();}
  else if(a==='etrans')editTranslate();
  else if(a==='rvchk'){captureInputs();var rr=S.rev.rows[wi];rr.on=!rr.on;render();}
  else if(a==='rvdel'){captureInputs();S.rev.rows.splice(wi,1);render(true);}
  else if(a==='rvadd'){captureInputs();S.rev.rows.push({cls:false,type:'word',en:'',ar:'',pen:'',par:'',on:true,dup:false});render();var nf=document.getElementById('rvE'+(S.rev.rows.length-1));if(nf)nf.focus();}
  else if(a==='rvtrans'){captureInputs();analyze(S.rev.rows,{});}
  else if(a==='rvsel'){captureInputs();var mm=b.getAttribute('data-m');S.rev.rows.forEach(function(r){r.on=mm==='all'?true:mm==='none'?false:(r.rec!==false&&!r.dup);});render();}
  else if(a==='rvcancel'){S.rev=null;render();}
  else if(a==='rvconfirm')confirmReview();
  else if(a==='sample'){mergeWords(parseWords(SAMPLE.join('\n')).words.concat(SAMPLE_VERBS));sfx('pop');render();}
  else if(a==='mtoggle'){var w0=S.words[wi];if(isM(w0)){delete S.mastered[mkey(w0)];sfx('tap');}else{S.mastered[mkey(w0)]=true;sfx('correct');}save();render();}
  else if(a==='wsay'){var sw=S.words[wi];speak(isVerb(sw)&&sw.pen?sw.en+', '+sw.pen:sw.en,'en-US',0.9);}
  else if(a==='wdel'){var d0=S.words[wi];delete S.mastered[mkey(d0)];S.words.splice(wi,1);S.edit=null;wordsChanged();save();render();}
  else if(a==='start'){if(!S.words.length)return;S.pron=null;S.drill=null;S.fin=null;S.done=[true,false,false,false,false];sfx('pop');go(1);}
  else if(a==='say')speak(units()[P.i].en,'en-US',0.9);
  else if(a==='slow')speak(units()[P.i].en,'en-US',0.5);
  else if(a==='spell')spellOut(units()[P.i].en);
  else if(a==='sayar')speak(units()[P.i].ar,'ar-SA',0.85);
  else if(a==='mic')listen();
  else if(a==='selfok'){P.passed[P.i]=true;P.tries[P.i]=Math.max(P.tries[P.i]||0,1);P.fb=null;sfx('correct');render();}
  else if(a==='pprev'){stopRec();P.listening=false;P.i=Math.max(0,P.i-1);P.fb=null;render();}
  else if(a==='pnext'){
    stopRec();P.listening=false;
    if(P.i>=units().length-1){S.done[1]=true;sfx('done');go(2);}
    else{P.i++;P.fb=null;render();}
  }
  else if(a==='dex'){var dk=b.getAttribute('data-k');S.dex[dk]=!dexOn(dk);S.drill.msg='';save();sfx('tap');render();}
  else if(a==='dall'){var all=b.getAttribute('data-m')==='all';DEX.forEach(function(d){S.dex[d.k]=all;});S.drill.msg='';save();render();}
  else if(a==='dstart')startDrill();
  else if(a==='dmenu'){clearTimeout(drillTimer);stopRec();S.drill={phase:'menu',queue:[],total:0,done:0,fb:null,msg:''};render();}
  else if(a==='mlt')matchTap('L',+b.getAttribute('data-id'));
  else if(a==='mrt')matchTap('R',+b.getAttribute('data-id'));
  else if(a==='lsay'){var lq=S.drill.queue[0];if(lq&&lq.i!==undefined)speak(units()[lq.i].en,'en-US',0.85);}
  else if(a==='gap'||a==='vch'){
    var Q=S.stage===4?S.sp:S.drill;if(!Q||Q.fb||!Q.queue.length)return;
    Q.queue[0].st.sel=a==='vch'?b.getAttribute('data-v'):+b.getAttribute('data-id');
    if(S.stage===4)spCheck();else drillCheck();
  }
  else if(a==='pick'){curQ()[0].st.picked.push(+b.getAttribute('data-id'));sfx('pop');render();}
  else if(a==='unpick'){var s2=curQ()[0].st,id=+b.getAttribute('data-id');s2.picked=s2.picked.filter(function(x){return x!==id;});sfx('pop2');render();}
  else if(a==='clearpick'){curQ()[0].st.picked=[];render();}
  else if(a==='dict')dictClick();
  else if(a==='slotpick'){var sb=S.drill.queue[0].st,sc=nextEmpty(sb);if(sc>=0){sb.slots[sc]=+b.getAttribute('data-id');sfx('pop');render();}}
  else if(a==='unslot'){delete S.drill.queue[0].st.slots[+b.getAttribute('data-ci')];sfx('pop2');render();}
  else if(a==='clearslots'){S.drill.queue[0].st.slots={};render();}
  else if(a==='key'){var F2=S.fin;if(F2&&F2.phase==='ask'&&(F2.draft||'').length<30){F2.draft=(F2.draft||'')+b.getAttribute('data-k');render();}}
  else if(a==='bksp'){var F3=S.fin;if(F3&&F3.draft){F3.draft=F3.draft.slice(0,-1);render();}}
  else if(a==='smode'){captureInputs();S.smode=b.getAttribute('data-m')==='short'?'short':'keep';render();}
  else if(a==='sgen')genSentences();
  else if(a==='scam'||a==='sgal'){var sfi=document.getElementById(a==='scam'?'sCamIn':'sGalIn');if(sfi){sfi.value='';sfi.click();}}
  else if(a==='spaste'){
    captureInputs();var pr=parseSentLines(S.spaste);
    if(!pr.list.length){S.sentMsg='الصق جملة إنجليزية أولًا.';render();return;}
    S.spaste='';S.sphoto={busy:true,msg:S.smode==='short'?'جارٍ تلخيص الجمل...':'جارٍ ترجمة الجمل...'};render();
    (async function(){
      var list=pr.list,note='';
      if(S.smode==='short'){var rs=await shortenList(list);list=rs.list;note=rs.note;}
      var n=await addSentences(list,pr.prose);
      S.sphoto={busy:false,msg:''};
      S.sentMsg=n?'أُضيفت '+arCount(n)+(pr.prose&&n>=3?' كفقرة واحدة':'')+'. '+note:'هذه الجمل موجودة عندك بالفعل.';
      sfx(n?'done':'wrong');render();
    })();
  }
  else if(a==='sdel'){S.sents.splice(wi,1);S.sp=null;save();render();}
  else if(a==='pdel'){var pd=+b.getAttribute('data-p');S.sents=S.sents.filter(function(x){return x.pid!==pd;});S.sp=null;save();render();}
  else if(a==='ssay'){speak(S.sents[wi].en,'en-US',0.9);}
  else if(a==='sspeak'){var q0=S.sp&&S.sp.queue[0];if(q0&&q0.si!==undefined)speak(S.sents[q0.si].en,'en-US',0.9);}
  else if(a==='sprac')initSp(b.getAttribute('data-m'));
  else if(a==='spend'){clearTimeout(drillTimer);S.sp=null;render();}
  else if(a==='cpick'){var cs=S.sp.queue[0].st;if(!S.sp.fb&&cs.picked.length<14){cs.picked.push(cs.pool[+b.getAttribute('data-i')]);sfx('pop');render();}}
  else if(a==='cunpick'){var cu=S.sp.queue[0].st;cu.picked.splice(+b.getAttribute('data-i'),1);sfx('pop2');render();}
  else if(a==='cclear'){S.sp.queue[0].st.picked=[];render();}
  else if(a==='dcheck'){if(S.stage===4)spCheck();else drillCheck();}
  else if(a==='dnext'){if(S.stage===4)spNext();else drillNext();}
  else if(a==='tofinal'){sfx('nav');go(3);}
  else if(a==='fsubmit')finalSubmit();
  else if(a==='fretry'){
    var F=S.fin;F.list=shuffle(F.all.filter(function(i){return !(F.res[i]&&F.res[i].ok);}));F.pos=0;F.draft='';F.phase='ask';render();
  }
  else if(a==='frestart')go(3);
});
$stage.addEventListener('submit',function(e){
  if(e.target.id==='addForm'){e.preventDefault();addWord();}
  else if(e.target.id==='editForm'){e.preventDefault();saveEdit();}
});
$stage.addEventListener('change',function(e){
  var t=e.target;
  if(t&&(t.id==='camIn'||t.id==='galIn')){var f=t.files&&t.files[0];if(f)handlePhoto(f);}
  if(t&&(t.id==='sCamIn'||t.id==='sGalIn')){var f2=t.files&&t.files[0];if(f2)handleSentPhoto(f2);}
});
$stage.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='wordsInput'){S.raw=t.value;updatePreview();}
});
/* physical keyboard (desktop only): letters fill the exercise, Backspace undoes, Enter confirms. Phones never open a keyboard here. */
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var tg=e.target,tag=tg&&tg.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  var isLetter=/^[a-z]$/i.test(e.key),c=e.key.toLowerCase();
  if(S.stage===3&&S.fin&&S.fin.phase==='ask'){
    if(isLetter&&(S.fin.draft||'').length<30){S.fin.draft=(S.fin.draft||'')+c;sfx('tap');render();}
    else if(e.key==='Backspace'&&S.fin.draft){S.fin.draft=S.fin.draft.slice(0,-1);render();}
    else if(e.key==='Enter'&&tag!=='BUTTON'){e.preventDefault();finalSubmit();}
    return;
  }
  if(S.stage===2&&S.drill&&S.drill.queue.length){
    var D=S.drill,it=D.queue[0];
    if(D.fb){if(e.key==='Enter'&&tag!=='BUTTON'&&!D.fb.ok){e.preventDefault();drillNext();}return;}
    var st=it.st;if(!st||it.v!==undefined||(it.mode!=='blank'&&it.mode!=='scramble'))return;
    if(it.mode==='blank'){
      if(isLetter){
        var ne=nextEmpty(st);if(ne<0)return;
        var used=usedIds(st),t=null;
        for(var i=0;i<st.tiles.length;i++){if(used.indexOf(st.tiles[i].id)===-1&&st.tiles[i].ch.toLowerCase()===c){t=st.tiles[i];break;}}
        if(t){st.slots[ne]=t.id;sfx('pop');render();}
      }else if(e.key==='Backspace'){
        var ks=Object.keys(st.slots).map(Number).sort(function(a,b){return a-b;});
        if(ks.length){delete st.slots[ks[ks.length-1]];sfx('pop2');render();}
      }
    }else{
      if(isLetter){
        var u2=st.picked,t2=null;
        for(var j=0;j<st.tiles.length;j++){if(u2.indexOf(st.tiles[j].id)===-1&&st.tiles[j].ch.toLowerCase()===c){t2=st.tiles[j];break;}}
        if(t2){st.picked.push(t2.id);sfx('pop');render();}
      }else if(e.key==='Backspace'&&st.picked.length){st.picked.pop();sfx('pop2');render();}
    }
    if(e.key==='Enter'&&tag!=='BUTTON'){e.preventDefault();drillCheck();}
  }
});
try{if('speechSynthesis' in window)speechSynthesis.getVoices();}catch(e){}
render();
})();
