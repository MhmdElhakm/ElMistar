<script>
(function(){var t=localStorage.getItem('elmistar-theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();

<style>
:root{
  --bg-base:#0d1117;--bg-surface:#161b22;--bg-card:#1c2230;--bg-elevated:#242e40;--bg-input:#1a2133;
  --accent:#3b82f6;--accent-dim:rgba(59,130,246,.15);--accent-hover:#2563eb;
  --green:#22c55e;--green-dim:rgba(34,197,94,.15);
  --amber:#f59e0b;--red:#ef4444;--red-dim:rgba(239,68,68,.15);
  --text-primary:#e2e8f0;--text-secondary:#94a3b8;--text-muted:#64748b;
  --border:rgba(255,255,255,.08);--border-active:rgba(59,130,246,.4);
  --shadow-card:0 2px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04);
}
[data-theme="light"]{
  --bg-base:#f1f5f9;--bg-surface:#fff;--bg-card:#fff;--bg-elevated:#e2e8f0;--bg-input:#f8fafc;
  --text-primary:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;
  --border:rgba(0,0,0,.1);--shadow-card:0 2px 8px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg-base);color:var(--text-primary);min-height:100vh}
.p-wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.p-top{display:flex;align-items:center;gap:11px;background:var(--bg-surface);border:1px solid var(--border);border-radius:18px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow-card)}
.p-top img{width:44px;height:44px;border-radius:13px;object-fit:cover}
.p-top b{display:block;font-size:16.5px;font-weight:900}
.p-top small{display:block;font-size:11.5px;color:var(--text-muted);font-weight:700}
.p-top .sp{flex:1}
.theme-btn{width:38px;height:38px;border-radius:50%;border:2px solid var(--text-secondary);background:none;cursor:pointer;font-size:17px;color:var(--text-primary)}
.p-card{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:22px 18px;box-shadow:var(--shadow-card);text-align:center;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.p-ic{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--t1,#3b82f6),var(--t2,#8b5cf6));display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 12px;box-shadow:0 10px 24px rgba(59,130,246,.4);color:#fff}
.p-card h2{font-size:19px;font-weight:900;margin-bottom:4px}
.p-card>p{font-size:12.5px;color:var(--text-secondary);font-weight:700;margin-bottom:14px;line-height:1.9}
.inp{display:flex;flex-direction:column;gap:5px;background:var(--bg-input);border:1.5px solid var(--border);border-radius:14px;padding:9px 13px;margin-bottom:12px;text-align:right;transition:.2s}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-dim)}
.inp label{font-size:11.5px;font-weight:800;color:var(--text-muted)}
.inp input{border:none;background:transparent;color:var(--text-primary);font-family:inherit;font-size:16px;font-weight:800;outline:none;width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 20px;border-radius:14px;font-family:inherit;font-weight:800;font-size:14.5px;cursor:pointer;border:none;width:100%;min-height:52px;transition:.2s;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--t1,#2563eb),var(--t2,#7c3aed));color:#fff;box-shadow:0 8px 22px rgba(59,130,246,.4)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:var(--bg-elevated);color:var(--text-secondary);border:1px solid var(--border)}
.err{display:none;background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,.4);border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:800;margin-top:10px}
.err.show{display:block}
/* لمسة احترافية */
body{background-image:radial-gradient(600px 320px at 85% -60px,rgba(59,130,246,.12),transparent 60%),radial-gradient(500px 300px at 0% 0%,rgba(139,92,246,.10),transparent 55%);background-attachment:fixed}
.p-card{position:relative;overflow:hidden}
.p-card::before{content:'';position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--t1,#3b82f6),var(--t2,#8b5cf6),var(--t1,#06b6d4))}
.p-ic{width:72px;height:72px;border-radius:22px;font-size:34px;box-shadow:0 12px 30px rgba(59,130,246,.5),inset 0 1px 0 rgba(255,255,255,.4);animation:plFloat 2.6s ease-in-out infinite}
@keyframes plFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.p-card h2{font-size:21px}
.inp{transition:.2s}
.inp:focus-within{transform:translateY(-1px)}
.inp input{font-size:17px;letter-spacing:1px}
.inp input::placeholder{letter-spacing:0}
.btn-primary{position:relative;overflow:hidden}
.btn-primary::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:shine 3s infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(59,130,246,.55)}
.ch-row:hover{transform:translateY(-2px);box-shadow:var(--shadow-card)}
.hidden{display:none!important}
.ch-row{display:flex;align-items:center;gap:11px;background:var(--bg-elevated);border:1.5px solid var(--border);border-radius:15px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:.18s;text-align:right;width:100%;font-family:inherit;color:var(--text-primary)}
.ch-row:active{transform:scale(.98)}
.ch-row:hover{border-color:var(--border-active)}
.ch-av{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;color:#fff;flex-shrink:0;overflow:hidden}
.ch-av img{width:100%;height:100%;object-fit:cover}
.ch-row b{display:block;font-size:14.5px;font-weight:900}
.ch-row small{display:block;font-size:11.5px;color:var(--text-muted);font-weight:700}
.d-head{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--accent-dim),rgba(139,92,246,.12));border:1px solid var(--border-active);border-radius:16px;padding:14px;margin-bottom:10px;text-align:right}
.d-head .avatar{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;flex-shrink:0;overflow:hidden;border:2px solid var(--border-active)}
.d-head .avatar img{width:100%;height:100%;object-fit:cover}
.d-head h3{font-size:17px;font-weight:900}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.bdg{font-size:11px;font-weight:800;padding:2px 10px;border-radius:12px;border:1px solid}
.bdg.grade{background:var(--accent-dim);color:var(--accent);border-color:var(--border-active)}
.bdg.group{background:rgba(139,92,246,.12);color:#8b5cf6;border-color:rgba(139,92,246,.3)}
.bdg.clear{background:var(--green-dim);color:var(--green);border-color:rgba(34,197,94,.3)}
.bdg.late{background:rgba(245,158,11,.12);color:var(--amber);border-color:rgba(245,158,11,.35)}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.d-item{background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;padding:10px 12px;display:flex;gap:9px;align-items:center;text-align:right;min-width:0}
.d-item .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.d-item small{display:block;font-size:10.5px;color:var(--text-muted);font-weight:700}
.d-item b{font-size:13px;font-weight:800}
.d-sec{background:var(--bg-elevated);border:1px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:10px;text-align:right}
.d-sec-title{font-weight:900;font-size:13.5px;display:flex;align-items:center;gap:7px;margin-bottom:9px}
.d-sec-title i{color:var(--accent);font-size:17px}
.d-report{background:var(--bg-input);border-right:3px solid var(--accent);border-radius:10px;padding:10px 12px;line-height:2;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.dots{display:flex;gap:7px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--bg-input);border:1.5px solid var(--border);color:var(--text-muted)}
.dot.on{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:#22c55e;color:#fff}
.pay-row{display:flex;gap:9px;align-items:center;background:var(--bg-input);border:1px solid var(--border);border-radius:12px;padding:9px 11px;margin-bottom:6px;font-size:12.5px}
.pay-row b{font-weight:900}
.pay-row small{color:var(--text-muted);font-weight:700}
.logout-row{display:flex;gap:8px;margin-top:4px}
.logout-row .btn{min-height:48px;font-size:13.5px}
</style>
</head>
<body>
<div class="p-wrap">
  <header class="p-top">
    <img id="topLogo" src="logo.png" alt="EduSmart" onerror="this.style.display='none'">
    <div><b id="topName">بوابة ولي الأمر 🎓</b><small id="topSub">تابع مستوى ومدفوعات أبنائك لحظة بلحظة</small></div>

<script>
(function(){
'use strict';
var LS_S='elmistar_students_v1',LS_G='elmistar_groups_v1',LS_FB='elmistar_firebase_cfg';
var SESS_PRICE=20,SESS_EIGHTH=10,MONTH_LEN=8;
var GRADES=["مرحلة الكي جي والتأسيس","الصف الأول الابتدائي","الصف الثاني الابتدائي","الصف الثالث الابتدائي","الصف الرابع الابتدائي","الصف الخامس الابتدائي","الصف السادس الابتدائي"];
function $(id){return document.getElementById(id);}
function esc(s){if(s==null)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function normPhone(p){p=(p||'').toString().replace(/\D/g,'');p=p.replace(/^0020/,'');p=p.replace(/^20/,'');p=p.replace(/^0+/,'');return p;}
function gradeSafe(g){if(!g)return 'غير محدد';var t=String(g).trim();var m={"0":"مرحلة الكي جي والتأسيس","تأسيس":"مرحلة الكي جي والتأسيس","1":"الصف الأول الابتدائي","2":"الصف الثاني الابتدائي","3":"الصف الثالث الابتدائي","4":"الصف الرابع الابتدائي","5":"الصف الخامس الابتدائي","6":"الصف السادس الابتدائي"};return m[t]||t;}
function dueForSessions(n){n=Math.max(0,parseInt(n)||0);if(n<=7)return n*SESS_PRICE;return 7*SESS_PRICE+SESS_EIGHTH+(n-8)*SESS_PRICE;}
function coveredSessions(amount){amount=Math.max(0,parseInt(amount)||0);var pack=7*SESS_PRICE+SESS_EIGHTH;if(amount<pack)return Math.min(7,Math.floor(amount/SESS_PRICE));return 8+Math.floor((amount-pack)/SESS_PRICE);}
function attListOf(s){var a=s?s.attendance:null;if(Array.isArray(a))return a.slice().sort(function(x,y){return x-y;});var n=parseInt(a)||0,r=[];for(var i=0;i<n;i++)r.push(0);return r;}
function fin(st){var c=attListOf(st).length;var net=Math.max(0,(parseInt(st.paid)||0)-(parseInt(st.otherExpenses)||0));var due=dueForSessions(c);var sess=coveredSessions(net);var un=Math.max(0,c-sess);var rest=Math.max(0,due-net);return{count:c,paid:sess,unpaid:un,due:due,rest:rest,clear:un===0};}
function fmtDay(ts){if(!ts)return '—';try{return new Date(ts).toLocaleDateString('ar-EG',{day:'numeric',month:'short'});}catch(e){return '—';}}
function fmtDate(ts){try{return new Date(ts).toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'});}catch(e){return '—';}}

/* الثيم */
var themeBtn=$('themeBtn');
function syncTheme(){var t=document.documentElement.getAttribute('data-theme');themeBtn.textContent=t==='dark'?'☀️':'🌙';}
syncTheme();
themeBtn.onclick=function(){var h=document.documentElement;var n=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',n);try{localStorage.setItem('elmistar-theme',n);}catch(e){}syncTheme();};

/* البيانات: محلي ثم السحابة */
var DB={students:[],groups:[]};
function loadLocal(){try{var a=JSON.parse(localStorage.getItem(LS_S)||'[]');DB.students=Array.isArray(a)?a:[];}catch(e){DB.students=[];}try{var b=JSON.parse(localStorage.getItem(LS_G)||'[]');DB.groups=Array.isArray(b)?b:[];}catch(e){DB.groups=[];}}
function fbCfg(){try{var c=JSON.parse(localStorage.getItem(LS_FB)||'null');if(c&&c.apiKey&&c.projectId)return c;}catch(e){}return null;}
function loadSdk(cb){
  if(window.firebase&&window.firebase.firestore){cb();return;}
  var s1=document.createElement('script');s1.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js';
  s1.onload=function(){var s2=document.createElement('script');s2.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js';s2.onload=cb;s2.onerror=function(){cb();};document.head.appendChild(s2);};
  s1.onerror=function(){cb();};document.head.appendChild(s1);
}
function cloudPullFb(cfg,cb){
  if(!cfg){cb(null);return;}
  loadSdk(function(){
    try{
      if(!window.firebase.apps.length)window.firebase.initializeApp({apiKey:cfg.apiKey,authDomain:cfg.authDomain,projectId:cfg.projectId,storageBucket:cfg.storageBucket,messagingSenderId:cfg.messagingSenderId,appId:cfg.appId});
      window.firebase.app().firestore().collection('elmistar').doc('main').get().then(function(doc){
        if(!doc.exists){cb(null);return;}
        var d=doc.data()||{};
        cb({students:Array.isArray(d.students)?d.students:[],groups:Array.isArray(d.groups)?d.groups:[],teacher:d.teacher||null});
      }).catch(function(){cb(null);});
    }catch(e){cb(null);}
  });
}
function cloudPull(cb){cloudPullFb(fbCfg(),cb);}
/* روابط المعلم: ?fb= إعدادات مشفرة | ?app= رابط Web App | ?sheet= معرّف الشيت */
function getParams(){var q={fb:'',app:'',sheet:'',f:'',a:'',s:'',tn:'',ta:'',tc:'',t2:''};try{var sp=new URLSearchParams(location.search);q.fb=sp.get('fb')||'';q.app=sp.get('app')||'';q.sheet=sp.get('sheet')||'';q.f=sp.get('f')||'';q.a=sp.get('a')||'';q.s=sp.get('s')||'';q.tn=sp.get('tn')||'';q.ta=sp.get('ta')||'';q.tc=sp.get('tc')||'';q.t2=sp.get('t2')||'';}catch(e){}return q;}
function normTeacher(t){t=t||{};return{name:t.name||'',academy:t.academy||'',c1:t.c1||t.tc||'#2563eb',c2:t.c2||t.t2||'#7c3aed',logo:t.logo||''};}
function applyTeacherBrand(p){
  p=normTeacher(p);
  if(!p.name&&!p.academy&&!p.logo&&p.c1==='#2563eb')return;
  try{
    var r=document.documentElement.style;r.setProperty('--t1',p.c1);r.setProperty('--t2',p.c2);
    try{document.querySelector('meta[name="theme-color"]').setAttribute('content',p.c1);}catch(e){}
    if(p.name){$('loginTitle').textContent=p.name;$('topName').textContent=p.name;}
    if(p.academy){$('loginSub').textContent=p.academy+' • سجّل برقم الهاتف لمتابعة أبنائك';$('topSub').textContent=p.academy;}
    else if(p.name){$('loginSub').textContent='بوابة ولي الأمر • سجّل برقم الهاتف لمتابعة أبنائك';}
    if(p.logo){$('loginIc').innerHTML='<img src="'+p.logo+'" style="width:100%;height:100%;object-fit:cover">';var ti=$('topLogo');if(ti){ti.src=p.logo;ti.style.display='';}}
  }catch(e){}
}
function restVal(f){
  if(!f||typeof f!=='object')return f;
  if('stringValue' in f)return f.stringValue;
  if('integerValue' in f)return Number(f.integerValue);
  if('doubleValue' in f)return Number(f.doubleValue);
  if('booleanValue' in f)return !!f.booleanValue;
  if('nullValue' in f)return null;
  if('timestampValue' in f)return f.timestampValue;
  if('arrayValue' in f){var vs=(f.arrayValue&&f.arrayValue.values)||[];return vs.map(restVal);}
  if('mapValue' in f){var fs=(f.mapValue&&f.mapValue.fields)||{};var o={};for(var k in fs)o[k]=restVal(fs[k]);return o;}
  var o2={},any=false;for(var k2 in f){o2[k2]=restVal(f[k2]);any=true;}
  return any?o2:null;
}
function restPull(projectId,apiKey,cb){
  if(!projectId||!apiKey){cb(null);return;}
  fetch('https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(projectId)+'/databases/(default)/documents/elmistar/main?key='+encodeURIComponent(apiKey))
  .then(function(r){return r.json();}).then(function(doc){
    if(!doc||!doc.fields){cb(null);return;}
    var v=restVal(doc.fields)||{};
    cb({students:Array.isArray(v.students)?v.students:[],groups:Array.isArray(v.groups)?v.groups:[],teacher:v.teacher||null});
  }).catch(function(){cb(null);});
}
function b64urlDecode(s){try{s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}catch(e){return '';}}
function shKey(k){return String(k==null?'':k).replace(/[\s_ـ]+/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');}
function shPick(obj,names){for(var i=0;i<names.length;i++){var w=shKey(names[i]);for(var k in obj){if(shKey(k)===w){var v=obj[k];if(v!=null&&String(v).trim()!=='')return v;}}}return '';}
function ensurePGroup(name){name=String(name||'').trim();if(!name)return '';var f=null;try{f=DB.groups.find(function(g){return (g.name||'')===name;});}catch(e){}if(f)return f.id;var g={id:'PG'+Date.now().toString(36)+Math.floor(Math.random()*1e4),name:name,color:'#3b82f6'};DB.groups.push(g);return g.id;}
function mapSheetRow(r,i){
  var name=String(shPick(r,['name','الاسم','الطالب','student'])||'').trim();if(!name)return null;
  var grp=String(shPick(r,['group','المجموعة','المجموعه','الفصل'])||'').trim();
  return{id:'SH_'+i+'_'+Date.now().toString(36),name:name,phone:String(shPick(r,['phone','الهاتف','موبايل','mobile','التليفون','رقم الهاتف'])||'').replace(/\D/g,''),grade:gradeSafe(shPick(r,['grade','الصف','المرحلة'])||''),groupId:grp?ensurePGroup(grp):'',day:String(shPick(r,['day','اليوم'])||''),hour:String(shPick(r,['hour','time','الموعد','الوقت','الساعة'])||''),level:'',paid:parseInt(shPick(r,['paid','المدفوع','المصاريف']) )||0,otherExpenses:0,report:'',notes:'',profileImage:'',attendance:parseInt(shPick(r,['sessions','الحصص','sessionsCount']))||0,isActivated:true,payments:[]};
}
function sheetGvizPull(id,cb){
  var tabs=['students','الطلاب','Sheet1',''],i=0;
  function next(){
    if(i>=tabs.length){cb(null);return;}
    var t=tabs[i++];
    var u='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:json'+(t?('&sheet='+encodeURIComponent(t)):'');
    fetch(u).then(function(r){return r.text();}).then(function(txt){
      var m=String(txt||'').match(/setResponse\(([\s\S]+)\)\s*;?\s*$/);
      if(!m)throw 0;
      var j=JSON.parse(m[1]);if(!j||j.status==='error')throw 0;
      var cols=(j.table.cols||[]).map(function(c,ci){return c.label||c.id||('c'+ci);});
      var rows=(j.table.rows||[]).map(function(rw){var o={};(rw.c||[]).forEach(function(c,ci){o[cols[ci]]=(c&&(c.v!=null?c.v:''));});return o;}).filter(function(o){return Object.keys(o).some(function(k){return String(o[k]).trim()!=='';});});
      if(!rows.length)throw 0;
      var out=[];rows.forEach(function(r,ix){var s=mapSheetRow(r,ix);if(s)out.push(s);});
      cb({students:out,groups:DB.groups});
    }).catch(function(){next();});
  }
  next();
}
function webAppPull(url,cb){
  fetch(url+(url.indexOf('?')>=0?'&':'?')+'action=pull').then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){cb(null);return;}
    (d.groups||[]).forEach(function(g){if(g&&g.name)ensurePGroup(g.name);});
    var out=[];(d.students||[]).forEach(function(r,ix){var s=mapSheetRow(r,ix);if(s)out.push(s);});
    cb({students:out,groups:DB.groups});
  }).catch(function(){cb(null);});
}
function groupOf(id){return DB.groups.find(function(g){return g.id===id;})||null;}

/* التنقل بين الشاشات */
function show(which){
  ['loginView','chooseView','stuView'].forEach(function(id){$(id).classList.toggle('hidden',id!==which);});
  window.scrollTo({top:0,behavior:'smooth'});
}
function loginErr(m){var e=$('loginErr');if(!m){e.classList.remove('show');e.textContent='';return;}e.textContent=m;e.classList.add('show');}

/* الدخول */
function doLogin(){
  loginErr('');
  var q=normPhone($('phInput').value);
  if(!q||q.length<9){loginErr('اكتب رقم هاتف صحيح (11 رقم يبدأ بـ 01)');return;}
  var btn=$('loginBtn');btn.disabled=true;btn.textContent='جاري البحث...';
  var finish=function(){btn.disabled=false;btn.textContent='دخول ←';};
  var found=DB.students.filter(function(s){return normPhone(s.phone)===q;});
  if(found.length){finish();afterMatch(found);return;}
  cloudPull(function(cloud){
    finish();
    if(cloud){
      var f2=(cloud.students||[]).filter(function(s){return normPhone(s.phone)===q;});
      if(f2.length){DB.students=cloud.students;DB.groups=cloud.groups;afterMatch(f2);return;}
    }
    loginErr('لا يوجد طالب مسجل بهذا الرقم — تأكد من الرقم أو تواصل مع المعلم');
  });
}
function afterMatch(list){
  try{sessionStorage.setItem('parent_phone',normPhone($('phInput').value));}catch(e){}
  if(list.length===1){openStudent(list[0].id);return;}
  $('chooseSub').textContent='وجدنا '+list.length+' طلاب بهذا الرقم — اختر واحداً';
  var box=$('chooseList');box.innerHTML='';
  list.forEach(function(s){
    var g=groupOf(s.groupId);
    var b=document.createElement('button');b.className='ch-row';
    b.innerHTML='<div class="ch-av">'+(s.profileImage?'<img src="'+s.profileImage+'">':esc((s.name||'?').charAt(0)))+'</div>'
    +'<div style="flex:1;min-width:0"><b>'+esc(s.name||'—')+'</b><small>'+esc(gradeSafe(s.grade))+(g?' • '+esc(g.name):'')+'</small></div><span style="color:var(--accent);font-weight:900">‹</span>';
    b.onclick=function(){openStudent(s.id);};
    box.appendChild(b);
  });
  show('chooseView');
}

/* بطاقة الطالب — البيانات المهمة لولي الأمر فقط */
function finBadge(st){var f=fin(st);if(f.clear)return '<span class="bdg clear">خالص 🟢</span>';return '<span class="bdg late">'+f.unpaid+' حصة ('+f.rest+' ج) 🟡</span>';}
function openStudent(id){
  var s=DB.students.find(function(x){return x.id===id;});
  if(!s){loginErr('تعذر فتح بيانات الطالب');show('loginView');return;}
  try{sessionStorage.setItem('parent_sid',id);}catch(e){}
  var g=groupOf(s.groupId),f=fin(s);
  $('vAvatar').innerHTML=s.profileImage?'<img src="'+s.profileImage+'">':esc((s.name||'?').charAt(0));
  $('vName').textContent=s.name||'—';
  $('vBadges').innerHTML='<span class="bdg grade">'+esc(gradeSafe(s.grade))+'</span>'
    +(g?'<span class="bdg group">'+esc(g.name)+'</span>':'')+finBadge(s)
    +'<span class="bdg grade">⭐ '+(esc(s.level||'جيد'))+'</span>';
  var att=attListOf(s),total=att.length,month=Math.floor(total/8)+1,pos=total%8;
  $('vGrid').innerHTML=
    '<div class="d-item"><div class="ic" style="background:rgba(59,130,246,.13);color:#3b82f6">📅</div><div><small>موعد الحصة</small><b>'+esc((((s.day||'—')+' '+(s.hour||'')).trim()))+'</b></div></div>'
    +'<div class="d-item"><div class="ic" style="background:rgba(34,197,94,.13);color:#22c55e">✅</div><div><small>الحصص الحاضرة</small><b>'+total+' حصة</b></div></div>'
    +'<div class="d-item"><div class="ic" style="background:rgba(245,158,11,.14);color:#f59e0b">💵</div><div><small>المدفوع</small><b>'+(s.paid||0)+' ج.م</b></div></div>'
    +'<div class="d-item"><div class="ic" style="background:rgba(239,68,68,.12);color:#ef4444">🧾</div><div><small>المتبقي</small><b>'+f.rest+' ج.م</b></div></div>';
  $('vReport').textContent=(s.report||'').trim()||'لا يوجد تقرير بعد —';
  var cur=att.slice(-pos||-8);if(pos===0&&total>0)cur=att.slice(-8);
  var dots='';for(var i=1;i<=8;i++){var on=i<=(pos===0?(total>0?8:0):pos);dots+='<span class="dot'+(on?' on':'')+'" title="'+(on?'حضر':'لم يحضر بعد')+'">'+i+'</span>';}
  $('vMonthLbl').textContent='الشهر '+month+' ('+((pos===0&&total>0)?8:(pos||0))+'/8)';
  $('vDots').innerHTML=dots;
  var pays=Array.isArray(s.payments)?s.payments.slice(-6).reverse():[];
  $('vPays').innerHTML=pays.length?pays.map(function(p){var dt='';try{dt=new Date(p.date).toLocaleDateString('ar-EG',{day:'numeric',month:'short'});}catch(e){}return '<div class="pay-row"><span style="font-size:18px">✅</span><div style="flex:1"><b>'+(parseInt(p.amount)||0)+' ج.م</b> <small>'+esc(p.month||'')+(dt?' • '+esc(dt):'')+'</small></div></div>';}).join(''):'<div style="text-align:center;color:var(--text-muted);font-size:12.5px;font-weight:700;padding:8px">لا توجد مدفوعات مسجلة بعد</div>';
  show('stuView');
}

/* أزرار */
$('loginBtn').onclick=function(){doLogin();};
$('phInput').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
$('backToLogin1').onclick=function(){show('loginView');};
$('switchBtn').onclick=function(){
  try{
    var q=sessionStorage.getItem('parent_phone')||'';
    var list=DB.students.filter(function(s){return normPhone(s.phone)===q;});
    if(list.length>1){afterMatch(list);return;}
  }catch(e){}
  show('loginView');
};
$('logoutBtn').onclick=function(){try{sessionStorage.removeItem('parent_sid');sessionStorage.removeItem('parent_phone');}catch(e){}$('phInput').value='';show('loginView');};

/* بدء: رابط المعلم أولاً (إن وُجد) ثم المحلي ثم استعادة الجلسة */
loadLocal();
function restoreSession(){try{var sid=sessionStorage.getItem('parent_sid');if(!sid)return false;var s=DB.students.find(function(x){return x.id===sid;});if(s){openStudent(sid);return true;}}catch(e){}return false;}
(function(){
  var q=getParams();
  var paramBrand=(q.tn||q.ta||q.tc)?{name:q.tn,academy:q.ta,c1:q.tc,c2:q.t2}:null;
  if(paramBrand)applyTeacherBrand(paramBrand);
  function withTeacher(cloud){if(cloud&&cloud.teacher)applyTeacherBrand(cloud.teacher);else if(paramBrand)applyTeacherBrand(paramBrand);if(cloud){DB.students=cloud.students;DB.groups=cloud.groups;}restoreSession();}
  if(q.f){var dot=q.f.indexOf('.');if(dot>0){var pid=q.f.slice(0,dot),pkey=q.f.slice(dot+1);restPull(pid,pkey,withTeacher);return;}}
  if(q.fb){try{var cfg=JSON.parse(b64urlDecode(q.fb));if(cfg&&cfg.projectId){cloudPullFb(cfg,withTeacher);return;}}catch(e){}}
  var appUrl=q.a||q.app,sheetId=q.s||q.sheet;
  if(appUrl){webAppPull(appUrl,withTeacher);return;}
  if(sheetId){sheetGvizPull(sheetId,withTeacher);return;}
  restoreSession();
})();
})();
</script>
